name: Deploy docs to GitHub Pages

# docs/ klasörünü statik site olarak yayınlar (eski Jekyll derleyicisi takıldığı için
# GitHub Actions ile deploy). Gizlilik (index.html), hesap silme (hesap-sil.html), şartlar.

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (yalnız docs)
        uses: actions/checkout@v4
        with:
          sparse-checkout: docs
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload docs artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
