name: Deploy docs to GitHub Pages

# docs/ klasörünü statik site olarak yayınlar (eski Jekyll derleyicisi takıldığı için
# GitHub Actions ile deploy). Gizlilik (index.html), hesap silme (hesap-sil.html), şartlar.

on:
  push:
    branches: [master]
    # YALNIZ docs/ değişince deploy et. GitHub Pages, içeriği hiç değişmemiş (byte-byte aynı)
    # bir yayını reddedip "Deployment failed, try again later" veriyor → kod/kök-dosya
    # (PROJE_DURUM.md vb.) commit'lerinde docs aynı kaldığı için her push fail + gereksiz mail
    # oluyordu. Bu filtre no-op deploy'ları TAMAMEN eler (workflow hiç çalışmaz).
    # NOT: workflow'un kendisini test etmek için manuel "Run workflow" (workflow_dispatch) kullan.
    paths:
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # Ardışık push'larda önceki deploy'u İPTAL ETME (iptal = "failure" sayılıp mail tetikliyordu);
  # sıraya al → her deploy tamamlanır, hatasız.
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (yalnız docs)
        uses: actions/checkout@v4
        with:
          sparse-checkout: docs
      - name: Configure Pages
        uses: actions/configure-pages@v5
      # GÜVENLİK: docs/ iç notları (güvenlik planları, SQL, md raporlar) da barındırıyor.
      # Siteye YALNIZ bu izin listesi çıkar; yeni herkese açık sayfa eklenirse buraya yazılmalı.
      - name: Build public site (izin listesi)
        run: |
          mkdir -p _site
          for f in .nojekyll .well-known CNAME 404.html google2b2160762885508d.html \
                   index.html gizlilik hesap-sil.html iletisim.html onaylandi.html sartlar.html \
                   uygulama.html sinavprovasi tahmin jsps2026iptalanaliz assets; do
            if [ -e "docs/$f" ]; then cp -r "docs/$f" _site/; fi
          done
          echo "Yayınlanan:"; ls -a _site
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
