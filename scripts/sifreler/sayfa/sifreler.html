":"44","g":"zor kullanarak karşı koyanlar","c":"jandarma yakalar; Cumhuriyet savcısına derhal bilgi","n":"","k":"(2) Görevini yaptığı sırada jandarmaya direnen veya zor kullanarak karşı koyanlar jandarma tarafından yakalanır. Yakalanan kişi ve olay hakkında Cumhuriyet savcısına derhal bilgi verilerek emri doğrultusunda işlem yapılır.","x":[]},{"m":"45","g":"veli ve vasileri olsa bile","c":"onsekiz yaşını doldurmamış küçükler içkili yere, kıraathaneye, internet salonuna giremez","n":"belgeli turizm işletmeleri hariç; izne bağlı yerlerde çalıştırma da yasak","k":"(3) Jandarma; bar, pavyon, gazino, meyhane gibi içkili yerler ile kıraathane, internet salonu ve oyun oynatılan benzeri yerlere yanlarında veli ve vasileri olsa bile onsekiz yaşını doldurmamış küçüklerin girmesini engeller.","x":[]},{"m":"45","g":"herhangi bir şikâyet olmasa bile","c":"genel ahlaka aykırı davranış, sarkıntılık, müstehcen yayın engellenir","n":"","k":"c) Genel ahlaka aykırı mahiyette her türlü sesli ve görüntülü eserleri, kaydedildiği materyale bakılmaksızın üreten ve satanları, herhangi bir şikâyet olmasa bile engeller, davranışlarının devamını durdurarak yasaklar ve gerekli kanuni işlemleri yapar.","x":[]},{"m":"46","g":"makul bir sebebin bulunması","c":"durdurma yetkisi şartı; süreklilik ve keyfilik yasak","n":"durdurma sebebi bildirilir; süre zorunlu süreyi aşamaz","k":"(2) Durdurma yetkisinin kullanılabilmesi için jandarmanın tecrübesine ve içinde bulunulan durumdan edindiği izlenime dayanan makul bir sebebin bulunması gerekir. Süreklilik arz edecek, fiili durum ve keyfilik oluşturacak şekilde durdurma işlemi yapılamaz.","x":[]},{"m":"46","g":"elbisenin çıkarılması","c":"durdurmada istenemez; aracın görünmeyen bölümünü açma da","n":"","k":"Bu amaçla kişinin üzerindeki elbisenin çıkarılması veya aracın dışarıdan bakıldığında içerisi görünmeyen bölümlerinin açılması istenemez.","x":[]},{"m":"46","g":"görevlendireceği kolluk amirinin yazılı","c":"durdurulanın üstünü/aracını arama emri; acele sözlü, yirmidört saatte hâkim onayı","n":"mülki amirin görevlendirdiği kolluk amiri; araç aramasında belge verilir","k":"Ancak el ile dıştan kontrol hariç, kişinin üstü ve eşyası ile aracının dışarıdan bakıldığında içerisi görünmeyen bölümlerinin aranması, Bakanlık tarafından belirlenen esaslar dahilinde mülki amirin görevlendireceği kolluk amirinin yazılı, acele hallerde sonradan yazıyla teyit edilmek üzere sözlü emriyle yapılabilir. Kolluk amirinin kararı yirmidört saat içinde görevli hakimin onayına sunulur.","x":[]},{"m":"46","g":"jandarma olduğunu belirleyen belgeyi","c":"belgeyi gösterdikten sonra kimliğini sorabilir","n":"kimliği belirlenemeyen tutulur, savcıya haber","k":"(8) Jandarma, görevini yerine getirirken kendisinin jandarma olduğunu belirleyen belgeyi gösterdikten sonra kişilere kimliğini sorabilir.","x":[]},{"m":"46","g":"fotoğraf ve parmak izi","c":"nüfusa kayıtsız kimliği belirlenemeyen kişi kayda alınır","n":"","k":"(10) Nüfusa kayıtlı olmadığı için kimliği tespit edilemeyen kişilerin nüfusa kayıtlarının temini için gerekli işlemler yapıldıktan sonra, ilgili mevzuatına göre fotoğraf ve parmak izi tespit edilerek kayda alınır.","x":[]},{"m":"47","g":"mülki amirin vereceği yazılı emirle","c":"önleme araması; gecikmesinde sakınca varsa (asıl: sulh ceza hâkimi)","n":"","k":"MADDE 47- (1) Jandarma, tehlikenin veya suç işlenmesinin önlenmesi amacıyla usulüne göre verilmiş sulh ceza hakiminin kararı veya bu sebeplere bağlı olarak gecikmesinde sakınca bulunan hallerde mülki amirin vereceği yazılı emirle kişilerin üstlerini, araçlarını, özel kağıtlarını ve eşyasını arar; alınması gereken tedbirleri alır, suç delillerini koruma altına alarak 5271 sayılı Kanun hükümlerine göre gerekli işlemleri yapar.","x":[]},{"m":"47","g":"kamuya açık olmayan işyerlerinde","c":"önleme araması yapılamaz; konut, yerleşim yeri de","n":"","k":"(5) Konutta, yerleşim yerinde ve kamuya açık olmayan işyerlerinde ve eklentilerinde önleme araması yapılamaz.","x":[]},{"m":"47","g":"sakınca bulunan hal var sayılır","c":"spor karşılaşması, miting, konser, festival, ani topluluk","n":"","k":"(6) Spor karşılaşması, miting, konser, festival, toplantı ve gösteri yürüyüşünün düzenlendiği veya aniden toplulukların oluştuğu hallerde gecikmesinde sakınca bulunan hal var sayılır.","x":[]},{"m":"47","g":"emir veya karar olmasına bakılmaksızın","c":"jandarmanın koruduğu bina/tesise girenlerin üstü-aracı aranır; kimlik ibrazı zorunlu","n":"","k":"(7) Jandarma, tehlikenin önlenmesi veya bertaraf edilmesi amacıyla güvenliğini sağladığı bina ve tesislere gelenlerin; herhangi bir emir veya karar olmasına bakılmaksızın üstünü, aracını ve eşyasını teknik cihazlarla, gerektiğinde el ile kontrol etmeye ve aramaya yetkilidir. Bu yerlere girmek isteyenler kimliklerini sorulmaksızın ibraz etmek zorundadır.","x":[]},{"m":"47","g":"İdarecilerinin talebiyle","c":"yükseköğretim kurumlarının içinde önleme araması","n":"toplantı yeri, genel kurul çevresi, umuma açık yer, toplu taşıma da","k":"ç) İdarecilerinin talebiyle ve mevzuatta yer alan usul ve şartlara uygun olarak yükseköğretim kurumlarının içinde, bunların yakın çevreleri ile giriş ve çıkışlarında.","x":[]},{"m":"48","g":"boğulma gibi büyük tehlikelerin","c":"konut ve işyerine girilebilir (acele hal)","n":"suçun işlenmesini/devamını engellemek için de","k":"MADDE 48- (1) Jandarma;\na) İmdat istenmesi veya yangın, su baskını ve boğulma gibi büyük tehlikelerin haber verilmesi veya görülmesi hallerinde bu tehlikelerden kişileri kurtarmak amacıyla,\nb) Bir suçun işlenmesine veya işlenmekte olan bir suçun devamına engel olmak için, konutlara, işyerlerine ve eklentilerine girebilir.","x":[]},{"m":"50","g":"yeri ve zamanına bakılmaksızın","c":"jandarma suçla karşılaşınca el koyar; delili yetkili kolluğa teslim","n":"","k":"MADDE 50- (1) Jandarma, sorumluluk alanı içinde hizmet branşı, yeri ve zamanına bakılmaksızın, bir suçla karşılaştığında olaya elkoymak, suçu önlemek, şüpheli ve suç delillerini tespit, muhafaza ve yetkili kolluğa teslim etmekle görevli ve yetkilidir.","x":[]},{"m":"52","g":"üst yöneticiye verilen","c":"Jandarma Genel Komutanı (5018 Kamu Malî Yönetimi)","n":"","k":"f) 10/12/2003 tarihli ve 5018 sayılı Kamu Malî Yönetimi ve Kontrol Kanunu ile diğer mevzuat hükümleri ile üst yöneticiye verilen görev, yetki ve sorumlulukları yerine getirmek.","x":[]},{"m":"53","g":"bulunmadığı zamanlarda vekalet etmek","c":"jandarma genel komutan yardımcıları","n":"","k":"b) Jandarma Genel Komutanının bulunmadığı zamanlarda vekalet etmek ve yetkilerini kullanmak.","x":[]},{"m":"54","g":"iller arasında kuvvet kaydırması","c":"bölge komutanı; konuşlu olduğu ilin valisinin onayıyla","n":"terör operasyonlarını da o valinin onayıyla planlar","k":"MADDE 54- (1) Jandarma bölge komutanları, emniyet ve asayiş hizmetlerinin daha etkili yürütülmesi amacıyla sorumluluk alanında il jandarma komutanlıkları arasında koordinasyon ve işbirliğini sağlamak, ihtiyaç duyulan lojistik ve teknik destek faaliyetlerini planlamak, kontrol ve denetimini sağlamak, personelin özlük işlemlerini yürütmek; bölge komutanlığının konuşlu olduğu ilin valisinin onayıyla; terörle mücadele kapsamında operasyonları planlamak, sevk ve idare etmek, iller arasında kuvvet kaydırması yapmakla görevlidir.","x":[]},{"m":"54","g":"faaliyette bulunulan ilin valisine","c":"bölge komutanı operasyonel faaliyette ona karşı da sorumlu","n":"il ve ilçe jandarma komutanlıklarına emir verebilir","k":"Bölge komutanı bu görevlerinin ifasından ve yetkilerin kullanılmasından, operasyonel faaliyetlerde faaliyette bulunulan ilin valisine karşı sorumluluğu saklı kalmak kaydıyla, bölge komutanlığının konuşlu olduğu ilin valisine karşı sorumludur.","x":[]},{"m":"56","g":"kaymakam tarafından verilen görevlerin","c":"ilçe jandarma komutanı takip ve kontrol eder","n":"il jandarma komutanı: vali","k":"d) Kanunlarla ve kaymakam tarafından verilen görevlerin yapılıp yapılmadığını takip ve kontrol etmek, sonuçlarını bildirmek.","x":[]},{"m":"57","g":"ilçe jandarma komutanı tarafından verilen","c":"karakol komutanı takip eder; vali → il J.K.","n":"","k":"d) Kanunlarla ve ilçe jandarma komutanı tarafından verilen görevlerin yapılıp yapılmadığını takip ve kontrol etmek, sonuçlarını bildirmek.","x":[]},{"m":"58","g":"en üst amiridir ve teşkilatı","c":"Bakan; JGK Bakana karşı sorumlu","n":"bölge komutanı valiye, il-ilçe komutanı mülki amire bağlı","k":"Bakan, jandarma teşkilatının en üst amiridir ve teşkilatı idare eder.","x":[]},{"m":"58","g":"doğrudan emir verme yetkisine","c":"mülki amirler ve adli makamlar; diğer makamlar mülki amire başvurur","n":"","k":"(3) Mülki amirler ile adli makamlar mevzuat hükümlerine uygun olarak jandarma komutanlarına ve diğer jandarma personeline doğrudan emir verme yetkisine sahiptir. Diğer makamlar jandarmaya görev olarak verilmesini istedikleri konunun kanuni dayanaklarını belirterek o yerin mülki amirine başvurur. Mülki amir, talebi mevzuata ve ihtiyaca uygunluk yönünden değerlendirir ve uygun bulduğunda, görevin ifasını emreder.","x":[]},{"m":"58","g":"araç ve gereçlerin seçimi","c":"jandarma komutanına ait; mülki amir yetersizlikte başka kurumdan sağlar","n":"","k":"(7) Jandarma birimlerinin üstlendikleri görevin yapılmasında kullanacakları araç ve gereçlerin seçimi kendi komutanlarına aittir. Mülki amirler özellik taşıyan ve yetersiz kalınan durumlarda gereken araç ve gereçleri diğer kamu kurum ve kuruluşlarından sağlayarak jandarmanın hizmetine verebilir.","x":[]},{"m":"59","g":"vakit geçirmeksizin mülki amire","c":"suç, afet, salgın, propaganda bilgileri; suçla ilgili olanlar savcılığa da","n":"","k":"MADDE 59- (1) Jandarma; bölgelerindeki her türlü suçları ve sonuçlarını, ülkenin emniyet ve asayişini bozan ya da bozacak olan olayları, yangın, su baskını gibi afetleri, haber aldıkları salgın ve bulaşıcı hastalıkları, Devletin ülkesi ve milletiyle bölünmez bütünlüğünü, nitelikleri Anayasada gösterilen Cumhuriyeti yıkmaya, sarsmaya ve bölmeye yönelik propagandalar konusunda edindikleri bilgileri, il veya ilçenin asayiş veya güvenliğini etkileyecek mahiyetteki kovuşturma ve soruşturmaları, vakit geçirmeksizin mülki amire sözlü ya da yazılı olarak bildirir. Suçla ilgili görülen olaylar aynı zamanda Cumhuriyet savcılığına da bildirilir.","x":[]},{"m":"60","g":"resen muhabere edemez","c":"JGK merkez ve taşra teşkilatı birbiriyle (teknik/lojistik/özlük hariç)","n":"yazışma Bakanlık ve mülki amir aracılığıyla","k":"MADDE 60- (1) Jandarma Genel Komutanlığı merkez ve taşra teşkilatları birbirleriyle; mahalli vakalar hakkında malumat istemek ve teknik, muhasebe, lojistik ve özlük konularına dair işlemler haricinde resen muhabere edemez ve yazışma yapamaz.","x":[]},{"m":"60","g":"her halükarda valilikler aracılığıyla","c":"hak-yükümlülük doğuran, irade beyanı niteliğindeki yazışmalar","n":"","k":"Hak ve yükümlülük doğuran ve Bakanlık ya da Jandarma Genel Komutanlığı adına irade beyanı niteliği taşıyan yazışmalar, her halükarda valilikler aracılığıyla yapılır.","x":[]},{"m":"60","g":"vali imzasıyla gönderilir","c":"Bakanlığa asayiş raporu; il jandarma komutanlığı hazırlar","n":"","k":"(4) Bakanlığa gönderilecek asayiş raporlarından jandarmanın sorumluluk alanında meydana gelen olaylara ait bulunanlar, il jandarma komutanlığınca hazırlanır ve vali imzasıyla gönderilir.","x":[]},{"m":"60","g":"beş örnek olarak birleştirilip","c":"emniyet-asayiş istatistikleri emniyet müdürlüğünce; iki örneği Bakanlığa","n":"il J.K., emniyet müdürü, SG komutanı parafe eder","k":"(5) Emniyet ve asayiş görevlerine ait aylık ve yıllık istatistikler jandarma, sahil güvenlik ve emniyet sorumluluk alanları için ait olduğu makamlarca hazırlandıktan ve emniyet müdürlüğünce beş örnek olarak birleştirilip il jandarma komutanı ve il emniyet müdürü ile teşkilatı olan yerlerde sahil güvenlik bölge veya grup komutanı tarafından parafe edildikten sonra, iki örneği vali imzasıyla Bakanlığa sunulur.","x":[]},{"m":"63","g":"yediemin otoparkına","c":"icra talebiyle yakalanan araç; üç işgünü içinde icra müdürlüğüne bildirim","n":"","k":"MADDE 63- (1) İcra müdürlüklerinin talebi üzerine kolluk kuvvetleri tarafından yakalanan araçlar, en yakın yediemin otoparkına teslim edilerek en geç üç işgünü içinde en yakın icra müdürlüğüne teslim alınması için bildirimde bulunulur.","x":[]},{"m":"65","g":"olay yerinde soruşturma yapamaz","c":"jandarma alanında suçla karşılaşan polis/sahil güvenlik; delilleri korur, haber verir","n":"jandarma gelemezse savcıya haber","k":"MADDE 65- (1) Jandarma sorumluluk alanında herhangi bir suçla karşılaşan sahil güvenlik veya polis, olaya müdahale etmek ve jandarmaya da haber vermek, jandarmanın istemi üzerine gerekli yardımı yapmakla yükümlüdür. Bu gibi durumlarda, sahil güvenlik ve polis, jandarma gelinceye kadar olay yerinde soruşturma yapamaz, durumu olduğu gibi koruyarak delillerin kaybolmaması için gereken önlemleri alır. Sahil güvenlik veya polis, olay yerinde elkoydukları nesneleri gelen jandarmaya bir alındı belgesiyle teslim eder, jandarmanın makul bir sürede gelememesi durumunda Cumhuriyet savcısına haber verir ve talimatına göre hareket eder.","x":[]},{"m":"65","g":"hangi kolluk kuvvetine ait olduğu","c":"ortak operasyonda komuta-sevk-idare; mülki amir belirler","n":"","k":"(6) Jandarma, sahil güvenlik ve polisin birlikte çalışmalarına gerek duyulan durumlarda, operasyona katılan birimlerin komuta, sevk ve idaresinin hangi kolluk kuvvetine ait olduğu mülki amir tarafından belirlenir.","x":[]},{"m":"66","g":"uluslararası kuruluşlara üye olabilir","c":"JGK; Bakan onayı ile","n":"","k":"(3) Jandarma Genel Komutanlığı, Bakan onayı ile uluslararası kuruluşlara üye olabilir.","x":[]},{"m":"66","g":"dış ilişkiler uygulama planı","c":"yıllık; Dışişleri görüşü, İçişleri Bakanlığı onayı","n":"plan dışı faaliyete ayrıca Bakanlık onayı","k":"MADDE 66- (1) Jandarma Genel Komutanlığı yurtdışında icra edilen faaliyetlere dış ilişkiler uygulama planı kapsamında iştirak eder. Bu plan yıllık olarak hazırlanır, Dışişleri Bakanlığının görüşü alınarak Bakanlıkça onaylanır.","x":[]},{"m":"67","g":"Mülkiye Teftiş Kurulu Başkanlığı","c":"Bakan adına jandarma birimlerini denetler; illerde vali, ilçelerde kaymakam","n":"JGK adına Teftiş Kurulu ve İç Denetim","k":"MADDE 67- (1) Bakan her kademedeki jandarma birimini denetler veya Bakan adına bu denetim Mülkiye Teftiş Kurulu Başkanlığı tarafından yerine getirilir. Bu denetim illerde vali ve ilçelerde kaymakamlar tarafından yapılır.","x":[]},{"m":"68","g":"kadro tavanını aşmamak üzere","c":"yıl içi kadro değişikliği Bakan onayıyla; kadrolar bütçe kanunuyla","n":"","k":"Yıl içinde ihtiyaç duyulan kadro değişikliklerinde kadro tavanını aşmamak üzere Bakandan onay alınır.","x":[]},{"m":"70","g":"değişik kılık ve kıyafetle","c":"mülki amir ya da il jandarma komutanı izniyle; gizli takip","n":"kaçakçılık ve terörle mücadelede de; esas resmi kıyafet","k":"Ancak suç ve suçluların gizli olarak takibi, yakalanması ve istihbarat, kaçakçılık ve terörle mücadele hizmetleri için gerek görüldüğünde mülki amirin veya il jandarma komutanının izni ile görevin icap ettirdiği değişik kılık ve kıyafetle de hizmet yürütülebilir.","x":[]},{"m":"71","g":"hiç bir zaman süreklilik taşımaz","c":"geçici görevlendirme; sonuç alınınca döner; mülki amir onayı","n":"jandarma, sahil güvenlik, emniyet birbirinin alanında","k":"Bu görev hiç bir zaman süreklilik taşımaz, istenen sonuç alındığında yardıma gelen kuvvet kendi görevine döner.\n(2) Bu madde kapsamındaki görevlendirmeler mülki amirin onayı ile yapılır.","x":[]},{"m":"72","g":"sorumluluk alanı ile sınırlı değildir","c":"merkezden/iller arası görevlendirilen ekiplerin kolluk yetkisi; mahallin mülki amirine bilgi","n":"Bakanlıkça ya da vali talebiyle; iller arası valiliklerce","k":"(2) Görevlendirilen ekiplerin kolluk yetkilerini kullanması, jandarma sorumluluk alanı ile sınırlı değildir. Bu ekipler görev yaptıkları mahallin mülki amirine bilgi vermek zorunda olup görevin ifası sırasında mahallin mülki amirine karşı da sorumludur.","x":[]},{"m":"74","g":"en yakın askerlik şubesine getirilirler","c":"yakalanan yoklama kaçağı/bakaya; en geç yirmidört saat","n":"","k":"Yakalanarak muhafaza altına alınan yükümlüler, vakit geçirmeksizin ve en geç yirmidört saat içerisinde en yakın askerlik şubesine getirilirler. Askerlik şubesince teslim alınamayan yükümlüler, jandarma tarafından hazırlanan tutanağa istinaden derhal serbest bırakılırlar.","x":[]},{"m":"74","g":"derhal serbest bırakılırlar","c":"askerlik şubesince teslim alınamayan yükümlü; jandarma tutanağıyla","n":"firar/izin tecavüzünde yakalama kararı varsa aranır","k":"Yakalanarak muhafaza altına alınan yükümlüler, vakit geçirmeksizin ve en geç yirmidört saat içerisinde en yakın askerlik şubesine getirilirler. Askerlik şubesince teslim alınamayan yükümlüler, jandarma tarafından hazırlanan tutanağa istinaden derhal serbest bırakılırlar.","x":[]},{"m":"75","g":"koruma ve müdahale harekat planı","c":"jandarma hazırlar; planlar mülki amir onayıyla yürürlüğe girer","n":"suç önleme/müdahale planı, doğal afet-yardım planı da","k":"MADDE 75- (1) Jandarma birimleri, emniyet ve asayiş ile kamu düzeninin korunmasını sağlamak ve olaylara etkili biçimde müdahale edebilmek amacıyla suçları önleme ve suçlara müdahale planı, doğal afet ve yardım planı ile koruma ve müdahale harekat planı hazırlar.\n(2) Anayasada öngörülen olağanüstü hallerle ilgili olarak hazırlanacak planlar, mevzuata uygun ve birinci fıkrada belirtilen planlarla uyumlu olarak hazırlanır.\n(3) Planlar, mülki amirin onayı ile yürürlüğe konulur.","x":[]},{"m":"76","g":"stratejik hedef planı","c":"beş yıllık; Bakan onayı; iki yılda bir gözden geçirilir","n":"","k":"MADDE 76- (1) Jandarma teşkilatının personel, araç, gereç, mühimmat, taşınır ve taşınmazları ile hizmetlerinin ve görevlerinin geliştirilmesi ve ihtiyaçlarının önceden tespiti ve hedeflerinin belirlenmesi için hazırlanan ve beş yıllık bir dönemi kapsayan Jandarma Genel Komutanlığı stratejik hedef planı Bakan onayı ile yürürlüğe konulur. Bu plan en az iki yılda bir gözden geçirilir.","x":[]},{"m":"77","g":"hiçbir tebligat işlemi jandarmaya","c":"mevzuatta belirtilmeyen; görev olarak verilemez","n":"","k":"Mevzuatta belirtilmeyen hiçbir tebligat işlemi jandarmaya görev olarak verilemez ve jandarma tarafından yerine getirilemez.","x":[]},{"m":"78","g":"Jandarma Müzesinde","c":"mevcut sancaklar muhafaza edilir","n":"","k":"MADDE 78- (1) Jandarma Genel Komutanlığı merkez ve taşra teşkilatlarındaki mevcut sancaklar Jandarma Müzesinde muhafaza edilir.","x":[]},{"m":"80","g":"otuz günü geçmemek üzere","c":"PVSK m.8 halinde işyeri faaliyetten men; mülki idare amiri","n":"İşyeri Açma ve Çalışma Ruhsatları Yönetmeliği m.39","k":"“2559 sayılı Kanunun 8 inci maddesinde sayılan hususların tespiti halinde belirtilen işyerleri otuz günü geçmemek üzere geçici süreyle; bu işyerlerinin mevzuat hükümlerine aykırı olarak ruhsatsız işletildiğinin tespiti halinde ise süresiz olarak ya da ruhsat alıncaya kadar mahallin en büyük mülki idare amiri tarafından faaliyetten men edilir.","x":[]},{"m":"80","g":"mühürlemek suretiyle","c":"yetkili idare üç işgünü içinde uygular; uygulamazsa kolluk re'sen","n":"","k":"Yetkili idare en geç üç işgünü içinde faaliyetten men’e ilişkin kararı işyerini mühürlemek suretiyle uygulayarak buna ilişkin tutanağın bir suretini ilgili mülki makama gönderir. Yetkili idare, işyerinin faaliyetten men’ine ilişkin kararı süresinde uygulamazsa, sorumluluğu yetkili idareye ait olmak üzere kapatma kararı kolluk güçleri tarafından re’sen uygulanır ve yetkili idareye bilgi verilir.”","x":[]},{"m":"3","g":"yerleşik ve yaygın inancı","c":"asayiş (tanım); dirlik ve düzenin varlığı konusunda kamuda oluşan","n":"","k":"dirlik ve düzenin varlığı konusunda kamuda oluşan yerleşik ve yaygın inancı,","x":[]},{"m":"3","g":"talep ya da yasağın","c":"emir (tanım); söz, yazı ve sair suretle ifadesi","n":"","k":"ç) Emir: Göreve ait bir talep ya da yasağın söz, yazı ve sair suretle ifadesini,","x":[]},{"m":"19","g":"gazi ,","x":[]},{"m":"3","g":"hizmet barınma, eğitim, tatbikat","c":"konuş (tanım): birlik ve kurumların bulunduğu yer","n":"","k":"k) Konuş: Birlik ve kurumların, hizmet barınma, eğitim, tatbikat ve harekata hazırlanma bakımından bulunduğu yeri,","x":[]},{"m":"3","g":"teşkil edilen jandarma birimini","c":"jandarma hizmet merkezi; ihtiyaç üzerine mülki amirin onayı","n":"","k":"ğ) Jandarma hizmet merkezi: İhtiyaç üzerine mülki amirin onayı ile emniyet ve asayiş ile kamu düzeninin korunması amacıyla geçici olarak teşkil edilen jandarma birimini,","x":[]},{"m":"3","g":"Jandarma Kriminal Daire Başkanlığı","c":"jandarma kriminal birimleri: JKDB, laboratuvar amirlikleri, OYİT, patlayıcı imha timleri","n":"","k":"h) Jandarma kriminal birimleri: Jandarma Kriminal Daire Başkanlığı (JKDB), Jandarma kriminal laboratuvar amirlikleri, olay yeri inceleme timleri (OYİT), patlayıcı madde imha timleri ile kriminal alanda görev yapacak diğer özel maksatlı (felaket kurbanlarını kimliklendirme ve benzeri) timleri,","x":[]},{"m":"3","g":"hususlar ile amir tarafından verilen","c":"görev (tanım): mevzuatla öngörülen + amir tarafından verilen emirler","n":"","k":"f) Görev: Mevzuat gereğince yapılması ya da yapılmaması öngörülen hususlar ile amir tarafından verilen emirleri,","x":[]},{"m":"4","g":"Bakana karşı sorumludur","c":"Jandarma Genel Komutanı; JGK Bakanlığa bağlı","n":"","k":"MADDE 4- (1) Jandarma Genel Komutanlığı Bakanlığa bağlıdır. Jandarma Genel Komutanı, Bakana karşı sorumludur.","x":[["58","çalışma esasları: JGK sevk ve idareden Bakana sorumlu"],["52","JGK görevleri maddesinde de Bakana karşı sorumlu"]]},{"m":"6","g":"Bakan onayı ile kurulabilir","c":"her düzeydeki jandarma birlikleri (konuş: mülki taksimat)","n":"","k":"Her düzeydeki jandarma birlikleri Bakan onayı ile kurulabilir.","x":[]},{"m":"6","g":"birden çok ili içine alan","c":"geçici jandarma bölge komutanlığı; konuşlu olduğu ilin valisine karşı sorumlu","n":"","k":"(2) Sevk ve idare ihtiyaçları ile hizmette verim ve etkinliğin sağlanması amacıyla geçici olarak birden çok ili içine alan jandarma bölge komutanlığı kurulabilir. Bölge komutanı bölge teşkilatının konuşlu olduğu ilin valisine karşı sorumlu olarak görev yapar.","x":[]},{"m":"6","g":"Karakol sorumluluk bölgesinin belirlenmesinde","c":"emniyet-asayiş, suç analizleri, coğrafya-ekonomi, yerleşim, nüfus, ulaşım, sosyal-kültürel","n":"karakoldaki personel sayısı listede yok","k":"Karakol sorumluluk bölgesinin belirlenmesinde aşağıdaki hususlar gözönünde tutulur.\na) Emniyet ve asayiş durumu.\nb) Suç oranları, suç haritaları gibi benzeri suç analizlerinin sonuçları.\nc) İlçenin coğrafi durumu, ekonomik şartlar ve kamu hizmetlerinin gerekleri.\nç) Yerleşim alanlarının durumu.\nd) Nüfus yoğunluğu.\ne) Ulaşım durumu.\nf) Sosyal ve kültürel gelişimi ve benzeri özellikler.","x":[]},{"m":"6","g":"konuş yerleri ise Bakan onayı","c":"karakol sorumluluk bölgesi: vali onayı; konuş yeri: Bakan onayı","n":"il jandarma komutanı önerir; geçici asayiş karakolu ve hizmet merkezi vali onayı","k":"(7) Karakolların sorumluluk bölgeleri il jandarma komutanının önerisi üzerine valinin onayı, karakolların konuş yerleri ise Bakan onayı ile belirlenir. Geçici asayiş karakolları ile jandarma hizmet merkezleri, il jandarma komutanının önerisi üzerine valinin onayıyla teşkil edilir.","x":[]},{"m":"7","g":"görev alanının dışı olup","c":"jandarmanın görev alanı: belediye sınırı dışı; polis-sahil güvenlik bulunmayan yerler","n":"Bakan kararıyla il/ilçenin tamamı tek kolluğa","k":"MADDE 7- (1) Jandarmanın genel olarak görev ve sorumluluk alanı, polis ve sahil güvenlik teşkilatının görev alanının dışı olup, bu alanlar il ve ilçe belediye sınırları dışında kalan ya da polis ve sahil güvenlik teşkilatı bulunmayan yerlerdir. Ancak, belediye sınırları içinde olmakla birlikte, hizmet gerekleri bakımından uygun görülen yerler, jandarmanın görev ve sorumluluk alanı olarak belirlenebilir.","x":[]},{"m":"8","g":"ceza infaz kurumlarının dış korumalarını","c":"mülki görev (iç güvenlik değil); trafik, arama kurtarma, kritik tesis","n":"","k":"a) Mülki görevler: Emniyet ve asayiş ile kamu düzenini sağlamak, korumak ve kollamak, kaçakçılığı men, takip ve tahkik etmek, suç işlenmesini önlemek için gerekli tedbirleri almak ve uygulamak, ceza infaz kurumlarının dış korumalarını sağlamak, trafik hizmetlerini yürütmek, arama kurtarma görevlerini yapmak, hassas ve kritik öneme sahip tesislerin korunmasına ilişkin önlemleri ilgili kuruluşlarla işbirliği içinde sağlamak, bu fıkranın (b) ve (c) bentlerinde belirtilen görevler dışında kalan ve mevzuat hükümlerinin icrası ile bunlara dayalı emir ve kararlarla jandarmaya verilen görevleri yapmak.","x":[["11","mülki görev esasları: dış koruma + sevk-nakil muhafaza"]]},{"m":"8","g":"Bakanlar Kurulunun uygun gördüğü bölümleriyle","c":"askeri görev: seferberlik ve savaşta kuvvet komutanlıkları emrinde","n":"","k":"c) Askeri görevler: Seferberlik ve savaş hallerinde Bakanlar Kurulunun uygun gördüğü bölümleriyle kuvvet komutanlıkları emrinde görev icra etmek ile Genelkurmay Başkanının talebi üzerine Bakanın, illerde ise garnizon komutanının talebi ve valinin onayıyla verilen askeri görevleri icra etmek.","x":[]},{"m":"8","g":"öngörülmeyen hiçbir görev jandarmadan","c":"mevzuat ve yetkili makam emirleri dışında istenemez","n":"","k":"(2) Kanunlar ve diğer mevzuat hükümleri ile bunlara dayalı olarak yetkili makamlarca verilen emir ve kararlarda öngörülmeyen hiçbir görev jandarmadan istenemez.","x":[]},{"m":"10","g":"görevlendireceği vali yardımcısı başkanlığında","c":"sorumluluk alanı komisyonu: illerde vali/yardımcısı, ilçelerde kaymakam; jandarma-emniyet temsilcileri","n":"","k":"(2) Birinci fıkrada belirlenen esaslara göre; il ve ilçelerdeki jandarma ve polis sorumluluk alanlarının sınırları, ilçelerde kaymakam, illerde vali veya görevlendireceği vali yardımcısı başkanlığında jandarma ve emniyet temsilcilerinin katılacağı bir komisyon tarafından belirlenir. Komisyon, vali veya kaymakamın çağrısı üzerine toplanır.","x":[]},{"m":"10","g":"en geç üç ay içerisinde","c":"belediye değişikliğinde sorumluluk alanları yeniden düzenlenir; devir-teslim de üç ay","n":"","k":"değişikliğin yürürlüğe girdiği tarihten itibaren en geç üç ay içerisinde sorumluluk alanları yeniden düzenlenir.\n(3) Komisyon tarafından alınan kararlar İçişleri Bakanının onayıyla yürürlüğe girer. Belirlenen sorumluluk alanlarının sınırları karara eklenen bir harita veya kroki üzerinde gösterilir.(1)\n(4) Sorumluluk alanlarının sınırlarının belirlenmesinde kolluk birimleri arasındaki anlaşmazlıklar, mülki amir tarafından kesin olarak çözümlenir.\n(5) Sorumluluk alanını belirleyen karar doğrultusunda devir ve teslim ile ilgili işlemler en geç üç ay içerisinde tamamlanır.","x":[]},{"m":"10","g":"İçişleri Bakanının onayıyla yürürlüğe","c":"komisyon kararları; sınırlar harita/kroki; anlaşmazlığı mülki amir kesin çözer","n":"","k":"(3) Komisyon tarafından alınan kararlar İçişleri Bakanının onayıyla yürürlüğe girer. Belirlenen sorumluluk alanlarının sınırları karara eklenen bir harita veya kroki üzerinde gösterilir.(1)\n(4) Sorumluluk alanlarının sınırlarının belirlenmesinde kolluk birimleri arasındaki anlaşmazlıklar, mülki amir tarafından kesin olarak çözümlenir.","x":[]},{"m":"11","g":"Halkın can, ırz ve malını","c":"jandarma korur (mülki görevlerin esasları ilk bendi)","n":"","k":"MADDE 11- (1) Jandarma;\na) Halkın can, ırz ve malını korur.","x":[["13","can, ırz ve malın korunmasına ilişkin görevler maddesi"]]},{"m":"11","g":"konut dokunulmazlığını korur","c":"asayişi, kamunun ve kişilerin güvenliğini ve (mülki görev esası)","n":"","k":"c) Asayişi, kamunun ve kişilerin güvenliğini ve konut dokunulmazlığını korur.","x":[]},{"m":"11","g":"kimsesizlere ve yabancılara yardım","c":"jandarma yardım eder: yardım isteyenler, korunmaya muhtaç çocuklar, engelli, hasta","n":"yaşlı, düşkün, kimsesiz, yabancı da","k":"e) Yardım isteyenlere, korunmaya muhtaç çocuklarla yardım gereken küçüklere, engelli, hasta, yaşlı kimselerle, düşkün ya da kimsesizlere ve yabancılara yardım eder.","x":[]},{"m":"11","g":"Her türlü kaçakçılığa engel olur","c":"kaçakçılığa engel olmak mülki görev esası (hakemlik yapmak yok)","n":"","k":"f) Her türlü kaçakçılığa engel olur.","x":[]},{"m":"11","g":"sevk ve nakilleriyle muhafazalarını","c":"tutuklu ve hükümlülerin; ceza infaz kurumlarının dış koruması (mülki görev)","n":"","k":"g) Ceza infaz kurumlarının dış korumalarını sağlayıcı önlemleri alır, tutuklu ve hükümlülerin sevk ve nakilleriyle muhafazalarını sağlar.","x":[]},{"m":"11","g":"üniversiteler ve sivil toplum kuruluşları","c":"suçların önlenmesi için işbirliği ve projeler (mülki görev esası)","n":"","k":"h) Suçların önlenmesi maksadıyla diğer kolluk birimleri, kamu kurumları, üniversiteler ve sivil toplum kuruluşları ile işbirliği yapar ve projeler yürütür.","x":[]},{"m":"16","g":"aile hayatının gizliliğini korumakla","c":"konut dokunulmazlığına ilişkin görevler başlığı altında (jandarma yükümlü)","n":"hak ve hürriyetler başlığı değil","k":"Konut dokunulmazlığına ilişkin görevler\nMADDE 16- (1) Konut dokunulmazlığını sağlamak amacıyla jandarma kendi görev ve sorumluluk alanı içinde;\na) Genel kollama ve koruma önlemleri alarak konutları korumakla,\nb) Konut dokunulmazlığı ve konutta oturanların kişisel güvenliklerinin ihlal edileceği hakkında bilgi olduğu durumlarda, mevzuata uygun olarak mülki amirce verilen emir üzerine, o bölgedeki güvenlik önlemlerini artırmakla,\nc) Özel hayatın ve aile hayatının gizliliğini korumakla, yükümlüdür.","x":[]},{"m":"32","g":"başka şekilde önlenmesine imkân","c":"sevkte ihtara rağmen firara teşebbüs; silah kullanılır","n":"","k":"Bu ihtara uymayarak firara teşebbüs etmeleri durumunda firarın başka şekilde önlenmesine imkân bulunmazsa silah kullanılır.","x":[]},{"m":"39","g":"adli amirlerin talimatlarına göre","c":"adli görevlerde hareket (soruşturma-kovuşturma CMK usulü)","n":"","k":"Adli görevler bakımından ilgili mevzuat ve adli amirlerin talimatlarına göre hareket edilir.","x":[]},{"m":"40","g":"yakıt ve benzeri masraflar","c":"gözaltı sevki JGK taşıtıyla ise JGK bütçesinden; yeme-içme-nakil masrafı da","n":"yalnız adli makam önüne çıkarılıncaya kadar","k":"MADDE 40- (1) Gözaltına alınan şahısların sadece adli makamlar önüne çıkarılıncaya kadarki yeme, içme ve nakil masrafları ile sevkin Jandarma Genel Komutanlığına ait taşıtlarla gerçekleştirilmesi durumunda, söz konusu taşıta ait yakıt ve benzeri masraflar Jandarma Genel Komutanlığı bütçesinden ödenir.","x":[]},{"m":"41","g":"talep etmesi halinde valinin","c":"illerde jandarmaya askeri görev; Genelkurmay talebiyle Bakan (kapsamı Genelkurmay+Bakanlık belirler)","n":"","k":"(2) Jandarma birlikleri; Genelkurmay Başkanlığının talebi üzerine Bakanın, illerde ise garnizon komutanının talep etmesi halinde valinin onayıyla kendilerine verilen askeri görevleri de yapar. Bu görevlerin kapsamı, niteliği ve yerine getirilme esasları Genelkurmay Başkanlığı ve Bakanlıkça belirlenir.","x":[]},{"m":"42","g":"aykırılığı emri verene bildirir","c":"aykırı emir yerine getirilmez; yazılı tekrarda getirilir, sorumlu olmaz","n":"konusu suç olan emir hiçbir surette","k":"(2) Jandarma amirinden aldığı emri Anayasa, kanun, tüzük ve yönetmelik hükümlerine aykırı görürse yerine getirmez ve bu aykırılığı emri verene bildirir. Ancak, amir emrinde ısrar eder ve bu emrini yazılı olarak tekrar ederse emir yerine getirilir. Bu halde, emri yerine getiren sorumlu olmaz.","x":[]},{"m":"42","g":"mal emniyetini korumak için","c":"can, ırz, mal emniyetini korumak: sözlü emir derhal yerine getirilir","n":"","k":"a) Can, ırz veya mal emniyetini korumak için,","x":[]},{"m":"42","g":"işlenmesine veya devamına mani olmak","c":"sözlü emir hali: işlenmekte suçun devamına engel (ehliyet iptali yok)","n":"","k":"f) İşlenmekte olan bir suçun işlenmesine veya devamına mani olmak için,","x":[]},{"m":"42","g":"Kanunsuz toplantı veya kanunsuz yürüyüşleri","c":"sözlü emir derhal yerine getirilir hali (dağıtmak, failleri yakalamak)","n":"","k":"ğ) Kanunsuz toplantı veya kanunsuz yürüyüşleri dağıtmak veya failleri yakalamak için,","x":[]},{"m":"46","g":"zorla getirme kararı verilmiş olan","c":"durdurma amaçları: suç-kabahat önleme, kaçan fail, yakalama emri, tehlike önleme","n":"idari para cezası tahsili durdurma amacı değil","k":"MADDE 46- (1) Jandarma, kişileri ve araçları;\na) Bir suç veya kabahatin işlenmesini önlemek,\nb) Suç işlendikten sonra kaçan faillerin yakalanmasını sağlamak, işlenen suç veya kabahatlerin faillerinin kimliklerini tespit etmek,\nc) Hakkında yakalama emri ya da zorla getirme kararı verilmiş olan kişileri tespit etmek,\nç) Kişilerin hayatı, vücut bütünlüğü veya malvarlığı bakımından ya da topluma yönelik mevcut veya muhtemel bir tehlikeyi önlemek, amacıyla durdurabilir.","x":[]},{"m":"46","g":"makul bir sebebin bulunması","c":"durdurma yetkisi şartı; süreklilik ve keyfilik oluşturacak durdurma yapılamaz","n":"","k":"(2) Durdurma yetkisinin kullanılabilmesi için jandarmanın tecrübesine ve içinde bulunulan durumdan edindiği izlenime dayanan makul bir sebebin bulunması gerekir. Süreklilik arz edecek, fiili durum ve keyfilik oluşturacak şekilde durdurma işlemi yapılamaz.","x":[]},{"m":"46","g":"elbisenin çıkarılması veya aracın","c":"istenemez (el ile dıştan kontrol hariç); arama kolluk amirinin emriyle","n":"","k":"Bu amaçla kişinin üzerindeki elbisenin çıkarılması veya aracın dışarıdan bakıldığında içerisi görünmeyen bölümlerinin açılması istenemez. Ancak el ile dıştan kontrol hariç, kişinin üstü ve eşyası ile aracının dışarıdan bakıldığında içerisi görünmeyen bölümlerinin aranması, Bakanlık tarafından belirlenen esaslar dahilinde mülki amirin görevlendireceği kolluk amirinin yazılı, acele hallerde sonradan yazıyla teyit edilmek üzere sözlü emriyle yapılabilir.","x":[]},{"m":"46","g":"arama gerekçesini de içeren","c":"araç araması yapılan kişiye verilir","n":"","k":"Bu fıkra kapsamında yapılan araç aramalarına ilişkin olarak kişiye, arama gerekçesini de içeren bir belge verilir.","x":[]},{"m":"46","g":"jandarma olduğunu belirleyen belgeyi","c":"gösterdikten sonra kimlik sorabilir; kimliğini ispat için kolaylık gösterilir","n":"","k":"(8) Jandarma, görevini yerine getirirken kendisinin jandarma olduğunu belirleyen belgeyi gösterdikten sonra kişilere kimliğini sorabilir. Bu kişilere kimliğini ispatlamaları hususunda gerekli kolaylık gösterilir.","x":[]},{"m":"46","g":"sair surette kimliği belirlenemeyen kişi","c":"tutularak derhal Cumhuriyet savcısı haberdar edilir","n":"nüfusa kayıtsız: fotoğraf-parmak izi; yabancı: Pasaport K., YUKK","k":"(9) Kişilerin kimliğini ispatlayan belgesinin bulunmaması, açıklamada bulunmaktan kaçınması veya gerçeğe aykırı beyanda bulunması dolayısıyla ya da sair surette kimliği belirlenemeyen kişi tutularak durumdan derhal Cumhuriyet savcısı haberdar edilir.","x":[]},{"m":"47","g":"Konusu ve kapsamı","c":"önleme araması kararında: sebep, konu-kapsam, yer, zaman-süre; personel adı yok","n":"","k":"(3) Arama kararında veya emrinde aşağıdaki hususlar belirtilir.\na) Sebebi.\nb) Konusu ve kapsamı.\nc) Yapılacağı yer.\nç) Yapılacağı zaman ve geçerli olacağı süre.","x":[]},{"m":"47","g":"Halkın topluca bulunduğu veya toplanabileceği","c":"önleme araması yerleri: toplantı-gösteri yeri, yükseköğretim kurumu, umumi yer, taşıtlar","n":"genel kurul toplantısı çevresi de; AVM çevresi sayılmıyor","k":"c) Halkın topluca bulunduğu veya toplanabileceği yerlerde.\nç) İdarecilerinin talebiyle ve mevzuatta yer alan usul ve şartlara uygun olarak yükseköğretim kurumlarının içinde, bunların yakın çevreleri ile giriş ve çıkışlarında.\nd) Umumi veya umuma açık yerlerde.\ne) Her türlü toplu taşıma araçları ile seyir halindeki taşıtlarda.","x":[]},{"m":"47","g":"kamuya açık olmayan işyerlerinde","c":"önleme araması yapılamaz (konut, yerleşim yeri, eklentiler de)","n":"","k":"(5) Konutta, yerleşim yerinde ve kamuya açık olmayan işyerlerinde ve eklentilerinde önleme araması yapılamaz.","x":[]},{"m":"47","g":"aniden toplulukların oluştuğu hallerde","c":"gecikmesinde sakınca var sayılır (spor, miting, konser, festival, gösteri)","n":"","k":"(6) Spor karşılaşması, miting, konser, festival, toplantı ve gösteri yürüyüşünün düzenlendiği veya aniden toplulukların oluştuğu hallerde gecikmesinde sakınca bulunan hal var sayılır.","x":[]},{"m":"47","g":"kimliklerini sorulmaksızın ibraz etmek","c":"jandarmanın güvenliğini sağladığı bina ve tesislere girenler; emir/karar olmadan arama","n":"","k":"(7) Jandarma, tehlikenin önlenmesi veya bertaraf edilmesi amacıyla güvenliğini sağladığı bina ve tesislere gelenlerin; herhangi bir emir veya karar olmasına bakılmaksızın üstünü, aracını ve eşyasını teknik cihazlarla, gerektiğinde el ile kontrol etmeye ve aramaya yetkilidir. Bu yerlere girmek isteyenler kimliklerini sorulmaksızın ibraz etmek zorundadır.","x":[]},{"m":"48","g":"boğulma gibi büyük tehlikelerin","c":"acele halde girme: imdat, yangın, su baskını; suçun devamına engel","n":"kira uyuşmazlığı girme sebebi değil","k":"a) İmdat istenmesi veya yangın, su baskını ve boğulma gibi büyük tehlikelerin haber verilmesi veya görülmesi hallerinde bu tehlikelerden kişileri kurtarmak amacıyla,\nb) Bir suçun işlenmesine veya işlenmekte olan bir suçun devamına engel olmak için, konutlara, işyerlerine ve eklentilerine girebilir.","x":[]},{"m":"54","g":"ilin valisine karşı sorumludur","c":"bölge komutanı (operasyonel faaliyette o ilin valisine karşı da)","n":"","k":"Bölge komutanı bu görevlerinin ifasından ve yetkilerin kullanılmasından, operasyonel faaliyetlerde faaliyette bulunulan ilin valisine karşı sorumluluğu saklı kalmak kaydıyla, bölge komutanlığının konuşlu olduğu ilin valisine karşı sorumludur.","x":[]},{"m":"55","g":"il jandarma teşkilatının komutanıdır","c":"il jandarma komutanı; görevleri: tedbir, denetim, disiplin, özlük, lojistik, adli","n":"komutan yardımcısı yokluğunda aynı yetkiler","k":"MADDE 55- (1) İl jandarma komutanları, il jandarma teşkilatının komutanıdır.\n(2) İl jandarma komutanlarının görev, yetki ve sorumlulukları şunlardır:\na) Emniyet ve asayişi sağlamak için alınan tedbir ve kararları uygulamak, icra edilen adli faaliyetlerin koordinasyon ve takibini yapmak.\nb) Emniyet ve asayişi sağlamaya yönelik alınması gereken tedbirlere ilişkin önerilerde bulunmak.\nc) Görev ve işlemlerin tam, doğru ve zamanında yapılmasını sağlamak, denetlemek, yanlış ve eksiklikleri gidermek, gerektiğinde soruşturma yapmak.\nç) Kanunlarla ve vali tarafından verilen görevlerin yapılıp yapılmadığını takip ve kontrol etmek, sonuçlarını bildirmek.\nd) Astlarını kanunlarda verilen görevleri yönünden yetiştirmek.\ne) Disiplini sağlamak.\nf) Personelin özlük işlemlerini yürütmek.\ng) İhtiyaç duyulan lojistik ve teknik destek faaliyetlerini planlamak, kontrol ve denetimini sağlamak.\nğ) Adli görevleri ifa etmek.","x":[]},{"m":"57","g":"karakolun komutanıdır","c":"karakol komutanı görevleri: tedbir, adli, denetim, yetiştirme, disiplin, özlük","n":"lojistik-teknik destek planlama il/bölge komutanının","k":"MADDE 57- (1) Jandarma karakol komutanları, karakolun komutanıdır.\n(2) Jandarma karakol komutanlarının görev, yetki ve sorumlulukları şunlardır:\na) Emniyet ve asayişi sağlamak için alınan tedbir ve kararları uygulamak.\nb) Emniyet ve asayişi sağlamaya yönelik alınması gereken tedbirlere ilişkin önerilerde bulunmak.\nc) Adli görevleri ifa etmek.\nç) Görev ve işlemlerin tam, doğru ve zamanında yapılmasını sağlamak, denetlemek; yanlış ve eksikliklerin nedenlerini inceleyerek gidermek, gerektiğinde soruşturma yapmak,\nd) Kanunlarla ve ilçe jandarma komutanı tarafından verilen görevlerin yapılıp yapılmadığını takip ve kontrol etmek, sonuçlarını bildirmek.\ne) Astlarını kanunlarda verilen görevleri yönünden yetiştirmek.\nf) Disiplini sağlamak.\ng) Personelin özlük işlemlerini yürütmek.","x":[]},{"m":"58","g":"mülki amirlere bağlı ve sorumlu","c":"il ve ilçe jandarma komutanları; bölge komutanı konuşlu il valisine","n":"","k":"(2) Jandarma bölge komutanları konuşlu olduğu ilin valisine, il ve ilçe jandarma komutanları ise mülki amirlere bağlı ve sorumlu olarak görev yapar.","x":[]},{"m":"58","g":"doğrudan emir verme yetkisine","c":"mülki amirler ve adli makamlar; diğer makamlar mülki amire başvurur","n":"","k":"(3) Mülki amirler ile adli makamlar mevzuat hükümlerine uygun olarak jandarma komutanlarına ve diğer jandarma personeline doğrudan emir verme yetkisine sahiptir. Diğer makamlar jandarmaya görev olarak verilmesini istedikleri konunun kanuni dayanaklarını belirterek o yerin mülki amirine başvurur. Mülki amir, talebi mevzuata ve ihtiyaca uygunluk yönünden değerlendirir ve uygun bulduğunda, görevin ifasını emreder.","x":[]},{"m":"58","g":"seçimi kendi komutanlarına aittir","c":"jandarma birimlerinin; mülki amir yetersizlikte diğer kurumlardan sağlayabilir","n":"","k":"(7) Jandarma birimlerinin üstlendikleri görevin yapılmasında kullanacakları araç ve gereçlerin seçimi kendi komutanlarına aittir. Mülki amirler özellik taşıyan ve yetersiz kalınan durumlarda gereken araç ve gereçleri diğer kamu kurum ve kuruluşlarından sağlayarak jandarmanın hizmetine verebilir.","x":[]},{"m":"59","g":"vakit geçirmeksizin mülki amire","c":"suçlar, asayişi bozan olaylar, afetler, salgınlar bildirilir; suç olayları savcılığa","n":"","k":"MADDE 59- (1) Jandarma; bölgelerindeki her türlü suçları ve sonuçlarını, ülkenin emniyet ve asayişini bozan ya da bozacak olan olayları, yangın, su baskını gibi afetleri, haber aldıkları salgın ve bulaşıcı hastalıkları, Devletin ülkesi ve milletiyle bölünmez bütünlüğünü, nitelikleri Anayasada gösterilen Cumhuriyeti yıkmaya, sarsmaya ve bölmeye yönelik propagandalar konusunda edindikleri bilgileri, il veya ilçenin asayiş veya güvenliğini etkileyecek mahiyetteki kovuşturma ve soruşturmaları, vakit geçirmeksizin mülki amire sözlü ya da yazılı olarak bildirir. Suçla ilgili görülen olaylar aynı zamanda Cumhuriyet savcılığına da bildirilir.","x":[]},{"m":"61","g":"genel hayatın akışını ilgilendiren olaylarda","c":"jandarma mülk ,"ad":"2521 sayılı Kanunun Uygulanmasına İlişkin Yönetmelik","grup":"müşterek","satirlar":[{"m":"10","g":"münhasıran valilerce verilir","c":"satıcılık (bayilik) belgesi; üç yıl süreli","n":"BAYİ = YALNIZ VALİ","k":"a) Satıcılık (Bayilik) Belgesi: Bu belge illerde münhasıran valilerce verilir. 2521 sayılı Avda ve Sporda Kullanılan Tüfekler, Nişan Tabancaları ve Av Bıçaklarının Yapımı, Alımı, Satımı ve Bulundurulmasına Dair Kanun kapsamına giren silahların satışını yapmak isteyenler aşağıdaki belgeleri dilekçelerine ekleyerek valiliğe müracaat eder. 1- İşyerinin kendi mülkiyetlerinde bulunduğunu veya kiralandığını kanıtlayan belge, 2- Silah bulundurmasında ve satmasında bedeni ve ruhi bakımdan bir sakınca olmadığına dair sağlık raporu, 3- Sabıka kaydına ilişkin yazılı beyanı, 4- 2521 sayılı Kanun hükümlerine uymayı taahhüt ettiği ve doğacak Kanuni sorumluluğu üstlendiğine dair taahhütname, 5- T.C. Kimlik Numarası beyanı, 6- İki adet fotoğraf. Yukarıdaki belgeler ile müracaat eden kişilere, 3 yıl süreli (Örnek 7) deki satıcılık (bayilik) belgesi verilir.","x":[]},{"m":"10","g":"ilçelerde kaymakamlarca verilir","c":"yivsiz tüfek ruhsatnamesi; merkez ilçede vali","n":"","k":"b) Yivsiz Tüfek Ruhsatnamesi: 2521 sayılı Kanunun 9 uncu maddesi gereğince illerin merkez ilçelerinde valiler, ilçelerde kaymakamlarca verilir.","x":[]},{"m":"10","g":"5 yıl süreli yivsiz tüfek","c":"verildiği tarihten geçerli; harç ödenmiş olmalı","n":"BAYİLİK ÜÇ YIL, RUHSATNAME BEŞ YIL","k":"ekleyecekleri dilekçeleri ile yerleşim yerinin bağlı bulunduğu valilik veya kaymakamlığına başvurmaları halinde yivsiz tüfek ruhsatnamesi harcının ödenmiş olması kaydıyla, verildiği tarihten geçerli olmak üzere 5 yıl süreli yivsiz tüfek ruhsatnamesi düzenlenir.","x":[]},{"m":"10","g":"kırsal alanda taşıma yetkisi","c":"yivsiz tüfek ruhsatnamesi: bulundurma + meskûn mahal dışı taşıma","n":"","k":"Bu belge tüfek sahibine, bulundurma ve meskun mahaller dışında kırsal alanda taşıma yetkisi sağlar.","x":[]},{"m":"10 in yapılacağı yer ile tebliğ tarihinden itibaren\nbir ay içinde ödenmesi hususu şiddet uygulayana tebliğ edilir. Ödemenin süresinde yapılmaması halinde bu tutar, 21/7/1953 tarihli ve 6183 sayılı Amme\nAlacaklarının Tahsil Usulü Hakkında Kanun hükümlerine göre ilgili vergi dairesi tarafından takip ve tahsil edilir.","x":[]},{"m":"42","g":"gerçeğe aykırı beyanda bulunduğunun","c":"korunan kişiden tahsil; şiddet uygulayandan alınan iade","n":"","k":"(2) Korunan kişinin gerçeğe aykırı beyanda bulunduğunun ilgili müdürlüğe yapılan ihbar üzerine veya kollukta ya da ŞÖNİM tarafından kararların\nuygulanması izlenirken tespit edilmesi halinde, bu hususa ilişkin tutanak tutulur ve sosyal inceleme raporu düzenlenir. Bu durumda yapılan ödemeler,\nkendisine ödeme yapılan kişiden 6183 sayılı Kanun hükümlerine göre tahsil edilir.","x":[]},{"m":"43","g":"suçüstü ödeneğinden","c":"nafaka icra posta giderleri; Cumhuriyet başsavcılığı","n":"harç alınmaz","k":"(4) İcra müdürlüklerinin nafakanın tahsili işlemlerine ilişkin posta giderleri Cumhuriyet başsavcılığının suçüstü ödeneğinden karşılanır. Ayrıca harç\nve benzeri hiçbir ad altında masraf alınmaz.","x":[]},{"m":"43","g":"başvurusu aranmaksızın","c":"SGK'lı borçlunun maaşından icra müdürlüğü nafakayı keser","n":"","k":"(3) Nafaka ödemekle yükümlü kılınan kişinin Sosyal Güvenlik Kurumu ile bağlantısı olması durumunda, korunan kişinin başvurusu aranmaksızın\nnafaka, ilgilinin aylık, maaş ya da ücretinden icra müdürlüğü tarafından tahsil edilir.","x":[]},{"m":"44","g":"gelir testine tabî tutulmaksızın","c":"GSS'siz korunan kişi genel sağlık sigortalısı sayılır","n":"","k":"Ancak Kanun hükümlerine göre hakkında\nkoruyucu tedbir kararı verilen kişilerden genel sağlık sigortalısı olmayan ve genel sağlık sigortalısının bakmakla yükümlü olduğu kişi kapsamına da\ngirmeyen veya genel sağlık sigortası prim borcu sebebiyle fiilen genel sağlık sigortasından yararlanamayan ya da diğer mevzuat hükümleri gereğince\ntedavi yardımından yararlanma ha ik; gümrük muhafaza dâhil değil","n":"","k":"h) Kolluk: Polis, jandarma ve sahil güvenlik birimlerini,","x":[]},{"m":"3","g":"Aile mahkemesi hâkimini","c":"Yönetmelikteki Hâkim (sulh ceza değil)","n":"","k":"e) Hâkim: Aile mahkemesi hâkimini,","x":[]},{"m":"3","g":"üçüncü kişiler tarafından ilgili makam","c":"ihbar (şikâyet: mağdurun kendisinin müracaatı)","n":"","k":"g) İhbar ve şikâyet: İhbar, üçüncü kişiler tarafından ilgili makam veya mercilere olayın yazılı, sözlü veya başka bir suretle bildirilmesini; şikâyet,\nşiddet mağdurunun şiddet veya şiddet tehlikesi halinde ilgili makam veya mercilere müracaat etmesini,","x":[]},{"m":"3","g":"komutanını/amirini","c":"kolluk amiri: yerleşim yeri/bulunduğu/uygulama yerindeki yetkili kolluk birimi amiri","n":"","k":"ı) Kolluk amiri: Hakkında tedbir kararı verilen kişilerin yerleşim yeri veya bulunduğu ya da tedbirin uygulanacağı yerdeki Jandarma Genel\nKomutanlığı, Emniyet Genel Müdürlüğü ve Sahil Güvenlik Komutanlığı tarafından atamalarındaki usule göre konu ile yetkili ve görevli kolluk biriminin\nkomutanını/amirini,","x":[]},{"m":"4","g":"herkes durumu yazılı, sözlü","c":"şiddet veya tehlikesini ilgili makamlara ihbar edebilir","n":"kamu kurumları ve meslek kuruluşları için zorunluluk","k":"(1) Kişinin, şiddete uğraması veya şiddete uğrama tehlikesi altında bulunması halinde herkes durumu yazılı, sözlü veya başka bir\nsuretle ilgili makam ve mercilere ihbar edebilir.","x":[]},{"m":"4","g":"Müdürlük veya ŞÖNİM’e yapılan","c":"şikâyet-ihbar gecikmeksizin kolluğa, mülki amire, Cumhuriyet başsavcılığına veya hâkime","n":"","k":"(4) Müdürlük veya ŞÖNİM’e yapılan şikâyet ve ihbarlar, bunlar tarafından olayın özelliğine göre, kolluğa, mülki amire, Cumhuriyet başsavcılığına\nveya hâkime gecikmeksizin bildirilir.","x":[]},{"m":"5","g":"evrakın bir örneğini ivedilikle","c":"Cumhuriyet başsavcılığı ihbar-şikâyeti hâkime veya mülki amire gönderir (tedbir için)","n":"","k":"(2) Cumhuriyet başsavcılığı, yapılan ihbar ve şikâyet üzerine evrakın bir örneğini ivedilikle olayın niteliğine göre uygulanabilecek olan koruyucu\nveya önleyici tedbir hakkında karar verilmek üzere hâkime veya mülki amire gönderir.","x":[]},{"m":"5","g":"ivedilikle ŞÖNİM’e bildirilir","c":"hâkim veya mülki amirin verdiği kararlar","n":"","k":"(4) Hâkim veya mülki amir tarafından verilen kararlar ivedilikle ŞÖNİM’e bildirilir.","x":[]},{"m":"6","g":"rehberlik ve danışmanlık hizmeti verilmesi","c":"mülkî amir tedbirleri: barınma, maddi yardım, rehberlik, geçici koruma, kreş","n":"aile konutu şerhi, işyeri değişikliği HÂKİM tedbiri","k":"a) Kendisine ve gerekiyorsa beraberindeki çocuklara, bulunduğu yerde veya başka bir yerde uygun barınma yeri sağlanması,\n b) Diğer kanunlar kapsamında yapılacak yardımlar saklı kalmak üzere, geçici maddi yardım yapılması,\n c) Psikolojik, meslekî, hukukî ve sosyal bakımdan rehberlik ve danışmanlık hizmeti verilmesi,\n ç) Hayatî tehlikesinin bulunması hâlinde, ilgilinin talebi üzerine veya resen geçici koruma altına alınması,\n d) Gerekli olması hâlinde, korunan kişinin çocukları varsa çalışma yaşamına katılımını desteklemek üzere dört ay, kişinin çalışması hâlinde ise iki\naylık süre ile sınırlı olmak kaydıyla, on altı yaşından büyükler için her yıl belirlenen aylık net asgari ücret tutarının yarısını geçmemek ve belgelendirilmek\nşartıyla Bakanlık bütçesinin ilgili tertibinden karşılanmak suretiyle kreş imkânının sağlanması.","x":[]},{"m":"6","g":"resen geçici koruma altına alınması","c":"hayatî tehlike halinde (mülkî amir; gecikmede kolluk amiri de)","n":"","k":"ç) Hayatî tehlikesinin bulunması hâlinde, ilgilinin talebi üzerine veya resen geçici koruma altına alınması,","x":[]},{"m":"9","g":"koordinasyon ŞÖNİM tarafından sağlanır","c":"ŞÖNİM sağlar: destek, iş bulma, hukuki rehberlik hizmetlerinde koordinasyon","n":"","k":"(3) Bu hizmetlerin yerine getirilmesinde koordinasyon ŞÖNİM tarafından sağlanır.","x":[]},{"m":"10","g":"geçici koruma altına alma tedbiri","c":"mülkî amir verir; gecikmede kolluk amiri (hayati tehlike)","n":"","k":"(1) Mülkî amir veya gecikmesinde sakınca bulunan hallerde kolluk amiri tarafından, olayın niteliği, şikâyet ve ihbar göz önünde\nbulundurularak şiddet mağdurunun hayati tehlikesinin bulunması halinde ilgilinin talebi üzerine veya resen geçici koruma altına alma tedbiri verilir.","x":[]},{"m":"10","g":"tutanağa geçirilir ve tebliğ edilir","c":"geçici koruma kararının kapsamı, telefonlar, kolluğun sorumlulukları korunan kişiye açıklanır","n":"","k":"(4) Korunan kişiye, geçici koruma kararının kapsam ve içeriği, şiddet veya şiddete uğrama tehlikesinin varlığı halinde arayabileceği telefon\nnumaraları, kolluğun sorumlulukları, hangi durumlarda kolluğa bilgi vermesi gerektiği, hangi kolluk biriminin geçici koruma hizmetinden sorumlu olduğu\nve benzeri hususlar, kolluk tarafından açıklanarak tutanağa geçirilir ve tebliğ edilir.","x":[]},{"m":"17","g":"derhâl uzaklaştırılması ve müşterek konutun","c":"hâkim önleyici tedbiri; müşterek konut korunan kişiye tahsis","n":"","k":"b) Müşterek konuttan veya bulunduğu yerden derhâl uzaklaştırılması ve müşterek konutun korunan kişiye tahsis edilmesi.","x":[]},{"m":"17","g":"hakaret, aşağılama veya küçük düşürmeyi","c":"önleyici tedbirler: hakaret yasağı, uzaklaştırma, yaklaşmama, rahatsız etmeme, silah teslimi","n":"aile konutu şerhi, işyeri değişikliği KORUYUCU tedbir","k":"a) Şiddet mağduruna yönelik olarak şiddet tehdidi, hakaret, aşağılama veya küçük düşürmeyi içeren söz ve davranışlarda bulunmaması.\n b) Müşterek konuttan veya bulunduğu yerden derhâl uzaklaştırılması ve müşterek konutun korunan kişiye tahsis edilmesi.\n c) Korunan kişilere, bu kişilerin bulundukları konuta, okula ve işyerine yaklaşmaması.\n ç) Çocuklarla ilgili daha önce verilmiş bir kişisel ilişki kurma kararı varsa, kişisel ilişkinin refakatçi eşliğinde kurulması, kişisel ilişkinin sınırlanması\nya da tümüyle kaldırılması.\n d) Gerekli görülmesi hâlinde korunan kişinin, şiddete uğramamış olsa bile yakınlarına, tanıklarına ve kişisel ilişki kurulmasına ilişkin hâller saklı\nkalmak üzere çocuklarına yaklaşmaması.\n e) Korunan kişinin şahsi eşyalarına ve ev eşyalarına zarar vermemesi.\n f) Korunan kişiyi iletişim araçlarıyla veya sair surette rahatsız etmemesi.\n g) Bulundurulması veya taşınmasına kanunen izin verilen silahları kolluğa teslim etmesi.\n ğ) Silah taşıması zorunlu olan bir kamu görevi ifa etse bile bu görevi nedeniyle zimmetinde bulunan silahı kurumuna teslim etmesi.\n h) Korunan kişilerin bulundukları yerlerde alkol ya da uyuşturucu veya uyarıcı madde kullanmaması ya da bu maddelerin etkisinde iken korunan\nkişilere ve bunların bulundukları yerlere yaklaşmaması, bağımlılığının olması hâlinde, hastaneye yatmak dâhil, muayene ve tedavisinin sağlanması.","x":[]},{"m":"17","g":"zimmetinde bulunan silahı kurumuna","c":"silah taşıması zorunlu kamu görevlisi şiddet uygulayan; önleyici tedbir","n":"","k":"ğ) Silah taşıması zorunlu olan bir kamu görevi ifa etse bile bu görevi nedeniyle zimmetinde bulunan silahı kurumuna teslim etmesi.","x":[["26","silahın kurum amirine teslimi ve iadesi usulü"]]},{"m":"29","g":"kırk sekiz saat içinde onaylanmayan","c":"kolluk amirinin aldığı barınma/geçici koruma tedbiri; mülkî amir onayı","n":"","k":"(1) Mülkî amir tarafından alınabilecek barınma yeri sağlanmasına ve geçici koruma altına alınmasına ilişkin tedbirler,\ngecikmesinde sakınca bulunan hâllerde ilgili kolluk amirince de alınabilir. Kolluk amiri, evrakı en geç tedbirin alındığı tarihi takip eden ilk işgünü içinde\nmülkî amirin onayına sunar. Mülkî amir tarafından kırk sekiz saat içinde onaylanmayan tedbirler kendiliğinden kalkar.","x":[]},{"m":"30","g":"en kolay ulaşılabilecek yer","c":"tedbir kararı talep yeri: hâkim, mülkî amir, kolluk","n":"","k":"Tedbir kararları en çabuk ve en kolay ulaşılabilecek yer hâkiminden, mülkî amirden ya da kolluktan talep edilebilir.","x":[]},{"m":"30","g":"ilk defasında en çok","c":"tedbir kararı süresi; tehlike sürerse süre/şekil değiştirilebilir, aynen devam","n":"","k":"(2) Tedbir kararı ilk defasında en çok altı ay için verilebilir. Ancak şiddet veya şiddet uygulanma tehlikesinin devam edeceğinin anlaşılması\nhâlinde, resen, korunan kişinin, müdürlük, ŞÖNİM veya kolluk görevlilerinin talebi üzerine, tedbirlerin süresinin veya şeklinin değiştirilmesine ya da\naynen devam etmesine karar verilebilir.","x":[]},{"m":"30","g":"geciktirilmeksizin verilir","c":"önleyici tedbir kararı; koruyucu tedbirde delil-belge aranmaz","n":"","k":"(3) Koruyucu tedbir kararı verilebilmesi için, şiddetin uygulandığı hususunda delil veya belge aranmaz. Önleyici tedbir kararı, geciktirilmeksizin\nverilir. Kararın verilmesi, Kanunun amacını gerçekleştirmeyi tehlikeye sokabilecek şekilde geciktirilemez.","x":[]},{"m":"34","g":"bir hafta içinde verilir","c":"itiraz üzerine aile mahkemesi kararı; kesin; duruşmasız","n":"","k":"(7) Karar bir hafta içinde verilir. İtiraz üzerine verilen karar kesindir.","x":[["33","mülki amir kararına itirazda da bir hafta"]]},{"m":"37","g":"ses ve görüntü kaydı alınamaz","c":"teknik araçla tedbir takibinde; kişiler dinlenemez, izlenemez (hâkim karar verir)","n":"","k":"(1) Hâkim, tedbir kararlarının uygulanmasında teknik araç ve yöntemler kullanılmasına karar verebilir. Ancak, teknik araçlar\nkullanılmak suretiyle, kişilerin ses ve görüntü kaydı alınamaz, kişiler dinlenemez ve izlenemez.","x":[]},{"m":"38","g":"tutulan tutanak Cumhuriyet başsavcılığına","c":"kolluk ihlali tespit edince başsavcılığa; mahkeme tespitinde resen zorlama hapsi","n":"","k":"(1) Tedbir kararlarının ihlal edildiğinin kolluk tarafından tespit edilmesi halinde tutulan tutanak Cumhuriyet başsavcılığına iletilir.\nBu tutanak Cumhuriyet başsavcılığı tarafından ivedilikle aile mahkemesine gönderilir. Tedbir kararlarının ihlal edildiğinin aile mahkemesince tespit\nedilmesi halinde ise başka bir işleme gerek kalmaksızın resen zorlama hapsine ilişkin karar verilebilir.","x":[]},{"m":"38","g":"üç günden on güne kadar","c":"zorlama hapsi (tedbire aykırılık); tekrarında onbeş-otuz gün; altı ayı geçemez","n":"","k":"hâkim tarafından üç günden on güne kadar zorlama hapsine tâbi tutulmasına karar verilir.\n (6) Tedbir kararının gereklerine aykırılığın her tekrarında, ihlal edilen tedbirin niteliğine ve aykırılığın ağırlığına göre zorlama hapsinin süresi onbeş\ngünden otuz güne kadardır. Ancak zorlama hapsinin toplam süresi altı ayı geçemez.","x":[]},{"m":"40","g":"kurumlararası ve sivil toplum kuruluşları","c":"koordinasyon Bakanlık tarafından; kurumlar tedbir kararlarını ivedilikle yerine getirir","n":"","k":"(1) Kanun hükümlerinin yerine getirilmesinde kurumlararası ve sivil toplum kuruluşları ile koordinasyon Bakanlık tarafından\ngerçekleştirilir.","x":[]},{"m":"41","g":"kadın erkek eşitliği konusunda eğitim","c":"kamu kurumları personelini Bakanlığın koordine ettiği eğitim programlarına katılmasını sağlar","n":"","k":"(1) Kanunun etkin bir biçimde uygulanması amacıyla tüm kamu kurum ve kuruluşları ile kamu kurumu niteliğindeki meslek\nkuruluşları, personel ve üyelerinin Bakanlığın hazırlayıp koordine edeceği, kadının insan hakları ile kadın erkek eşitliği konusunda eğitim programlarına\nkatılmasını sağlar.","x":[["36","ŞÖNİM personeline verilecek eğitim"]]},{"m":"41","g":"mezun oldukları tarihte","c":"sosyal sorumluluk projelerine katılan öğrencilere sertifika (Bakanlık + MEB/YÖK)","n":"","k":"(3) Ortaöğretim öğrencileri ile yükseköğrenim öğrencileri, Bakanlığın görev alanına giren konularda sosyal sorumluluk projeleri oluşturmada ya\nda mevcut projelerin içerisinde yer alma konularında teşvik edilir. Bu öğrencilere mezun oldukları tarihte Bakanlık ile Milli Eğitim Bakanlığı ya da\nYükseköğretim Kurumu tarafından hazırlanan bir sertifika verilir.","x":[]},{"m":"42","g":"bir ay içinde ödenmesi hususu","c":"geçici maddi yardım rücusu şiddet uygulayana tebliğ; ödenmezse 6183 takibi","n":"","k":"(1) Geçici maddi yardımlar için yapılan ödemelerin tahsili için, ödeme tutarı, ödemenin yapılacağı yer ile tebliğ tarihinden itibaren\nbir ay içinde ödenmesi hususu şiddet uygulayana tebliğ edilir. Ödemenin süresinde yapılmaması halinde bu tutar, 21/7/1953 tarihli ve 6183 sayılı Amme\nAlacaklarının Tahsil Usulü Hakkında Kanun hükümlerine göre ilgili vergi dairesi tarafından takip ve tahsil edilir.","x":[]},{"m":"43","g":"kararın bir örneği, resen","c":"nafaka kararı icra müdürlüğüne gönderilir (alacaklı/borçlu yerleşim yeri)","n":"","k":"(1) Kanun hükümlerine göre nafakaya karar verilmesi hâlinde, kararın bir örneği, resen nafaka alacaklısının veya borçlusunun\nyerleşim yeri icra müdürlüğüne gönderilir.","x":[]},{"m":"44","g":"genel sağlık sigortası kapsamında karşılanır","c":"korunan kişinin sağlık giderleri; GSS'siz gelir testi olmadan sigortalı sayılır","n":"","k":"(1) Korunan kişinin sağlık giderleri, genel sağlık sigortası kapsamında karşılanır. Ancak Kanun hükümlerine göre hakkında\nkoruyucu tedbir kararı verilen kişilerden genel sağlık sigortalısı olmayan ve genel sağlık sigortalısının bakmakla yükümlü olduğu kişi kapsamına da\ngirmeyen veya genel sağlık sigortası prim borcu sebebiyle fiilen genel sağlık sigortasından yararlanamayan ya da diğer mevzuat hükümleri gereğince\ntedavi yardımından yararlanma hakkı bulunmayanlar, bu hâllerin devamı süresince, 31/5/2006 tarihli ve 5510 sayılı Sosyal Sigortalar ve Genel Sağlık\nSigortası Kanununun 60 ıncı maddesinin birinci fıkrasının (c) bendinin (1) numaralı alt bendi kapsamında, gelir testine tabî tutulmaksızın genel sağlık\nsigortalısı sayılır.","x":[]},{"m":"45","g":"veraset ve intikal vergisinden","c":"Kanun m.17 ödemeleri gelir vergisinden de müstesna; kâğıtlar damga vergisinden","n":"","k":"(2) Kanunun 17 nci maddesi uyarınca yapılan ödemeler, gelir vergisi ile veraset ve intikal vergisinden, bu ödemeler için düzenlenen kâğıtlar ise\ndamga vergisinden müstesnadır.","x":[["8","geçici maddi yardım ödemelerinde vergi istisnası"]]},{"m":"3","g":"beraberindeki çocukları, aile bireylerini","c":"korunan kişi: tedbir kapsamındaki mağdur + çocukları, aile bireyleri","n":"","k":"j) Korunan kişi: Tedbir kararı kapsamında korunan şiddet mağdurunu ve varsa beraberindeki çocukları, aile bireylerini ve tek taraflı","x":[]},{"m":"5","g":"niteliğine göre mülki amire","c":"gecikmesinde sakınca: kolluğun aldığı koruyucu/önleyici tedbir onaya sunulur","n":"koruyucu → mülki amir, önleyici → hâkim","k":"sakınca bulunan hallerde Kanun kapsamında almış olduğu koruyucu ve önleyici tedbirleri onaylanmak üzere tedbirin niteliğine göre mülki amire veya\nhâkime sunar.","x":[]},{"m":"12","g":"ayrı yerleşim yeri belirlenmesi","c":"hâkim koruyucu tedbiri (evli ise); işyeri değişikliği, aile konutu şerhi","n":"silah teslimi ÖNLEYİCİ tedbir (m.17)","k":"b) Kişinin evli olması hâlinde müşterek yerleşim yerinden ayrı yerleşim yeri belirlenmesi.\n c) 22/11/2001 tarihli ve 4721 sayılı Türk Medenî Kanunundaki şartların varlığı hâlinde ve korunan kişinin talebi üzerine tapu kütüğüne aile konutu\nşerhi konulması.\n ç) Korunan kişi bakımından hayatî tehlikenin bulunması ve bu tehlikenin önlenmesi için diğer tedbirlerin yeterli olmayacağının anlaşılması hâlinde\nve ilgilinin aydınlatılmış rızasına dayalı olarak 27/12/2007 tarihli ve 5726 sayılı Tanık Koruma Kanununa göre kimlik ve ilgili diğer bilgi ve belgelerinin","x":[["13","işyeri değişikliği uygulama maddesi"],["14","ayrı yerleşim yeri uygulama maddesi, nüfus"]]},{"m":"17","g":"talep edilmese dahi tedbir nafakasına","c":"hâkim hükmedebilir; şiddet uygulayan ailenin geçimini sağlıyorsa (TMK nafakası yoksa)","n":"","k":"(3) Şiddet uygulayan, aynı zamanda ailenin geçimini sağlayan veya katkıda bulunan kişi ise hâkim, Türk Medeni Kanunu hükümlerine göre\nnafakaya hükmedilmemiş olması kaydıyla, şiddet mağdurunun yaşam düzeyini göz önünde bulundurarak talep edilmese dahi tedbir nafakasına","x":[]},{"m":"29","g":"dört saat içinde onaylanmayan","c":"kolluk amirinin aldığı önleyici tedbir hâkimce onaylanmazsa kendiliğinden kalkar","n":"koruyucu tedbirde mülkî amir, kırk sekiz saat","k":"tarafından yirmi dört saat içinde onaylanmayan tedbirler kendiliğinden kalkar.","x":[]},{"m":"43","g":"Ayrıca harç ve benzeri","c":"nafaka tahsilinde harç ve masraf yok; posta gideri suçüstü ödeneğinden","n":"","k":"suçüstü ödeneğinden karşılanır. Ayrıca harç\nve benzeri hiçbir ad altında masraf alınmaz.","x":[]}]},{"id":22,"ad":"Jandarma Genel Komutanlığı ve Sahil Güvenlik Komutanlığı Personel Yönetmeliği","grup":"müşterek","satirlar":[{"m":"4","g":"temsil ettiği mevkii","c":"makam (tanım)","n":"MAKAM = KOLTUK, AMİR = KOLTUKTAKİ","k":"i) Makam: Her amirin kuruluş ve kadrolarında temsil ettiği mevkii,","x":[]},{"m":"4","g":"rütbe veya kıdem büyüklüğünü","c":"üst: makam, rütbe ya da kıdem büyüklüğü","n":"","k":"k) Üst: Makam, rütbe veya kıdem büyüklüğünü,","x":[]},{"m":"4","g":"inha eden makamı","c":"müşterek kararla atananda atamaya yetkili amir","n":"","k":"b) Atamaya yetkili amir: Atama usul ve esaslarını belirleyen mevzuat hükümleriyle atama yetkisi tanınan veya bu konuda usulüne göre yetki devri yapılan personeli, müşterek kararla atanan personel bakımından ise inha eden makamı,","x":[]},{"m":"5","g":"insan gücü planına","c":"personel ihtiyacı; JGK/SGK hazırlar, Bakanlık onaylar","n":"kaynak: Akademi ve eğitim komutanlıkları","k":"(4) Personel ihtiyacı, Jandarma Genel Komutanlığı ve Sahil Güvenlik Komutanlığı tarafından ayrı ayrı hazırlanarak Bakanlık tarafından onaylanan insan gücü planına göre karşılanır.","x":[]},{"m":"7","g":"Uçak ve helikopter teknisyeni","c":"JGK astsubay branşı (subayda Pilot)","n":"","k":"b) Astsubaylar 1) Jandarma 2) İstihkâm 3) Muhabere 4) Uçak ve helikopter teknisyeni","x":[]},{"m":"7","g":"Bilgi teknolojileri","c":"Sahil Güvenlik astsubay branşı","n":"SG astsubay: güverte, makine, ikmal, uçak bakım, idari","k":"b) Astsubaylar 1) Güverte 2) Makine 3) İkmal 4) Uçak bakım 5) İdari 6) Bilgi teknolojileri","x":[]},{"m":"7","g":"İnsansız Hava Aracı","c":"JGK subay ve astsubay branşı (2024)","n":"Hukuk branşı 2020","k":"(1) Jandarma Genel Komutanlığında bulunan branşlar şunlardır: a) Subaylar 1) Jandarma 2) İstihkâm 3) Muhabere 4) Pilot 5) İkmal 6) Bakım 7) Personel 8) Kimyager 9) Veteriner hekim 10) Mühendis 11) Maliye 12) Öğretmen 13) Bando 14) Tabip 15) Eczacı 16) Diş tabibi 17) Sağlık 18) (Ek:RG-28/5/2020) Hukuk 19) (Ek:RG-16/1/2024) İnsansız Hava Aracı","x":[]},{"m":"8","g":"branş belirleme kurul kararı","c":"branş değişikliği; sağlık, uçuştan ayrılma, ikinci tahsil, kadro değişikliği","n":"","k":"(2) Personelin branşları; sağlık durumu, uçuştan ayrılma, özel hizmet niteliğini kaybetme, ikinci bir tahsil, yeterlilik değişikliği, kuruluş ve kadro değişikliği sebebiyle branşların değişmesi ve yeni bir branş kurulması durumunda kurumun ihtiyaçları doğrultusunda branş belirleme kurul kararı ile değiştirilebilir.","x":[]},{"m":"9","g":"Çekimser oy kullanılamaz","c":"branş belirleme kurulu; üye tam sayısı, oyçokluğu, eşitlikte başkan tarafı","n":"","k":"(2) Branş belirleme kurulları üye tam sayısı ile toplanır ve oyçokluğu ile karar alırlar. Çekimser oy kullanılamaz. Oyların eşitliği durumunda başkanın bulunduğu taraf çoğunluk sayılır. İlk branş belirleme kurullarının kararları Jandarma ve Sahil Güvenlik Akademisi Başkanının, ilk branş belirleme ve branş değişikliğine ilişkin branş belirleme kurullarının kararları ise ilgisine göre Jandarma Genel Komutanı veya Sahil Güvenlik Komutanının onayı ile kesinleşir.","x":[]},{"m":"9","g":"Akademisi Başkanının","c":"ilk branş belirleme kurulu kararını onaylar; değişiklikleri JGK/SGK","n":"","k":"(2) Branş belirleme kurulları üye tam sayısı ile toplanır ve oyçokluğu ile karar alırlar. Çekimser oy kullanılamaz. Oyların eşitliği durumunda başkanın bulunduğu taraf çoğunluk sayılır. İlk branş belirleme kurullarının kararları Jandarma ve Sahil Güvenlik Akademisi Başkanının, ilk branş belirleme ve branş değişikliğine ilişkin branş belirleme kurullarının kararları ise ilgisine göre Jandarma Genel Komutanı veya Sahil Güvenlik Komutanının onayı ile kesinleşir.","x":[]},{"m":"10","g":"temayüz etmiş astsubaylar","c":"subay kadrolarına atanabilir; astları değerlendirmede rütbe şartı yok","n":"","k":"(7) İhtiyaç duyulması halinde subay kadrolarına, liyakat esas alınarak emsalleri arasında temayüz etmiş astsubaylar atanabilir. Bu şekilde atanan astsubaylar için astları hakkında değerlendirme işlemi yapabilmek için rütbe şartı aranmaz.","x":[]},{"m":"10","g":"kritik ve kilit kadrolar","c":"puanlama sisteminden hariç; Bakanlık belirler","n":"","k":"(4) Bakanlık tarafından belirlenecek kritik ve kilit kadrolar hariç olmak üzere yapılan atamalarda, aynı branş ve/veya ihtisasa sahip personelden aynı ili tercih edenlerin atamasında 12 nci maddedeki esaslar ve varsa puanlama sistemi de gözönünde bulundurulabilir.","x":[]},{"m":"11","g":"kura ile yapılır","c":"ilk görev yeri ataması; branş ve ihtisasa göre","n":"","k":"MADDE 11- (1) Öğrenimlerini, temel kurslarını ve/veya stajlarını başarı ile bitiren personelin ilk görev yerlerine atanmaları branş ve ihtisasına göre kura ile yapılır.","x":[]},{"m":"12","g":"evlenmeden önceki nüfusa kayıtlı","c":"o ilçeye atanmaz; nüfusu bir milyonu aşan ilçeler hariç","n":"kendisinin ve eşinin","k":"(2) Personel, belediye sınırları içindeki nüfusu 1.000.000’u aşan ilçeler hariç, kendileri ve eşlerinin evlenmeden önceki nüfusa kayıtlı olduğu ilçelere atanmaz.","x":[]},{"m":"14","g":"Mayıs ve Ekim","c":"genel atama dönemi; Bakanlık başka zaman da belirleyebilir","n":"","k":"(2) Genel atamalar, her yılın Mayıs ve Ekim (dâhil) ayları arasında yapılır. Bu atamalar, Jandarma Genel Komutanlığı ve Sahil Güvenlik Komutanlığı tarafından önceden duyurulabilir.","x":[]},{"m":"15","g":"Aynı yerdeki görevlere atananlar","c":"tebliğ gününü izleyen işgünü içinde işe başlar","n":"AYNI YER AYNI GÜN","k":"a) Aynı yerdeki görevlere atananlar atama emirlerinin kendilerine tebliğ gününü,\nb) Başka yerdeki görevlere atananlar, atama emirlerinin kendilerine tebliğ tarihinden itibaren onbeş gün içerisinde o yere hareket ederek belli yol süresini, izleyen işgünü içinde işe başlamak zorundadırlar.","x":[]},{"m":"15","g":"Başka yerdeki görevlere atananlar","c":"tebliğden onbeş gün içinde hareket; yol süresi; izleyen işgünü başlar","n":"savaş ve OHAL'de süre kısaltılabilir","k":"b) Başka yerdeki görevlere atananlar, atama emirlerinin kendilerine tebliğ tarihinden itibaren onbeş gün içerisinde o yere hareket ederek belli yol süresini, izleyen işgünü içinde işe başlamak zorundadırlar.","x":[]},{"m":"15","g":"hiçbir şekilde bir ayı geçemez","c":"sayman, mal sorumlusu, mutemedin devir süresi","n":"süre devrin bitiminde başlar","k":"b) Hesaplarını, yerlerine gelenlere devir zorunda bulunan sayman, mal sorumlusu, hesap sorumlusu, muhasebe yetkilisi ve mutemetler için devrin sona ermesi (Bu süre hiçbir şekilde bir ayı geçemez.), tarihinde başlar.","x":[]},{"m":"15","g":"amire ulaşmasından itibaren","c":"atama emri en geç on gün içinde tebliğ edilir","n":"","k":"(4) Atama emrinde aksi belirlenmedikçe atama emrinin amire ulaşmasından itibaren en geç on gün içerisinde ilgilisine tebliğ edilir.","x":[]},{"m":"15","g":"gıyaplarında evrak üzerinden","c":"izinli, raporlu, tutuklu, uzaklaştırılmış personelin ilişik kesme ve katılışı","n":"tebligata engel değil","k":"(5) Atamaya tabi tutulan personelin izinli, raporlu, tutuklu, görevden uzaklaştırılmış, göreve gelmemiş olması veya hastanede yatması tebligata engel olmaz. Bu personelin ilişik kesme işlemleri, ilgisine göre Jandarma Genel Komutanlığı veya Sahil Güvenlik Komutanlığınca uygun görülmesi durumunda, personelin atamalı bulundukları kurum amirliklerince gıyaplarında evrak üzerinden yapılır ve ilişik kesme belgeleri yeni görev yerine gönderilir. Bunların yeni görevlerine katılışları da gıyaplarında evrak üzerinden yapılır ve özlük hakları yeni birlikleri tarafından ödenmeye başlanır.","x":[]},{"m":"16","g":"kendi kurumunun bütçesinden karşılanır","c":"geçici görevlendirilen kolluk personelinin aylığı","n":"görevlendirme Bakan; valiye devredebilir; disiplin soruşturması fiilen görevli kurumda","k":"(2) Birinci fıkraya göre görevlendirilen personelin;\na) Aylık ve diğer mali haklar ile sosyal hakları kendi kurumunun bütçesinden karşılanır.","x":[]},{"m":"19","g":"siyasi partiye üye olamaz","c":"personel; ayrım yapamaz, siyasi beyan-eylemde bulunamaz","n":"","k":"MADDE 19- (1) Personel siyasi partiye üye olamaz, herhangi bir siyasi parti, kişi veya zümrenin yararını veya zararını hedef tutan bir davranışta bulunamaz; görevlerini yerine getirirken dil, ırk, cinsiyet, siyasi düşünce, felsefi inanç, din ve mezhep gibi ayırım yapamaz; hiçbir şekilde siyasi ve ideolojik amaçlı beyanda ve eylemde bulunamaz ve bu eylemlere katılamaz.","x":[]},{"m":"21","g":"hediyesini kabul edemez","c":"amir, maiyetindekinden; borç da alamaz, menfaat isteyemez","n":"kanunlara aykırı emir de veremez","k":"(3) Amir, maiyetindeki personele kanunlara aykırı emir veremez ve maiyetindeki personel ile astı olan personelden hususi bir menfaat temin edecek bir talepte bulunamaz, hediyesini kabul edemez ve borç alamaz.","x":[]},{"m":"23","g":"rayiç bedeli üzerinden","c":"kasıt, kusur, ihmalle idareye verilen zarar personelce ödenir","n":"","k":"(2) Personelin kasıt, kusur, ihmal veya tedbirsizliği sonucu idare zarara uğratılmışsa, bu zararın ilgili personel tarafından rayiç bedeli üzerinden ödenmesi esastır.","x":[]},{"m":"24","g":"ilgili kurum aleyhine dava açarlar","c":"kamu görevinden zarar gören kişi; personele değil; kurumun rücu hakkı","n":"","k":"MADDE 24- (1) Kişiler kamu hukukuna tabi görevlerle ilgili olarak uğradıkları zararlardan dolayı bu görevleri yerine getiren personel aleyhine değil, ilgili kurum aleyhine dava açarlar. Ancak, Devlet dairelerine tevdi veya bu dairelerce tahsil veya muhafaza edilen para ve para hükmündeki değerli kâğıtların ilgili personel tarafından zimmete geçirilmesi halinde, zimmete geçirilen miktar, cezai takibat sonucu beklenmeden Hazine tarafından hak sahibine ödenir. Kurumun, genel hükümlere göre
