 tekrarlı"]]},{"m":"53","g":"Disiplin işleri özel kanun","c":"disiplin: özel kanun hükümleri; kişisel suçlar: genel hükümler","n":"","k":"a) Disiplin işleri özel kanun hükümlerine göre yürütülür.\nb) Jandarma Genel Komutanlığı ve Sahil Güvenlik Komutanlığı teşkilatları personelinin mülki görevlerinden doğan suçlarında özel kanunların hükümleri saklı kalmak şartıyla 4483 sayılı Kanun hükümlerine göre işlem yapılır.\nc) Adli görevlerinden doğan suçlarda 5271 sayılı Kanunun 161 inci maddesinin beşinci fıkrası hükmü uygulanır.\nç) Jandarma hizmetleri ve sahil güvenlik hizmetleri sınıfları personeline askeri görev verildiği takdirde bu görevlerden doğan suçlarda 25/10/1963 tarihli ve 353 sayılı Askeri Mahkemeler Kuruluşu ve Yargılama Usulü Kanunu hükümleri uygulanır. Bu suçların muhakemesi jandarma hizmetleri ve sahil güvenlik hizmetleri sınıfları personeli emrine verildiği askeri birlik personelini muhakeme etmekle görevli ve yetkili olan askeri mahkemede görülür.\nd) Jandarma Genel Komutanlığı ve Sahil Güvenlik Komutanlığı teşkilatları personelinin kişisel suçlarında genel hükümlere göre işlem yapılır.","x":[]},{"m":"53","g":"mülki görevlerinden doğan suçlarında","c":"4483 sayılı Kanun; adli görev suçunda CMK 161 beşinci fıkra","n":"","k":"b) Jandarma Genel Komutanlığı ve Sahil Güvenlik Komutanlığı teşkilatları personelinin mülki görevlerinden doğan suçlarında özel kanunların hükümleri saklı kalmak şartıyla 4483 sayılı Kanun hükümlerine göre işlem yapılır.\nc) Adli görevlerinden doğan suçlarda 5271 sayılı Kanunun 161 inci maddesinin beşinci fıkrası hükmü uygulanır.","x":[]},{"m":"53","g":"askeri görev verildiği takdirde","c":"bu görevlerden doğan suçlarda 353 sayılı Kanun; askeri mahkeme","n":"","k":"ç) Jandarma hizmetleri ve sahil güvenlik hizmetleri sınıfları personeline askeri görev verildiği takdirde bu görevlerden doğan suçlarda 25/10/1963 tarihli ve 353 sayılı Askeri Mahkemeler Kuruluşu ve Yargılama Usulü Kanunu hükümleri uygulanır. Bu suçların muhakemesi jandarma hizmetleri ve sahil güvenlik hizmetleri sınıfları personeli emrine verildiği askeri birlik personelini muhakeme etmekle görevli ve yetkili olan askeri mahkemede görülür.","x":[]},{"m":"54","g":"resmi üniforma giymesi zorunludur","c":"görev sırasında; Yönetmelik/mevzuattaki istisnalar saklı","n":"","k":"MADDE 54- (1) Personelin görev sırasında, bu Yönetmelikte veya diğer mevzuatta belirtilen istisnalar saklı kalmak kaydıyla resmi üniforma giymesi zorunludur.","x":[]},{"m":"55","g":"personel dışındaki kişiler tarafından giyilemez","c":"resmi üniforma eskimiş olsa da; işaretler sökülerek sivile dönüştürülemez","n":"","k":"c) Resmi üniformalar eskimiş dahi olsa personel dışındaki kişiler tarafından giyilemez ve bu kişilere verilemez.\nç) Branş ve rütbe işaretleri sökülmek suretiyle resmi üniformalar sivil kıyafete dönüştürülerek kullanılamaz; resmi pantolon, sivil gömlek, kazak, ceket gibi şeylerle birlikte giyilemez;","x":[]},{"m":"55","g":"hamileliğini belgelediği takdirde","c":"kadın personel sivil kıyafetle görev yapabilir (üniforma yasağı değil)","n":"","k":"e) Resmi üniformalı olarak görev yapan kadın personel, hamileliğini belgelediği takdirde resmi kıyafet yerine sivil kıyafet ile görev yapabilir.","x":[]},{"m":"55","g":"resmi üniformasını çıkarmaya mecburdur","c":"emeklilik, çekilme veya ilişik kesilmesinden itibaren","n":"","k":"(3) Personel; emeklilik, çekilme veya herhangi bir nedenle Jandarma Genel Komutanlığından veya Sahil Güvenlik Komutanlığından ilişiği kesildiği tarihten itibaren resmi üniformasını çıkarmaya mecburdur.","x":[]},{"m":"56","g":"özlük hakları saklıdır","c":"genel-özel kanunlarla verilen; JGK-SGK kadrosundaki personel asayiş tazminatından yararlanır","n":"","k":"MADDE 56- (1) Jandarma Genel Komutanlığı ve Sahil Güvenlik Komutanlığı personeline, genel ve özel düzenleme getiren kanunlarla verilen özlük hakları saklıdır. (2) Jandarma Genel Komutanlığı ve Sahil Güvenlik Komutanlığı kadrolarına atanmış personel ayrıca Asayiş Tazminatından yararlanır.","x":[]}]},{"id":23,"ad":"Jandarma ve Sahil Güvenlik Personelinin Hizmet Esasları Yönetmeliği","grup":"müşterek","satirlar":[{"m":"2","g":"işçiler kendi mevzuatına tabidir","c":"işçiler Yönetmelik kapsamı dışında","n":"askerlik yükümlüleri: eksik hususlarda diğer yükümlülerin mevzuatı","k":"görevli işçiler kendi mevzuatına tabidir.","x":[]},{"m":"3","g":"24’üncü maddesine","c":"dayanak 2803 sayılı Kanun m.24 ve 2692 sayılı Kanun m.23","n":"","k":"Bu Yönetmelik, 10/3/1983 tarihli ve 2803 sayılı Jandarma Teşkilat, Görev ve Yetkileri Kanununun 24’üncü maddesine ve 9/7/1982 tarihli ve 2692 sayılı Sahil Güvenlik Komutanlığı Kanununun 23’üncü maddesine dayanılarak hazırlanmıştır.","x":[]},{"m":"4","g":"kuruluş yönünden bağlı olunan","c":"Âmir; ayrıca âmir olarak yetkilendirilmiş diğer personel","n":"","k":"a) Âmir: Kadro ve kuruluş yönünden bağlı olunan kimse ile âmir olarak yetkilendirilmiş olan diğer personeli,","x":[]},{"m":"4","g":"Rütbe veya kıdemce küçük","c":"Ast (Üst: rütbe veya kıdemce büyük)","n":"","k":"b) Ast: Rütbe veya kıdemce küçük olan personeli,","x":[]},{"m":"4","g":"astının ve üstünün hukukuna riayeti","c":"Disiplin tanımı; mevzuata ve âmirlere mutlak itaat ile","n":"","k":"g) Disiplin: Mevzuat hükümlerine ve âmirlere mutlak bir itaat ile astının ve üstünün hukukuna riayeti,","x":[]},{"m":"4","g":"söz, yazı ve sair surette","c":"Emir tanımı; göreve ilişkin fiilin yapılması veya yapılmaması asta bildirilir","n":"","k":"ğ) Emir: Göreve ilişkin bir fiilin yapılmasının veya yapılmamasının söz, yazı ve sair surette asta bildirilmesini,","x":[]},{"m":"4","g":"yeterlik bakımından üstünlük sırasını","c":"Kıdem (aynı nasıplılar arasında)","n":"","k":"m) Kıdem: Belli bir rütbeye nasıp tarihinden itibaren, o rütbede görev süreleri veya aynı nasıplılar arasında yeterlik bakımından üstünlük sırasını,","x":[]},{"m":"4","g":"bekleme süresinin başlama tarihini","c":"Nasıp (yeni rütbenin normal bekleme süresi)","n":"","k":"u) Nasıp: İlk rütbeye veya bir rütbeden sonraki rütbeye terfide yeni rütbenin normal bekleme süresinin başlama tarihini,","x":[]},{"m":"4","g":"duruşu ve dış görünüşünü","c":"Kılık (Kıyafet = giyim ve kuşam)","n":"KILIK DURUŞ, KIYAFET GİYİM","k":"n) Kılık: Personelin duruşu ve dış görünüşünü,\no) Kışla: Jandarma Genel Komutanlığı ve Sahil Güvenlik Komutanlığında personelin barındırıldığı ve görev yaptığı tek bir bina veya toplu halde bulunan muhtelif binalar ile bunların müştemilatından olan diğer binalar ve araziyi,\nö) Kıyafet: Giyim ve kuşamı,","x":[]},{"m":"4","g":"komutası altındaki personeli","c":"Maiyet (âmirin emir ve komutası altındakiler)","n":"","k":"s) Maiyet: Âmirin emir ve komutası altındaki personeli,","x":[]},{"m":"4","g":"geçici olarak personelin kullanımına","c":"Tahsis: belli bir görev için geçici kullanım (İstihkak: sarf yetkisi)","n":"istihkak = sarfına yetki verilen giyecek/teçhizatın cins ve miktarı","k":"dd) Tahsis: Belli bir görevin icrası amacıyla giyecek ve teçhizatın geçici olarak personelin kullanımına verilmesini,","x":[]},{"m":"4","g":"Nizamiye/Lumbarağzı","c":"giriş-çıkış kontrol ve emniyet tesisi; belirli sayıda kuvvet","n":"","k":"ü) Nizamiye/Lumbarağzı: Karargâh, birlik veya kurumların giriş ve çıkışlarının kontrol altına alınması ve emniyetinin sağlanması amacıyla, bünyesinde belirli sayıda kuvvet ihtiva eden tesisi,","x":[]},{"m":"4","g":"sekiz kademeli çavuşa kadar","c":"uzman jandarma rütbe aralığı (3466 sayılı Kanun)","n":"uzman erbaş: 3269; uzman onbaşı ve uzman çavuş","k":"gg) Uzman jandarma: 28/5/1988 tarihli ve 3466 sayılı Uzman Jandarma Kanunu kapsamında temin edilmiş ve eğitimlerini başarı ile bitirmiş uzman jandarma çavuştan uzman jandarma sekiz kademeli çavuşa kadar rütbeyi haiz şahısları,","x":[]},{"m":"4","g":"erler ile işçiler hariç","c":"Devlet memuru tanımı (rütbeliler, yedekler, erler dışında kalanlar)","n":"","k":"f) Devlet memuru: Jandarma Genel Komutanlığı, Sahil Güvenlik Komutanlığı, Jandarma ve Sahil Güvenlik Akademisinde görevli subay, sözleşmeli subay, astsubay, sözleşmeli astsubay, uzman jandarma, uzman erbaş, sözleşmeli erbaş ve er, 7179 sayılı Kanuna tabi yedek subay, yedek astsubay, erbaş ve erler ile işçiler hariç diğer personeli,","x":[]},{"m":"5","g":"ant içerek göreve başlar","c":"yetkili âmirlerin huzurunda; tören usulü yönerge ile","n":"","k":"Personel, yetkili âmirlerin huzurunda mevzuatta belirtildiği şekilde ant içerek göreve başlar. Ant içme töreninin icrasına yönelik hususlar yönerge ile düzenlenir.","x":[]},{"m":"6","g":"subay ve astsubayların astı","c":"Uzman jandarma: diğer rütbeli personelin üstü","n":"","k":"(3) Uzman jandarmalar, subay ve astsubayların astı, diğer rütbeli personelin üstüdür.","x":[]},{"m":"6","g":"emsal rütbedeki sözleşmeli erbaşların","c":"Uzman erbaş onların üstü (subay, astsubay, uzman jandarmanın astı)","n":"yükümlü emsal erbaşların da üstü","k":"(4) Uzman erbaşlar, subay, astsubay ve uzman jandarmaların astı, emsal rütbedeki sözleşmeli erbaşların ve 7179 sayılı Kanuna göre askerlik yükümlüsü olan emsal rütbedeki erbaşların üstüdür.","x":[]},{"m":"6","g":"emsal rütbedeki uzman erbaşların astı","c":"Sözleşmeli erbaş; yükümlü emsal erbaşların üstü","n":"","k":"(5) Sözleşmeli erbaşlar, subay, astsubay, uzman jandarma ve emsal rütbedeki uzman erbaşların astı, 7179 sayılı Kanuna göre askerlik yükümlüsü olan emsal rütbedeki erbaşların üstüdür.","x":[]},{"m":"6","g":"amir-maiyet ilişkisi vardır","c":"Devlet memuru–rütbeli personel: astlık-üstlük yok","n":"","k":"(6) Devlet memurları ile rütbeli personel arasında bir astlık-üstlük ilişkisi bulunmamakla birlikte devlet memurları ile rütbeli personel arasında amir-maiyet ilişkisi vardır.","x":[["17","devlet memurları esas duruşa geçmez"],["18","devlet memurları selamlamadan muaf"]]},{"m":"7","g":"disiplinden taviz verilemez","c":"Disiplin teşkilatın temelidir; hiçbir suretle","n":"","k":"Disiplin, Jandarma Genel Komutanlığı, Sahil Güvenlik Komutanlığı, Jandarma ve Sahil Güvenlik Akademisinin temelidir ve hiçbir suretle disiplinden taviz verilemez.","x":[]},{"m":"7","g":"hep birlikte itaatsizlik veya mukavemet","c":"halleri gören her üst emir ve komuta işini üzerine alır","n":"yükümlülük (yetki değil)","k":"(5) Herhangi bir karargâh, birlik veya kurumda birden fazla personel, bir üst veya âmire hep birlikte itaatsizlik veya mukavemet ederse veya bu eylemlerden biri veya birkaçını yapmak için ittifak ederse; düzeni temin etmek ve disiplinsizliğin önünü almak için bu halleri gören her üst emir ve komuta işini üzerine almak ile yükümlüdür.","x":[]},{"m":"7","g":"öncelikle bilgi, yetenek","c":"sevk ve idarede otorite; yüksek bir karakter ile sağlanır","n":"","k":"(10) Sevk ve idarede otoritenin, öncelikle bilgi, yetenek ve yüksek bir karakter ile sağlanması esastır.","x":[]},{"m":"8","g":"kıyafetli olsun veya olmasın","c":"âmirlerin usulüne uygun emirlerini tam, zamanında, değiştirmeden yerine getirir","n":"","k":"resmî kıyafetli olsun veya olmasın âmirlerinin, usulüne uygun emirlerini tam, zamanında, değiştirmeden ve eksiksiz olarak yerine getirmekle","x":[]},{"m":"8","g":"korku ile değil","c":"görev sevgi ve üstün görev anlayışı ile icra edilir","n":"","k":"(2) Görevini; korku ile değil, sevgi ve üstün görev anlayışı ile icra eder.","x":[]},{"m":"8","g":"âmirine mütalâada bulunmaz","c":"ast, aldığı bir emirden dolayı; mırıldanmaz, doğru bulmadığını sezdirmez","n":"","k":"(5) Aldığı bir emirden dolayı âmirine mütalâada bulunmaz. Bir emri alırken veya aldıktan sonra mırıldanmaz, doğru bulmadığını sezdirecek hal ve harekette bulunmaz.","x":[]},{"m":"8","g":"Âmirinin yokluğunda","c":"âmirin yerini tutabilmek için onun görevini de öğrenir","n":"","k":"Âmirinin yokluğunda, âmirin yerini tutabilmek için onun görevini de iyice öğrenmeye çalışır.","x":[]},{"m":"8","g":"maiyete yüklenen görevleri yapar","c":"Devlet memurları da astın görevlerini yapar","n":"","k":"(14) Devlet memurları bu maddede maiyete yüklenen görevleri yapar.","x":[]},{"m":"9","g":"hususi bir menfaat","c":"âmir maiyetinden böyle hiçbir talepte bulunmaz; gerektiğinde disiplin cezası verir","n":"","k":"(4) Maiyetinden hususi bir menfaat temin edecek hiçbir talepte bulunmaz. Maiyetini disiplini bozan fiil ve hareketlerinden dolayı ikaz ve ıslah eder. Gerektiğinde mevzuat dâhilinde disiplin cezası verir.","x":[]},{"m":"9","g":"mecbur kalmadıkça müdahalede bulunmaz","c":"âmir; maiyetine görevini icra esnasında (âmirin görevleri)","n":"","k":"(8) Maiyetine görevini icra esnasında mecbur kalmadıkça müdahalede bulunmaz.","x":[]},{"m":"9","g":"nefsini sona bırakır","c":"âmir; bir kolaylık çıkınca; zorlukta öne atılmak şerefli görev","n":"","k":"(10) Maiyetinin katlandığı her türlü zahmet ve mahrumiyete, fiziki imkân nispetinde beraber katlanır, bir kolaylık çıkınca bunlardan istifade için nefsini sona bırakır ve bir zorluk çıkınca bilâkis öne atılmayı şerefli bir görev kabul eder.","x":[]},{"m":"9","g":"gerekçesiz takdir hakkı","c":"âmir ödül veya ceza ile ilgili olarak kullanmaz","n":"","k":"(11) Ödül veya ceza ile ilgili olarak gerekçesiz takdir hakkı kullanmaz, her konuyu etraflıca değerlendirir, ölçülü, adaletli ve hakkaniyetli davranır.","x":[]},{"m":"10","g":"yazı ile yinelerse","c":"emir yerine getirilir; sorumluluk emri verene; üst âmire bildirilir","n":"mevzuata aykırı emir: önce yerine getirilmez, aykırılık emri verene bildirilir","k":"(3) Ast emri; Anayasa ve mevzuat hükümlerine aykırı görürse, yerine getirmez ve bu aykırılığı o emri verene bildirilir. Ancak, âmir emrinde ısrar ederse ve bu emrini yazı ile yinelerse, emir yerine getirilir. Emrin yerine getirilmesinden doğacak sorumluluk emri verene aittir. Ancak, durum emri veren âmirin bir üst âmirine bildirilir.","x":[]},{"m":"10","g":"Konusu suç teşkil eden emir","c":"hiçbir surette yerine getirilmez; yapan sorumluluktan kurtulamaz","n":"","k":"(4) Konusu suç teşkil eden emir hiçbir surette yerine getirilmez; yerine getiren kimse sorumluluktan kurtulamaz.","x":[]},{"m":"10","g":"verilme takdiri","c":"emrin yazılı, sözlü veya sair usulle verilmesi âmire aittir","n":"","k":"(5) Emrin yazılı, sözlü veya sair usullerle verilme takdiri, âmire aittir.","x":[]},{"m":"10","g":"kurum kimliği ile tanıtır","c":"emir resmî veya sivil kıyafetli verilebilir; âmir gerektiğinde kendini","n":"","k":"(6) Emir, resmî veya sivil kıyafetli olarak verilebilir. Âmir, gerektiği takdirde, emir verdiği personele kendini kurum kimliği ile tanıtır.","x":[["18","sivil üst kimlik kartını ibraz edince selam"]]},{"m":"10","g":"atlanan kademelere","c":"acele halde silsile dışı emir; emri veren âmir bilgi verir","n":"maiyet de kendi âmirini haberdar eder","k":"(7) Emirler, kural olarak birbirine bağlı âmirler tarafından, silsile ile verilir. Ancak, acele ve zorunlu hallerde bu sıraya riayet edilmeden de emir verilebilir. Bu takdirde emri veren âmir, atlanan kademelere en kısa zamanda bilgi verir. Böyle bir emri alan maiyet de âmirini haberdar eder.","x":[]},{"m":"10","g":"muhalif ikinci bir emir","c":"ikinci emri veren âmire önceki emir bildirilir; ısrarda ikincisi yapılır","n":"ilk emri veren âmire bilgi verilir","k":"(8) Bir âmirin verdiği emir yapılırken daha büyük bir âmirden önceki emre muhalif ikinci bir emir daha alınacak olursa, ikinci emri veren âmire önceki emir bildirilir. Eğer önceki emre muhalif emir veren âmir kendi emrinin yapılmasında ısrar ederse, bu âmirin emri yapılır ve ilk emri veren âmire en kısa zamanda bilgi verilir.","x":[]},{"m":"10","g":"Emirde kararlılık esastır","c":"verilen emir mecburi sebepler oluşmadıkça değiştirilemez veya yok sayılamaz","n":"","k":"(11) Emirde kararlılık esastır. Verilen emir, mecburi sebepler oluşmadıkça veya gerekliliği ortadan kalkmadıkça değiştirilemez veya yok sayılamaz. Bu davranış, âmirin kararsızlığını gösterir ve ast üzerinde itibarsızlık yaratır.","x":[]},{"m":"10","g":"emri yeni duruma uygun","c":"ast sorumluluğu üzerine alarak değiştirerek yapabilir (âmirden yeni emir alınamıyorsa)","n":"büyük tehlike/ağır zarar/bilinmeyen husus; ilk fırsatta bilgi","k":"ast sorumluluğu üzerine alarak emri yeni duruma uygun bir şekilde değiştirerek yapabilir ve ilk fırsatta emri yerine getirilmeyen veya kısmen yerine getirilen âmire bilgi verilir.","x":[]},{"m":"10","g":"nazik bir dille","c":"üst âmir, emri iptal gereğini emri veren âmire izah eder","n":"","k":"(14) Emri veren âmirin üst âmirleri, emri değiştirme veya iptal etme gereği duyar ise, bu hususu, emri veren âmire nazik bir dille izah eder ve tatmin edici bir gerekçe sunar.","x":[]},{"m":"10","g":"son kontrol yapılır","c":"emri yerine getiren tarafından; sonra âmire bilgi verilir","n":"","k":"Verilen emrin yerine getirilmesini müteakip, emri yerine getiren tarafından son kontrol yapılır ve âmire bilgi verilir.","x":[]},{"m":"10","g":"birleştirilerek verilir","c":"birbiri ile bağlantılı emirler; işgücü israfını önlemek için","n":"","k":"(18) Birbiri ile bağlantılı olabilecek emirler, zaman ve işgücü israfına sebebiyet verilmemesi maksadıyla, uygun bir şekilde birleştirilerek verilir.","x":[]},{"m":"11","g":"toplu olarak söz veya yazı","c":"aynı konuda toplu müracaat yasak; her biri ayrı ayrı","n":"","k":"(2) Personelin, aynı konu ve şahısla ilgili, toplu olarak söz veya yazı ile müracaatı yasaktır. Aynı olay birden fazla personelin şikâyetine sebep veya konu olursa bunların her biri ayrı ayrı veya yalnız başına şikâyet hakkını kullanabilir.","x":[]},{"m":"11","g":"yüzüne karşı kendisini şikâyet","c":"âmirin; cezayı muciptir (dedikodu yapmak da)","n":"","k":"(4) Âmirin yüzüne karşı kendisini şikâyet etmek, âmirinden şikâyetçi olacağını söyleyerek dedikodu yapmak cezayı muciptir.","x":[]},{"m":"11","g":"bizzat şikâyeti neticelendirirler","c":"şikâyeti incelemeye yetkili âmirler; kararı şikâyetçiye tebliğ ederler","n":"","k":"(3) Şikâyetleri incelemeye yetkili olan âmirler, bizzat şikâyeti neticelendirirler. Daha yukarıdaki âmirlerin karar ve hükümlerine lüzum gösteren şikâyetleri onlara bildirirler ve alacakları hüküm ve kararları şikâyetçiye tebliğ ederler.","x":[]},{"m":"11","g":"Şikâyet ve Müracaatları Hakkında Yönetmelik","c":"bu maddede hüküm bulunmayan hallerde uygulanır (8/5743 sayılı BKK)","n":"","k":"(5) Bu maddede hüküm bulunmayan hallerde, 28/11/1982 tarihli ve 8/5743 sayılı Bakanlar Kurulu Kararı ile yürürlüğe konulan Devlet Memurlarının Şikâyet ve Müracaatları Hakkında Yönetmelik hükümleri uygulanır.","x":[]},{"m":"12","g":"görevini vaktinde yapmıştır","c":"bu gerekçeyle ödül dağıtmak, ödüllendirmede aşırıya kaçmaktır","n":"","k":"Bu sebeple, “görevini yapmıştır, görevini vaktinde yapmıştır.” gibi ödül dağıtmak, ödüllendirmede aşırıya kaçmaktır.","x":[]},{"m":"12","g":"mesai arkadaşlarının huzurunda","c":"ödüller mümkün olduğunca orada verilir; teşvik edici sözler","n":"","k":"(6) Ödüller, mümkün olduğunca personelin mesai arkadaşlarının huzurunda verilir ve diğer personeli de başarıya teşvik edici sözler söylenir.","x":[]},{"m":"12","g":"değerlendirme notundan bağımsız","c":"ödül sistemi disiplin cezaları ile değerlendirme notundan bağımsız çalışır","n":"","k":"(7) Ödül sistemi, disiplinle ilgili yaptırım ve cezalar ile değerlendirme notundan bağımsız çalışır. Personel ödüllendirilirken, sadece ödüllendirilmeye gerekçe olan durum içinde değerlendirilir.","x":[]},{"m":"12","g":"daha büyük ödül tekliflerinde","c":"başarı derecesine orantısız büyük ödül teklifi yapılmaz","n":"","k":"(8) Başarının derecesi dikkate alınmadan ve teklif edilen ödülle orantılı olmayan daha büyük ödül tekliflerinde bulunulmaz.","x":[]},{"m":"12","g":"Ödül çeşitleri","c":"Bakanlıkça yürürlüğe konulan yönetmelikle belirlenir","n":"","k":"(9) Ödül çeşitleri, personelin ödüllendirilmesi ve diğer hususlar, Bakanlıkça yürürlüğe konulan yönetmelikle belirlenir.","x":[]},{"m":"13","g":"diğerlerine ibret olmasındadır","c":"cezanın fayda ve tesiri; tam adaletle ve zamanında verilir","n":"","k":"Cezanın, disiplinin tesisi bakımından fayda ve tesiri, suçluyu uyarmak ve maddeten zarar vermekten ziyade diğerlerine ibret olmasındadır.\n(2) Ceza tam bir adaletle ve zamanında verilmelidir.","x":[]},{"m":"13","g":"7068 sayılı Genel Kolluk Disiplin","c":"disiplin cezası gerektiren haller ve tatbik şekli bu Kanunda","n":"","k":"(3) Disiplin cezası verilmesini gerektiren haller ve bunun tatbik şekli, 31/1/2018 tarihli ve 7068 sayılı Genel Kolluk Disiplin Hükümleri Hakkında Kanun Hükmünde Kararnamenin Kabul Edilmesine Dair Kanunda yazılı olduğu gibidir.","x":[]},{"m":"14","g":"gönüllü olarak feragat","c":"âmir, izin hakkından vazgeçmeye yönelik tavır, davranış ve imada bulunmaz","n":"","k":"(3) Âmir, açıkça olmasa da, personelin izin hakkından gönüllü olarak feragat etmesine yönelik tavır, davranış ve imada bulunmamalıdır.","x":[]},{"m":"14","g":"İzin yılı","c":"her senenin ilk ayından itibaren başlar","n":"","k":"(6) İzin yılı, her senenin ilk ayından itibaren başlar ve izin süre ve sıraları ona göre düzenlenir.","x":[]},{"m":"14","g":"kendi inisiyatiflerine","c":"izinleri yetkili âmir kullandırır; daha büyük âmirler almaz","n":"","k":"(4) İzinler yetkili âmir tarafından kullandırılmalı, bu tasarruf daha büyük âmirlerce kendi inisiyatiflerine alınmamalıdır.","x":[]},{"m":"14","g":"izinden çağrılmayı gerektirecek","c":"izne giden, adresini ve iletişim araçlarını âmirine bildirir; ulaşılabilir kalır","n":"","k":"(5) İzne giden her personel, ayrılmadan evvel kendi birlik veya kurum âmirine gideceği yerdeki adresini ve iletişim araçlarını bildirmeli, izinden çağrılmayı gerektirecek hallerin varlığı halinde ise kendisini ulaşılabilir kılmalıdır.","x":[]},{"m":"14","g":"komuta yeteneği, beceri","c":"izinlerin tam ve zamanında kullandırılması âmirin göstergesidir","n":"","k":"İzinlerin tam ve zamanında kullandırılması, âmirlerin komuta yeteneği, beceri ve özgüvenlerinin bir göstergesidir.","x":[]},{"m":"15","g":"tanıklık veya bilirkişilik dışında","c":"adlî yargı makamlarına çağrılınca resmî kıyafet giyilmez; tutuklu/hükümlü de","n":"görevden uzaklaştırılanlar da giyemez","k":"(8) Rütbeli personel ve erler; tanıklık veya bilirkişilik dışında, adlî yargı makam ve mercilerine çağrıldığında, tutuklu veya hükümlü iken veya görevden uzaklaştırıldıkları süre içerisinde resmî kıyafet giyemez.","x":[]},{"m":"15","g":"sakız çiğnenmez, poşet taşınmaz","c":"resmî kıyafetle; şapka çıkarılmaz, kol kola girilmez, eller cepte dolaşılmaz","n":"","k":"b) Resmî kıyafet ile sakız çiğnenmez, poşet taşınmaz, şapka çıkarılmaz, kol kola girilmez, el ele tutuşulmaz, ağızda sigara veya eller cepte dolaşılmaz.","x":[]},{"m":"15","g":"nişan, evlilik ve devre yüzüğü","c":"resmî kıyafetle bunlar dışında yüzük, bileklik ve kolye kullanılmaz","n":"","k":"ç) Resmî kıyafet ile nişan, evlilik ve devre yüzüğü dışında yüzük, bileklik ve kolye kullanılmaz.","x":[]},{"m":"15","g":"Hak sahibi olunmayan","c":"şerit, rozet ve bröve takılmaz (mevzuata uymayanlar da)","n":"","k":"Hak sahibi olunmayan veya mevzuatta belirtilen özelliklere uymayan şerit rozet ve bröveler takılmaz.","x":[]},{"m":"15","g":"örgü başlık giyilmesi zorunludur","c":"bina ve müştemilatı ile araç dışında şapka, kep, bere de","n":"","k":"e) Bina ve müştemilatı ile araç dışında, görevin özelliğine göre şapka, kep, bere veya örgü başlık giyilmesi zorunludur.","x":[]},{"m":"15","g":"şapkasız olarak dolaşılabilir","c":"karargâh, birlik ve kurumlarda en büyük âmirin müsaade ettiği alanlarda","n":"","k":"Karargâh, birlik ve kurumlarda, en büyük âmirin müsaade ettiği alanlarda şapkasız olarak dolaşılabilir.","x":[]},{"m":"15","g":"Araç içinde resmî kıyafetli","c":"yolculukta şapka çıkarılabilir; araç içinde birlik ve beraberlik esastır","n":"","k":"f) Araç içinde resmî kıyafetli olarak yolculuk yaparken şapka çıkarılabilir. Bu konuda araç içerisinde birlik ve beraberlik esastır.","x":[]},{"m":"15","g":"işaretler sökülse dahi","c":"resmî kıyafet sivil kıyafete dönüştürülemez; resmî pantolon sivil gömlekle giyilemez","n":"","k":"ı) Üzerindeki işaretler sökülse dahi, resmî kıyafetler sivil kıyafete dönüştürülerek kullanılamaz; resmî pantolon, sivil gömlek, kazak, ceket gibi giyeceklerle birlikte giyilemez.","x":[]},{"m":"15","g":"göze görünmeyecek şekilde","c":"rütbeli personel görev dışında sivil elbise ile tabancasını taşıyabilir","n":"","k":"j) Rütbeli personel görev dışında da sivil elbise ile tabancalarını göze görünmeyecek şekilde taşıyabilir.","x":[]},{"m":"15","g":"koyu renk ve sade desenlerde","c":"resmî kıyafetle çantalar; yalnız sol elde taşınabilir","n":"","k":"k) Resmi kıyafet ile sadece koyu renk ve sade desenlerde çantalar sol elde taşınabilir.","x":[]},{"m":"15","g":"resmî kıyafet rengindeki başörtüleri","c":"kadın rütbeli personel (yüzü kapatmayacak); bunun dışında sivil giysi giyemez","n":"","k":"l) Kadın rütbeli personel yüzünü kapatmayacak şekilde başlarına taktıkları resmî kıyafet rengindeki başörtüleri hariç, resmî kıyafetlerinin içerisine ve üzerine sivil giysi, sivil palto, pardösü ve benzeri kıyafetler giyemez.","x":[]},{"m":"15","g":"hamileliğini belgelediği takdirde","c":"kadın rütbeli personel sivil kıyafet ile görev yapabilir","n":"","k":"m) Kadın rütbeli personel, hamileliğini belgelediği takdirde sivil kıyafet ile görev yapabilir.","x":[]},{"m":"15","g":"ilişiği kesildiği tarihten","c":"emeklilik, çekilme vb. ile; resmî kıyafetini çıkarmaya mecburdur","n":"eskimiş resmî kıyafet başkasına verilmez","k":"o) Rütbeli personel ve erler; emeklilik, çekilme veya herhangi bir nedenle Jandarma Genel Komutanlığı veya Sahil Güvenlik Komutanlığından ilişiği kesildiği tarihten itibaren resmî kıyafetini çıkarmaya mecburdur.","x":[]},{"m":"15","g":"favori, sakal ve bıyık","c":"bırakılmaz (mevzuatta düzenlenen haller hariç); sadelik esastır","n":"","k":"ö) El, yüz ve saç tuvaletlerinde sadelik esastır. Mevzuatta düzenlenen haller hariç olmak üzere favori, sakal ve bıyık bırakılmaz.","x":[]},{"m":"15","g":"omuz hizasını geçmez","c":"kadın rütbeli personel kısa saçlı ise; uzun saçlı ise toplar","n":"erkek: saç şapka/bere içinden taşmaz","k":"Kadın rütbeli personel, uzun saçlı ise dağınık olmayacak şekilde saçlarını toplar, kısa saçlı ise saç uzunlukları omuz hizasını geçmez.","x":[]},{"m":"15","g":"istihbarata karşı koyma","c":"kimlik kartı bu gibi istisnalar dışında her zaman üzerinde bulundurulur","n":"yetkili makam isteyince gösterilmesi zorunlu","k":"(10) Kimlik kartı, kişinin jandarma veya sahil güvenlik personeli olduğunu gösteren resmî bir belgedir. Personel, güvenlik ve istihbarata karşı koyma gibi çeşitli istisnai durumlar dışında, kimlik kartını resmî ve sivil olarak her zaman üzerinde bulundurmak zorundadır. Yetkili makamlarca talep edilmesi durumunda kimlik kartının gösterilmesi zorunludur.","x":[]},{"m":"15","g":"her sabah sakal","c":"erkek personel sakal tıraşı her sabah; saç tıraşı gerekli zamanlarda","n":"","k":"(6) Erkek personel her sabah sakal ve gerekli zamanlarda saç tıraşı olur. Personel hiçbir zaman güçsüz, yorgun ve bitkin bir görüntü sergilemez.","x":[]},{"m":"15","g":"Kılık ve Kıyafetine Dair Yönetmelik","c":"Devlet memurlarının kılık kıyafeti bu Yönetmeliğe tabi (16/7/1982)","n":"","k":"(12) Devlet memurları hakkında, 16/7/1982 tarihli Kamu Kurum ve Kuruluşlarında Çalışan Personelin Kılık ve Kıyafetine Dair Yönetmelik hükümleri uygulanır.","x":[]},{"m":"16","g":"Devlet töresine göre","c":"kamu kurum ve kuruluşlarının âmirlerine teamüllere göre hitap edilir","n":"","k":"(2) Personel; kamu kurum ve kuruluşlarının âmirleri ile diğer personeline, teamüller ve Devlet töresine göre hitap eder.","x":[]},{"m":"16","g":"emir, broşür vb.","c":"görgü ve nezaket ayrıntıları; her teşkilat ayrı ayrı hazırlar","n":"aykırı davranana disiplin işlemi","k":"Buna ilişkin ayrıntılar her teşkilatın ayrı ayrı hazırlayacakları emir, broşür vb. ile yayımlanır. Mesleki görgü ve nezaket kurallarına aykırı tavır ve davranışlarda bulunan personel hakkında disiplin işlemi uygulanır.","x":[]},{"m":"17","g":"otur veya rahat komutunu","c":"âmir vermeden esas duruş bozulmaz; âmir gelince derhal ayağa kalkılır","n":"","k":"(2) Âmir veya üst, astın veya astların bulunduğu yere gelir ise derhal ayağa kalkılır ve esas duruşa geçilir. Âmir otur veya rahat komutunu vermeden esas duruş bozulmaz.","x":[]},{"m":"17","g":"yerinde dönüşle cephe","c":"âmir yan tarafta ise; konuşurken baş çevrilmez, esas duruşa geçilir","n":"","k":"(4) Âmir veya üst ile konuşurken hemen esas duruşa geçilir, baş çevrilmez ve âmir yan tarafta ise yerinde dönüşle cephe âmir veya üste çevrilir.","x":[]},{"m":"17","g":"el ve kol sallanmaz","c":"esas duruşta konuşmak gerekiyorsa; vücut bükülmez, sessiz kalınır","n":"","k":"(5) Esas duruşta sessiz kalınır ve aksi emredilmedikçe kımıldanılmaz. Konuşulması gerekiyorsa el ve kol sallanmaz, vücut bükülmez.","x":[]},{"m":"17","g":"esas duruşa geçmez","c":"Devlet memurları; amirleri karşısında saygılı duruş zorunlu","n":"","k":"(7) Devlet memurları esas duruşa geçmez. Ancak amirleri karşısında saygılı bir duruş sergilemek zorundadır.","x":[["18","selamlamadan da muaf, saygılı duruş"],["6","astlık-üstlük yok, amir-maiyet var"]]},{"m":"18","g":"Küçüğün büyüğü selamlaması","c":"saygının; büyüğün küçüğü sevginin; aynı seviye nezaket ve muhabbetin","n":"","k":"Küçüğün büyüğü selamlaması saygının, büyüğün küçüğü selamlaması sevginin, aynı seviyede olanların birbirini selamlaması ise nezaket ve muhabbetin belirtisidir.","x":[]},{"m":"18","g":"ayrılanların kalanları","c":"selamlamada temel kural: astın üstünü, gelenlerin mevcut olanları selamlaması","n":"","k":"Selamlamada temel kural; astın üstünü, ayrılanların kalanları, gelenlerin mevcut olanları selamlamasıdır. Üst veya âmir selamlamayı bitirmeden ast selamlamayı bitiremez.","x":[]},{"m":"18","g":"selamlamayı bitirmeden","c":"üst veya âmir bitirmeden ast selamlamayı bitiremez","n":"","k":"Selamlamada temel kural; astın üstünü, ayrılanların kalanları, gelenlerin mevcut olanları selamlamasıdır. Üst veya âmir selamlamayı bitirmeden ast selamlamayı bitiremez.","x":[]},{"m":"18","g":"Sivil kıyafetli olunması","c":"sivil de olsa selam verilir (mani değil)","n":"","k":"Sivil kıyafetli olunması selam verilmesine mani değildir.","x":[]},{"m":"18","g":"görmemek mazeret teşkil etmez","c":"selamlama gecikmiş bile olsa yapılır","n":"","k":"(5) Selamlama gecikmiş bile olsa yapılır, görmemek mazeret teşkil etmez.","x":[]},{"m":"18","g":"kimlik kartını ibraz ederek","c":"sivil âmir veya üst; derhal esas duruşa geçilip selam verilir","n":"","k":"Âmir veya üst sivil dahi olsa, tanınıyorsa veyahut kimlik kartını ibraz ederek kendini tanıtmışsa, derhal esas duruşa geçilip selam verilir ve gerekli saygı gösterilir.","x":[["10","emir veren âmir kurum kimliğiyle tanıtır"]]},{"m":"18","g":"başla takip yapılır","c":"âmir veya üst selâmlanırken; selamlanan şahsın gözüne canlı bakılır","n":"","k":"(7) Âmir veya üst selâmlanırken başla takip yapılır. Selâmlama esnasında, selamlanan şahsın gözüne canlı bir şekilde bakılır.","x":[]},{"m":"18","g":"sağ el ile yapılır","c":"elle selamlama; başta şapka, kayık kep, bere, çelik başlık varken","n":"","k":"(8) Elle selamlama, başta şapka, kayık kep, bere, kar başlığı, çelik/fiber başlık bulunduğunda ve sağ el ile yapılır.","x":[]},{"m":"18","g":"durup yol vermesi","c":"merdiven ve dar geçit gibi yerlerde selamlama; astlar","n":"","k":"Merdiven ve dar geçit gibi yerlerde selamlama, astların durup yol vermesi suretiyle olur.","x":[]},{"m":"18","g":"eldiven ile selâmlama","c":"tören birliklerindeki rütbeli personel ve erler hariç yapılmaz","n":"","k":"(9) Tören birliklerinde bulunan rütbeli personel ve erler haricinde eldiven ile selâmlama yapılmaz.","x":[]},{"m":"18","g":"cephe selamı verilir","c":"Cumhurbaşkanına, sancağa, yabancı devlet başkanlarına ve sancaklarına, cenazeye","n":"bayrak çekilir/indirilirken de cephe alınarak selamlanır","k":"(10) Cumhurbaşkanına, sancağa ve yabancı devlet başkanları ile sancaklarına ve cenazeye karşı cephe selamı verilir.","x":[]},{"m":"18","g":"açık yerde şapkalı","c":"milli marş çalınırken saygı duruşu; kapalı yerlerde şapkasız","n":"cephe marşın çalındığı yöne","k":"(11) Rütbeli personel ve erler, milli marş çalınır veya söylenirken, açık yerde şapkalı, kapalı yerlerde şapkasız olarak, cephesini marşın çalındığı yöne dönerek saygı duruşunda bulunur.","x":[]},{"m":"18","g":"araç forsu veya flamasının","c":"görülmesi halinde selamlama yapılır; özel araç kullanan üstlere de selam","n":"","k":"(13) Resmî araçlardaki rütbeli personelin tanınması, araç forsu veya flamasının görülmesi halinde selamlama yapılır. Özel araç kullanan üstlere selam verilir.","x":[]},{"m":"18","g":"Araç süren rütbeli","c":"selamlama yapmaz; astın selamına araçta en kıdemli karşılık verir","n":"","k":"Araç süren rütbeli personel ve erler selamlama yapmaz. Araçta bulunan diğer rütbeli personel ve erler üst ve âmirlerini selamlar. Bir astın selamına araçta iken en kıdemli karşılık verir.","x":[]},{"m":"18","g":"başı açık girilir","c":"konferans salonu, gazino, kütüphane, yemekhane; karşılık beklenmeden içeridekiler selamlanır","n":"servis araçlarında da aynı","k":"(14) Konferans salonu, gazino, kütüphane, dershane, yemekhane gibi yerlere başı açık girilir ve karşılık beklenmeden içeride bulunanlar selamlanır. Çıkarken de aynı selamlama yapılır. Servis araçları içinde de aynı kurallar geçerlidir.","x":[]},{"m":"18","g":"Şehit na’şını taşıyan","c":"hava nakil araçlarının iniş ve kalkışında hazır bulunanlarca selamlama","n":"","k":"(15) Şehit na’şını taşıyan hava nakil araçlarının alanlara iniş ve kalkışında, hazır bulunanlarca selamlama yapılır.","x":[]},{"m":"18","g":"selamlama ile ilgili hususlardan muaftır","c":"Devlet memurları; amirlerine karşı saygılı duruşunu muhafaza eder","n":"","k":"(16) Devlet memurları selamlama ile ilgili hususlardan muaftır. Ancak, amirlerine karşı saygılı duruşunu muhafaza etmekle mükelleftir.","x":[["17","esas duruşa geçmez, saygılı duruş"]]},{"m":"19","g":"en büyük ve affedilmeyecek kusurdur","c":"Korkaklık; cesaret ve şecaat vasfı","n":"","k":"ç) Cesaret ve şecaat: Tehlikeden asla korkmayarak ve gerektiğinde ölmekten çekinmeyerek iş görmek ve pek yürekli olmaktır. Korkaklık; personel için en büyük ve affedilmeyecek kusurdur. Nefsini zarardan ve tehlikeden korumak için görevi bırakarak savuşmak veya ihmal etmek namus ve onura leke getirir.","x":[]},{"m":"19","g":"muntazam işleyen bir saat","c":"İntizam severlik vasfı (görevi dakikası dakikasına)","n":"","k":"j) İntizam severlik: Personel, görevini muntazam işleyen bir saat gibi dakikası dakikasına yapmayı adet haline getirmelidir.","x":[]},{"m":"19","g":"kardeşten ileri olduğunu","c":"İyi geçinmek; arkadaşın kabahatini örtbas etmek teşkilata fenalıktır","n":"","k":"f) İyi geçinmek: Bütün mesai arkadaşlarının kardeşten ileri olduğunu ve gerektiğinde aynı ülkü için bir arada kanlarını dökeceklerini düşünerek birbirlerini yürekten sevmek, birbirlerinin onurlarına saygı göstermek, edep ve terbiyeye uymayan işlerden, şakalardan kaçınmak ve daima mertçe hareket etmektir. Personel, arkadaşının keder ve sevincine ortak olmalı ve gerektiğinde ona öğüt vererek ahlâksızlıktan ve her türlü tehlikeden korumalıdır. Arkadaşını fena yola sürüklemenin, kabahatini örtbas etmeye çalışmanın teşkilatına fenalık etmek demek olduğunu her personel bilmelidir.","x":[]},{"m":"19","g":"kendisini dinlemekte olduklarını","c":"Sır saklamak; görev hususlarında hiç kimseye sır vermemek","n":"","k":"ğ) Sır saklamak: Personel, her yerde kötü niyetlilerin bulunacağını ve kendisini dinlemekte olduklarını kabul edip, görev ve göreve ait hususlarda hiç kimseye sır vermemelidir. Hiçbir yerde mesleğine ilişkin sözler sarf etmemeli, her hangi bir şeyi büyüterek ve ekleyerek yayıp dağıtmaktan sakınmalı ve hiç bir zaman doğruluktan ayrılmamalıdır.","x":[]},{"m":"19","g":"gösterdiğinden dışarı çıkmamak","c":"İtaat (yasak edilen şeyleri yapmamak)","n":"","k":"b) İtaat: Mevzuat ile emirlerin gösterdiğinden dışarı çıkmamak ve yasak edilen şeyleri yapmamaktır.","x":[]},{"m":"19","g":"Başka milletten kolluk","c":"Temsil ve tanıtım vasfı (iyi geçinmek, yüksek değeri tanıtmak)","n":"","k":"k) Temsil ve tanıtım: Başka milletten kolluk veya askeri personel ile bir arada bulunulduğu zaman, onlarla iyi geçinmek ve yüksek değerini onlara da tanıtacak bir arkadaşlık yapmak, teşkilatların temsil ve tanıtım mahiyetindeki görevidir.","x":[]},{"m":"19","g":"bir vücut gibi çalışmaktır","c":"Emel ve fikir birliği; genelin menfaati şahsi menfaatten üstün","n":"","k":"h) Emel ve fikir birliği: Cumhuriyetin ve milletin korunması uğrunda bir vücut gibi çalışmaktır. Bu, teşkilatların en kıymetli özelliklerindendir. Emelde ve fikirde birlik genelin menfaatinin şahsi menfaatten daha üstün, aziz olduğunu takdir ederek sağlanır.","x":[]},{"m":"19","g":"mesai saatleri dışında da","c":"personel, teşkilatının bir personeli olduğu bilinciyle hareket eder","n":"","k":"(2) Personel, resmî sıfatının gerektirdiği itibar ve güvene layık olduğunu, görev içindeki ve görev dışındaki davranışlarıyla gösterir ve mesai saatleri dışında da teşkilatının bir personeli olduğu bilinciyle hareket eder.","x":[]},{"m":"20","g":"hastalandığında durumunu âmirine","c":"personel bildirmekle yükümlü; âmir de maiyetinin sağlığını yakinen takip eder","n":"","k":"personel sağlığını korumakla ve hastalandığında durumunu âmirine bildirmekle, her kademedeki âmirler de, maiyetinin sağlığı ile ilgili hususları yakinen takip ve gerekli tedbirleri almakla yükümlüdür.","x":[]},{"m":"21","g":"satamaz, kiralayamaz veya istifadesine","c":"emanet devlet malı kimseye; kalkışanı duyan âmirine derhal haber verir","n":"","k":"a) Devlet tarafından bedelsiz ve emanet olarak kendisine verilen her çeşit Devlet malını hiç bir surette kimseye satamaz, kiralayamaz veya istifadesine sunamaz. Böyle bir iş yapmaya kalkışanları duyar veya bilirse âmirine derhal haber verir.","x":[]},{"m":"21","g":"kendiliğinden ilâveler ve değişiklikler","c":"kendisine verilen eşyanın şeklinde yapamaz","n":"","k":"b) Kendisine verilen eşyanın şekillerinde kendiliğinden ilâveler ve değişiklikler yapamaz.","x":[]},{"m":"22","g":"illerde valiler ve Bakanın","c":"basına bilgi ancak onlar ve Bakanın yetkili kılacağı görevli verir","n":"","k":"Bu konuda gerekli bilgi ancak illerde valiler ve Bakanın yetkili kılacağı görevli tarafından verilebilir.","x":[]},{"m":"22","g":"topluca bildiri dağıtamaz","c":"personel tek başına veya topluca; basına demeç veremez","n":"","k":"Personel, tek başına veya topluca bildiri dağıtamaz, kamu görevleri hakkında basına, haber ajanslarına, radyo ve televizyon kurumlarına veya diğer iletişim kanallarına bilgi, yazı ve demeç veremez.","x":[]},{"m":"22","g":"mesul müdürü, yazarı","c":"personel hiçbir basın yayın organının, internet vasıtasının olamaz","n":"","k":"(3) Personel, hiç bir basın ve yayın organının, internet vasıtasının ve diğer iletişim kanallarının mesul müdürü, yazarı veya haber vericisi olamaz.","x":[]},{"m":"22","g":"siyaset hariç olmak üzere","c":"bilimsel, tarihi, iktisadi, içtimai, edebi makale ve kitap yazmak serbest","n":"siyaset hakkında yazı yazamaz","k":"(5) Personel, siyaset hariç olmak üzere, özellikle bilimsel, tarihi, iktisadi, içtimai, edebi bir zemin üzerinde gazete ve dergilere makaleler göndermekte ve aynı konularda kitap, tez, bildiri yazmak ve kendi hesabına bastırmakta serbesttir.","x":[]},{"m":"22","g":"ışığında yazılmıştır","c":"resmî kaynaktan yararlanan eser; yazmadan evvel Komutanlıktan izin alınır","n":"kaydın konulup konulmayacağını Komutanlık belirler","k":"b) Yalnız mesleki makam ve mevkii itibariyle kendisince malûm olan resmî kaynak ve belgelerden yararlanmak suretiyle eser yayımlamak isteyenler, eserini yazmadan evvel ilgisine göre Jandarma Genel Komutanlığı veya Sahil Güvenlik Komutanlığından izin almalıdır. Bu gibi eserlerin “resmî kaynak ve belgeler ışığında yazılmıştır.” kaydını içerip içermeyeceğini de ilgisine göre Jandarma Genel Komutanlığı veya Sahil Güvenlik Komutanlığı belirler.","x":[]},{"m":"22","g":"göreve mahsus kitaplardan","c":"bunlardan yararlanan eser basılmadan evvel silsile ile incelettirilir; izin alınır","n":"","k":"c) Yayımlanacak kitap veya makaleler gizli ve göreve mahsus kitaplardan istifade suretiyle yazılmış bulunuyorsa, bunun basılması ve yayımından evvel sahibi, silsileler yolu ile ilgisine göre Jandarma Genel Komutanlığına veya Sahil Güvenlik Komutanlığına başvurarak eser veya makalesini incelettirir ve yayımlanması için izin alır.","x":[]},{"m":"23","g":"en kıdemli birlik komutanı","c":"kışla komutanıdır (birden fazla birliğin aynı kışlada bulunduğu yer)","n":"","k":"MADDE 23 - (1) Birden fazla birliğin aynı kışla içinde bulunduğu yerlerde en kıdemli birlik komutanı, karargâh veya kurum âmiri kışla komutanıdır.","x":[]},{"m":"23","g":"kışla emniyet subayı","c":"bir subay, yoksa tecrübeli bir astsubay görevlendirilir","n":"","k":"Emniyet tedbirlerinin tespiti, idamesi ve kontrollerinin yapılması amacıyla bir subay veya subay bulunmadığı durumlarda tecrübeli bir astsubay kışla emniyet subayı olarak görevlendirilir.","x":[]},{"m":"23","g":"en kıdemli kışla komutanınca","c":"aynı belediye mücavir alanında birden fazla kışla; planlar tek elden","n":"JGK ve SGK için ayrı ayrı","k":"(3) Aynı belediye mücavir alanı içinde, birden fazla kışlanın bulunması durumunda, birlik emniyet planı, takviye planı, yangından korunma planı ve disiplinin muhafazası gibi hususlar, Jandarma Genel Komutanlığı ve Sahil Güvenlik Komutanlığı için ayrı ayrı olmak üzere, en kıdemli kışla komutanınca bir bütünlük içinde ele alınarak tek elden tespit ve takip edilir.","x":[]},{"m":"23","g":"Paratonerlerin ölçüm ve bakımlarının","c":"kışla komutanının görevi; yaptırılması ve kontrolünü sağlar","n":"içme suyu analizi, ilaçlama, hijyen denetimi de kışla komutanı","k":"ı) Paratonerlerin ölçüm ve bakımlarının yaptırılması ve kontrol edilmesini sağlar.","x":[]},{"m":"23","g":"Kışla gelişim planının","c":"hazırlanmasını kışla komutanı sağlar","n":"","k":"j) Kışla gelişim planının hazırlanmasını sağlar.","x":[]},{"m":"24","g":"genel olarak 40 saattir","c":"rütbeli personelin haftalık çalışma süresi (göreve çağrılmaya engel değil)","n":"","k":"uzman jandarmaların haftalık çalışma süresi genel olarak 40 saattir.","x":[]},{"m":"24","g":"yirmi dört saatinde devamlılık","c":"çalışma saat ve şekillerini birlik komutanları veya birim âmirleri belirler","n":"","k":"(2) Günün yirmi dört saatinde devamlılık gösteren görevlerde çalışan rütbeli personelin çalışma saat ve şekilleri birlik komutanları veya birim âmirlerince belirlenir.","x":[]},{"m":"24","g":"nöbete ilişkin hükümler saklıdır","c":"nöbetçi ve görevli olmayan rütbeli personel mesai bitiminde ayrılabilir","n":"görev yerinden izinsiz ayrılma yok","k":"(3) Nöbetçi ve görevli olmayan veya kendisine ayrıca özel bir görev verilmeyen subay, sözleşmeli subay, astsubay, sözleşmeli astsubay ve uzman jandarmalar günlük mesai veya eğitimin bitiminde görev yerinden ayrılabilir. Ancak nöbete ilişkin hükümler saklıdır. Görevin bulunmayı gerektirdiği yerden izinsiz hiçbir rütbeli personel ve er gündüz ve gece ayrılamaz.","x":[]},{"m":"25","g":"günlük görev cetveline göre","c":"kışlada kalanların yoklamasını nöbetçi heyeti alır","n":"","k":"(3) Kışlada kalan rütbeli personel ve erlerin yoklamaları, nöbetçi heyeti tarafından günlük görev cetveline göre alınır.","x":[]},{"m":"25","g":"toplu takdim alınabilir","c":"kılık, kıyafet, teçhizat kontrolü, müşterek emir tebliği için; âmir belirler","n":"","k":"(2) Rütbeli personel ve erlerin kılık, kıyafet, malzeme ve teçhizatının kontrolü, eğitim ve disiplin düzeylerinin tespiti, müşterek emirlerin tebliği gibi amaçlarla, âmir tarafından belirlenecek yer ve zamanlarda toplu takdim alınabilir veya içtima edilebilir. Toplu takdimin icrası ilgili mevzuat esaslarına göre yürütülür.","x":[]},{"m":"25","g":"nöbetçi âmirinin emri","c":"gereken hallerde onun emriyle de yoklama alınabilir","n":"birlik komutanı, karargâh ve kurum âmirleri de","k":"(4) Gereken hâllerde birlik komutanı, karargâh ve kurum âmirleri ile nöbetçi âmirinin emri ile de yoklama alınabilir.","x":[]},{"m":"26","g":"nöbet görevi ihdas edilir","c":"müşterek görevlerin belli bir sıra ve süreyle yapılması maksadıyla","n":"","k":"belli bir sıra ve süreyle; personel tarafından yerine getirilmesini sağlamak maksadıyla nöbet görevi ihdas edilir.","x":[]},{"m":"27","g":"en az üç kişiden","c":"hazır kıt’a kuvveti; birliğin tamamına kadar; birlik komutanı belirler","n":"","k":"(3) Hazır kıt’anın teşkil edileceği zaman ve kuvveti ihtiyaca göre birlik komutanı belirler. Bu kıt’anın kuvveti en az üç kişiden birliğin tamamına kadar olabilir. Hazır kıt’a komutanı, görevlendirilen birliğin büyüklüğüne bağlı olarak subay, astsubay, uzman jandarma veya uzman erbaş olabilir.","x":[]},{"m":"27","g":"uzman jandarma veya uzman erbaş","c":"hazır kıt’a komutanı; birliğin büyüklüğüne bağlı (subay, astsubay da)","n":"","k":"(3) Hazır kıt’anın teşkil edileceği zaman ve kuvveti ihtiyaca göre birlik komutanı belirler. Bu kıt’anın kuvveti en az üç kişiden birliğin tamamına kadar olabilir. Hazır kıt’a komutanı, görevlendirilen birliğin büyüklüğüne bağlı olarak subay, astsubay, uzman jandarma veya uzman erbaş olabilir.","x":[]},{"m":"27","g":"uyuyup uyumayacağı","c":"hazır kıt’anın; çıkaran birlik komutanı emreder","n":"gece dahi tam teçhizatlı, silahlı hazır","k":"(2) Hazır kıt'a kendisine gösterilen yerde gece dahi tam teçhizatlı, silahlı ve giyimli olarak harekete hazır bulunur. Hazır kıt'anın uyuyup uyumayacağı, çıkaran birlik komutanı tarafından emredilir.","x":[]},{"m":"29","g":"dayanıklı tüketim malları hariç","c":"kantinlerin amacı; zaruri ihtiyaçlar daha ucuza ve kolay","n":"","k":"dayanıklı tüketim malları hariç zaruri ihtiyaçlarının daha ucuza ve kolaylıkla sağlanmasını temin maksadıyla","x":[]},{"m":"30","g":"seyir istikametleri değiştirilmemek","c":"servis araçlarından aileler ancak boş yer varsa; bu şartla","n":"hasta/cenaze aracından da boş yerde yararlanır","k":"(2) Servis araçlarından, ancak boş yer bulunduğu takdirde ve seyir istikametleri değiştirilmemek şartı ile personelin aileleri de istifade edebilir.","x":[]},{"m":"30","g":"sivil moral ekipleri","c":"savaşta ve olağanüstü hallerde harekât bölgesine nakil araçlarından yararlandırılır","n":"","k":"(3) Savaşta ve olağanüstü hallerde, izinli personel ve görevin gerektirdiği diğer işlerde görevlendirilecek personel ile sivil moral ekipleri, harekât bölgesi ve harekâtla ilgili diğer bölgelere gidiş ve dönüşlerinde nakil araçlarından yararlandırılır.","x":[]},{"m":"30","g":"hava araçlarından faydalanabilir","c":"terörle mücadele bölgesinde yol güvenliği yoksa aileler de; boş yer","n":"","k":"(4) Terörle mücadele harekâtı yürütülen bölgelerde, yol güvenliğinin sağlanamadığı veya tehdit varlığının değerlendirildiği durumlarda, zorunlu ve acil hallerde emniyet açısından hava ulaştırma araçları ile ulaşım sağlanan bölgelerdeki personelin aileleri de boş yer bulunduğu takdirde ve seyir istikametleri değiştirilmemek şartı ile hava araçlarından faydalanabilir.","x":[]},{"m":"30","g":"en son gittiği yerden","c":"tarifeli araç işlemeyen yere tayin; aile ve eşya resmî araçla","n":"","k":"(7) Gündelik ve belirli tarifeli umumi araçların işlemediği bölgelere tayin edilen personelin zatî eşyaları ile ailesi, efradı ve kendisi umumi araçların en son gittiği yerden, görev yerine kadar resmî araç ile götürülüp, getirilebilir. Bu husus ilgili komutanlıkça düzenlenir.","x":[]},{"m":"32","g":"en büyük mülki âmirine haber","c":"birlik komutanları afet ve acil durumları bildirmekle sorumludur","n":"","k":"MADDE 32 - (1) Birlik komutanları, meydana gelen afet ve acil durumları mahallin en büyük mülki âmirine haber vermekten sorumludurlar.","x":[]},{"m":"32","g":"üstlerinden emir beklemeksizin","c":"vali veya kaymakamın istediği yardımı birlik komutanı yapar; Komutanlığa haber","n":"","k":"(2) Afet bölgelerinde veya civarında bulunan birlik komutanları, vali veya kaymakamlar tarafından istenilecek yardımları üstlerinden emir beklemeksizin ve gecikmeksizin yerine getirirler ve en kısa zamanda sıralı amirleri ile ilgisine göre Jandarma Genel Komutanlığına veya Sahil Güvenlik Komutanlığına haber verirler.","x":[]},{"m":"32","g":"Türkiye Afet Müdahale Planı","c":"diğer afet işleri; Afet ve Acil Durum Müdahale Hizmetleri Yönetmeliği","n":"","k":"(3) Afet ve acil durumlara ilişkin diğer tüm faaliyetler, 26/8/2013 tarihli ve 2013/5703 sayılı Afet ve Acil Durum Müdahale Hizmetleri Yönetmeliği ile Türkiye Afet Müdahale Planı esaslarına göre yürütülür.","x":[]},{"m":"33","g":"Binaların Yangından Korunması Hakkında Yönetmelik","c":"yangın tedbirleri bu Yönetmelik ve ilgili Yönerge esaslarına göre","n":"","k":"MADDE 33 - (1) Karargâh, birlik ve kurumlardaki her türlü bina, tesis ile bunların içinde ve dışındaki, her cins ikmal maddelerinin yangına karşı korunması ve yangının meydana gelmesi halinde genişlemesine meydan verilmeyerek can ve mal kayıplarının önlenmesi veya azaltılması konusunda alınması gereken tedbirler ve bu tedbirlerin uygulama yöntemleri 27/11/2007 tarihli ve 2007/12937 sayılı Binaların Yangından Korunması Hakkında Yönetmelik ve ilgili Yönerge esaslarına göre yürütülür.","x":[]},{"m":"34","g":"onaylandığı tarihte yürürlüğe","c":"Yönetmelik onay tarihinde yürürlüğe girer; Bakan yürütür","n":"","k":"MADDE 34 - (1) Bu Yönetmelik onaylandığı tarihte yürürlüğe girer.","x":[]},{"m":"4","g":"bir emir komuta altında toplanan","c":"birlik (tanım); taktik ve idari birimler","n":"","k":"e) Birlik: Görevin yapılması için teşkil edilen ve bir emir komuta altında toplanan taktik ve idari birimleri,","x":[]},{"m":"10","g":"tüm görevlerin düzenleyicisidir","c":"emir; göreve ilişkin ve mevzuata uygun olması şart","n":"","k":"(1) Emir tüm görevlerin düzenleyicisidir.\n(2) Emirlerin, göreve ilişkin ve mevzuata uygun olması şarttır.","x":[]},{"m":"9","g":"Tüm görevleri mevzuata uygun","c":"âmir: zamanında, eksiksiz yapar/yaptırır; disiplini tesis eder","n":"izin talebini gerekçesiz reddetmek görev DEĞİL","k":"MADDE 9 - (1) Tüm görevleri mevzuata uygun, zamanında ve eksiksiz yapar veya yaptırır, disiplini tesis ve idame eder, maiyetini yetiştirir, hal ve hareketlerini takip ve kontrol eder.","x":[]},{"m":"9","g":"adil ve hakkaniyetli hareket","c":"âmir astlarına karşı; hukuk ve adaletten ayrılmaya mazeret yok","n":"","k":"(5) Astlarına karşı adil ve hakkaniyetli hareket eder. Hiçbir mazeret, hukuk ve adaletten ayrılmaya gerekçe gösterilemez.","x":[]},{"m":"9","g":"öne atılmayı şerefli","c":"âmir: kolaylıkta nefsini sona bırakır, zorlukta öne atılır","n":"KOLAYLIKTA SONA, ZORLUKTA ÖNE","k":"(10) Maiyetinin katlandığı her türlü zahmet ve mahrumiyete, fiziki imkân nispetinde beraber katlanır, bir kolaylık çıkınca bunlardan istifade için nefsini sona bırakır ve bir zorluk çıkınca bilâkis öne atılmayı şerefli bir görev kabul eder.","x":[]},{"m":"9","g":"mizaçlarını ayrıntılarıyla bilir","c":"âmir maiyetinin isimlerini, hususi vasıflarını, kişilik özelliklerini de bilir","n":"","k":"Maiyetindeki personelin isimlerini ve bunların hususi vasıflarını, kişiliklerini oluşturan özelliklerini ve mizaçlarını ayrıntılarıyla bilir.","x":[]},{"m":"9","g":"samimi ve candan olur","c":"âmirin görev dışı münasebeti; görev esnasında daima ciddi","n":"","k":"(3) Görev esnasında, maiyeti ile münasebetleri daima ciddi, görev dışındaki münasebet ve görüşmeleri ise samimi ve candan olur.","x":[]},{"m":"8","g":"değiştirmeden ve eksiksiz olarak","c":"ast usulüne uygun emirleri tam, zamanında yerine getirir; yorum katmaz","n":"","k":"MADDE 8 - (1) Ast, âmir ve üstlerine genel görgü ve disiplin kurallarına uygun tam bir saygı göstermekle, resmî kıyafetli olsun veya olmasın âmirlerinin, usulüne uygun emirlerini tam, zamanında, değiştirmeden ve eksiksiz olarak yerine getirmekle, görevini kusursuz icra etmekle ve yapılması kendisince de malum olan görevleri yerine getirmekle, doğru insiyatif kullanmakla ve emrin icrası veya sonuçları ile ilgili olarak görevlendirme yapan âmirine bilgi vermekle yükümlüdür.","x":[]},{"m":"8","g":"mutlak itaat anlayışıyla","c":"âmirin mevzuata uygun her emri; korku ile değil sevgiyle","n":"","k":"(2) Görevini; korku ile değil, sevgi ve üstün görev anlayışı ile icra eder. Âmirin mevzuata uygun şekilde verdiği her emri mutlak itaat anlayışıyla, bütün tahammül kuvvetini sarf ederek yapar.","x":[]},{"m":"8","g":"mırıldanmaz, doğru bulmadığını sezdirecek","c":"yasak davranışlar; emirden dolayı âmire mütalaa da yok","n":"","k":"(5) Aldığı bir emirden dolayı âmirine mütalâada bulunmaz. Bir emri alırken veya aldıktan sonra mırıldanmaz, doğru bulmadığını sezdirecek hal ve harekette bulunmaz.","x":[]},{"m":"15","g":"resmî kıyafetli olması esastır","c":"rütbeli personel ve erler görev sırasında","n":"","k":"(2) Rütbeli personel ve erlerin görev sırasında resmî kıyafetli olması esastır.","x":[]},{"m":"15","g":"her zaman üzerinde bulundurmak","c":"kimlik kartı resmî ve sivil; güvenlik/İKK istisnası dışında","n":"","k":"(10) Kimlik kartı, kişinin jandarma veya sahil güvenlik personeli olduğunu gösteren resmî bir belgedir. Personel, güvenlik ve istihbarata karşı koyma gibi çeşitli istisnai durumlar dışında, kimlik kartını resmî ve sivil olarak her zaman üzerinde bulundurmak zorundadır. Yetkili makamlarca talep edilmesi durumunda kimlik kartının gösterilmesi zorunludur.","x":[]},{"m":"15","g":"tutuklu veya hükümlü iken","c":"resmî kıyafet giyilmez; görevden uzaklaştırılınca da; tanıklık-bilirkişilik hariç","n":"","k":"(8) Rütbeli personel ve erler; tanıklık veya bilirkişilik dışında, adlî yargı makam ve mercilerine çağrıldığında, tutuklu veya hükümlü iken veya görevden uzaklaştırıldıkları süre içerisinde resmî kıyafet giyemez.","x":[]},{"m":"14","g":"İznin maksadı","c":"dinlenme, güç toplama, yenilenmiş güçle göreve dönme, şahsi ihtiyaçlar","n":"","k":"MADDE 14 - (1) İznin maksadı, personelin dinlenmesi, gücünü toplaması, yenilenmiş güçle göreve tekrar dönmesinin sağlanması ve bazı şahsi ihtiyaçlarını görmesidir.","x":[]},{"m":"14","g":"adresini ve iletişim araçlarını","c":"izne giden personel birlik/kurum âmirine bildirir; ulaşılabilir kalır","n":"","k":"(5) İzne giden her personel, ayrılmadan evvel kendi :[]}]},{"id":24,"ad":"Jandarma Genel Komutanlığı İzin Yönetmeliği","grup":"müşterek","satirlar":[{"m":"5","g":"Sıhhi izinler","c":"izin türlerinden; yıllık, mazeret, sıhhi, yurt dışı","n":"dört tür","k":"a) Personele verilecek izinler şunlardır:\n1) Yıllık izin.\n2) Mazeret izinleri.\n3) Sıhhi izinler.\n4) Yurt dışı izinleri.","x":[]},{"m":"5","g":"kanuni izinlerinden mahsup edilmez","c":"adli makama şüpheli, sanık, tanık, mağdur, bilirkişi çağrısı","n":"amir, çağrı ve yol süresine göre gönderir","k":"d) Adli makamlara şüpheli, sanık, tanık, mağdur veya bilirkişi olarak çağrılan personelin görevden ayrı kaldığı süreler kanuni izinlerinden mahsup edilmez.","x":[]},{"m":"5","g":"vekâlet edenler","c":"vekâlet ettikleri kadronun izin yetkisine sahip","n":"","k":"e) İzin vermeye yetkili amirlerin yerine vekâlet edenler, vekâlet ettikleri kadronun izin verme yetkisine sahiptir.","x":[]},{"m":"5","g":"izinli sayılır","c":"milletlerarası spor müsabakası ve hazırlığına katılan","n":"","k":"f) 21/5/1986 tarihli ve 3289 sayılı Gençlik ve Spor Hizmetleri Kanununun 29 uncu maddesi uyarınca milletlerarası seviyede yurt içi ve yurt dışı spor müsabakaları ve bunların hazırlık çalışmalarına katılacak personel, organizasyonun devamı süresince izinli sayılır.","x":[]},{"m":"5","g":"izinden geriye çağrılabilir","c":"asgari yıllık izin planını onaylayan makam; yazılı ya da sözlü","n":"sonradan görevlendirme yazısı; dönüş ve gidiş masrafı Harcırah Kanununa göre ödenir; savaş ve OHAL'de de çağrılabilir","k":"ğ) Görev ve hizmet ihtiyacının gerektirdiği durumlarda, asgari yıllık izin planlamasını onaylayan makam tarafından personel izinden geriye çağrılabilir. Personelin izinden çağrılması, yazılı veya sözlü olarak yapılabilir.","x":[]},{"m":"5","g":"günün başlangıç saatidir","c":"izinlerin başlangıç ve bitiş saati","n":"istisnai durumda yetkili amir farklı saat belirleyebilir","k":"h) İzinlerin başlangıç ve bitiş saati günün başlangıç saatidir.","x":[]},{"m":"5","g":"48 saat içerisinde","c ir sureti personelin birlik ve sayısal özlük dosyalarında","x":[]}]},{"id":25,"ad":"6136 sayılı Ateşli Silahlar ve Bıçaklar ile Diğer Aletler Hakkında Kanun","grup":"müşterek","satirlar":[{"m":"2","g":"armağan edilenlerin","c":"resmî görevle yurt dışında; gümrük vergisiz yurda sokulur","n":"devlet/hükümet başkanı, genelkurmay başkanı, kuvvet komutanı armağanı; belgelenmeli","k":"B) Resmi görevle yurt dışına giden kişilerden, gittikleri yabancı ülkenin devlet veya hükümet başkanları ya da hükümet üyeleri yahut genelkurmay başkanları veya kuvvet komutanları tarafından veya hükümetleri adına, kendilerine silah ve mermi armağan edilenlerin, (silahın ve merminin armağan olarak verildiğinin belgelenmesi koşulu ile ve gümrük vergi ve resmi ödenmeksizin)","x":[]},{"m":"2","g":"tek bir silaha mahsus","c":"dış temsilcilikte elçi, konsolos, subay, güvenlik memuru","n":"","k":"C) Memuriyetleri devamınca bir defaya ve tek bir silaha mahsus olmak üzere, dış temsilciliklerimizde elçi sınıfından olanlar ile konsolosların ve daimi görevlerde bulunan subaylarla güvenlik memurlarının, Getirdikleri silah ve mermisinin yurda sokulmasına izin verilir.","x":[]},{"m":"2","g":"kıta ile gönderilen","c":"kimlik kartındaki silah için yurda girişte izin aranmaz","n":"","k":"Yurt dışına kıta ile gönderilen subay ve astsubayların kimlik kartlarında kayıtlı silahları için yurda girişlerinde izin şartı aranmaz.","x":[]},{"m":"4","g":"sustalı çakı","c":"yapımı yasak alet (m.4)","n":"kama, hançer, pala, kılıç, kasatura, süngü, topuz, muşta, boğma teli; meslek için İçişleri yönetmeliğiyle izin","k":"Ülke içinde kama, hançer, saldırma, şişli baston, sustalı çakı, pala,kılıç, kasatura, süngü, sivri uçlu ve oluklu bıçaklar, topuz, topuzlu kamçı, boğma teli veya zinciri, muşta ile salt saldırı ve savunmada kullanılmak üzere özel nitelikteki benzeri aletlerin yapımı yasaktır.","x":[]},{"m":"4","g":"bu Kanun hükümlerine tabi değildir","c":"yivsiz tüfek, spor silahı, meslek aletleri Kanuna tabi değil","n":"","k":"Yalnız sporda kullanılan yivli ateşsiz silahlar ve mermileri ile yivsiz tüfekler ve mermilerinin, ev gereçlerinden olan veya tababet, sanayi, tarım, spor için kullanılan aletlerle bir meslek veya sanatın icrası için gerekli bıçak, şiş, raspa ve benzerlerinin kullanılması bu Kanun hükümlerine tabi değildir.","x":[]},{"m":"4","g":"ateşli yivli silahlar","c":"avda-sporda bile m.7 ruhsatına tabi","n":"","k":"Avda veya sporda kullanılan her nevi ateşli yivli silahlar bu Kanunun 7 nci maddesine göre ruhsata tabidir.","x":[]},{"m":"6","g":"beş yıl için geçerlidir","c":"taşıma ve bulundurma ruhsatları; yenileme harcıyla","n":"","k":"Bu Kanun kapsamına giren silahlar için verilen taşıma ve bulundurma ruhsatları yenileme harcı alınmak şartı ile beş yıl için geçerlidir.","x":[]},{"m":"6","g":"altı ay içerisinde ruhsatını yeniletmeyenlerin","c":"ruhsat iptal; üçbin TL ödeyerek yeniden alınabilir (mülki amir)","n":"ruhsat sebebi kalkınca altı ayda bildirme yükümlülüğü","k":"Ruhsatların veriliş sebeplerinin ortadan kalkması halinde ruhsat sahibi durumu ruhsatı veren makama altı ay içinde bildirmekle yükümlüdür. Aksine hareket edenler ile süresi dolduğu halde altı ay içerisinde ruhsatını yeniletmeyenlerin ruhsatları iptal edilir. Ancak, gerekli şartları haiz olan kişilere üçbin Türk Lirası idari para cezası ödemeleri kaydıyla tekrar ruhsat verilebilir. Bu fıkra hükmüne göre idari para cezası vermeye mülki amir yetkilidir.","x":[]},{"m":"6","g":"süre kaydı aranmaz","c":"Cumhurbaşkanı, bakanlar, TBMM üyeleri, komutanlar, gaziler, şehit yakını","n":"armağan silahlarda da süre kaydı yok","k":"Ancak, Cumhurbaşkanı, Başbakan, Cumhurbaşkanı yardımcıları, bakanlar, Genelkurmay Başkanı, Hükümet Üyeleri, Türkiye Büyük Millet Meclisi Üyeleri, Kuvvet Komutanları, Jandarma Genel Komutanı, Cumhurbaşkanlığı Genel Sekreteri, Türkiye Büyük Millet Meclisi Genel Sekreteri, Başbakanlık ile İçişleri Bakanlığı müsteşarları, Savunma Sanayii Geliştirme ve Destekleme İdaresi Müsteşarı, Emniyet Genel Müdürü, Sahil Güvenlik Komutanı, Cumhurbaşkanlığı Genel Sekreter yardımcıları, Türkiye Büyük Millet Meclisi Genel Sekreter yardımcıları ve bu görevlerde bulunmuş olanların, gazilerin ve 7 nci maddenin üçüncü fıkrasında belirtilen şehitlerin ve gazilerin ana, baba, eş ve çocuklarına intikal eden veya intikal eden yoksa edinecekleri ruhsatlarında süre kaydı aranmaz.","x":[]},{"m":"6","g":"mermiler için ayrıca ruhsat aranmaz","c":"ruhsata bağlı silahın mermileri","n":"","k":"Ruhsata bağlanmış silahlara ait yerli ve yabancı menşeli mermiler için ayrıca ruhsat aranmaz. Bu ruhsatlar mermiler için de geçerlidir.","x":[]},{"m":"6","g":"Ek 1 inci maddede sayılan","c":"taşıma ruhsatı buralarda geçersiz; nereden verilmiş olursa olsun","n":"","k":"Silah taşıma ruhsatları nereden verilmiş olursa olsun Ek 1 inci maddede sayılan yerler dışında geçerlidir.","x":[]},{"m":"6","g":"ayrı ayrı taşıma ruhsatı","c":"birden fazla silahı olana, isteği halinde","n":"","k":"Birden fazla silaha sahip olanlardan bu Kanun Hükümlerine göre, durumları silah taşımaya uygun olanlara istekleri halinde, mevcut silahlarının hepsi için ayrı ayrı taşıma ruhsatı verilir.","x":[]},{"m":"7","g":"mecburi hizmetini tamamlayarak istifa","c":"emekli gibi silah taşıyabilir (subay, astsubay, uzman jandarma)","n":"","k":"emekli subay, astsubay, uzman jandarma ve uzman erbaşlar ile mecburi hizmetini tamamlayarak istifa etmek suretiyle Türk Silahlı Kuvvetleri, Jandarma Genel Komutanlığı ve Sahil Güvenlik Komutanlığından ayrılan subay, astsubay ve uzman jandarmalar ile en az on yıl görev yapıp sözleşmelerinin uzatılmaması sonucu veya kendi isteğiyle Türk Silahlı Kuvvetleri, Jandarma Genel Komutanlığı ve Sahil Güvenlik Komutanlığından ayrılan uzman erbaşlar ile en az on yıl görev yapmış olmak kaydıyla istifa etmek veya kurum değiştirmek suretiyle Emniyet Genel Müdürlüğünden ayrılan emniyet hizmetleri sınıfı personeli,","x":[]},{"m":"7","g":"on yıl görev yapıp","c":"sözleşmesi uzatılmayan/ayrılan uzman erbaş; emniyetten ayrılan da on yıl","n":"","k":"emekli subay, astsubay, uzman jandarma ve uzman erbaşlar ile mecburi hizmetini tamamlayarak istifa etmek suretiyle Türk Silahlı Kuvvetleri, Jandarma Genel Komutanlığı ve Sahil Güvenlik Komutanlığından ayrılan subay, astsubay ve uzman jandarmalar ile en az on yıl görev yapıp sözleşmelerinin uzatılmaması sonucu veya kendi isteğiyle Türk Silahlı Kuvvetleri, Jandarma Genel Komutanlığı ve Sahil Güvenlik Komutanlığından ayrılan uzman erbaşlar ile en az on yıl görev yapmış olmak kaydıyla istifa etmek veya kurum değiştirmek suretiyle Emniyet Genel Müdürlüğünden ayrılan emniyet hizmetleri sınıfı personeli,","x":[]},{"m":"7","g":"Devlet memurluğundan çıkarılanlar hariç","c":"7068 disiplin cezasıyla çıkarılan emekli silah taşıyamaz","n":"tart, ihraç, rütbe geri alma, ayırma işlemi de hariç","k":"7068 sayılı Genel Kolluk Disiplin Hükümleri Hakkında Kanun Hükmünde Kararnamenin Kabul Edilmesine Dair Kanun gereğince meslekten veya Devlet memurluğundan çıkarılanlar hariç olmak üzere;","x":[]},{"m":"7","g":"Orman muhafaza memurları","c":"orman bölge şefleri de; emekli olanlar taşıyabilir","n":"emekli vali, kaymakam, hâkim-savcı, emniyet, MİT, büyükelçi, infaz koruma de","k":"h) Orman muhafaza memurları ve orman bölge şeflerinden, emekli olanlar.","x":[]},{"m":"7","g":"valiler tarafından verilecek izin vesikasını","c":"Cumhurbaşkanı yönetmeliğindeki esaslara göre; taşıma hakkı","n":"","k":"5. Cumhurbaşkanınca çıkarılan yönetmelikte belirlenecek esaslara göre valiler tarafından verilecek izin vesikasını alanlar,","x":[]},{"m":"7","g":"köy veya mahalle muhtarlığı","c":"en az bir dönem yapmış olan taşıyabilir; terör irtibatı hariç","n":"belediye başkanlığı da","k":"7. Yapılan soruşturma sonucu veya kesinleşmiş yargı kararı üzerine görevine son verilenler ile terör örgütlerine veya (İptal ibare: Anayasa Mahkemesinin 3/6/2021 tarihli ve E.:2020/9; K.:2021/37 sayılı Kararı ile) (…) Devletin milli güvenliğine karşı faaliyette bulunduğuna karar verilen yapı, oluşum veya gruplara üyeliği, mensubiyeti veya iltisakı yahut bunlarla irtibatı olanlar hariç olmak üzere, en az bir dönem köy veya mahalle muhtarlığı ya da belediye başkanlığı yapmış bulunanlar, taşıyabilirler veya mesken ya da işyerinde bulundurabilirler.","x":[]},{"m":"7","g":"en fazla bir adet silahın","c":"6 ve 7 nci bentlerdeki kişilerin (korucu, muhtar) edinecekleri","n":"","k":"Birinci fıkranın (1), (2), (3) ve (4) numaralı bentlerinde sayılan kişilere ait silahların, (6) ve (7) numaralı bentlerde sayılan kişilerin edinecekleri en fazla bir adet silahın,","x":[]},{"m":"7","g":"izin belgesi yerine geçer","c":"Kuvvet/EGM/SGK/JGK kayıtlı emekli belgesi","n":"","k":"Birinci fıkranın (4) numaralı bendinin (A) alt bendinden istifade edenler ilgili Kuvvet Komutanlıkları, Emniyet Genel Müdürlüğü, Sahil Güvenlik Komutanlığı veya Jandarma Genel Komutanlığının kayıtlarına geçmek ve bu makamlarca verilen belgelere işlenmek şartıyla ateşli silah taşıyabilirler veya bulundurabilirler. Bu şekilde düzenlenen belgeler, taşıma veya bulundurma izin belgesi yerine geçer.","x":[]},{"m":"8","g":"toplu silah aranması","c":"Cumhurbaşkanı kararıyla valiler; halka taşıma izni de","n":"","k":"Lüzum görülen mıntakalarda Cumhurbaşkanı karariyle valiler tarafından halka silah bulundurma ve taşıma müsaadesi verilebileceği gibi toplu silah aranması da yapılabilir.","x":[]},{"m":"9","g":"muvakkaten de olsa başkalarına veremezler","c":"ruhsatlı silah; ruhsatsıza satılamaz da","n":"","k":"Ateşli silah taşımak müsaadesini haiz olanlar, bu silahları resmi ruhsatı haiz bulunanlardan başkasına satamıyacakları gibi muvakkaten de olsa başkalarına veremezler.","x":[]},{"m":"9","g":"intihar ve intihara teşebbüs","c":"silahın ihmaliyle; vesika geri alınır, bir daha verilmez","n":"silahla suç işlemek de","k":"Silah bulundurma ve taşıma ruhsatını haiz olan kimsenin bu silahla suç işlemesi veya silahın muhafazasındaki ihmal ve kusurlu neticesi başkaları tarafından bir suç işlenmesi veya intihar ve intihara teşebbüs edilmesi hallerinde silah vesikası geriye alınır ve bir daha silah bulundurma ve taşıma izni verilmez.","x":[]},{"m":"9","g":"İkinci kez silahı çalınan","c":"yeni müracaatta tek silah izni","n":"kaybeden de","k":"İkinci kez silahı çalınan veya silahını ikinci kez kaybedenlere, yeni silah müracaatlarında tek bir silah için taşıma veya bulundurma izni verilebilir.","x":[]},{"m":"9","g":"Üçüncü kez silahı çalınan","c":"vesika geri; beş yıl izin yok; sonra tek silah","n":"İKİNCİ KAYIP TEK SİLAH, ÜÇÜNCÜ KAYIP BEŞ YIL","k":"Üçüncü kez silahı çalınan veya silahını üçüncü kez kaybedenlerin silah vesikası geri alınır ve bu kişilere fiil tarihinden itibaren beş yıl geçmedikçe silah bulundurma ve taşıma izni verilmez.","x":[]},{"m":"10","g":"tutanak karşılığı Milli Savunma","c":"zoralımına karar verilen, ele geçirilen silah ve mermiler","n":"öncelik MSB, JGK, EGM, MİT, Gümrük Muhafaza; MKE aracılığıyla satış","k":"Mahkemelerce zoralımına karar verilen veya güvenlik kuvvetlerince herhangi bir şekilde ele geçirilen ateşli silahlarla mermiler ve bıçaklar bir tutanak karşılığı Milli Savunma Bakanlığı emrine verilir.","x":[]},{"m":"10","g":"bedellerinin yarısı","c":"polisler zati tabancayı yarı bedelle; öncelik hakkı","n":"","k":"Emniyet Genel Müdürlüğünce zati silah edinmelerine izin verilen polisler, bu silahlardan, tabanca niteliğinde olanlarını, takdir olunan bedellerinin yarısı bir bedelle ve bir adet olarak satın almada, öncelik hakkına sahiptirler.","x":[]},{"m":"11","g":"üstte taşımaya cevaz vermez","c":"antika silah izni; yalnız bulundurma ve nakil","n":"hatıra ve antika silaha bulundurma izni zorunlu","k":"Antika olan ateşli silahlarla bıçaklar için verilen izin bunların yalnız sahibine bırakılmasına veya nakline müsaadeyi tazammun edip üstte taşımaya cevaz vermez.","x":[]},{"m":"11","g":"kılıç, meç ve benzeri","c":"görev nedeniyle verilen; izin belgesi aranmaz","n":"","k":"Ancak, görevleri nedeniyle Devletçe verilen veya kendilerince bu amaçla temin edilen ve bu görevleri sona erdikten sonra meskenlerinde kalan veya kanuni yakınlarına intikal eden kılıç, meç ve benzeri aletler için izin belgesi aranmaz.","x":[]},{"m":"11","g":"izin vesikalarıyla birlikte satışı serbesttir","c":"antika silah ve bıçaklar","n":"","k":"Antika olan ateşli silahlarla bıçakların izin vesikalarıyla birlikte satışı serbesttir.","x":[]},{"m":"11","g":"artık imal edilmeyen","c":"antika silah tanımı","n":"hatıra silah: devlet başkanı/hükümet/genelkurmay hediyesi, İstiklal Savaşı silahları","k":"Antika silah deyimi; eskiden kalma, değerli belli bir özelliği olan, benzerlerine az rastlanan ve artık imal edilmeyen ateşli, ateşsiz silah ve bıçakları ifade eder.","x":[]},{"m":"12","g":"ülkeye sokar veya sokmaya kalkışır","c":"silah/mermi; beş yıldan oniki yıla + beşyüz–beşbin gün APC","n":"imal, nakil, satış, bu amaçla bulundurma da","k":"Her kim bu Kanunun kapsamına giren ateşli silahları, bunlara ait mermileri veya bunlara ait namlu, sürgü, gövde, çerçeve, silindir, mekanizma başı, çıkarıcı, tırnak, ateşleme iğnesinden oluşan ana veya balistik önemi haiz parçaları ülkeye sokar veya sokmaya kalkışır veya bunların ülkeye sokulmasına aracılık eder veya bunları 29/6/2004 tarihli ve 5201 sayılı Harp Araç ve Gereçleri ile Silâh, Mühimmat ve Patlayıcı Madde Üreten Sanayi Kuruluşlarının Denetimi Hakkında Kanun hükümleri dışında ülkede yapar veya bu suretle ülkeye sokulmuş ve ülkede yapılmış olan ateşli silahları veya mermileri ya da namlu, sürgü, gövde, çerçeve, silindir, mekanizma başı, çıkarıcı, tırnak, ateşleme iğnesinden oluşan ana veya balistik önemi haiz parçaları bir yerden diğer bir yere taşır veya yollar veya taşımaya bilerek aracılık eder, satar veya satmaya aracılık ederse veya bu amaçla bulundurursa beş yıldan oniki yıla kadar hapis ve beşyüz günden beşbin güne kadar adlî para cezasıyla cezalandırılır.","x":[]},{"m":"12","g":"daha çok kişinin birlikte","c":"silahta sekiz yıldan onbeş yıla + bin–onbin gün","n":"örgüt faaliyetinde bir kat artırım", anun hükümlerine tabi silah vasfına dönüştürülen silahları satın alan veya taşıyanlar veya bulunduranlar hakkında iki yıldan dört yıla kadar hapis ve yüz günden beşyüz güne kadar adlî para cezasına hükmolunur.","x":[]},{"m":"13","g":"ev veya işyerinde bulundurulması","c":"bir adet silah + mutat mermi: bir yıldan üç yıla","n":"","k":"Bu Kanunun 12 nci maddesinin dördüncü fıkrasında sayılanlar dışındaki ateşli silahın bir adet olması ve mutat sayıdaki mermilerinin veya namlu, sürgü, gövde, çerçeve, silindir, mekanizma başı, çıkarıcı, tırnak, ateşleme iğnesinden oluşan ana veya balistik önemi haiz parçaların ev veya işyerinde bulundurulması halinde verilecek ceza bir yıldan üç yıla kadar hapis ve yüz günden beşyüz güne kadar adlî para cezasıdır.","x":[]},{"m":"13","g":"takdir edilmemesi durumunda","c":"pek az mermi: altı aya kadar hapis + otuz–beşyüz gün","n":"","k":"takdir edilmemesi durumunda hükmolunacak ceza altı aya kadar hapis ve otuz günden beşyüz güne kadar adlî para cezasıdır.","x":[]},{"m":"13","g":"Nakil izin belgesi almaksızın","c":"onbin–yirmibeşbin TL idari para cezası; mülki idare amiri","n":"ruhsatlandırma yükümlülüğüne aykırılıkta da aynı","k":"Nakil izin belgesi almaksızın, bulundurma izni verilen silahını mesken veya işyeri değişikliği nedeniyle nakledenler hakkında onbin Türk Lirasından yirmibeşbin Türk Lirasına kadar idari para cezasına hükmolunur.","x":[]},{"m":"14","g":"ikiyüz günden az olmamak","c":"yasak bıçak imal/ithal/nakil; iki yıldan beş yıla hapis","n":"azlıkta yarıya kadar indirim","k":"Her kim, bu Kanun hükümlerine aykırı olarak 4 üncü maddede yazılı olan bıçak veya başkaca aletler yahut benzerlerini ülkeye sokar, sokmaya kalkışır veya bunların ülkeye sokulmasına aracılık eder veya bunları ülkede yapar veya bir yerden diğer bir yere taşır veya yollar veya taşımaya aracılık ederse iki yıldan beş yıla kadar hapis ve ikiyüz günden az olmamak üzere adlî para cezası ile cezalandırılır.","x":[]},{"m":"14","g":"teşekkül kuranlar","c":"bıçak su {"m":"4","g":"özel nitelikteki benzeri aletlerin","c":"yapımı yasaktır; kama, hançer, muşta, topuz, boğma teli","n":"ortak ölçüt: salt saldırı ve savunmada kullanılmak üzere özel nitelik","k":"Ülke içinde kama, hançer, saldırma, şişli baston, sustalı çakı, pala,kılıç, kasatura, süngü, sivri uçlu ve oluklu bıçaklar, topuz, topuzlu kamçı, boğma teli veya zinciri, muşta ile salt saldırı ve savunmada kullanılmak üzere özel nitelikteki benzeri aletlerin yapımı yasaktır.","x":[]},{"m":"4","g":"bir sanat veya mesleğin icrası","c":"yapımına İçişleri Bakanlığı yönetmeliğiyle izin verilir","n":"","k":"Bunlardan bir sanat veya mesleğin icrası için kullanılması zorunlu bulunanların yapımına İçişleri Bakanlığınca yapılacak bir yönetmelikte belirlenen kurallara göre izin verilir.","x":[["5","izinli meslek bıçakları satış-taşıma-bulundurma yasağının dışındadır"]]},{"m":"13","g":"ruhsat yenileme işlemlerinde","c":"yükümlülüğe aykırılık: onbin–yirmibeşbin Türk Lirası idari para cezası","n":"vefat, sağlık, mahkûmiyet, müsadere, satın alma, devir sebebiyle ruhsatlandırmada","k":"Bu madde kapsamındaki bulundurma ve taşıma fiilinin; vefat, sağlık durumu, mahkûmiyet, müsadere, satın alma veya devir nedeniyle yapılan ruhsatlandırma ya da ruhsat yenileme işlemlerinde bu Kanunda düzenlenen yükümlülüklere aykırı davranılarak işlenmesi halinde onbin Türk Lirasından yirmibeşbin Türk Lirasına kadar idari para cezasına hükmolunur.","x":[]},{"m":"13","g":"idari para cezası vermeye","c":"mülki idare amiri yetkilidir (ruhsatsız silah idari cezaları)","n":"","k":"Bu madde hükümlerine göre idari para cezası vermeye mülki idare amiri yetkilidir.","x":[["6","ruhsat yenilememe cezasında mülki amir yetkili; üçbin lira"]]},{"m":"13","g":"bir adet olması","c":"tek silah + mutat mermi evde: bir yıldan üç yıla","n":"yüz günden beşyüz güne adlî para da; yasak bıçak bulunduran altı aydan bir yıla","k":"Bu Kanunun 12 nci maddesinin dördüncü fıkrasında sayılanlar dışındaki ateşli silahın bir adet olması ve mutat const esc = s => (s||'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $ = id => document.getElementById(id);
const toplam = VERI.reduce((a,k)=>a+k.satirlar.length,0);
$('sayac').textContent = `${VERI.length} mevzuat · ${toplam} kelime · kanun kanun büyüyor`;
for (const k of VERI){ const o=document.createElement('option'); o.value=k.id; o.textContent=k.ad; $('kanun').appendChild(o); }
const mEt = m => /^\d/.test(m) ? 'm.'+m : m;
function isaretle(kanit, kel){
  const i = kk(kanit).indexOf(kk(kel));
  if (i<0) return esc(kanit);
  return esc(kanit.slice(0,i)) + '<b>' + esc(kanit.slice(i,i+kel.length)) + '</b>' + esc(kanit.slice(i+kel.length));
}
function satir(s){
  const kar = s.x.length ? `<ul>${s.x.map(([m,f])=>`<li>${mEt(m)}: ${esc(f)}</li>`).join('')}</ul>` : '';
  return `<div class="satir" tabindex="0" role="button" aria-expanded="false">
    <div class="kel"><mark>${esc(s.g)}</mark><small>${mEt(s.m)}</small></div>
    <div class="cev">${esc(s.c)}${s.n?`<small>${esc(s.n)}</small>`:''}</div>
    <div class="detay"><div class="kanit">“${isaretle(s.k,s.g)}”</div>${kar}</div>
  </div>`;
}
function ciz(){
  const q = kk($('ara').value.trim()), kid = $('kanun').value;
  let html='', n=0, sonGrup=null;
  for (const k of VERI){
    if (kid && String(k.id)!==kid) continue;
    const ss = k.satirlar.filter(s => !q || kk(s.g+' '+s.c+' '+s.n+' '+s.k+' m.'+s.m).includes(q));
    if (!ss.length) continue;
    n += ss.length;
    html += `<section class="kanun"><h2>${esc(k.ad)}</h2><div class="alt">${GRUP[k.grup]||esc(k.grup)} · ${ss.length} kelime</div><div class="tablo">${ss.map(satir).join('')}</div></section>`;
  }
  $('liste').innerHTML = (html || '<p class="bos">Bu aramaya uyan kelime yok.</p>')
    + '<p class="not">Ezber modunda cevaplar bulanık görünür; önce kendin hatırla, sonra satıra dokunup aç. Liste kanun kanun eklenir; önce müşterek mevzuat.</p>';
}
$('ara').addEventListener('input', ciz);
$('kanun').addEventListener('change', ()=>{ ciz(); window.scrollTo({top:0}); });
$('ezber').addEventListener('change', e=>{ document.body.classList.toggle('ezber', e.target.checked); try{localStorage.setItem('ezber', e.target.checked?'1':'0')}catch(_){} });
function ac(el){ el.classList.toggle('acik'); el.setAttribute('aria-expanded', el.classList.contains('acik')); }
$('liste').addEventListener('click', e=>{ const s=e.target.closest('.satir'); if (s) ac(s); });
$('liste').addEventListener('keydown', e=>{ if ((e.key==='Enter'||e.key===' ') && e.target.classList.contains('satir')){ e.preventDefault(); ac(e.target); } });
try{ if(localStorage.getItem('ezber')==='1'){ $('ezber').checked=true; document.body.classList.add('ezber'); } }catch(_){}
ciz();
</script>
