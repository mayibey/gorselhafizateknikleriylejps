nci fıkranın (a) ve (ç) bentlerinde yer alan tedbirler, ilgili kolluk amirlerince de alınabilir. Kolluk amiri evrakı en geç kararın alındığı tarihi takip eden ilk işgünü içinde mülkî amirin onayına sunar. Mülkî amir tarafından kırksekiz saat içinde onaylanmayan tedbirler kendiliğinden kalkar.","x":[["5","önleyici tedbirde hâkim onayı yirmidört saat"]]},{"m":"4","g":"İşyerinin değiştirilmesi","c":"hâkimin koruyucu tedbiri","n":"ayrı yerleşim yeri de hâkim","k":"(1) Bu Kanun kapsamında korunan kişilerle ilgili olarak aşağıdaki koruyucu tedbirlerden birine, birkaçına veya uygun görülecek benzer tedbirlere hâkim tarafından karar verilebilir: a) İşyerinin değiştirilmesi. b) Kişinin evli olması hâlinde müşterek yerleşim yerinden ayrı yerleşim yeri belirlenmesi.","x":[["10","işyeri değişikliği kararını kişinin tabi olduğu mevzuata göre yetkili merci uygular"]]},{"m":"4","g":"aile konutu şerhi","c":"hâkim; TMK şartları ve korunan kişinin talebi","n":"","k":"c) 22/11/2001 tarihli ve 4721 sayılı Türk Medenî Kanunundaki şartların varlığı hâlinde ve korunan kişinin talebi üzerine tapu kütüğüne aile konutu şerhi konulması.","x":[]},{"m":"4","g":"Tanık Koruma Kanunu","c":"hâkim; kimlik değişikliği, aydınlatılmış rıza","n":"diğer tedbirler yetersizse","k":"ç) Korunan kişi bakımından hayatî tehlikenin bulunması ve bu tehlikenin önlenmesi için diğer tedbirlerin yeterli olmayacağının anlaşılması hâlinde ve ilgilinin aydınlatılmış rızasına dayalı olarak 27/12/2007 tarihli ve 5726 sayılı Tanık Koruma Kanunu hükümlerine göre kimlik ve ilgili diğer bilgi ve belgelerinin değiştirilmesi.","x":[]},{"m":"5","g":"derhâl uzaklaştırılması","c":"hâkimin önleyici tedbiri; konut korunan kişiye tahsis","n":"EVİ TERK EDEN MAĞDUR DEĞİL, ŞİDDET UYGULAYAN","k":"b) Müşterek konuttan veya bulunduğu yerden derhâl uzaklaştırılması ve müşterek konutun korunan kişiye tahsis edilmesi.","x":[]},{"m":"5","g":"zimmetinde bulunan silahı","c":"kamu görevlisi de kurumuna teslim eder (önleyici tedbir)","n":"ruhsatlı silahlar kolluğa teslim","k":"ğ) Silah taşıması zorunlu olan bir kamu görevi ifa etse bile bu görevi nedeniyle zimmetinde bulunan silahı kurumuna teslim etmesi.","x":[]},{"m":"5","g":"yirmidört saat içinde onaylanmayan","c":"kolluğun aldığı önleyici tedbir kalkar; hâkim onayı","n":"","k":"(2) Gecikmesinde sakınca bulunan hâllerde birinci fıkranın (a), (b), (c) ve (d) bentlerinde yer alan tedbirler, ilgili kolluk amirlerince de alınabilir. Kolluk amiri evrakı en geç kararın alındığı tarihi takip eden ilk işgünü içinde hâkimin onayına sunar. Hâkim tarafından yirmidört saat içinde onaylanmayan tedbirler kendiliğinden kalkar.","x":[["3","koruyucu tedbirde mülkî amir onayı kırksekiz saat"]]},{"m":"5","g":"talep edilmese dahi tedbir nafakasına","c":"hâkim hükmedebilir; şiddet uygulayan geçimi sağlıyorsa","n":"TMK nafakası yoksa","k":"(4) Şiddet uygulayan, aynı zamanda ailenin geçimini sağlayan yahut katkıda bulunan kişi ise 4721 sayılı Kanun hükümlerine göre nafakaya hükmedilmemiş olması kaydıyla hâkim, şiddet mağdurunun yaşam düzeyini göz önünde bulundurarak talep edilmese dahi tedbir nafakasına hükmedebilir.","x":[]},{"m":"7","g":"herkes bu durumu","c":"ihbar edebilir; kamu görevlisi gecikmeksizin işlem yapar","n":"","k":"(1) Şiddet veya şiddet uygulanma tehlikesinin varlığı hâlinde herkes bu durumu resmi makam veya mercilere ihbar edebilir.","x":[]},{"m":"8","g":"en çok altı ay için","c":"tedbir kararı süresi; uzatılabilir, değiştirilebilir","n":"talep: ilgili, Bakanlık, kolluk, Cumhuriyet savcısı","k":"(2) Tedbir kararı ilk defasında en çok altı ay için verilebilir.","x":[]},{"m":"8","g":"delil veya belge aranmaz","c":"koruyucu tedbir kararı için","n":"önleyici tedbir geciktirilmeksizin verilir","k":"(3) Koruyucu tedbir kararı verilebilmesi için, şiddetin uygulandığı hususunda delil veya belge aranmaz.","x":[]},{"m":"8","g":"sadece korunan kişiye tebliğ","c":"tedbir talebinin reddi kararı","n":"tedbir kararı iki tarafa da","k":"Tedbir talebinin reddine ilişkin karar ise sadece korunan kişiye tebliğ edilir.","x":[]},{"m":"8","g":"zorlama hapsinin uygulanacağı ihtarı","c":"tebliğ ve tefhimde yapılır","n":"","k":"(5) Tedbir kararının tefhim ve tebliğ işlemlerinde, tedbir kararına aykırılık hâlinde şiddet uygulayan hakkında zorlama hapsinin uygulanacağı ihtarı yapılır.","x":[]},{"m":"9","g":"aile mahkemesine itiraz edilebilir","c":"tedbir kararına; tefhim/tebliğden iki hafta","n":"","k":"(1) Bu Kanun hükümlerine göre verilen kararlara karşı tefhim veya tebliğ tarihinden itibaren iki hafta içinde ilgililer tarafından aile mahkemesine itiraz edilebilir.","x":[]},{"m":"9","g":"İtiraz mercii kararını bir hafta","c":"verir; itiraz üzerine karar kesin","n":"İTİRAZ İKİ HAFTA, KARAR BİR HAFTA","k":"(3) İtiraz mercii kararını bir hafta içinde verir. İtiraz üzerine verilen kararlar kesindir.","x":[]},{"m":"10","g":"engel teşkil etmez","c":"tedbir kararının tebliğ edilmemesi uygulamayı engellemez","n":"","k":"(5) Tedbir kararının ilgililere tefhim veya tebliğ edilmemesi, kararın uygulanmasına engel teşkil etmez.","x":[]},{"m":"10","g":"kolluk birimi görevli ve yetkilidir","c":"tedbirin uygulanması; yerleşim yeri ya da tedbirin uygulanacağı yer","n":"","k":"(3) Korunan kişinin geçici koruma altına alınmasına ilişkin koruyucu tedbir kararı ile şiddet uygulayan hakkında verilen önleyici tedbir kararlarının yerine getirilmesinden, hakkında koruyucu veya önleyici tedbir kararı verilen kişilerin yerleşim yeri veya bulunduğu ya da tedbirin uygulanacağı yer kolluk birimi görevli ve yetkilidir.","x":[]},{"m":"12","g":"ses ve görüntüleri dinlenemez","c":"teknik takipte yasak; hâkim kararıyla teknik araç kullanılabilir","n":"","k":"(1) Bu Kanun hükümlerine göre verilen tedbir kararlarının uygulanmasında hâkim kararı ile teknik araç ve yöntemler kullanılabilir. Ancak, bu suretle, kişilerin ses ve görüntüleri dinlenemez, izlenemez ve kayda alınamaz.","x":[]},{"m":"13","g":"fiili bir suç oluştursa bile","c":"zorlama hapsi üç günden on güne; hâkim kararıyla","n":"tedbire aykırılık","k":"(1) Bu Kanun hükümlerine göre hakkında tedbir kararı verilen şiddet uygulayan, bu kararın gereklerine aykırı hareket etmesi hâlinde, fiili bir suç oluştursa bile ihlal edilen tedbirin niteliğine ve aykırılığın ağırlığına göre hâkim kararıyla üç günden on güne kadar zorlama hapsine tabi tutulur.","x":[]},{"m":"13","g":"onbeş günden otuz güne","c":"tekrarında zorlama hapsi; toplam altı ayı geçemez","n":"İLK 3-10 GÜN, TEKRAR 15-30, TOPLAM 6 AY","k":"(2) Tedbir kararının gereklerine aykırılığın her tekrarında, ihlal edilen tedbirin niteliğine ve aykırılığın ağırlığına göre zorlama hapsinin süresi onbeş günden otuz güne kadardır. Ancak zorlama hapsinin toplam süresi altı ayı geçemez.","x":[]},{"m":"13","g":"Zorlama hapsine ilişkin kararlar","c":"Cumhuriyet başsavcılığınca yerine getirilir","n":"","k":"(3) Zorlama hapsine ilişkin kararlar, Cumhuriyet başsavcılığınca yerine getirilir.","x":[]},{"m":"3","g":"ilk işgünü içinde mülkî amirin","c":"kolluk amirinin koruyucu tedbir evrakı; kırksekiz saatte onaylanmazsa kalkar","n":"","k":"Kolluk amiri evrakı en geç kararın alındığı tarihi takip eden ilk işgünü içinde mülkî amirin onayına sunar. Mülkî amir tarafından kırksekiz saat içinde onaylanmayan tedbirler kendiliğinden kalkar.","x":[]},{"m":"8","g":"Cumhuriyet savcısının başvurusu üzerine","c":"tedbir kararı: ilgilinin talebi, Bakanlık, kolluk ya da savcı başvurusuyla","n":"muhtar, sivil toplum örgütü YOK","k":"(1) Tedbir kararı, ilgilinin talebi, Bakanlık veya kolluk görevlileri ya da Cumhuriyet savcısının başvurusu üzerine verilir. Tedbir kararları en çabuk ve en kolay ulaşılabilecek yer hâkiminden, mülkî amirden ya da kolluk biriminden talep edilebilir.","x":[]},{"m":"8","g":"en çabuk ve en kolay","c":"ulaşılabilecek yer hâkimi, mülkî amir ya da kolluk biriminden talep","n":"","k":"(1) Tedbir kararı, ilgilinin talebi, Bakanlık veya kolluk görevlileri ya da Cumhuriyet savcısının başvurusu üzerine verilir. Tedbir kararları en çabuk ve en kolay ulaşılabilecek yer hâkiminden, mülkî amirden ya da kolluk biriminden talep edilebilir.","x":[]},{"m":"8","g":"Tedbir kararı ilk defasında","c":"en çok altı ay; sonra süre/şekil değiştirilebilir, kaldırılabilir, devam eder","n":"","k":"(2) Tedbir kararı ilk defasında en çok altı ay için verilebilir. Ancak şiddet veya şiddet uygulanma tehlikesinin devam edeceğinin anlaşıldığı hâllerde, resen, korunan kişinin ya da Bakanlık veya kolluk görevlilerinin talebi üzerine tedbirlerin süresinin veya şeklinin değiştirilmesine, bu tedbirlerin kaldırılmasına veya aynen devam etmesine karar verilebilir.","x":[]},{"m":"8","g":"geciktirilmeksizin verilir","c":"önleyici tedbir kararı; koruyucu tedbirde delil aranmaz","n":"","k":"(3) Koruyucu tedbir kararı verilebilmesi için, şiddetin uygulandığı hususunda delil veya belge aranmaz. Önleyici tedbir kararı, geciktirilmeksizin verilir.","x":[]},{"m":"8","g":"tüm resmi kayıtlarda gizli tutulur","c":"kimlik, adres ve koruma için önemli bilgiler; tebligata ayrı adres","n":"ifşa edene TCK; şiddet uygulayanın adli sicili gizlilik kapsamında YOK","k":"(6) Gerekli bulunması hâlinde, tedbir kararı ile birlikte talep üzerine veya resen, korunan kişi ve diğer aile bireylerinin kimlik bilgileri veya kimliğini ortaya çıkarabilecek bilgileri ve adresleri ile korumanın etkinliği bakımından önem taşıyan diğer bilgileri, tüm resmi kayıtlarda gizli tutulur. Yapılacak tebligatlara ilişkin ayrı bir adres tespit edilir.","x":[]},{"m":"1","g":"tek taraflı ısrarlı takip","c":"korunanlar: kadınlar, çocuklar, aile bireyleri, ısrarlı takip mağdurları","n":"şiddete uğrama tehlikesi bulunanlar da","k":"(1) Bu Kanunun amacı; şiddete uğrayan veya şiddete uğrama tehlikesi bulunan kadınların, çocukların, aile bireylerinin ve tek taraflı ısrarlı takip mağduru olan kişilerin korunması ve bu kişilere yönelik şiddetin önlenmesi amacıyla alınacak tedbirlere ilişkin usul ve esasları düzenlemektir.","x":[]},{"m":"1","g":"ayrımcılık olarak yorumlanamaz","c":"kadınları cinsiyete dayalı şiddetten koruyan özel tedbirler","n":"","k":"ç) Bu Kanun kapsamında kadınlara yönelik cinsiyete dayalı şiddeti önleyen ve kadınları cinsiyete dayalı şiddetten koruyan özel tedbirler ayrımcılık olarak yorumlanamaz.","x":[]},{"m":"1","g":"kadın erkek eşitliğine duyarlı","c":"temel ilke: insan haklarına dayalı, sosyal devlet, adil, etkili, süratli","n":"","k":"b) Şiddet mağdurlarına verilecek destek ve hizmetlerin sunulmasında temel insan haklarına dayalı, kadın erkek eşitliğine duyarlı, sosyal devlet ilkesine uygun, adil, etkili ve süratli bir usul izlenir.","x":[]},{"m":"1","g":"Avrupa Konseyi Sözleşmesi","c":"Anayasa ve taraf olunan uluslararası sözleşmeler esas alınır","n":"yalnız Anayasa değil","k":"a) Türkiye Cumhuriyeti Anayasası ile Türkiye’nin taraf olduğu uluslararası sözleşmeler, özellikle Kadınlara Yönelik Şiddet ve Aile İçi Şiddetin Önlenmesi ve Bunlarla Mücadeleye İlişkin Avrupa Konseyi Sözleşmesi ve yürürlükteki diğer kanuni düzenlemeler esas alınır.","x":[]},{"m":"2","g":"Aile ve Sosyal Politikalar Bakanlığını","c":"Bakanlık tanımı; Aile ve Sosyal Politikalar","n":"","k":"a) Bakanlık: Aile ve Sosyal Politikalar Bakanlığını,","x":[]},{"m":"2","g":"özgürlüğün keyfî engellenmesini","c":"şiddet tanımı: fiziksel, cinsel, psikolojik, sözlü, ekonomik; tehdit-baskı dahil","n":"dinî şiddet, mesleki başarı azalması tanımda YOK","k":"d) Şiddet: Kişinin, fiziksel, cinsel, psikolojik veya ekonomik açıdan zarar görmesiyle veya acı çekmesiyle sonuçlanan veya sonuçlanması muhtemel hareketleri, buna yönelik tehdit ve baskıyı ya da özgürlüğün keyfî engellenmesini de içeren, toplumsal, kamusal veya özel alanda meydana gelen fiziksel, cinsel, psikolojik, sözlü veya ekonomik her türlü tutum ve davranışı,","x":[]},{"m":"2","g":"kolluk görevlileri ve mülkî amirler","c":"tedbir kararı tanımı: hâkim de verir; istem üzerine veya resen","n":"","k":"ğ) Tedbir kararı: Bu Kanun kapsamında, şiddet mağdurları ve şiddet uygulayanlar hakkında hâkim, kolluk görevlileri ve mülkî amirler tarafından, istem üzerine veya resen verilecek tedbir kararlarını,","x":[]},{"m":"2","g":"kalma tehlikesi bulunan kişiyi","c":"şiddet mağduru tanımı; dolaylı maruz kalan ve etkilenen de","n":"tanımlar: Bakanlık, ev içi şiddet, hâkim, kadına yönelik şiddet, şiddet, mağdur, ŞÖNİM, uygulayan, tedbir kararı; Cumhuriyet başsavcılığı YOK","k":"e) Şiddet mağduru: Bu Kanunda şiddet olarak tanımlanan tutum ve davranışlara doğrudan ya da dolaylı olarak maruz kalan veya kalma tehlikesi bulunan kişiyi ve şiddetten etkilenen veya etkilenme tehlikesi bulunan kişileri,","x":[]},{"m":"5","g":"önleyici tedbirlerden birine","c":"hâkim karar verir (şiddet uygulayana); kolluk amiri gecikmede a,b,c,d","n":"mülkî amir önleyici tedbir VEREMEZ","k":"(1) Şiddet uygulayanlarla ilgili olarak aşağıdaki önleyici tedbirlerden birine, birkaçına veya uygun görülecek benzer tedbirlere hâkim tarafından karar verilebilir:","x":[]},{"m":"5","g":"söz ve davranışlarda bulunmaması","c":"önleyici tedbir (a): şiddet tehdidi, hakaret, aşağılama, küçük düşürme","n":"","k":"a) Şiddet mağduruna yönelik olarak şiddet tehdidi, hakaret, aşağılama veya küçük düşürmeyi içeren söz ve davranışlarda bulunmaması.","x":[]},{"m":"5","g":"konuta, okula ve işyerine yaklaşmaması","c":"hâkimin önleyici tedbiri; korunan kişilere ve bulundukları yerlere","n":"yakınlarına, tanıklarına, çocuklarına yaklaşmama da (d)","k":"c) Korunan kişilere, bu kişilerin bulundukları konuta, okula ve işyerine yaklaşmaması.","x":[]},{"m":"5","g":"alkol ya da uyuşturucu","c":"korunan kişilerin bulunduğu yerlerde kullanmama; bağımlıysa tedavi (hastane dahil)","n":"","k":"h) Korunan kişilerin bulundukları yerlerde alkol ya da uyuşturucu veya uyarıcı madde kullanmaması ya da bu maddelerin etkisinde iken korunan kişilere ve bunların bulundukları yerlere yaklaşmaması, bağımlılığının olması hâlinde, hastaneye yatmak dâhil, muayene ve tedavisinin sağlanması.","x":[]},{"m":"13","g":"üç günden on güne kadar","c":"ilk aykırılıkta zorlama hapsi; n":"","k":"(3) Verilen disiplin cezaları üst disiplin amirine, meslekten çıkarma cezası ve Devlet memurluğundan çıkarma cezası ayrıca Devlet Personel Başkanlığına bildirilir.","x":[]},{"m":"34","g":"uzun süreli durdurma cezası gibi","c":"657'deki kademe ilerlemesinin durdurulması","n":"boşlukta 657 disiplin hükümleri","k":"(2) 657 sayılı Kanundaki kademe ilerlemesinin durdurulması cezası, bu Kanundaki uzun süreli durdurma cezası gibi telakki edilir ve uygulanır.","x":[]},{"m":"8","g":"usul ve kurallara riayet etmeden","c":"kınama; usulsüz sözlü, yazılı veya elektronik müracaat/şikâyet","n":"","k":"(2) Kınama cezasını gerektiren fiiller şunlardır: a) Görev sırasında, mevzuat veya talimatlarla yasaklanan davranışlarda bulunmak. b) Mevzuatta belirlenmiş usul ve kurallara riayet etmeden sözlü, yazılı veya elektronik olarak müracaat veya şikâyette bulunmak.","x":[]},{"m":"4","g":"kasten veya taksirle oluşabilir","c":"aynı fiile birden fazla ceza verilemez; idari yaptırım engel değil","n":"","k":"(1) Disiplinsizlik kasten veya taksirle oluşabilir. (2) Aynı fiil nedeniyle bu Kanunda yazılı disiplin cezalarından birden fazlası verilemez. (3) Bir fiilin birden fazla disiplinsizlik teşkil etmesi halinde ağır olan disiplin cezası verilir. (4) Bir fiilin diğer kanunlar kapsamında idari yaptırıma bağlanmış olması, aynı fiile bu Kanun kapsamında disiplin cezası verilmesine engel teşkil etmez.","x":[]},{"m":"6","g":"ölçülü, adaletli ve hakkaniyetli","c":"takdir hakkı; mutlaka gerekçeli; işleniş, zaman-yer, zarar, kusur, geçmiş, pişmanlık","n":"","k":"(1) Bu Kanun ile disiplin cezası vermeye yetkilendirilen disiplin amirleri veya kurulları, disiplin cezası uygulanması ile ilgili takdir haklarını ölçülü, adaletli ve hakkaniyetli bir şekilde kullanırlar.\n(2) Takdir hakkı mutlaka gerekçeli olarak kullanılır. (3) Takdir hakkı kullanılırken; a) Disiplinsizliğin işleniş biçimi, b) Disiplinsizliğin işlendiği zaman ve yer, c) Disiplinsizliğin hizmete olumsuz etkisinin ağırlığı, ç) Meydana gelen zarar veya tehlikenin ağırlığı, d) Disiplinsizlik yapan personelin kast veya taksire dayalı kusurunun ağırlığı, e) Disiplinsizlik yapan personelin daha önceki disiplin durumu, f) Disiplinsizlik yapan personelin samimi ikrarı ve gösterdiği pişmanlık, gözönüne alınır.","x":[]},{"m":"7","g":"onbeş günlüğe kadar kesinti","c":"aylıktan kesme: zam-tazminat hariç brüt aylıktan; tam lira","n":"","k":"c) Aylıktan kesme cezası: Disiplin cezası verilen personelin, fiilin ağırlık derecesine göre zam ve tazminatlar hariç brüt aylığından onbeş günlüğe kadar kesinti yapılmasıdır. Ceza, aylığı tahakkuk ettiren birimce personelin aylığından kesilmek suretiyle yerine getirilir. Aylıktan kesme tam Türk Lirası üzerinden yapılır ve kuruşlar dikkate alınmaz.","x":[]},{"m":"7","g":"memurluktan çıkarılmasıdır","c":"ceza türleri: uyarma, kınama, aylıktan kesme, durdurma (kısa/uzun), meslekten/memurluktan çıkarma","n":"görevden uzaklaştırma ceza değil, tedbir","k":"f) Devlet memurluğundan çıkarma: Personelin bir daha Devlet memurluğuna atanmamak üzere memurluktan çıkarılmasıdır.","x":[]},{"m":"7","g":"bir derece hafif olanı uygulanabilir","c":"iyi/çok iyi değerlendirme puanlı, geçmişi olumlu personele","n":"","k":"(2) Kurumda geçmiş hizmetleri sırasında çalışmaları olumlu bulunan ve iyi veya çok iyi derecede değerlendirme puanı alan personel için verilecek cezalarda bir derece hafif olanı uygulanabilir.","x":[]},{"m":"7","g":"özlük dosyasından silinmesini isteyebilir","c":"uyarma-kınama beş yıl, diğerleri on yıl özlük dosyasından silinme istenebilir","n":"atamaya yetkili amire başvuru","k":"(5) Devlet memurluğundan çıkarma ya da meslekten çıkarma cezalarından başka bir disiplin cezasına çarptırılmış olanlar, uyarma ve kınama cezalarının uygulanmasından başlayarak beş yıl, diğer cezaların uygulanmasından başlayarak on yıl geçtikten sonra, atamaya yetkili amire başvurarak verilmiş olan disiplin cezalarının özlük dosyasından silinmesini isteyebilir. İlgilinin bu süreler içerisindeki davranışları, bu isteğini haklı kılacak nitelikte görülürse söz konusu ceza özlük dosyasından silinir.","x":[]},{"m":"10","g":"emrinin yapılmaması fiilinin neticesinde","c":"zarar/gecikme/durma doğmuşsa meslekten çıkarma uygulanabilir (ağırlaştırıcı)","n":"","k":"(1) Amirin emrinin yapılmaması fiilinin neticesinde, Devlet ya da kişiler zarara uğratılmış ya da hizmetin gecikmesine ya da durmasına neden olunmuşsa doğan zararın derecesine ya da durumun ağırlığına göre meslekten çıkarma cezası uygulanabilir.","x":[]},{"m":"10","g":"Denetleme ve soruşturma görevlerini savsaklamak","c":"zarar/gecikme doğurmuşsa dört ay kısa süreli durdurma","n":"","k":"(12) Denetleme ve soruşturma görevlerini savsaklamak fiili hizmetin gecikmesine, durmasına, aksamasına neden olmuş veya Devlet ya da kişileri zarara uğratmışsa durumun ağırlığına yahut zararın derecesine göre, dört ay kısa süreli durdurma cezası uygulanabilir.","x":[]},{"m":"10","g":"yurtdışı liman ziyaretlerinde","c":"sahil güvenlik personelinin fiilinde ceza bir kademe ağırlaşabilir (karasuları dışında)","n":"","k":"(13) Bu Kanunda belirlenmiş ve bir disiplin cezasıyla yaptırıma bağlanmış fiillerin sahil güvenlik personelince yurtdışı liman ziyaretlerinde veya Türk karasuları dışında işlenmesi halinde, uyarma ve kınama cezası gerektiren fiillerde meydana gelen zarar ve tehlikenin ağırlığı da dikkate alınarak aylıktan kesme, kısa veya uzun süreli durdurma cezası; aylıktan kesme, kısa veya uzun süreli durdurma cezası gerektiren fiillerde ise yine meydana gelen zarar veya tehlikenin ağırlığı dikkate alınarak meslekten çıkarma cezası verilebilir.","x":[]},{"m":"12","g":"iki farklı disiplin amirinden","c":"alışkanlık: bir yılda oniki, beş yılda yirmibeş ceza; meslekten çıkarma","n":"puan eşiği: yirmi / kırk","k":"a) En son alınan disiplin cezasının kesinleştiği tarihten geriye doğru son bir yıl içinde yirmi disiplin cezası puanı veya en az iki farklı disiplin amirinden toplam oniki defa veya daha fazla disiplin cezası almak. b) En son alınan disiplin cezasının kesinleştiği tarihten geriye doğru son beş yıl içinde kırk disiplin cezası puanı veya en az iki farklı disiplin amirinden toplam yirmibeş defa veya daha fazla disiplin cezası almak.","x":[]},{"m":"12","g":"en yüksek olanın puanı","c":"aynı disiplin dosyasında birden fazla ceza; değerlendirmeye esas","n":"","k":"(2) Aynı disiplin dosyası kapsamında birden fazla disiplin cezası verilmesi halinde en yüksek olanın puanı değerlendirmeye esas alınır.","x":[]},{"m":"12","g":"ekli (2) sayılı çizelgede","c":"JGK-SGK personelinin ceza puanı hesabı (EGM: (1) sayılı çizelge)","n":"uyarma 1 puan","k":"(3) Birinci fıkra kapsamında ceza puanlarının hesaplanması usulü Emniyet Genel Müdürlüğü personeli için ekli (1) sayılı çizelgede, Jandarma Genel Komutanlığı ve Sahil Güvenlik Komutanlığı personeli için ekli (2) sayılı çizelgede gösterilmiştir.","x":[]},{"m":"12","g":"sözleşmelerinin feshine ilişkin özel","c":"sözleşmeli personelin fesih hükümleri saklı","n":"","k":"(4) Sözleşmeli personelin sözleşmelerinin feshine ilişkin özel kanunlardaki hükümler saklıdır.","x":[]},{"m":"13","g":"rütbe veya kıdemce büyük olması","c":"disiplin amiri şartı; amir konumunda bulunmalı","n":"","k":"(1) Disiplin amirinin, disiplin cezası verilecek personelden makam, rütbe veya kıdemce büyük olması ve amir konumunda bulunması gerekir.","x":[]},{"m":"13","g":"en üst disiplin amiridir","c":"kaymakam ilçede, vali ilde; Bakan EGM-JGK-SGK ve valilere göre üst","n":"","k":"(3) Kaymakamlar ilçe, valiler il teşkilatındaki diğer disiplin amirlerine göre en üst disiplin amiridir. Valiler kaymakamlara, Bakan ise Emniyet Genel Müdürü, Jandarma Genel Komutanı ve Sahil Güvenlik Komutanı ile valilere göre bir üst disiplin amiridir.","x":[]},{"m":"13","g":"amirleri tarafından da kullanılabilir","c":"disiplin soruşturması yapma ve ceza verme yetkisi (üst disiplin amirleri)","n":"","k":"(5) Disiplin soruşturması yapma ve disiplin cezası verme görev ve yetkisi üst disiplin amirleri tarafından da kullanılabilir.","x":[]},{"m":"14","g":"kişinin üstü konumundaki bir","c":"soruşturmacı; müfettiş de; heyet üyesi ast olabilir (başkan hariç)","n":"","k":"(2) Disiplin soruşturmacısı olarak hakkında disiplin soruşturması yapılacak kişinin üstü konumundaki bir veya birden fazla kişi ya da Bakanlık ve/veya ilgisine göre Emniyet Genel Müdürlüğü, Jandarma Genel Komutanlığı ya da Sahil Güvenlik Komutanlığı müfettişi görevlendirilebilir. Ancak gerek görülmesi halinde, heyet başkanı hariç olmak üzere hakkında disiplin soruşturması yapılacak kişinin astı konumunda heyet üyeleri görevlendirilebilir. Disiplin soruşturmacısı olarak mülki idare amirliği hizmetleri sınıfı ile ilgisine göre emniyet hizmetleri sınıfından olanlar ile Jandarma Genel Komutanlığı ve Sahil Güvenlik Komutanlığı personeli haricinde herhangi bir personel görevlendirilemez.","x":[]},{"m":"14","g":"bilirkişi görevlendirme, keşif yapma","c":"soruşturmacı yetkileri: bilgi-belge toplama, ifade alma, tanık dinleme, kriminal inceleme","n":"","k":"(3) Disiplin soruşturmacıları ve heyeti, kendilerini görevlendiren disiplin amiri adına disiplin soruşturmasıyla ilgili bilgi ve belgeleri toplama, ifade alma, tanık dinleme, bilirkişi görevlendirme, keşif yapma, hâkim veya savcı kararı gerektirmeyen durumlarda kriminal inceleme yaptırma da dahil olmak üzere her türlü inceleme yapma ve ilgili makamlarla yazışma yetkisini haizdir.","x":[]},{"m":"14","g":"kan ve kayın hısımları","c":"hısım personelin soruşturmasında soruşturmacı görevlendirilemez (boşanmış eş dahil)","n":"","k":"(4) Disiplin soruşturmacısı olarak görevlendirilebileceği belirtilenler, boşanmış olsalar dahi eşleri veya ikinci dereceye kadar kan ve kayın hısımları olan personel hakkında yürütülen soruşturmalarda görevlendirilemez.","x":[["15","disiplin amirinin hısımı: yetkiyi üst amir kullanır"]]},{"m":"15","g":"üst konumdaki disiplin amiri tarafından","c":"eş/ikinci derece hısım personel hakkında disiplin amirliği yetkisini o kullanır","n":"","k":"Bu hallerde, disiplin amirliği yetkisi, üst konumdaki disiplin amiri tarafından kullanılır.","x":[]},{"m":"15","g":"Disiplin amirliği yetkisi devredilemez","c":"vekâleten/ikinci görevle/geçici görevle yürütenler yetkiyi kullanabilir; devir yok","n":"","k":"(2) Disiplin amiri olarak tayin edilen unvanlara ait görevleri vekâleten, ikinci görevle, geçici görevle veya kanunlarda yazılı diğer hallerde yetkili olarak yürütenler de bu görevi yürüttükleri sürece disiplin amirlerine tanınan yetkileri kullanabilirler. (3) Disiplin amirleri boşanmış olsalar dahi eşleri veya ikinci dereceye kadar kan ve kayın hısımları olan personel hakkında, bu sıfatlarından doğan yetkilerini kullanamazlar. Bu hallerde, disiplin amirliği yetkisi, üst konumdaki disiplin amiri tarafından kullanılır. (4) Disiplin amirliği yetkisi devredilemez.","x":[]},{"m":"20","g":"İl jandarma disiplin kurulu","c":"il jandarma disiplin kurulu: yüzbaşı altı rütbeler; meslekten çıkarma veremez","n":"","k":"a) İl jandarma disiplin kurulu il jandarma, ilçe jandarma ve geçici bölge komutanlıklarındaki; 1) Yüzbaşı ve altı rütbelerdeki subay, astsubay, uzman jandarma ve diğer sınıflardaki memurlara meslekten çıkarma ve Devlet memurluğundan çıkarma cezası dışında kalan diğer disiplin cezalarını, 2) (Değişik:18/10/2018-7148/40 md.) Uzman erbaş, sözleşmeli erbaş ve sözleşmeli erlere Devlet memurluğundan çıkarma cezası dışında kalan disiplin cezalarını,","x":[["19","kurulların oluşumu maddesi"],["21","kararların kesinleşmesi: valinin onayı"]]},{"m":"20","g":"binbaşı ve yarbay rütbelerindeki","c":"JGK Yüksek Disiplin Kurulu meslekten çıkarma verir; albay: Bakanlık YDK","n":"","k":"d) Jandarma Genel Komutanlığı Yüksek Disiplin Kurulu; 1) Genel Komutanlık merkez teşkilatı, asayiş kolordu komutanlıkları, komando tugay komutanlıkları, komando alay komutanlıkları, Jandarma Komando Özel Asayiş ve Kurtarma Tugay Komutanlığı, eğitim tugay ve birlik komutanlıkları, il jandarma, ilçe jandarma ve geçici bölge komutanlıkları, eğitim ve öğretim kurumları kadrolarında bulunan binbaşı ve yarbay rütbelerindeki subaylara meslekten çıkarma cezasını,","x":[]},{"m":"27","g":"kurulun yetkisizliğine karar verebilir","c":"disiplin kurulu kararları: ceza; ceza/karar verilmesine yer olmadığı; yetkisizlik","n":"görevden uzaklaştırma kurul kararı değil","k":"(1) Disiplin kurulu, soruşturma sonucunda disiplin cezası verilmesine yer olmadığına, karar verilmesine yer olmadığına veya disiplin cezası verilmesine yahut kurulun yetkisizliğine karar verebilir.","x":[]},{"m":"29","g":"altı ay içinde","c":"meslekten çıkarmada soruşturmaya başlama zamanaşımı; diğer cezalarda bir ay (öğrenmeden)","n":"ceza verme: fiilden itibaren iki yıl","k":"b) Meslekten çıkarma cezası ve Devlet memurluğundan çıkarma cezasında altı ay içinde,\ndisiplin soruşturmasına başlanmadığı takdirde disiplin cezası verme yetkisi zamanaşımına uğrar.","x":[]},{"m":"29","g":"zincirleme suçlarda ise son suçun","c":"zamanaşımı başlangıcı; tamamlanmış: işlendiği tarih; kesintisiz: kesintinin gerçekleştiği","n":"","k":"(3) Zamanaşımı, tamamlanmış suçlarda suçun işlendiği, kesintisiz suçlarda kesintinin gerçekleştiği, zincirleme suçlarda ise son suçun işlendiği tarihten itibaren işlemeye başlar.","x":[]},{"m":"30","g":"on gün içinde itiraz edilebilir","c":"disiplin amiri cezasına; üst disiplin amirine yazılı; otuz günde karar","n":"","k":"(1) Disiplin amirleri tarafından verilen disiplin cezalarına karşı, cezanın tebliğ edilmesinden itibaren on gün içinde itiraz edilebilir. İtiraz, bir üst disiplin amirine yazılı olarak yapılır. Ancak vali, Emniyet Genel Müdürü, Jandarma Genel Komutanı veya Sahil Güvenlik Komutanının doğrudan verdikleri disiplin cezalarına karşı Bakanlık Yüksek Disiplin Kuruluna itiraz edilir. İtiraz üzerine Kurulun verdiği karar kesindir. Kaymakamın doğrudan verdiği disiplin cezalarına karşı ise valiye itiraz edilir. Süresi içinde itiraz edilmeyen cezalar kesinleşir. (2) İtiraz, yetkili merci tarafından otuz gün içinde karara bağlanır.","x":[]},{"m":"30","g":"Kaymakamın doğrudan verdiği","c":"disiplin cezasına valiye itiraz; süresinde itiraz edilmeyen kesinleşir","n":"","k":"Kaymakamın doğrudan verdiği disiplin cezalarına karşı ise valiye itiraz edilir. Süresi içinde itiraz edilmeyen cezalar kesinleşir.","x":[]},{"m":"30","g":"ancak idari yargı yoluna","c":"Bakan ve disiplin kurullarının cezalarına karşı (itiraz yok)","n":"","k":"(5) Bakan ile disiplin kurullarının verdiği disiplin cezalarına karşı ancak idari yargı yoluna başvurulabilir.","x":[]},{"m":"31","g":"yedi günden az olamaz","c":"savunma süresi; savunma alınmadan ceza verilemez; süresinde yapmayan vazgeçmiş sayılır","n":"","k":"Savunma için verilen süre yedi günden az olamaz. Süresi içinde savunmasını yapmayan personel, savunma hakkından vazgeçmiş sayılır.","x":[]},{"m":"31","g":"görevlendireceği kurul üyelerinden biri","c":"savunmayı disiplin amiri ya da kurul başkanı/üyesi ister","n":"","k":"(2) Disiplin amirince veya yetkili disiplin kurulu başkanı ya da görevlendireceği kurul üyelerinden biri tarafından ilgiliden savunma istenir.","x":[]},{"m":"31","g":"vekili vasıtasıyla savunma yapma","c":"meslekten/memurluktan çıkarma istenen personel; tanık dinletme, evrak inceleme de","n":"","k":"(4) Hakkında meslekten çıkarma cezası veya Devlet memurluğundan çıkarma cezası istenen personel, soruşturma evrakını incelemeye, tanık dinletmeye, disiplin kurulunda sözlü veya yazılı olarak kendisi veya vekili vasıtasıyla savunma yapma hakkına sahiptir.","x":[]},{"m":"32","g":"iptal davası açılabilir","c":"kesinleşen disiplin cezasına; süre tebliğden başlar (SG gemide: üsse dönüşle)","n":"","k":"(1) Kesinleşen disiplin cezalarına karşı iptal davası açılabilir. (2) Dava açma süresi, kesinleşen cezanın personele tebliğinden itibaren başlar. Ancak Sahil Güvenlik Komutanlığının seyir halindeki gemi ve botlarında verilen cezalarda dava açma süresi, geminin bağlı bulunduğu üsse veya limana dönmesiyle başlar.","x":[]},{"m":"8","g":"sorumluluğu üstlenmekten imtina","c":"kınama (tevdi edilen görevin gerektirdiği sorumluluk)","n":"","k":"(2) Kınama cezasını gerektiren fiiller şunlardır: a) Görev sırasında, mevzuat veya talimatlarla yasaklanan davranışlarda bulunmak. b) Mevzuatta belirlenmiş usul ve kurallara riayet etmeden sözlü, yazılı veya elektronik olarak müracaat veya şikâyette bulunmak. c) Nöbeti teslimden sonra görev yerine özürsüz olarak geç dönmek. ç) Bildirimleri süresi içerisinde yerine ulaştırmamak. d) Mevzuat veya talimatlarla taşınmasına veya bulundurulmasına izin verilmiş olanlar dışında, mesleğin ciddiyeti ile bağdaşmayacak biçimde yüzük, bilezik, kolye, madalyon, rozet ve benzeri şeyleri takmak. e) Görev sırasında veya dışında kendisi ile aynı rütbede çalışanlara veya mesai arkadaşlarına karşı saygısız davranmak. f) Mevzuat ve talimatlarla kendisine tevdi edilmiş görevlerin gerektirdiği sorumluluğu üstlenmekten imtina ettiğini gösterecek tavır ve davranışlarda bulunmak.","x":[]},{"m":"8","g":"dövme girişiminde bulunmak","c":"dört ay kısa süreli durdurma (ast, aynı rütbe, mesai arkadaşı)","n":"","k":"a) Dört ay kısa süreli durdurma cezasını gerektiren fiiller; 1) Amir ve memurlara görevle ilgili olarak yalan söylemek. 2) Denetim görevini yerine getirmemek. 3) İzinsiz ya da kurumca kabul edilebilir özrü olmaksızın kesintisiz olarak üç günden fazla ve beş güne kadar (beşinci gün dahil) göreve gelmemek. 4) Amirlerini, üstlerini, aynı rütbedeki arkadaşlarını, astlarını veya diğer mesai arkadaşlarını haksız yere şikâyet etmek. 5) Astlarını, aynı rütbedeki arkadaşlarını ve diğer mesai arkadaşlarını dövme girişiminde bulunmak.","x":[]},{"m":"8","g":"Toplu olarak sözlü veya yazılı","c":"şikâyette bulunmak: dört ay kısa süreli durdurma","n":"","k":"a) Dört ay kısa süreli durdurma cezasını gerektiren fiiller; 1) Amir ve memurlara görevle ilgili olarak yalan söylemek. 2) Denetim görevini yerine getirmemek. 3) İzinsiz ya da kurumca kabul edilebilir özrü olmaksızın kesintisiz olarak üç günden fazla ve beş güne kadar (beşinci gün dahil) göreve gelmemek. 4) Amirlerini, üstlerini, aynı rütbedeki arkadaşlarını, astlarını veya diğer mesai arkadaşlarını haksız yere şikâyet etmek. 5) Astlarını, aynı rütbedeki arkadaşlarını ve diğer mesai arkadaşlarını dövme girişiminde bulunmak. 6) Toplu olarak sözlü veya yazılı şikâyette bulunmak.","x":[]},{"m":"8","g":"Kriptolu telsiz cihazının","c":"kaybını/çalındığını mazeretsiz derhal bildirmemek: yirmidört ay uzun süreli durdurma","n":"","k":"ç) Yirmidört ay uzun süreli durdurma cezasını gerektiren fiiller; 1) Silahla dikkatsizlik, tedbirsizlik veya ihmal sonucu ölüme sebebiyet vermek ya da bu fiilin başkaları tarafından işlenmesine neden olmak. 2) Silahla yaralama suçunu kasten işlemek. 3) Meskûn yerlerde, binalarda, herkesin dolaşıp gezebileceği veya oturabileceği yerlerde silah atmak. 4) Amirin usulüne göre verdiği emri yerine getirmemek. 5) Amirin izni olmaksızın görev yerini terk etmek. 6) Kişinin iffetine yönelik söz söylemek, fiil veya harekette bulunmak. 7) Amir veya üste hakaret etmek. 8) Amir veya üstlerini söz, yazı, tutum veya davranışlarıyla küçümsemek. 9) Amir veya üstlerini dövmeye teşebbüs etmek. 10) Amir veya üstlerini sözlü veya fiili olarak tehdit etmek. 11) Göreve ilişkin her türlü yazılı kağıt, belge, mikrofilm aslı veya kopyalarını kasıtlı olarak yok etmek, ortadan kaldırmak ya da belge niteliği taşıyan bilgisayar programlarını, dosyalarını, verilerini hukuka aykırı olarak ele geçirmek, başkasına zarar vermek üzere kullanmak, tahrip etmek, değiştirmek, silmek, sistemin işlemesine engel olmak ya da yanlış biçimde işlemesini sağlamak. 12) Kriptolu telsiz cihazının ve her türlü kriptolu cihazın kaybını veya çalındığını, idarece kabul edilebilir bir mazereti olmaksızın ilgili birime derhal bildirmemek.","x":[]},{"m":"8","g":"Yetkisini veya nüfuzunu kendisine","c":"çıkar/kin-dostlukla kötüye kullanmak: meslekten çıkarma","n":"","k":"(6) Meslekten çıkarma cezasını gerektiren fiiller şunlardır: a) Görevin yerine getirilmesinde dil, ırk, ar başvuru yapılabilir. Bu şekilde muvazzaf astsubaylığa geçirilenler; astsubay nasbedildikleri tarihten başlamak üzere onbeş yıl hizmet etmedikçe istifa edemezler.","x":[["7","subay yedinci yıldan"]]},{"m":"12","g":"en az üç ay önce","c":"sözleşme yenileme bildirimi; yoksa kendiliğinden sona erer","n":"","k":"Her sözleşme süresinin sona erme tarihinden en az üç ay önce taraflar sözleşmeyi yenileyeceklerine dair yazılı bildirimde bulunmadıkları takdirde, sözleşme kendiliğinden sona erer.","x":[]},{"m":"12","g":"tek taraflı olarak fesh edemezler","c":"sözleşmeli subay/astsubay, süre dolmadan","n":"","k":"Sözleşmeli subay veya astsubaylar, sözleşme süreleri sona ermeden sözleşmelerini tek taraflı olarak fesh edemezler.","x":[]},{"m":"12","g":"iki katı kadar","c":"yurt dışı altı ay+ öğrenim/kurs: sözleşme uzar","n":"yurt içi TSK hesabına öğrenim: geçen süre kadar","k":"Subay veya astsubay nasbedildikten sonra; yabancı memleketlere altı ay veya daha uzun süreli öğrenim, staj, kurs, ihtisas veya görgü ve bilgilerini artırmak maksadıyla gidenlerin sözleşme süreleri, gidiş ve dönüş tarihleri arasında geçen sürenin iki katı kadar; Türk Silâhlı Kuvvetleri hesabına yurt içindeki fakülte veya yüksekokullarda öğrenim yapanlarla, meslekleriyle ilgili ihtisas yapanların sözleşme süreleri ise, buralarda geçen süreler kadar uzatılır.","x":[]},{"m":"12","g":"sürelerin yarısı kadar uzatılır","c":"yurt içi tıp/diş uzmanlığı, doktora","n":"YURT DIŞI İKİ KAT, YURT İÇİ BİR KAT, UZMANLIK YARIM","k":"hekimliğinde veya eczacılıkta doktora eğitimini bitirenlerin sözleşme süreleri, buralarda geçen sürelerin yarısı kadar uzatılır.","x":[]},{"m":"12","g":"devlet hizmet yükümlülüğüne tâbi olmazlar","c":"sözleşmeli tabip subaylar (sözleşmesi feshedilenler hariç)","n":"TUS kazanan üç yıl kıt'a hizmetinden sonra uzmanlığa","k":"Sözleşme süresi sona ermeden sözleşmesi fesih edilenler hariç olmak üzere, sözleşmeli tabip subaylar devlet hizmet yükümlülüğüne tâbi olmazlar. Bunlardan tıpta uzmanlık sınavını kazananlar; kıt’a, kurum ve karargahlarda üç yıllık hizmetini tamamladıktan sonra uzmanlık eğitimine başlayabilirler.","x":[]},{"m":"13","g":"üçte birine","c":"askeri eğitime katılmama: ön sözleşme feshi; kazayla bir kez tekrar","n":"","k":"d) Askeri eğitimin üçte birine çeşitli nedenlerle katılmamak. Bunlardan; görevlerini icra ederken veya görevleri dolayısıyla bir saldırıya veya kazaya uğrayan ya da bir meslek hastalığına yakalanma neticesinde askeri eğitimin üçte birine devam etmeyerek başarısız kabul edilenler, bir kez olmak üzere sonraki dönemde açılacak askeri eğitime planlanırlar. Sonraki dönemde istekli olmaları, aranan sağlık ve diğer niteliklerini korumaları halinde yeniden ön sözleşme yapılarak eğitime alınırlar.","x":[]},{"m":"13","g":"bir ay ve daha fazla","c":"hürriyeti bağlayıcı ceza: sözleşme feshi (taksirli hariç)","n":"","k":"e) Taksirli suçlar hariç olmak üzere adli veya askeri mahkemeler tarafından bir ay ve daha fazla süreli hürriyeti bağlayıcı bir cezaya mahkum olmak.","x":[]},{"m":"13","g":"toplam sekiz defa","c":"iki amirden bir yılda: fesih; otuz gün oda hapsi de","n":"","k":"f) (Değişik: 31/1/2013-6413/45 md.) Son olarak verilen de dahil olmak üzere, kararın kesinleştiği tarihten itibaren geriye doğru son bir yıl içinde toplamda otuz gün ve daha fazla oda hapsi veya hizmet yerini terk etmeme cezasına mahkum olmak veya en son aldığı disiplin cezasından geriye doğru son bir yıl içinde en az iki disiplin amirinden toplam sekiz defa veya daha fazla disiplin cezası almak.","x":[]},{"m":"13","g":"Milli Savunma Bakanlığınca uygun görülmemek","c":"yabancıyla evlilik: sözleşme feshi","n":"vatandaşlık kaybı da","k":"ı) Yabancı uyruklu kişilerle yapılan evliliklerde, evlilikleri ilgili mevzuatta belirtilen esaslar dahilinde Milli Savunma Bakanlığınca uygun görülmemek ve çeşitli nedenlerle Türk vatandaşlığını kaybetmek veya Türk vatandaşlığından çıkarılmak.","x":[]},{"m":"13","g":"doksan günü geçmek","c":"bir sözleşme yılında sıhhi izin: fesih (kaza, kanser vb. hariç)","n":"","k":"hariç olmak kaydıyla, bir sözleşme yılı içinde alınan hava değişimi, istirahat ve benzeri sıhhi izin süresi toplamı doksan günü geçmek.","x":[]},{"m":"15","g":"rütbe verilmeksizin bir üst dereceye","c":"subay onbeşinci, astsubay onsekizinci yılda; sicil yüzde altmış","n":"derecede üç yıl, üçüncü kademede bir yıl","k":"Sözleşmeli subaylardan onbeşinci, sözleşmeli astsubaylardan onsekizinci fiilî hizmet yılını tamamlayanlardan, aşağıdaki koşulları yerine getirenler rütbe verilmeksizin bir üst dereceye yükseltilirler:\na) Son üç yıla ait sicil notu ortalaması sicil tam notunun % 60 ve daha üstünde olmak. b) Bulunduğu derecede en az üç yılını ve bu derecenin üçüncü kademesinde bir yılını tamamlamış olmak.","x":[]},{"m":"16","g":"en çok on yılı","c":"idarece yenilenmeyenlerin sağlık hakkı; hizmet süresi kadar","n":"","k":"a) Kendi kusurları olmaksızın idare tarafından sözleşmeleri yenilenmeyenler ile sözleşme süresi içinde vefat, bir yıl içerisinde Kanunda belirtilen süreden daha fazla hava değişimi/istirahat/benzeri sıhhi izin süresini geçirme, bulunduğu kadronun kaldırılması, istihdam edildiği kadronun sağlık niteliğini kaybetme nedeniyle sözleşmeleri sona erenler ve bunların bakmakla yükümlü oldukları aile fertlerinin, Türk Silâhlı Kuvvetlerinde sözleşmeli subay ve sözleşmeli astsubay olarak hizmet edilen süre kadar ve en çok on yılı,","x":[]},{"m":"16","g":"en çok beş yılı","c":"kendi isteğiyle yenilemeyenler; hizmetin yarısı kadar","n":"İDARE YENİLEMEDİ ON, KENDİ İSTEMEDİ BEŞ","k":"b) Sözleşme süresi sonunda kendi istekleriyle sözleşmeleri yenilenmeyenler ile bunların bakmakla yükümlü oldukları aile fertlerinin ise Türk Silahlı Kuvvetlerinde sözleşmeli subay ve sözleşmeli astsubay olarak hizmet edilen sürenin yarısı kadar ve en çok beş yılı,","x":[]},{"m":"16","g":"oniki ayı geçmemek üzere tedavi","c":"sağlıktan sözleşmesi bitenlere net maaşın üçte ikisi yardım","n":"","k":"Sözleşmeleri sağlık nedeniyle sona erenlerden; sözleşmele iz ve tarihsiz başvuru","c":"gerçek kişi ve tarih bilgisi olmayan dilekçe ilgisi","n":"","k":"(10) Gerçek kişi ve tarih bilgisi bulunmayan başvuru/dilekçe ilgi tutulmak istendiğinde, ilgi bölümü “İsimsiz ve tarihsiz başvuru/dilekçe.” biçiminde yazılır.","x":[]},{"m":"16","g":"alt makamlara","c":"rica ederim; üst ve aynı düzeye arz ederim","n":"ASTA RİCA, ÜSTE VE EŞİTE ARZ","k":"a) Yazışma yapan makamlar arasındaki hiyerarşi yönünden alt makamlara “… rica ederim.”, üst ve aynı düzeydeki makamlara “… arz ederim.” ibaresiyle bitirilir.","x":[]},{"m":"16","g":"arz ve rica ederim","c":"üst, aynı düzey ve alt makamlara birlikte dağıtım","n":"arz/rica ederim de olur","k":"b) Üst, aynı düzey ve alt makamlara birlikte dağıtımlı olarak yapılan yazışmalar “… arz ve rica ederim.” veya “… arz/rica ederim.” ibaresiyle bitirilir.","x":[]},{"m":"16","g":"Cumhurbaşkanlığı İdari İşler Başkanı tarafından","c":"bakanlıklarla yazışmada Rica ederim","n":"","k":"ç) 1 sayılı Cumhurbaşkanlığı Kararnamesinin 6 ncı maddesi gereğince bakanlıklarla yapılan yazışmalar, Cumhurbaşkanlığı İdari İşler Başkanı tarafından veya adına imzalandığında “Rica ederim.” ibaresiyle bitirilir.","x":[]},{"m":"16","g":"Saygılarımla","c":"gerçek kişi muhataba bitiş; İyi dileklerimle, Bilgilerinize sunulur da","n":"","k":"e) Muhatabı gerçek kişi olan yazışmalar “Saygılarımla.”, “İyi dileklerimle.” veya “Bilgilerinize sunulur.” ibareleriyle bitirilebilir.","x":[]},{"m":"16","g":"1,25 cm","c":"paragraf girintisi; iki yana hizalı; paragraf arası boşluk yok","n":"","k":"(4) Paragrafa 1,25 cm içeriden başlanır ve metin iki yana hizalanır. Paragraflar arasında satır boşluğu bırakılmaz (Örnek 8).","x":[]},{"m":"16","g":"üçlü gruplara ayrılarak","c":"dört ve çok haneli sayılar; nokta ile; kesirler virgülle","n":"","k":"(7) Dört ve dörtten çok haneli sayılar sondan sayılmak üzere üçlü gruplara ayrılarak yazılır ve araya nokta (.) işareti konulur (Örnek: 1.452; 25.126; 326.197). Sayılarda kesirler virgül (,) ile ayrılır (Örnek: 10.545,72).","x":[]},{"m":"16","g":"sadece ilk sayfada","c":"çok sayfalı üst yazıda sayı-tarih-konu-muhatap-ilgi; imza ve ekler son sayfada","n":"iletişim ve doğrulama bilgisi her sayfada","k":"(5) Birden fazla sayfa tutan üst yazılarda sayı, tarih, konu, muhatap ve ilgi bilgilerine sadece ilk sayfada; imza, ek ve dağıtım bilgilerine ise sadece son sayfada yer verilir (Örnek 9).","x":[]},{"m":"17","g":"iki ilâ dört satır","c":"metin bitimi ile imza arası boşluk","n":"ad-soyad-unvan yazı alanının en sağında ortalı","k":"(1) Metnin bitiminden itibaren iki ilâ dört satır boşluk bırakılarak, belgeyi imzalayacak olan makam sahibinin adına, soyadına ve bunların altında unvanına, yazı alanının en sağında ortalanarak yer verilir (Örnek 9).","x":[]},{"m":"17","g":"mavi renkli kalemle","c":"el yazısı imza (zorunlu hâl); paraf da mavi","n":"","k":"El yazısıyla atılan imza, kaybolmayacak ve kâğıda işlemesini sağlayacak mavi renkli kalemle atılır.","x":[]},{"m":"17","g":"bakan veya ilgili bakan yardımcısı","c":"bakanlıkların Cumhurbaşkanlığı ile yazışmasını imzalar","n":"CB'ye bağlı kurumlarda en üst yönetici","k":"(8) Bakanlıklar ile bunlara bağlı, ilgili ve ilişkili kurum ve kuruluşların Cumhurbaşkanlığı ile yapacakları yazışmalar, belgenin mahiyeti ve aciliyet durumu değerlendirilerek bakan veya ilgili bakan yardımcısı tarafından imzalanır.","x":[]},{"m":"17","g":"yetki devreden makamı gösteren","c":"ikinci satıra “Bakan a.”, “Vali a.”; iç yazışmada kullanılmaz","n":"","k":"(9) Belgeyi imza yetkisi devredilen makam imzaladığında, imzalayanın adı ve soyadı birinci satıra, yetki devreden makamı gösteren “Bakan a.”, “İdari İşler Başkanı a.”, “Vali a.”, “Belediye Başkanı a.” “Başkan a.” “Genel Müdür a.” veya “Rektör a.” biçimindeki ibare ikinci satıra, imzalayan makamın unvanı ise üçüncü satıra yazılır (Örnek 10). İdare birimleri arasındaki iç yazışmalarda yetki devredenin unvanı kullanılmaz.","x":[]},{"m":"17","g":"Belge vekâleten imzalandığında","c":"ikinci satıra “Genel Müdür V.” gibi","n":"YETKİ DEVRİ a., VEKÂLET V.","k":"(10) Belge vekâleten imzalandığında, imzalayanın adı ve soyadı birinci satıra, vekâlet olunan makam “Genel Müdür V.”, “Başkan V.”, “Belediye Başkan V.” “Rektör V.” veya “Dekan V.” biçiminde ikinci satıra yazılır (Örnek 10).","x":[]},{"m":"17","g":"imzası sağda yer alır","c":"iki yetkilide üst unvan sağda; ikiden fazlada en üst solda","n":"","k":"(11) Belgenin iki yetkili tarafından imzalanması durumunda üst unvan sahibinin adı, soyadı, unvanı ve imzası sağda yer alır. Belgenin ikiden fazla yetkili tarafından imzalanması durumunda en üst unvan sahibinin adı, soyadı, unvanı ve imzası en solda olmak üzere yetkililer unvan sırasına göre soldan sağa doğru sıralanır (Örnek 11).","x":[]},{"m":"17","g":"ibareye, şekle veya ifadeye","c":"e-imzalı belgede imzalandığına dair işaret konmaz","n":"","k":"Elektronik ortamda yapılan yazışmalarda, yetkili makamın ad ve soyad bilgilerinin üzerinde belgenin güvenli elektronik imza ile imzalandığına dair herhangi bir ibareye, şekle veya ifadeye yer verilmez.","x":[]},{"m":"18","g":"EK LİSTESİ","c":"ek listesi sığmazsa ayrı sayfa; üst yazıda Ek: Ek Listesi","n":"ek numarası sağ üst köşede EK-1, EK-2","k":"(4) Ek listesi yazı alanına sığmayacak kadar uzunsa ayrı bir sayfada, “EK LİSTESİ” başlığı altında yazılır ve üst yazıda “Ek: Ek Listesi” şeklinde gösterilir (Örnek 13).","x":[]},{"m":"18","g":"Ek konulmadı","c":"ekler muhataba gönderilmediğinde","n":"","k":"(5) Belge eklerinin muhataba gönderilmediği durumlarda “Ek konulmadı”","x":[]},{"m":"19","g":"bilgi sahibi olması istenenler","c":"Dağıtım: Bilgi kısmı; gereğini yapacaklar Gereği kısmı","n":"","k":"(2) Belgenin gereğini yerine getirme durumunda olanlar “Gereği:” kısmına, belgenin içeriği hakkında bilgi sahibi olması istenenler ise “Bilgi:” kısmına yazılır.","x":[]},{"m":"20","g":"Uygun görüşle arz ederim","c":"olura katılan ara makam ibaresi","n":"","k":"(4) Oluru teklif eden birim ile olur alınan makam arasında başka makamlar varsa bunlar olura katılabilir. Teklif eden birim yetkilisinin imza bölümü ile “OLUR” ibaresinin bulunduğu bölüm arasına uygun boşluk bırakılarak yazı alanının solunda yer alacak şekilde “Uygun görüşle arz ederim.” ibaresi yazılır","x":[]},{"m":"20","g":"“OLUR” ibaresinin alt satırına","c":"ortaya büyük harfle; olur makamının imza tarihi belge tarihi","n":"","k":"(2) Belge, olur için makama sunulurken imza bölümünden sonra uygun boş satır bırakılarak yazı alanının ortasına büyük harflerle “OLUR” yazılır. “OLUR” ibaresinin alt satırına imzalayanın adı ilk harfi büyük diğerleri küçük, soyadı büyük ve bir alt satıra unvanı ilk harfleri büyük diğerleri küçük harflerle ortalanarak yazılır. Oluru alınan makamın güvenli elektronik imza ile oluşturduğu imzaya ait tarih bilgisi, belge tarihi olarak esas alınır ve 12 nci maddenin birinci fıkrasında belirtilen alanda belge görüntüsü üzerinde gösterilir (Örnek 17).","x":[]},{"m":"21","g":"paraf bilgileri paylaşılmaz","c":"belge muhataba iletildiğinde; üstveride tutulur","n":"elektronik paraf: e-imza ya da elektronik onay","k":"Belge muhataba iletildiğinde, belgeye ait paraf bilgileri paylaşılmaz.","x":[]},{"m":"21","g":"günlük olarak zaman damgasıyla","c":"EBYS günlük raporları damgalanır; saklama süresi belgeden kısa olamaz","n":"","k":"Günlük raporlar, günlük olarak zaman damgasıyla damgalanır ve günlük raporlarının saklama süresi ilişkili olduğu belgelerin saklama süresinden daha kısa olamaz.","x":[]},{"m":"22","g":"“Koordinasyon” seçimi yapılır","c":"işbirliğiyle hazırlanan belgede paraf hiyerarşisinden sonra","n":"","k":"(1) İdare içinde birden fazla birimin iş birliği ile hazırlanan ve yetkili makamın imzasına sunulan belgelerde, belgeyi hazırlayan birime ait paraf hiyerarşisinden sonra “Koordinasyon” seçimi yapılır ve iş birliğine dâhil olan ilgililerin unvanları, adları ve soyadları belirtilir (Örnek 20).","x":[]},{"m":"23","g":"karekod","c":"iletişim bilgileri alanının en sağında; doğrulama e-Devlet üzerinden","n":"\"Bu belge, güvenli elektronik imza ile imzalanmıştır.\" ibaresi","k":"Belge doğrulama bilgilerini içeren “belge doğrulama kodu” ikinci satırda, “karekod” ise “İletişim bilgileri” alanının en sağ kısmında yer alır (Örnek 21). (2) Belge doğrulama işlemi, doğrulama kodu ve karekod ile Dijital Türkiye (e-Devlet) üzerinden sağlanır.","x":[]},{"m":"24","g":"bilgi alınacak kişinin","c":"iletişim bilgilerinin sağında; solda idarenin adresi, KEP","n":"","k":"(1) İletişim bilgileri; solda belgeyi gönderen idarenin adresini, posta kodunu, telefonunu, faks numarasını, e-posta adresini, kayıtlı elektronik posta (KEP) adresini ve internet adresini; sağda bilgi alınacak kişinin adını, soyadını, unvanını ve telefon numarasını içerecek şekilde sayfa sonuna yazılır ve çizgi ile ayrılır (Örnek 21).","x":[]},{"m":"25","g":"“Hizmete Özel” gizlilik derecesi","c":"elektronik ortamda işlem görür; Özel ve üstü fiziksel","n":"HİZMETE ÖZEL E-ORTAM, ÖZEL VE ÜSTÜ KÂĞIT","k":"(1) “Hizmete Özel” gizlilik derecesi bulunan belgelerin hazırlanması, kaydedilmesi, saklanması, gönderilmesi, alınması ve diğer işlemleri elektronik ortamda gerçekleştirilir. (2) “Özel” ve üstü gizlilik dereceli belgelerin hazırlanması, kaydedilmesi, saklanması, gönderilmesi, alınması ve diğer işlemler ilgili mevzuatta belirtilen hükümlere uygun olarak fiziksel ortamda gerçekleştirilir.","x":[]},{"m":"25","g":"gizlilik derecesinin belirlenmesinden sorumludur","c":"belgenin imzacısı olan yetkili makam","n":"","k":"(3) Belgenin imzacısı olan yetkili makam, belgeye ait gizlilik derecesinin belirlenmesinden sorumludur.","x":[]},{"m":"26","g":"“ACELE” ibaresi taşıyan belgeye","c":"derhâl ve süratle cevap; GÜNLÜDÜR belirtilen sürede","n":"","k":"(2) “ACELE” ibaresi taşıyan belgeye derhâl ve süratle; “GÜNLÜDÜR” ibaresi taşıyan belgeye belirtilen süre içinde cevap verilir.","x":[]},{"m":"26","g":"kırmızı renkli olarak","c":"ACELE/GÜNLÜDÜR sağ üst köşede; yalnız birinci sayfada","n":"","k":"(3) Elektronik ortamda veya zorunlu hâllerde ya da olağanüstü durumlarda hazırlanan süreli belgelerde “ACELE” veya “GÜNLÜDÜR” ibaresi yazı alanının sağ üst köşesinde kırmızı renkli olarak belirtilir (Örnek 19/A, 19/B). Birden fazla sayfalı belgelerde “ACELE” veya “GÜNLÜDÜR” ibaresi sadece birinci sayfada belirtilir (Örnek 9).","x":[]},{"m":"26","g":"zarfı açılmadan","c":"KİŞİYE ÖZEL belge; zarf bilgileri kaydedilir, ilgilisine teslim","n":"yalnız ilgili tasarruf eder","k":"(5) “KİŞİYE ÖZEL” ibaresi taşıyan belgenin zarfı açılmadan zarf üzerinde yer alan bilgiler, yetkili birimce EBYS’ye veya kurumsal belge kayıt sistemine kaydedilir ve ilgilisine teslim edilir. “KİŞİYE ÖZEL” ibaresi taşıyan belge üzerinde yalnızca ilgili kişi tasarruf hakkına sahiptir ve ilgilinin talebi ile EBYS’ye kaydedilir.","x":[]},{"m":"27","g":"kaçıncısı olduğunu gösterecek","c":"sayfa numarası; iletişim bilgilerinin altında, ortada","n":"","k":"(1) Birden fazla sayfa tutan belgelere sayfa numarası verilir. Sayfa numarası, iletişim bilgilerinin altında ve sayfanın ortasında, toplam sayfa sayısının kaçıncısı olduğunu gösterecek şekilde belirtilir (Örnek 9).","x":[]},{"m":"28","g":"ayrılmaz bir bütünüdür","c":"e-imzalı belgenin üstverisi; tarih-sayı görüntüyle aynı olmalı","n":"","k":"(3) Elektronik ortamda güvenli elektronik imza ile imzalanan belgenin üstveri elemanları, belgenin ayrılmaz bir bütünüdür. Tarih ve sayı gibi belge görüntüsü üzerinde yer alan bilgiler ile üstveride yer alan bilgiler arasında fark olamaz.","x":[]},{"m":"29","g":"ASLI GİBİDİR","c":"fiziksel belge örneği; yetkili görevli imzalar; asıl gibi kabul","n":"e-imzalı belge çoğaltması: yetkili görevli çıktı alır","k":"(2) Zorunlu hâllerde veya olağanüstü durumlarda ya da bu Yönetmeliğin yürürlüğe girdiği tarihten önce fiziksel ortamda hazırlanan bir belgeden örnek çıkartılması hâlinde, çoğaltılan belgenin uygun bir yerine “ASLI GİBİDİR” ibaresi konulur ve yetkilendirilmiş görevli tarafından ad, soyad, unvan ve tarih belirtilmek suretiyle imzalanır. Bu şekilde çoğaltılan belge, asıl belge gibi kabul edilir.","x":[]},{"m":"30","g":"reddetme hakkına sahiptir","c":"Rehbere uygun olmayan belge; ikinci iş günü sonuna kadar bildirim","n":"","k":"(4) İdare, başka bir idareden kendisine resmî yazışma kapsamında iletilen ve e-Yazışma Teknik Rehberi’nde tanımlanan kurallara uygun şekilde hazırlanmamış bir belgeyi reddetme hakkına sahiptir. Bu durumda, kendisine iletilen belgeyi reddeden idare, gönderen idareye bu durumu sebepleriyle birlikte belgenin kendisine ulaştığı tarihi takip eden ikinci iş gününün sonuna kadar bildirir.","x":[]},{"m":"30","g":"açılmış, içeriğine erişilmiş","c":"şifreli belge; idare bildirimde bulunmazsa kabul edilmiş sayılır","n":"","k":"İdarenin bildirimde bulunmaması hâlinde, gönderilen şifreli belge açılmış, içeriğine erişilmiş ve bu belgenin e- Yazışma Teknik Rehberi’ne uygun şekilde hazırlandığı kabul edilmiş sayılır.","x":[]},{"m":"30","g":"DETSİS üzerinden paylaşılır","c":"idarelerin elektronik şifreleme sertifikaları","n":"","k":"İdareler için oluşturulan elektronik şifreleme sertifikaları DETSİS üzerinden paylaşılır.","x":[]},{"m":"31","g":"zarfın sol üst köşesine","c":"gönderen idarenin başlığı, tarih-sayı; muhatap zarfın ortasına","n":"ACELE, GÜNLÜDÜR, KİŞİYE ÖZEL zarfın sağ üstünde kırmızı","k":"(2) Belge zarflanarak muhatabına iletildiğinde başlık bilgisi, ihtiyaç duyulması hâlinde gönderen idarenin adres bilgisi, belgenin tarihi ve sayısı zarfın sol üst köşesine; muhatabın adı ve adres bilgisi zarfın ortasına kısaltma kullanılmadan yazılır. Varsa süre ve kişiye özel bilgisi (ACELE, GÜNLÜDÜR, KİŞİYE ÖZEL), üstte olmak üzere, zarfın sağ üst köşesinde kırmızı renkli büyük harflerle belirtilir (Örnek 22).","x":[]},{"m":"31","g":"işleme alınmasına engel değildir","c":"dilekçenin arz ederim ile bitmemesi, rica ederim denmesi","n":"","k":"(7) Kişiler tarafından idareye yazılan dilekçelerin; “… arz ederim.” şeklinde bitirilmemesi veya “… rica ederim.” ibaresiyle ya da başka ibarelerle bitirilmesi dilekçenin işl ay ve sözleşmeli astsubaylar ile bunların bakmakla yükümlü oldukları kimselerin, sözleşme süresince, sosyal hakları ve sağlık işlemlerinde 4/1/1961 tarihli ve 211 sayılı Türk Silahlı Kuvvetleri İç Hizmet Kanununun muvazzaf subay ve astsubaylara ilişkin hükümleri uygulanır.","x":[]},{"m":"13","g":"rütbe bekleme süreleri hakkında","c":"926 sayılı TSK Personel Kanunundaki muvazzaf süreleri uygulanır","n":"RÜTBE 926, SAĞLIK 211","k":"Madde 13 - Sözleşmeli subayların ve astsubayların rütbe bekleme süreleri hakkında, 27/07/1967 tarihli ve 926 sayılı Türk Silahlı Kuvvetleri Personel Kanununda muvazzaf subaylar ve astsubaylar için belirlenen süreler uygulanır.","x":[]},{"m":"8","g":"on ikinci fiili hizmet yılını","c":"muvazzaf subaylığa geçiş: yedinci yıla başlamış, on ikinci yılı bitirmemiş","n":"astsubaylıkta dördüncü yıl (m.11)","k":"1) Yedinci fiili hizmet yılına başlamış veya on ikinci fiili hizmet yılını bitirmemiş olmak.","x":[["11","muvazzaf astsubaylığa geçiş: dördüncü fiili hizmet yılına başlamış olmak"]]},{"m":"14","g":"ilk amirine müracaat eder","c":"yenileme dilekçesi sona erme tarihinden 6 ay önce; silsileler yoluyla","n":"doğrudan Genelkurmay’a dilekçe YOK","k":"a) Sözleşmeli subay ve astsubaylardan, sözleşmesini yenilemek isteyenler sözleşme süresinin sona erme tarihinden 6 ay önceden başlamak suretiyle dilekçe ile ilk amirine müracaat eder. Bu dilekçeler, EK-C'de belirtilen nitelik belgesi ile beraber silsileler yolu ile Kuvvet Komutanlıkları, Jandarma Genel Komutanlığı ve Sahil Güvenlik Komutanlığına gönderilir.","x":[]},{"m":"14","g":"en az 3 ay önce","c":"yazılı bildirim yoksa sözleşme kendiliğinden sona erer","n":"DİLEKÇE 6 AY, BİLDİRİM 3 AY","k":"d) Her sözleşme süresinin sona erme tarihinden en az 3 ay önce taraflar sözleşmeyi yenileyeceklerine dair yazılı bildirimde bulunmadıkları taktirde sözleşme kendiliğinden sona erer.","x":[]},{"m":"14","g":"iki katı kadar","c":"yurt dışı 6 ay+ öğrenim/staj/kurs: sözleşme bu kadar uzar","n":"yurt içi öğrenim: geçen süre kadar","k":"c) Sözleşmeli subay ve astsubay nasbedildikten sonra; yabancı memleketlere 6 ay veya daha uzun süreli öğrenim, staj, kurs, ihtisas veya görgü ve bilgilerini artırmak maksadıyla gidenlerin sözleşme süreleri, gidiş ve dönüş tarihleri arasında geçen sürenin iki katı kadar; Türk Silahlı Kuvvetleri hesabına yurtiçindeki fakülte ve yüksekokullarda öğrenim yapanlarla meslekleri ile ilgili ihtisas yapanların sözleşme süreleri ise buralarda geçen süreler kadar uzatılır.","x":[]},{"m":"30","g":"fiziki yetenek, değerlendirme testi","c":"aday adayı sınavları: genel kültür-meslek bilgisi, mülakat; yabancı dil YOK","n":"","k":"Müracaatları kabul edilenler fiziki yetenek, değerlendirme testi, genel kültür ve meslek bilgisi ile mülakata tabi tutulurlar.","x":[]}]},{"id":17,"ad":"Jandarma Teşkilat, Görev ve Yetkileri Yönetmeliği","grup":"müşterek","satirlar":[{"m":"3","g":"ilçelerde kaymakamı","c":"mülki amir tanımı","n":"illerde vali","k":"l) Mülki amir: İllerde vali, ilçelerde kaymakamı,","x":[]},{"m":"3","g":"Jandarma hizmet merkezi","c":"mülki amirin onayıyla geçici kurulan jandarma birimi","n":"","k":"ğ) Jandarma hizmet merkezi: İhtiyaç üzerine mülki amirin onayı ile emniyet ve asayiş ile kamu düzeninin korunması amacıyla geçici olarak teşkil edilen jandarma birimini,","x":[]},{"m":"3","g":"Genel Komutanlığının ihtiyatını oluşturmak","c":"jandarma komando birlikleri; Bakanlıkça konuşlandırılır","n":"mahalli birliklerin gücünü aşan toplumsal olay, terörle mücadele","k":"ı) Jandarma komando birlikleri: Jandarma Genel Komutanlığının ihtiyatını oluşturmak üzere gerektiğinde mahalli jandarma birliklerinin gücü dışına çıkan toplumsal olaylara müdahale etmek ve terörle mücadele faaliyetlerini yürütmek amacıyla Bakanlıkça gerek görülen yerlerde konuşlandırılan birlikleri,","x":[]},{"m":"3","g":"takip ve tenkil harekatını","c":"jandarma asayiş komando birlikleri; il jandarma komutanlığını takviye","n":"","k":"g) Jandarma asayiş komando birlikleri: Gerektiğinde bağlı olduğu il jandarma komutanlığının diğer birliklerini takviye etmek, her türlü toplumsal olaylara süratle müdahale etmek, terörle mücadele faaliyetlerini yürütmek, takip ve tenkil harekatını yürütmek amacıyla Bakanlıkça gerek görülecek yerlerde konuşlandırılan genel kolluk birliklerini,","x":[]},{"m":"4","g":"Jandarma Genel Komutanı, Bakana karşı","c":"Jandarma Genel Komutanı","n":"JGK İçişleri Bakanlığına bağlı","k":"MADDE 4- (1) Jandarma Genel Komutanlığı Bakanlığa bağlıdır. Jandarma Genel Komutanı, Bakana karşı sorumludur.","x":[]},{"m":"5","g":"Doğrudan merkeze bağlı birimler","c":"asayiş kolordu, komando tugay, JÖAK, eğitim kurumları, havacılık grup/filo","n":"","k":"c) Doğrudan merkeze bağlı birimler şunlardır:\n1) Jandarma asayiş kolordu komutanlıkları.\n2) Eğitim ve öğretim birim ve kurumları.\n3) Komando tugay komutanlıkları.\n4) Jandarma Komando Özel Asayiş ve Kurtarma Tugay Komutanlığı (JÖAK).\n5) Havacılık grup/filo komutanlıkları.","x":[]},{"m":"5","g":"Taşra teşkilatı şunlardır","c":"bölge, il, ilçe komutanlıkları; komando alay/tabur/bölük; JÖH tabur","n":"asayiş komando bölük de taşra","k":"b) Taşra teşkilatı şunlardır:\n1) Jandarma bölge komutanlıkları.\n2) İl jandarma komutanlıkları.\n3) İlçe jandarma komutanlıkları.\n4) Komando alay/tabur/bölük komutanlıkları.\n5) Jandarma komando özel harekat tabur komutanlıkları.\n6) Asayiş komando bölük komutanlıkları.","x":[]},{"m":"6","g":"Bakan onayı ile kurulabilir","c":"her düzeydeki jandarma birliği","n":"konuş düzeninde mülki taksimat esas","k":"Her düzeydeki jandarma birlikleri Bakan onayı ile kurulabilir.","x":[]},{"m":"6","g":"karakolların konuş yerleri","c":"Bakan onayı; sorumluluk bölgeleri vali onayı","n":"KARAKOL BÖLGESİ = VALİ, KARAKOL YERİ = BAKAN; geçici karakol/hizmet merkezi vali onayı","k":"(7) Karakolların sorumluluk bölgeleri il jandarma komutanının önerisi üzerine valinin onayı, karakolların konuş yerleri ise Bakan onayı ile belirlenir. Geçici asayiş karakolları ile jandarma hizmet merkezleri, il jandarma komutanının önerisi üzerine valinin onayıyla teşkil edilir.","x":[]},{"m":"6","g":"kuvvet tasarrufu yoluyla","c":"geçici karakol kuvveti; il jandarma komutanlığınca","n":"","k":"Geçici karakolların kuvveti il jandarma komutanlığınca kuvvet tasarrufu yoluyla sağlanır.","x":[]},{"m":"6","g":"il merkez jandarma komutanlığı","c":"merkez ilçe jandarma komutanlığı; özel adı yoksa il adıyla","n":"","k":"Merkez ilçelerde kurulan ilçe jandarma komutanlıkları; il merkez jandarma komutanlığı olarak ve merkez ilçenin özel bir adı yoksa o ilin adıyla adlandırılır.","x":[]},{"m":"7","g":"Bakanın kararıyla bir il","c":"il/ilçenin tamamı polis ya da jandarma alanı","n":"","k":"Bakanın kararıyla bir il veya ilçenin tamamı polis ya da jandarma görev ve sorumluluk alanı olarak belirlenebilir.","x":[]},{"m":"8","g":"arama kurtarma görevlerini","c":"mülki görev (yönetmelikte); trafik, kritik tesis koruma da","n":"","k":"a) Mülki görevler: Emniyet ve asayiş ile kamu düzenini sağlamak, korumak ve kollamak, kaçakçılığı men, takip ve tahkik etmek, suç işlenmesini önlemek için gerekli tedbirleri almak ve uygulamak, ceza infaz kurumlarının dış korumalarını sağlamak, trafik hizmetlerini yürütmek, arama kurtarma görevlerini yapmak, hassas ve kritik öneme sahip tesislerin korunmasına ilişkin önlemleri ilgili kuruluşlarla işbirliği içinde sağlamak, bu fıkranın (b) ve (c) bentlerinde belirtilen görevler dışında kalan ve mevzuat hükümlerinin icrası ile bunlara dayalı emir ve kararlarla jandarmaya verilen görevleri yapmak.","x":[]},{"m":"9","g":"kendiliğinden olaya elkoyması","c":"özel kolluk alanında; o yer jandarmanın görev alanı sayılır","n":"polis teşkilatı kurulmamış yerde de","k":"c) Özel kolluk kuruluşlarının sorumluluk alanına giren konularda, bu kuruluş ve kuvvetlerin yokluğundan ötürü meydana gelen ihlal ya da suçlar nedeniyle, jandarmanın görevlendirilmesi ya da kendiliğinden olaya elkoyması mümkündür. Bu gibi durumlarda jandarmanın görev yaptığı o yer, jandarmanın görev alanı sayılır.","x":[]},{"m":"10","g":"kesin olarak çözümlenir","c":"kolluk birimleri arası sorumluluk alanı anlaşmazlığı; mülki amir","n":"","k":"(4) Sorumluluk alanlarının sınırlarının belirlenmesinde kolluk birimleri arasındaki anlaşmazlıklar, mülki amir tarafından kesin olarak çözümlenir.","x":[]},{"m":"10","g":"devir ve teslim ile ilgili","c":"en geç üç ay içinde tamamlanır","n":"","k":"(5) Sorumluluk alanını belirleyen karar doğrultusunda devir ve teslim ile ilgili işlemler en geç üç ay içerisinde tamamlanır.","x":[]},{"m":"13","g":"Kişisel koruma ve kollama","c":"mevzuat hükmü ya da mülki amir emriyle; esas genel koruma","n":"","k":"Kişisel koruma ve kollama ancak, mevzuatta özel hüküm bulunması durumunda veya özel nitelik taşıyan durumlarda yetkili mülki amirin emriyle yerine getirilir.","x":[]},{"m":"14","g":"Yangının nedenlerini","c":"jandarma saptar; tutanak mülki amire ve savcılığa","n":"","k":"Yangının nedenlerini, diğer olayların yol açtığı zararları ve kurtarılan nesnelerin cins ve miktarını saptar. Olayla ilgili olarak düzenlenen tutanağın bir örneğini mülki amire, bir diğer örneğini de Cumhuriyet savcılığına verir.","x":[]},{"m":"15","g":"akıl hastalarının","c":"polis olmayan yerde yalnız saldırıya engel; sevkten sorumlu değil","n":"il/ilçenin tamamı jandarmaysa sevk de jandarmanın","k":"(3) Polis teşkilatı olmayan yerlerde sevkleri gerekli görülen akıl hastalarının başkalarına saldırma ihtimali varsa sevkten sorumlu olmamak ve yalnızca saldırıya engel olmak amacıyla sevk görevi jandarma tarafından yerine getirilir. Ancak 2803 sayılı Kanun çerçevesinde bir il veya ilçenin tamamında jandarmanın görevli olduğu durumlarda sevk görevi de jandarmaya aittir.","x":[]},{"m":"18","g":"denetim kesintisiz sürdürülür","c":"silah ve av tüfeği izin belgesi işlemleri; jandarma yürütür","n":"","k":"(1) Sorumluluk alanında olmak kaydıyla aşağıdaki işlemler jandarma tarafından yürütülür.\na) 21/3/1991 tarihli ve 91/1779 sayılı Bakanlar Kurulu Kararı ile yürürlüğe konulan Ateşli Silahlar ve Bıçaklar ile Diğer Aletler Hakkında Yönetmelik uyarınca valiler tarafından verilecek izin belgesine ilişkin işlemler.\nb) 10/3/1982 tarihli ve 17629 sayılı Resmi Gazetede yayımlanan 2521 Sayılı Avda ve Sporda Kullanılan Tüfekler, Nişan Tabancaları ve Av Bıçaklarının Yapımı, Alımı, Satımı ve Bulundurulmasına Dair Kanunun Uygulanmasına İlişkin Yönetmelik uyarınca verilecek izin belgelerine ilişkin işlemler.\n(2) Bu maddedeki görevler çerçevesinde, denetim kesintisiz sürdürülür.","x":[]},{"m":"19","g":"yedi gün içinde verir","c":"jandarma görüşü; umuma açık yer ruhsatı için","n":"izinsiz açılan yer kapatılır","k":"Jandarma görüşünü genel güvenlik ve asayiş açısından yedi gün içinde verir.","x":[]},{"m":"19","g":"il özel idareleri tarafından verilir","c":"belediye ve mücavir alan dışındaki umuma açık yerlerin ruhsatı","n":"belediye sınırı içinde belediye","k":"(3) Jandarma sorumluluk alanında, umuma açık istirahat ve eğlence yerlerinin ruhsatı jandarmanın görüşü alındıktan sonra belediye ve mücavir alan sınırları içinde belediyeler; bu alanların dışında il özel idareleri tarafından verilir.","x":[]},{"m":"19","g":"kat’i delil elde edilmesi","c":"kumar, uyuşturucu, fuhuş yeri vb. mülki amire bildirilir","n":"","k":"(4) Jandarma tarafından kat’i delil elde edilmesi halinde;\na) Kumar oynanan umumi ve umuma açık yerler ile her çeşit özel ve resmi kurum ve kuruluşlara ait lokaller,\nb) Mevzuata aykırı bir şekilde uyuşturucu madde imal edilen, satılan, kullanılan, bulundurulan yerler,\nc) Mevzuata aykırı faaliyet gösteren genelevler, birleşme yerleri ve fuhuş yapılan evler ve yerler,\nç) Devletin ülkesi ve milletiyle bölünmez bütünlüğüne, Anayasal düzenine, genel güvenliğe ve genel ahlaka zararı dokunacak oyun oynatılan, temsil verilen, film veya video bant gösterilen yerler ile internet üzerinden yapılan yayınlara izin verilen yerler,\nd) Derneklere, sendikalara, loca ve kulüplere, kamu kurumu niteliğindeki meslek kuruluşları ile benzeri kurum ve kuruluşlara ait ve yalnız üyelerinin yararlanması için açılan lokallerden, birden fazla denetim sonunda ve yazılı ihtara rağmen, mevzuata aykırı faaliyet göstererek umuma açık yer durumuna geldiği tespit edilenler,\ne) Her türlü denize elverişli araçla günübirlik tur düzenleyen veya her türlü mal ve hizmet satanlardan, müşteriye faaliyetlerini duyururken veya müşteri kabul ederken çevreyi veya müşteriyi rahatsız edecek yöntemler kullananlar, gereği yapılmak üzere mülki amire bildirilir.","x":[]},{"m":"20","g":"İnternet Toplu Kullanım Sağlayıcıları","c":"açma-kapatma mülki amir emriyle; jandarma güvenlik yönünden denetler","n":"","k":"MADDE 20- (1) 1/11/2007 tarihli ve 26687 sayılı Resmi Gazetede yayımlanan İnternet Toplu Kullanım Sağlayıcıları Hakkında Yönetmelik kapsamındaki işyerlerinin açılması, izin alınmadan açıldığı tespit edilen işyerlerinin kapatılması, işyerlerinin uyması gereken kurallara uyulmasının sağlanması mülki amirin emriyle yapılır. Jandarma bu işyerlerini genel güvenlik ve asayiş yönünden denetler ve denetleme sonuçlarını gereği yapılmak üzere mülki amire bildirir.","x":[]},{"m":"21","g":"saat yirmidörtten sonra","c":"civarı rahatsız eden gürültü jandarmaca men edilir; Kabahatler","n":"","k":"MADDE 21- (1) Mesken içinde ve dışında saat yirmidörtten sonra her ne suretle olursa olsun civar halkının rahat ve huzurunu bozacak surette gürültü yapanlar jandarma tarafından menolunur.","x":[]},{"m":"21","g":"kırksekiz saat önce mülki amire","c":"düğün, nişan, konser, panayır bildirimi","n":"","k":"(2) Düğün, nişan, konser, panayır, festival ve benzeri toplanmalarda kamu düzeninin korunmasına yönelik tedbirlerin alınmasına imkân sağlamak için ilgililer kırksekiz saat önce mülki amire bildirimde bulunmak zorundadır.","x":[]},{"m":"22","g":"teslim almaktan kaçındıklarında","c":"kanuni temsilci; jandarma tutanak tutar, kanuni işlem","n":"","k":"(2) Yardıma muhtaçların, kimsesiz çocukların, düşkün durumda bulunanların kanuni temsilcileri bunları teslim almaktan kaçındıklarında, durum jandarma tarafından bir tutanakla saptanır ve kanuni işlem yapılır.","x":[]},{"m":"22","g":"Sosyal Politikalar Bakanlığı yetkililerine","c":"korunmaya muhtaç kişiler bildirilir","n":"","k":"(3) Jandarma, 5237 sayılı Kanun ve 24/5/1983 tarihli ve 2828 sayılı Sosyal Hizmetler Kanununa göre korunmaya, bakıma, yardıma ihtiyacı olan aile, çocuk, engelli ve yaşlılar ile sosyal hizmetlere ihtiyacı olan diğer kişileri Aile ve Sosyal Politikalar Bakanlığı yetkililerine bildirmek ve bu kişilere ilişkin incelemelerde söz konusu Bakanlık yetkilileri ile işbirliği içinde bulunmakla görevlidir.","x":[]},{"m":"23","g":"jandarmaya haber verir, yitebilecek delilleri","c":"özel kolluk, jandarmanın görevine giren olayda el koyar","n":"","k":"MADDE 23- (1) Özel kolluk, jandarmanın görevine giren bir olayla karşılaştığında, mevzuatta başka bir hüküm yoksa olaya elkoyar, jandarmaya haber verir, yitebilecek delilleri toplar, kaybolmasını önler, olay yerini korur ve olayla ilgili eylemcileri yakalar.","x":[]},{"m":"23","g":"özel güvenlik teşkilatına devredilir","c":"özel kolluk yokken jandarmanın yaptığı işlem ve soruşturmalar","n":"","k":"Mevzuatta aykırı bir hüküm bulunmadıkça yapılan işlem ve soruşturmaları sonuçlandırmak üzere bütün bilgi ve belgeler özel kolluk veya özel güvenlik teşkilatına devredilir.","x":[]},{"m":"23","g":"onayıyla bu yerlerden bilgi","c":"işyerlerindeki çalışanların kimlik ve nitelikleri","n":"işyeri denetimi de mülki amirin emri/onayıyla","k":"Jandarma, bu yerlerde bulunan ve çalışanların kimlik ve nitelikleri hakkında mülki amirin onayıyla bu yerlerden bilgi isteyebilir. İstenilen bilgiler hemen verilir.","x":[]},{"m":"24","g":"infaz koruma memurluğu görevlerinde","c":"jandarma hiçbir şekilde kullanılamaz","n":"dış koruma jandarmanın","k":"(3) Jandarma hiçbir şekilde ceza infaz kurumlarının iç işlerinde ve infaz koruma memurluğu görevlerinde kullanılamaz.","x":[]},{"m":"24","g":"infaz koruma memurlarının başvurusu","c":"içerideki kargaşaya jandarma müdahale eder; müdür/vekili de","n":"","k":"Ceza infaz kurumlarının içinde burada görevli olanlarca bastırılamayacak genel bir hareket ve kargaşa meydana geldiğinde ceza infaz kurumlarının müdürü veya vekili veya infaz koruma memurlarının başvurusu üzerine jandarma olaya müdahale ederek sükûnu sağlar.","x":[]},{"m":"24","g":"jandarma muhafazasında olmadıkça","c":"izinsiz hiçbir tutuklu/hükümlü dışarı gönderilemez","n":"","k":"(5) Ceza infaz kurumlarının yetkili amir ve memurlarınca verilmiş izin ve jandarma muhafazasında olmadıkça bu yerlerden hiçbir tutuklu ve hükümlü dışarıya gönderilemez.","x":[]},{"m":"25","g":"inzibat aletleri","c":"savcı, hâkim, mahkeme önünde çıkarılır; çıkışta tekrar takılabilir","n":"","k":"(3) Hükümlü ve tutuklular Cumhuriyet savcısının, hakimin ya da mahkemenin önüne götürüldüğünde, inzibat aletleri takılmış ise çıkarılır ve bağlı olmayarak girmeleri sağlanır. Bu yerlerden çıkışta inzibat aletleri ilgili mevzuat kapsamında tekrar takılabilir.","x":[]},{"m":"25","g":"muhafız devriyenin kuvvetini","c":"jandarma komutanı saptar; liste infaz müdüründen yazıyla","n":"","k":"MADDE 25- (1) Soruşturma ve duruşmalar için adli mercilere götürülecek tutuklu ve hükümlülerin isim listesi, infaz kurum müdürü tarafından, koruma görevini yürüten jandarma komutanına yazı ile bildirir. Jandarma komutanı muhafız devriyenin kuvvetini saptayarak hükümlü ve tutukluları istenilen yer ve zamanda hazır bulundurur.","x":[]},{"m":"26","g":"yazılı istemi üzerine","c":"kurumlar arası sevk; jandarma götürür","n":"","k":"MADDE 26- (1) Bir ceza infaz kurumundan diğer bir ceza infaz kurumuna gönderilmesi gereken tutuklu ve hükümlüler, kanunen yetkili makamın yazılı istemi üzerine, jandarma kuvvetlerince istenilen yere götürülürler.","x":[]},{"m":"27","g":"hizmet araçları sevklerde kullanılmaz","c":"jandarmanın araçları; esas ceza infaz kurumu araçları","n":"yoksa kamu kitle ulaşımı; özel taşıt yok; uçak olabilir","k":"(3) Jandarmaya ait hizmet araçları sevklerde kullanılmaz.","x":[]},{"m":"27","g":"özel bir bölüm ayrılması","c":"kamu kitle ulaşım aracıyla sevkte zorunlu","n":"","k":"Kamuya ait kitle ulaşım araçlarıyla sevk sırasında ilgili kamu kurumlarınca özel bir bölüm ayrılması zorunludur.","x":[]},{"m":"28","g":"alındı belgesi","c":"teslim alınan para/eşya için tutuklu-hükümlüye verilir; sevk pusulasına","n":"","k":"Teslim alınan nesnelerin cins ve miktarlarını gösterir bir alındı belgesi, tutuklu ve hükümlülere verilir. Yapılan işlem sevk pusulasına yazılır.","x":[["65","polis/sahil güvenlik el koyduğu nesneyi jandarmaya alındı belgesiyle teslim eder"]]},{"m":"28","g":"doktor raporuyla saptandığında","c":"sevke engel sağlık durumu: sevk yapılmaz, makama yazı","n":"","k":"(3) Sağlık açısından sevke engel bir durumun varlığı doktor raporuyla saptandığında sevk yapılmaz. Durum ilgili makama yazıyla bildirilir.","x":[]},{"m":"29","g":"birlikte sevk edilemez","c":"erkek ve kadın tutuklu; iştirak halinde suç ve yakınlar hariç","n":"","k":"MADDE 29- (1) İştirak halinde suç işlemiş olanlar ile kanunen önemli ilişki sayılacak derecede yakınlığı olanlar dışında; erkek ve kadın tutuklu ya da hükümlüler, birlikte sevk edilemez.","x":[]},{"m":"29","g":"kadın ceza infaz koruma görevlisi","c":"sevk edilen kadın tutuklu-hükümlüye verilir","n":"","k":"(2) Sevk edilen tutuklu ve hükümlünün kadın olması durumunda, kadın ceza infaz koruma görevlisi verilir.","x":[]},{"m":"30","g":"yolda hastalandığında","c":"en yakın hekimli jandarma birliğine; devam edemezse savcı talimatıyla cezaevine","n":"","k":"MADDE 30- (1) Sevk ve nakil sırasında tutuklu ya da hükümlü yolda hastalandığında hekim ya da sağlık kuruluşu bulunan en yakın jandarma birliğine kadar götürülerek muayene ve tedavileri yaptırılır. Bu gibilerin yola devam edemeyecekleri hekim muayenesi ile anlaşıldığında; iyileştikten sonra usulüne uygun biçimde sevk edilmek üzere, bütün eşya ve evrakı ile birlikte Cumhuriyet savcısının talimatıyla belirlenecek ceza ve tutukevine teslim edilir.","x":[]},{"m":"31","g":"birisi öldüğünde","c":"en yakın jandarma birliğine, oradan savcılığa; devriye komutanı tutanak","n":"","k":"MADDE 31- (1) Sevk ve nakil sırasında tutuklu ya da hükümlülerden birisi öldüğünde durum en elverişli haberleşme aracı ile en yakın jandarma birliği komutanlığına ve bu komutanlıkça da o yerin Cumhuriyet savcılığına bildirilir. Bu konuda devriye komutanının düzenleyeceği tutanak ilgili makama verilir.","x":[]},{"m":"32","g":"silah kullanılacağı ihtar edilir","c":"isyan/firar hazırlığında devriye komutanı; başka çare yoksa silah","n":"","k":"MADDE 32- (1) Sevk ve nakil sırasında tutuklu veya hükümlülerin isyan ya da firar hazırlığı içinde olduklarından kuşkulanıldığında, sevke görevli devriye komutanı tarafından, böyle bir harekete kalkıştıklarında silah kullanılacağı ihtar edilir. Bu ihtara uymayarak firara teşebbüs etmeleri durumunda firarın başka şekilde önlenmesine imkân bulunmazsa silah kullanılır.","x":[]},{"m":"32","g":"sevke devam edip edemeyeceklerini","c":"Cumhuriyet savcısı belirler; jandarma tutuklanırsa o yer jandarması","n":"","k":"(3) Bu gibi durumlarda diğer tutuklu ve hükümlülerle sevkle görevli jandarmaların sevke devam edip edemeyeceklerini Cumhuriyet savcısı belirler. Jandarmaların tutuklanması ya da soruşturmanın uzaması durumunda sevk işlemi o yer jandarması tarafından yapılır.","x":[]},{"m":"33","g":"gündüz varılacak biçimde","c":"sevk hareketi; konaklama cezaevi, emniyet odası, karakol, köy odası","n":"","k":"MADDE 33- (1) Sevk ve nakillerde, gidilecek yere gündüz varılacak biçimde hareket edilir. Zorunluluk nedeniyle konaklamak durumunda kalınırsa tutuklu ve hükümlülerin geceyi yol üzerinde bulunan il ya da ilçe merkezlerindeki ceza infaz kurumlarında, zorunluluk varsa jandarma birimlerinin emniyet odalarında geçirmeleri sağlanır. Belde ve köylerde jandarma karakolunda, karakol yoksa köy odasında, belediye hizmet binasında konaklamaya uygun bir odada gerekli önlemler alınarak kalınabilir.","x":[]},{"m":"35",
