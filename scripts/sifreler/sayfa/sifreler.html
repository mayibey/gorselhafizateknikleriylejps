<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Inter:wght@500;600;700;800&display=swap">
<style>
:root{
  --zemin:#F7F3EA; --kart:#FFFCF5; --kenar:#E7DCC7; --ayirici:#EFE6D6;
  --metin:#1B2A4A; --soluk:#6E6047; --krom:#0B1F3A; --krom2:#173B6B;
  --altin:#C9A227; --altinkoyu:#B88917; --altinyuzey:#F3E7C1; --kirmizi:#C00000;
  --vurgu:#FFF1C9;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --zemin:#0C1729; --kart:#13223A; --kenar:#25385A; --ayirici:#1C2D4A;
    --metin:#EFE7D8; --soluk:#B5A88E; --krom:#08121F; --krom2:#9DB8E0;
    --altin:#D9B444; --altinkoyu:#E3C25C; --altinyuzey:#3A3119; --kirmizi:#FF6B6B;
    --vurgu:#4A3D14;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --zemin:#0C1729; --kart:#13223A; --kenar:#25385A; --ayirici:#1C2D4A;
  --metin:#EFE7D8; --soluk:#B5A88E; --krom:#08121F; --krom2:#9DB8E0;
  --altin:#D9B444; --altinkoyu:#E3C25C; --altinyuzey:#3A3119; --kirmizi:#FF6B6B;
  --vurgu:#4A3D14;
}
*{box-sizing:border-box}
html,body{overflow-x:hidden}
body{background:var(--zemin);color:var(--metin);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px;line-height:1.45}
.sar{max-width:760px;margin:0 auto;padding-inline:16px}
.ust{background:var(--krom);color:#F7F3EA;padding-block:26px 20px}
.ust h1{font-family:"Playfair Display",Georgia,serif;font-weight:800;font-size:clamp(28px,6vw,38px);line-height:1.1;margin:0 0 8px;text-wrap:balance}
.ust p{margin:0;color:#D8CDB6;max-width:60ch}
.ust .ornek{margin-top:12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-weight:700}
.ust .ornek .tt{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);padding:3px 10px;border-radius:6px}
.ust .ornek .ok{color:var(--altin)}
.ust .sayac{margin-top:12px;font-size:13px;color:#BFB49C;font-variant-numeric:tabular-nums}
.arac{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--zemin);border-bottom:1px solid var(--kenar);padding-block:10px}
.arac .sar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.arac input[type=search],.arac select{font:inherit;color:var(--metin);background:var(--kart);border:1px solid var(--kenar);border-radius:8px;padding:8px 11px;min-width:0}
.arac input[type=search]{flex:1 1 200px}
.arac select{flex:1 1 200px;max-width:100%}
.anahtar{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:14px;cursor:pointer;user-select:none;padding:7px 11px;border:1px solid var(--kenar);border-radius:8px;background:var(--kart)}
.anahtar input{accent-color:var(--altinkoyu);width:16px;height:16px}
input:focus-visible,select:focus-visible,.anahtar:focus-within,.satir:focus-visible{outline:2px solid var(--altin);outline-offset:2px}
main{padding-block:14px 60px}
.kanun{margin-bottom:30px}
.kanun h2{font-family:"Playfair Display",Georgia,serif;font-weight:700;font-size:21px;line-height:1.25;margin:0 0 2px;text-wrap:balance}
.kanun .alt{color:var(--soluk);font-size:13px;margin-bottom:10px;font-variant-numeric:tabular-nums}
.tablo{background:var(--kart);border:1px solid var(--kenar);border-radius:10px;overflow:hidden}
.satir{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:4px 12px;padding:10px 12px;border-top:1px solid var(--ayirici);cursor:pointer;min-width:0}
.satir:first-child{border-top:0}
.satir:hover{background:color-mix(in srgb,var(--vurgu) 35%,transparent)}
.kel{font-weight:800;overflow-wrap:anywhere}
.kel mark{background:var(--vurgu);color:inherit;padding:0 4px;border-radius:4px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.kel small{display:block;font-weight:500;color:var(--soluk);font-size:12px;margin-top:2px;font-variant-numeric:tabular-nums}
.cev{font-weight:700;overflow-wrap:anywhere}
.cev small{display:block;font-weight:500;color:var(--soluk);font-size:12.5px;margin-top:2px}
.detay{grid-column:1/-1;display:none;font-size:13.5px;color:var(--soluk);border-left:2px solid var(--altin);padding-left:10px;margin-top:4px}
.satir.acik .detay{display:grid;gap:6px}
.detay .kanit{font-style:italic;max-width:70ch}
.detay .kanit b{font-style:normal;color:var(--metin);background:var(--vurgu);padding:0 2px;border-radius:3px}
.detay ul{margin:0;padding-left:16px}
body.ezber .cev{filter:blur(7px);user-select:none;transition:filter .15s}
body.ezber .satir.acik .cev{filter:none}
@media (prefers-reduced-motion:reduce){body.ezber .cev{transition:none}}
.bos{color:var(--soluk);padding:30px 0;text-align:center}
.not{color:var(--soluk);font-size:12.5px;max-width:70ch;margin-top:26px;border-top:1px solid var(--kenar);padding-top:12px}
@media (max-width:420px){.satir{grid-template-columns:1fr}.satir .cev{padding-left:10px;border-left:2px solid var(--ayirici)}}
</style>

<script>
const VERI = [{"id":1,"ad":"5237 sayılı Türk Ceza Kanunu (müşterek kapsam)","grup":"müşterek","satirlar":[{"m":"2","g":"düzenleyici işlemleriyle","c":"suç ve ceza konulamaz","n":"yönetmelik, genelge ile suç olmaz","k":"(2) İdarenin düzenleyici işlemleriyle suç ve ceza konulamaz.","x":[]},{"m":"2","g":"kıyas","c":"yapılamaz; geniş yorum da yasak","n":"","k":"(3) Kanunların suç ve ceza içeren hükümlerinin uygulanmasında kıyas yapılamaz. Suç ve ceza içeren hükümler, kıyasa yol açacak biçimde geniş yorumlanamaz.","x":[]},{"m":"4","g":"bilmemek","c":"mazeret sayılmaz","n":"ceza kanunlarını bilmemek","k":"(1) Ceza kanunlarını bilmemek mazeret sayılmaz.","x":[]},{"m":"5","g":"özel ceza kanunları","c":"TCK genel hükümleri orada da uygulanır","n":"","k":"(1) Bu Kanunun genel hükümleri, özel ceza kanunları ve ceza içeren kanunlardaki suçlar hakkında da uygulanır.","x":[]},{"m":"8","g":"sabit platformlarda","c":"Türkiye'de işlenmiş sayılır","n":"kıt'a sahanlığı, münhasır ekonomik bölge; neticenin Türkiye'de gerçekleşmesi de yeter","k":"d) Türkiye'nin kıt'a sahanlığında veya münhasır ekonomik bölgesinde tesis edilmiş sabit platformlarda veya bunlara karşı, işlendiğinde Türkiye'de işlenmiş sayılır.","x":[]},{"m":"20","g":"Tüzel kişiler hakkında","c":"ceza yok; güvenlik tedbiri var","n":"ceza sorumluluğu şahsidir","k":"(2) Tüzel kişiler hakkında ceza yaptırımı uygulanamaz. Ancak, suç dolayısıyla kanunda öngörülen güvenlik tedbiri niteliğindeki yaptırımlar saklıdır.","x":[["253","rüşvetle menfaat sağlanan tüzel kişiye güvenlik tedbiri"]]},{"m":"21","g":"öngörmesine rağmen","c":"olası kast","n":"ceza üçte birden yarısına kadar İNDİRİLİR; müebbet yerine yirmi–yirmibeş yıl","k":"(2) Kişinin, suçun kanuni tanımındaki unsurların gerçekleşebileceğini öngörmesine rağmen, fiili işlemesi halinde olası kast vardır. Bu halde, ağırlaştırılmış müebbet hapis cezasını gerektiren suçlarda müebbet hapis cezasına, müebbet hapis cezasını gerektiren suçlarda yirmi yıldan yirmibeş yıla kadar hapis cezasına hükmolunur; diğer suçlarda ise temel ceza üçte birden yarısına kadar indirilir.","x":[]},{"m":"22","g":"istememesine karşın","c":"bilinçli taksir","n":"ceza üçte birden yarısına kadar ARTIRILIR","k":"(3) Kişinin öngördüğü neticeyi istememesine karşın, neticenin meydana gelmesi halinde bilinçli taksir vardır; bu halde taksirli suça ilişkin ceza üçte birden yarısına kadar artırılır.","x":[]},{"m":"22","g":"kişisel ve ailevi durumu","c":"ceza verilmez","n":"taksirle kendi yakınına zarar; bilinçli taksirde yarıdan altıda bire indirilebilir","k":"(6) Taksirli hareket sonucu neden olunan netice, münhasıran failin kişisel ve ailevi durumu bakımından, artık bir cezanın hükmedilmesini gereksiz kılacak derecede mağdur olmasına yol açmışsa ceza verilmez; bilinçli taksir halinde verilecek ceza yarıdan altıda bire kadar indirilebilir.","x":[]},{"m":"23","g":"en azından taksirle","c":"netice sebebiyle ağırlaşmış suçta sorumluluk şartı","n":"kastedilenden daha ağır netice","k":"(1) Bir fiilin, kastedilenden daha ağır veya başka bir neticenin oluşumuna sebebiyet vermesi halinde, kişinin bundan dolayı sorumlu tutulabilmesi için bu netice bakımından en azından taksirle hareket etmesi gerekir.","x":[]},{"m":"35","g":"elinde olmayan nedenlerle","c":"teşebbüs","n":"elverişli hareketlerle doğrudan icraya başlamış olmalı","k":"(1) Kişi, işlemeyi kastettiği bir suçu elverişli hareketlerle doğrudan doğruya icraya başlayıp da elinde olmayan nedenlerle tamamlayamaz ise teşebbüsten dolayı sorumlu tutulur.","x":[]},{"m":"35","g":"Suça teşebbüs halinde","c":"dörtte birinden dörtte üçüne kadar İNDİRİM","n":"zincirleme suçta aynı oran artırım; ağırlaştırılmış müebbet yerine ondört–yirmibir, müebbet yerine on–onsekiz yıl","k":"(2) Suça teşebbüs halinde fail, meydana gelen zarar veya tehlikenin ağırlığına göre, ağırlaştırılmış müebbet hapis cezası yerine ondört yıldan yirmibir yıla kadar, müebbet hapis cezası yerine on yıldan onsekiz yıla kadar hapis cezası ile cezalandırılır. Diğer hallerde verilecek cezanın dörtte birinden dörtte üçüne kadarı indirilir.","x":[["43","zincirleme suçta aynı oran ARTIRIM"]]},{"m":"36","g":"gönüllü vazgeçer","c":"teşebbüsten ceza yok","n":"tamamlanan kısım suçsa yalnız ondan ceza","k":"(1) Fail, suçun icra hareketlerinden gönüllü vazgeçer veya kendi çabalarıyla suçun tamamlanmasını veya neticenin gerçekleşmesini önlerse, teşebbüsten dolayı cezalandırılmaz; fakat tamam olan kısım esasen bir suç oluşturduğu takdirde, sadece o suça ait ceza ile cezalandırılır.","x":[]},{"m":"37","g":"araç olarak kullanan","c":"dolaylı fail; fail gibi sorumlu","n":"kusur yeteneği olmayanı kullanırsa üçte birden yarısına artırım","k":"(2) Suçun işlenmesinde bir başkasını araç olarak kullanan kişi de fail olarak sorumlu tutulur. Kusur yeteneği olmayanları suçun işlenmesinde araç olarak kullanan kişinin cezası, üçte birden yarısına kadar artırılır.","x":[]},{"m":"38","g":"azmettiren kişi","c":"işlenen suçun cezası ile cezalandırılır","n":"fail ile aynı ceza","k":"(1) Başkasını suç işlemeye azmettiren kişi, işlenen suçun cezası ile cezalandırılır.","x":[]},{"m":"38","g":"Üstsoy ve altsoy","c":"azmettirmede üçte birden yarısına artırım","n":"çocuğu azmettirmede üstsoy-altsoy aranmaz","k":"(2) Üstsoy ve altsoy ilişkisinden doğan nüfuz kullanılmak suretiyle suça azmettirme halinde, azmettirenin cezası üçte birden yarısına kadar artırılır. Çocukların suça azmettirilmesi halinde, bu fıkra hükmüne göre cezanın artırılabilmesi için üstsoy ve altsoy ilişkisinin varlığı aranmaz.","x":[]},{"m":"38","g":"Azmettirenin belli olmaması","c":"ortaya çıkaran faile indirim","n":"diğer hallerde üçte bir; ağırlaştırılmış müebbet yerine yirmi–yirmibeş yıl","k":"(3) Azmettirenin belli olmaması halinde, kim olduğunun ortaya çıkmasını sağlayan fail veya diğer suç ortağı hakkında ağırlaştırılmış müebbet hapis cezası yerine yirmi yıldan yirmibeş yıla kadar, müebbet hapis cezası yerine onbeş yıldan yirmi yıla kadar hapis cezasına hükmolunabilir. Diğer hallerde verilecek cezada, üçte bir oranında indirim yapılabilir.","x":[]},{"m":"39","g":"sekiz yılı geçemez","c":"yardım eden; cezanın yarısı indirilir","n":"ağırlaştırılmış müebbet yerine onbeş–yirmi, müebbet yerine on–onbeş yıl","k":"Diğer hallerde cezanın yarısı indirilir. Ancak, bu durumda verilecek ceza sekiz yılı geçemez.","x":[]},{"m":"39","g":"kararını kuvvetlendirmek","c":"yardım eden (azmettirme değil)","n":"teşvik, sonradan yardım vaadi, yol gösterme, araç sağlama da yardım etmedir","k":"a) Suç işlemeye teşvik etmek veya suç işleme kararını kuvvetlendirmek veya fiilin işlenmesinden sonra yardımda bulunacağını vaat etmek.","x":[["38","azmettirme: suç kararı olmayan kişide karar oluşturmak"]]},{"m":"40","g":"Özgü suçlarda","c":"yalnız özel sıfatlı kişi fail olur","n":"diğerleri azmettiren ya da yardım eden","k":"(2) Özgü suçlarda, ancak özel faillik niteliğini taşıyan kişi fail olabilir. Bu suçların işlenişine iştirak eden diğer kişiler ise azmettiren veya yardım eden olarak sorumlu tutulur.","x":[]},{"m":"41","g":"sadece gönüllü vazgeçen","c":"yalnız vazgeçen ortak yararlanır","n":"diğer ortaklar yararlanmaz","k":"(1) İştirak halinde işlenen suçlarda, sadece gönüllü vazgeçen suç ortağı, gönüllü vazgeçme hükümlerinden yararlanır.","x":[]},{"m":"42","g":"bileşik suç","c":"içtima hükümleri uygulanmaz","n":"biri diğerinin unsuru ya da ağırlaştırıcı nedeni","k":"(1) Biri diğerinin unsurunu veya ağırlaştırıcı nedenini oluşturması dolayısıyla tek fiil sayılan suça bileşik suç denir. Bu tür suçlarda içtima hükümleri uygulanmaz.","x":[]},{"m":"43","g":"değişik zamanlarda","c":"zincirleme suç; tek ceza, dörtte birden dörtte üçe ARTIRIM","n":"aynı kişiye karşı aynı suç; mağduru belirsiz suçlarda da","k":"(1) Bir suç işleme kararının icrası kapsamında, değişik zamanlarda bir kişiye karşı aynı suçun birden fazla işlenmesi durumunda, bir cezaya hükmedilir. Ancak bu ceza, dörtte birinden dörtte üçüne kadar artırılır.","x":[["35","teşebbüste aynı oran indirim"]]},{"m":"43","g":"tek bir fiille","c":"birden fazla kişiye karşı aynı suç: zincirleme hükmü","n":"","k":"(2) Aynı suçun birden fazla kişiye karşı tek bir fiille işlenmesi durumunda da, birinci fıkra hükmü uygulanır.","x":[]},{"m":"43","g":"işkence ve yağma","c":"zincirleme suç uygulanmaz","n":"kasten öldürme ve kasten yaralamada da uygulanmaz","k":"(3) Kasten öldürme, kasten yaralama, işkence ve yağma suçlarında bu madde hükümleri uygulanmaz.","x":[]},{"m":"44","g":"farklı suçun","c":"fikri içtima; en ağır cezayı gerektiren suçtan","n":"tek fiil, birden fazla farklı suç","k":"(1) İşlediği bir fiil ile birden fazla farklı suçun oluşmasına sebebiyet veren kişi, bunlardan en ağır cezayı gerektiren suçtan dolayı cezalandırılır.","x":[]},{"m":"247","g":"zimmetine geçiren","c":"beş yıldan oniki yıla kadar hapis","n":"görevi nedeniyle zilyetliği devredilmiş mal; kamu görevlisi","k":"(1) Görevi nedeniyle zilyedliği kendisine devredilmiş olan veya koruma ve gözetimiyle yükümlü olduğu malı kendisinin veya başkasının zimmetine geçiren kamu görevlisi, beş yıldan oniki yıla kadar hapis cezası ile cezalandırılır.","x":[]},{"m":"247","g":"açığa çıkmamasını","c":"nitelikli zimmet; ceza yarı oranında artırılır","n":"hileli davranışla gizleme","k":"(2) Suçun, zimmetin açığa çıkmamasını sağlamaya yönelik hileli davranışlarla işlenmesi halinde, verilecek ceza yarı oranında artırılır.","x":[]},{"m":"247","g":"iade edilmek üzere","c":"kullanma zimmeti; yarı oranına kadar indirilebilir","n":"geçici kullanıp geri koyma","k":"(3) Zimmet suçunun, malın geçici bir süre kullanıldıktan sonra iade edilmek üzere işlenmesi halinde, verilecek ceza yarı oranına kadar indirilebilir.","x":[]},{"m":"248","g":"Soruşturma başlamadan önce","c":"zimmette etkin pişmanlık: üçte ikisi indirilir","n":"soruşturma öncesi üçte iki → kovuşturma öncesi yarısı → hükümden önce üçte bir","k":"(1) Soruşturma başlamadan önce, zimmete geçirilen malın aynen iade edilmesi veya uğranılan zararın tamamen tazmin edilmesi halinde, verilecek cezanın üçte ikisi indirilir. (2) Kovuşturma başlamadan önce, gönüllü olarak, zimmete geçirilen malın aynen iade edilmesi veya uğranılan zararın tamamen tazmin edilmesi halinde, verilecek cezanın yarısı indirilir. Etkin pişmanlığın hükümden önce gerçekleşmesi halinde, verilecek cezanın üçte biri indirilir.","x":[]},{"m":"248","g":"Kovuşturma başlamadan önce","c":"cezanın yarısı indirilir","n":"","k":"(1) Soruşturma başlamadan önce, zimmete geçirilen malın aynen iade edilmesi veya uğranılan zararın tamamen tazmin edilmesi halinde, verilecek cezanın üçte ikisi indirilir. (2) Kovuşturma başlamadan önce, gönüllü olarak, zimmete geçirilen malın aynen iade edilmesi veya uğranılan zararın tamamen tazmin edilmesi halinde, verilecek cezanın yarısı indirilir. Etkin pişmanlığın hükümden önce gerçekleşmesi halinde, verilecek cezanın üçte biri indirilir.","x":[]},{"m":"248","g":"hükümden önce","c":"cezanın üçte biri indirilir","n":"","k":"(1) Soruşturma başlamadan önce, zimmete geçirilen malın aynen iade edilmesi veya uğranılan zararın tamamen tazmin edilmesi halinde, verilecek cezanın üçte ikisi indirilir. (2) Kovuşturma başlamadan önce, gönüllü olarak, zimmete geçirilen malın aynen iade edilmesi veya uğranılan zararın tamamen tazmin edilmesi halinde, verilecek cezanın yarısı indirilir. Etkin pişmanlığın hükümden önce gerçekleşmesi halinde, verilecek cezanın üçte biri indirilir.","x":[]},{"m":"249","g":"değerinin azlığı","c":"üçte birden yarıya kadar indirilir","n":"zimmette","k":"(1) Zimmet suçunun konusunu oluşturan malın değerinin azlığı nedeniyle, verilecek ceza üçte birden yarıya kadar indirilir.","x":[]},{"m":"250","g":"icbar eden","c":"irtikâp; beş yıldan on yıla kadar hapis","n":"ZORLA = İRTİKÂP, ANLAŞMA = RÜŞVET","k":"Görevinin sağladığı nüfuzu kötüye kullanmak suretiyle kendisine veya başkasına yarar sağlanmasına veya bu yolda vaatte bulunulmasına bir kimseyi icbar eden kamu görevlisi, beş yıldan on yıla kadar hapis cezası ile cezalandırılır.","x":[["252","rüşvet: anlaşma var, iki taraf da suçlu"]]},{"m":"250","g":"kendisini mecbur hissederek","c":"icbar sayılır","n":"haklı işinin görülmeyeceği endişesiyle menfaat vermişse","k":"Kamu görevlisinin haksız tutum ve davranışları karşısında, kişinin haklı bir işinin gereği gibi, hiç veya en azından vaktinde görülmeyeceği endişesiyle, kendisini mecbur hissederek, kamu görevlisine veya yönlendireceği kişiye menfaat temin etmiş olması halinde, icbarın varlığı kabul edilir.","x":[]},{"m":"250","g":"ikna eden","c":"ikna suretiyle irtikâp; üç yıldan beş yıla","n":"hileli davranışla kandırma","k":"(2) Görevinin sağladığı güveni kötüye kullanmak suretiyle gerçekleştirdiği hileli davranışlarla, kendisine veya başkasına yarar sağlanmasına veya bu yolda vaatte bulunulmasına bir kimseyi ikna eden kamu görevlisi, üç yıldan beş yıla kadar hapis cezası ile cezalandırılır.","x":[]},{"m":"250","g":"hatasından yararlanarak","c":"irtikâp; bir yıldan üç yıla","n":"ZORLA beş–on, KANDIR üç–beş, HATA bir–üç yıl","k":"(3) İkinci fıkrada tanımlanan suçun kişinin hatasından yararlanarak işlenmiş olması halinde, bir yıldan üç yıla kadar hapis cezasına hükmolunur.","x":[]},{"m":"251","g":"göz yuman","c":"denetim görevlisi müşterek fail","n":"kasten göz yumma","k":"(1) Zimmet veya irtikap suçunun işlenmesine kasten göz yuman denetimle yükümlü kamu görevlisi, işlenen suçun müşterek faili olarak sorumlu tutulur.","x":[]},{"m":"251","g":"Denetim görevini ihmal","c":"üç aydan üç yıla kadar hapis","n":"zimmet ya da irtikâba imkân sağlama","k":"(2) Denetim görevini ihmal ederek, zimmet veya irtikap suçunun işlenmesine imkan sağlayan kamu görevlisi, üç aydan üç yıla kadar hapis cezası ile cezalandırılır.","x":[]},{"m":"252","g":"Görevinin ifasıyla ilgili bir işi","c":"rüşvet; dört yıldan oniki yıla kadar hapis","n":"veren de alan da aynı ceza","k":"(1) Görevinin ifasıyla ilgili bir işi yapması veya yapmaması için, doğrudan veya aracılar vasıtasıyla, bir kamu görevlisine veya göstereceği bir başka kişiye menfaat sağlayan kişi, dört yıldan oniki yıla kadar hapis cezası ile cezalandırılır.","x":[]},{"m":"252","g":"Rüşvet konusunda anlaşmaya","c":"suç tamamlanmış sayılır","n":"para el değiştirmese de","k":"(3) Rüşvet konusunda anlaşmaya varılması halinde, suç tamamlanmış gibi cezaya hükmolunur.","x":[]},{"m":"252","g":"rüşvet talebinde bulunması","c":"kabul edilmezse ceza yarı oranında indirilir","n":"teklif reddedilirse de aynı","k":"(4) Kamu görevlisinin rüşvet talebinde bulunması ve fakat bunun kişi tarafından kabul edilmemesi ya da kişinin kamu görevlisine menfaat temini konusunda teklif veya vaatte bulunması ve fakat bunun kamu görevlisi tarafından kabul edilmemesi hâllerinde fail hakkında, birinci ve ikinci fıkra hükümlerine göre verilecek ceza yarı oranında indirilir.","x":[]},{"m":"252","g":"rüşvetin temini hususlarında aracılık","c":"aracı müşterek fail; kamu görevlisi olmasa da","n":"","k":"(5) Rüşvet teklif veya talebinin karşı tarafa iletilmesi, rüşvet anlaşmasının sağlanması veya rüşvetin temini hususlarında aracılık eden kişi, kamu görevlisi sıfatını taşıyıp taşımadığına bakılmaksızın, müşterek fail olarak cezalandırılır.","x":[]},{"m":"252","g":"yeminli mali müşavir","c":"rüşvette üçte birden yarısına artırım","n":"yargı görevi yapan, hakem, bilirkişi, noter de","k":"(7) Rüşvet alan veya talebinde bulunan ya da bu konuda anlaşmaya varan kişinin; yargı görevi yapan, hakem, bilirkişi, noter veya yeminli mali müşavir olması halinde, verilecek ceza üçte birden yarısına kadar artırılır.","x":[]},{"m":"254","g":"aynen teslim etmesi","c":"rüşvet alan: ceza yok (etkin pişmanlık)","n":"resmî makamlar öğrenmeden önce; veren pişmanlıkla haber verirse de ceza yok","k":"(1) (Değişik: 2/7/2012-6352/88 md.) Rüşvet alan kişinin, durum resmi makamlarca öğrenilmeden önce, rüşvet konusu şeyi soruşturmaya yetkili makamlara aynen teslim etmesi halinde, hakkında rüşvet suçundan dolayı cezaya hükmolunmaz.","x":[]},{"m":"255","g":"nüfuz sahibi olduğundan bahisle","c":"nüfuz ticareti; iki–beş yıl + beşbin güne kadar adli para","n":"kamu görevlisiyse hapis yarı artar; menfaat veren bir–üç yıl","k":"(1) Kamu görevlisi üzerinde nüfuz sahibi olduğundan bahisle, haksız bir işin gördürülmesi amacıyla girişimde bulunması için, doğrudan veya aracılar vasıtasıyla, kendisine veya bir başkasına menfaat temin eden kişi, iki yıldan beş yıla kadar hapis ve beşbin güne kadar adli para cezası ile cezalandırılır.","x":[]},{"m":"256","g":"ölçünün dışında kuvvet","c":"kasten yaralama hükümleri uygulanır","n":"zor kullanma yetkisinin aşılması","k":"(1) Zor kullanma yetkisine sahip kamu görevlisinin, görevini yaptığı sırada, kişilere karşı görevinin gerektirdiği ölçünün dışında kuvvet kullanması halinde, kasten yaralama suçuna ilişkin hükümler uygulanır.","x":[]},{"m":"257","g":"gereklerine aykırı hareket","c":"altı aydan iki yıla kadar hapis","n":"görevi kötüye kullanma, yaparak","k":"(1) Kanunda ayrıca suç olarak tanımlanan haller dışında, görevinin gereklerine aykırı hareket etmek suretiyle, kişilerin mağduriyetine veya kamunun zararına neden olan ya da kişilere haksız bir menfaat sağlayan kamu görevlisi, altı aydan iki yıla kadar hapis cezası ile cezalandırılır.","x":[]},{"m":"257","g":"ihmal veya gecikme","c":"üç aydan bir yıla kadar hapis","n":"YAPARAK altı ay–iki yıl, YAPMAYARAK üç ay–bir yıl","k":"(2) Kanunda ayrıca suç olarak tanımlanan haller dışında, görevinin gereklerini yapmakta ihmal veya gecikme göstererek, kişilerin mağduriyetine veya kamunun zararına neden olan ya da kişilere haksız bir menfaat sağlayan kamu görevlisi, üç aydan bir yıla kadar hapis cezası ile cezalandırılır.","x":[]},{"m":"258","g":"gizli kalması gereken","c":"göreve ilişkin sırrın açıklanması; bir yıldan dört yıla","n":"","k":"(1) Görevi nedeniyle kendisine verilen veya aynı nedenle bilgi edindiği ve gizli kalması gereken belgeleri, kararları ve emirleri ve diğer tebligatı açıklayan veya yayınlayan veya ne suretle olursa olsun başkalarının bilgi edinmesini kolaylaştıran kamu görevlisine, bir yıldan dört yıla kadar hapis cezası verilir.","x":[]},{"m":"258","g":"sıfatı sona erdikten sonra","c":"aynı ceza","n":"görevden ayrılsa da","k":"(2) Kamu görevlisi sıfatı sona erdikten sonra, birinci fıkrada yazılı fiilleri işleyen kimseye de aynı ceza verilir.","x":[]},{"m":"259","g":"mal veya hizmet satmaya","c":"altı aya kadar hapis veya adlî para","n":"kamu görevlisinin ticareti","k":"(1) Yürüttüğü görevin sağladığı nüfuzdan yararlanarak, bir başkasına mal veya hizmet satmaya çalışan kamu görevlisi, altı aya kadar hapis veya adlî para cezası ile cezalandırılır.","x":[]},{"m":"260","g":"üçten fazla olmaması","c":"toplu görev terkinde ceza yok","n":"en az dört kamu görevlisi olmalı; ceza üç aydan bir yıla","k":"(1) Hukuka aykırı olarak ve toplu biçimde, görevlerini terk eden, görevlerine gelmeyen, görevlerini geçici de olsa kısmen veya tamamen yapmayan veya yavaşlatan kamu görevlilerinin her biri hakkında üç aydan bir yıla kadar hapis cezası verilir. Kamu görevlisi sayısının üçten fazla olmaması halinde cezaya hükmolunmaz.","x":[]},{"m":"260","g":"mesleki ve sosyal hakları","c":"kısa süreli iş bırakma: indirim ya da ceza yok","n":"hizmeti aksatmayacak biçimde","k":"(2) Kamu görevlilerinin mesleki ve sosyal hakları ile ilgili olarak, hizmeti aksatmayacak biçimde, geçici ve kısa süreli iş bırakmaları veya yavaşlatmaları halinde, verilecek cezada indirim yapılabileceği gibi, ceza da verilmeyebilir.","x":[]},{"m":"261","g":"karşılık ödenmek suretiyle de olsa","c":"kişilerin malları üzerinde usulsüz tasarruf; altı ay–iki yıl","n":"","k":"(1) İlgili kanunlarda belirlenen koşullara aykırı olduğunu bilerek, kişilerin taşınır veya taşınmaz malları üzerinde, karşılık ödenmek suretiyle de olsa, zorla tasarrufta bulunan kamu görevlisi, fiil daha ağır cezayı gerektiren bir suç oluşturmadığı takdirde, altı aydan iki yıla kadar hapis cezası ile cezalandırılır.","x":[]},{"m":"262","g":"terk emri","c":"görevi sürdüren; üç aydan iki yıla","n":"kamu görevinin usulsüz üstlenilmesi","k":"(1) Bir kamu ında artırılır.","x":[]},{"m":"266","g":"araç ve gereçleri","c":"üçte biri oranında artırılır","n":"görev araçlarıyla suç","k":"(1) Görevi gereği olarak elinde bulundurduğu araç ve gereçleri bir suçun işlenmesi sırasında kullanan kamu görevlisi hakkında, ilgili suçun tanımında kamu görevlisi sıfatı esasen göz önünde bulundurulmamış ise, verilecek ceza üçte biri oranında artırılır.","x":[]},{"m":"317","g":"komutasını alanlara","c":"müebbet hapis","n":"yetkisiz komuta; terk emrine uymayan komutana da","k":"(1) Kanunen yetkili olmadıkları veya Devlet tarafından memur edilmedikleri halde, bir asker kıtasının veya donanmasının veya savaş gemisinin veya savaş hava filosunun veya bir kale veya müstahkem mevkiin veya bir askerî üssün veya tesisin, bir liman veya şehrin komutasını alanlara müebbet hapis cezası verilir.","x":[]},{"m":"318","g":"firara sevk edecek","c":"halkı askerlikten soğutma; altı aydan iki yıla","n":"basın yayın yoluyla yarı artırım","k":"Askerlik hizmetini yapanları firara sevk edecek veya askerlik hizmetine katılacak olanları bu hizmeti yapmaktan vazgeçirecek şekilde teşvik veya telkinde bulunanlara altı aydan iki yıla kadar hapis cezası verilir.","x":[]},{"m":"319","g":"itaatsizliğe","c":"askerleri itaatsizliğe teşvik; bir yıldan üç yıla","n":"aleni ise iki–beş yıl; savaş zamanında bir kat artar","k":"(1) Askerleri veya askerî idareye bağlı olarak görev yapan diğer kişileri kanunlara karşı itaatsizliğe veya yeminlerini bozmaya veya askerî disiplini veya askerlik hizmetine ilişkin görevlerini ihlale yönelten ve tahrik edenler ile kanunlara, yeminlere veya disiplin veya diğer görevlere aykırı hareketleri askerler önünde öven veya iyi gördüğünü söyleyen kimselere, bir yıldan üç yıla kadar hapis cezası verilir.","x":[]},{"m":"320","g":"vatandaşlardan asker yazan","c":"yabancı hizmetine asker toplama; üç yıldan altı yıla","n":"hizmeti kabul eden bir–üç yıl","k":"(1) Hükûmetin izni olmaksızın bir yabancı veya yabancı Devlet hizmetinde veya bunların lehinde ç arma, kanunlarda öngörülen (görevin gereği olarak)","n":"yönetmelik/genelge/emirle değil, kanunla","k":"Jandarma, kendisine verilen görevlerin ifası sırasında hizmet özelliğine uygun ve görevin gereği olarak kanunlarda öngörülen silah kullanma yetkisine sahiptir.","x":[]},{"m":"13","g":"statü ve rütbelerine göre","c":"nasıp-terfi, mali-sosyal haklar: 926, 4678, 3466, 3269, 6191 sayılı kanunlar","n":"657 bu listede yok (o, Jandarma Hizmetleri Sınıfı için)","k":"Ancak, nasıp ve terfi, aylık ve diğer mali ve sosyal haklar bakımından statü ve rütbelerine göre 27/7/1967 tarihli ve 926 sayılı Türk Silâhlı Kuvvetleri Personel Kanunu, 13/6/2001 tarihli ve 4678 sayılı Türk Silahlı Kuvvetlerinde İstihdam Edilecek Sözleşmeli Subay ve Astsubaylar Hakkında Kanun, 28/5/1988 tarihli ve 3466 sayılı Uzman\n\nJandarma Kanunu, 18/3/1986 tarihli ve 3269 sayılı Uzman Erbaş Kanunu ile 10/3/2011 tarihli ve 6191 sayılı Sözleşmeli Erbaş ve Er Kanununa tabi personel hakkındaki hükümler uygulanır.","x":[]},{"m":"1","g":"teşkilat ve konuşa ait esas","c":"görev, yetki ve sorumluluk; bağlılık ve ilişkiler; teşkilat ve konuş","n":"\"özel hukuk sözleşmeleri\" Kanunun konusu değil","k":"Madde 1 – Bu Kanun, Türkiye Cumhuriyeti Jandarma Teşkilatının görev, yetki ve sorumluluklarına, hizmetin gerektirdiği bağlılık ve ilişkilere, teşkilat ve konuşa ait esas ve usulleri düzenler.","x":[]},{"m":"2","g":"karargah, birlik ve kurumlar ile","c":"Kanunun kapsamı; buralarda hizmet gören personel ve faaliyetler","n":"","k":"Madde 2 – Bu Kanun, Jandarma Teşkilatındaki karargah, birlik ve kurumlar ile buralarda hizmet gören personeli ve bunlarla ilgili faaliyet ve esasları kapsar.","x":[]},{"m":"8","g":"garnizon komutanının talep etmesi halinde","c":"illerde valinin onayıyla askeri görev; Genelkurmay talebiyle İçişleri Bakanı","n":"","k":"Ayrıca, Jandarma birlikleri; Genelkurmay Başkanlığının talebi üzerine İçişleri Bakanının, illerde ise garnizon komutanının talep etmesi halinde valinin onayıyla kendilerine veri ,"g":"bedelsiz olarak devredebilirler","c":"EGM, SG, JGK silah-araç-taşınmazları İçişleri Bakanı onayıyla; geçici tahsis de","n":"","k":"Ayrıca, İçişleri Bakanının onayıyla; Emniyet Genel Müdürlüğü, Sahil Güvenlik Komutanlığı ve Jandarma Genel Komutanlığı silah, mühimmat, teçhizat, taşıt ve diğer taşınırları ile taşınmazlarını birbirlerine geçici olarak tahsis edebilirler veya bedelsiz olarak devredebilirler.","x":[]},{"m":"13","g":"çarşı ve mahalle bekçileri hakkında","c":"Emniyet'teki emsal bekçilerin mali ve sosyal hakları uygulanır (JHS'de)","n":"","k":"Jandarma Hizmetleri Sınıfında yer alan çarşı ve mahalle bekçileri hakkında, Emniyet Hizmetleri Sınıfında yer alan emsali çarşı ve mahalle bekçilerinin mali ve sosyal hakları aynı usul ve esaslar çerçevesinde uygulanır. Bunlar hakkında birinci fıkranın ikinci cümlesi uygulanmaz.","x":[]},{"m":"13","g":"inha, seçim, görüş alma","c":"İçişleri dışındaki mercilere verilmiş yetkiler JGK personeli için uygulanmaz","n":"","k":"Nasıp ve terfi yetkilerinin kullanılmasıyla ilgili olan; 926 sayılı Kanun ve diğer kanunlarla, İçişleri Bakanlığı dışında, başka mercilere verilmiş inha, seçim, görüş alma ve benzeri yetkilere dair hükümler Jandarma Genel Komutanlığı personeli bakımından uygulanmaz.","x":[]},{"m":"13","g":"205 sayılı Ordu Yardımlaşma Kurumu","c":"JGK personeline TSK karşılığı rütbe-kıdemle OYAK Kanunu uygulanır","n":"","k":"Jandarma Genel Komutanlığı personeli hakkında, Türk Silahlı Kuvvetlerinde karşılığı olan rütbe ve kıdem üzerinden aynı şartlarla, 3/1/1961 tarihli ve 205 sayılı Ordu Yardımlaşma Kurumu Kanunu uygulanır.","x":[]},{"m":"13","g":"4857 sayılı İş Kanunu","c":"işçilerin işe alınma, izin, sicil, ödül, fesih; toplu iş sözleşmesi","n":"","k":"İşçilerin işe alınma, işyeri değişikliği, yükselme, izin, sicil, ödül ve hizmet akdinin feshi işlemleri 22/5/2003 tarihli ve 4857 sayılı İş Kanunu ile varsa geçerli bulunan toplu iş sözleşmesi hükümlerine göre yapılır.","x":[]},{"m":"13","g":"Arşiv Araştırması Kanununa göre","c":"JGK hesabına ve Akademide eğitim göreceklere güvenlik soruşturması","n":"","k":"Jandarma Genel Komutanlığı nam ve hesabına eğitim-öğrenim görecekler ile Jandarma ve Sahil Güvenlik Akademisi ve buna bağlı eğitimöğretim kurumlarında eğitim-öğrenim görecekler hakkında Güvenlik Soruşturması ve Arşiv Araştırması Kanununa göre güvenlik soruşturması ve arşiv araştırması yapılır.","x":[]},{"m":"14","g":"il jandarma komutanları dışında kalanlar","c":"atamaları İçişleri Bakanınca (JGK, yardımcıları, generaller, bölge/il komutanları hariç)","n":"","k":"Jandarma Genel Komutanı, Genel Komutan Yardımcıları, generaller, bölge ve il jandarma komutanları dışında kalanlar İçişleri Bakanınca yapılır.","x":[]},{"m":"14","g":"nokta atamasına tabi tutulabilir","c":"özel eğitimli personel; nokta ataması yapılmayanlar valilik emrine atanır","n":"il içi yer değiştirme vali","k":"İhtisaslaşma gereği olarak özel eğitim görmüş personel nokta atamasına tabi tutulabilir. Nokta ataması yapılmayan subay, astsubay ve uzman jandarmalar valilik emrine atanır ve bunların istihdam yerleri, il içi yer değiştirmeleri vali tarafından yapılır.","x":[]},{"m":"19","g":"İçişleri Bakanlığınca belirlenecek standartlara","c":"ikmal ihtiyaçları, silah mühimmat kendi bütçesinden; SSDF'den TSK usulüyle yararlanır","n":"","k":"Jandarma Genel Komutanlığı ikmal hizmetleriyle faaliyetlerine ait her türlü ihtiyacını ve silah ve mühimmatını İçişleri Bakanlığınca belirlenecek standartlara uygun olarak kendi bütçesinden karşılar. Ancak Jandarma Genel Komutanlığı, Savunma Sanayi Destekleme Fonundan Türk Silahlı Kuvvetlerinin tabi olduğu usul ve esaslar dahilinde yararlanır.","x":[]},{"m":"19","g":"muafiyet ve istisna hükümleri","c":"MSB-TSK gümrük, vergi, resim, harç, ardiye muafiyetleri JGK hakkında uygulanır","n":"","k":"Bütçe kanunları ve diğer kanunlarla Milli Savunma Bakanlığı ile Türk Silahlı Kuvvetlerine tanınan gümrük, her türlü vergi, resim, harç ve ardiye ücretlerine ilişkin muafiyet ve istisna hükümleri Jandarma Genel Komutanlığı hakkında da uygulanır.","x":[]},{"m":"20","g":"genel ve özel düzenleme getiren","c":"özlük hakları: 926, 657 ve diğer kanunlarla verilen haklardan yararlanır","n":"","k":"Madde 20 – Jandarma Genel Komutanlığı personeli; bu Kanunla getirilen hakların yanısıra, özlük hakları bakımından, 926 sayılı “Türk Silahlı Kuvvetleri Personel Kanunu”, 657 sayılı “Devlet Memurları Kanunu” ile genel ve özel düzenleme getiren diğer kanunlarla verilen haklardan da yararlanır.","x":[]},{"m":"21","g":"İçişleri Bakanlığınca belirlenecek usul","c":"asayiş tazminatı ödeme usulü; damga vergisi hariç kesinti yapılmaz","n":"","k":"geçmemek üzere İçişleri Bakanlığınca belirlenecek usul ve esaslara göre fazla çalışma karşılığı asayiş tazminatı ödenir. Bu tazminattan damga vergisi hariç herhangi bir vergi ve kesinti yapılmaz.","x":[]},{"m":"24","g":"Cumhurbaşkanınca yürürlüğe konulan yönetmelikle","c":"teşkilat, görev, yetki, komuta-kontrol, terfi, değerlendirme, ödül, kılık-kıyafet düzenlenir","n":"","k":"Bu Kanunla münhasıran yönetmelik çıkarılması öngörülen hususların yanısıra jandarmanın teşkilat, görev, yetki ve sorumlulukları, diğer makamlarla ilişkileri, birlikte çalışma ve işbirliği esasları dahil komuta ve kontrol ilişkileri ile Jandarma (…)23 personelinin terfi işleri, değerlendirme, ödüllendirme, kılık ve kıyafet ve Kanunun uygulanmasına ilişkin diğer hususlar; Cumhurbaşkanınca yürürlüğe konulan yönetmelikle düzenlenir.","x":[]},{"m":"15/A","g":"birlik komutanının veya kurum amirinin","c":"erbaş-er araması: gecikmede yazılı emri; yirmi dört saatte hâkim onayı","n":"asıl: sulh ceza hâkimi kararı","k":"birlik komutanının veya kurum amirinin yazılı emri (İptal ibare: Anayasa Mahkemesi’nin 30/6/2022 tarihli ve E.: 2018/137, K.: 2022/86 sayılı Kararı ile.) üzerine, jandarma hizmet binaları ve eklentilerinde, askerlik yükümlülüğünü yerine getiren erbaş ve erlerin üstü, özel kâğıtları ve eşyası aranır, gerekli tedbirler alınır, suç delilleri koruma altına alınarak 5271 sayılı Kanun hükümlerine göre gerekli işlemler yapılır.","x":[]},{"m":"15/A","g":"sebebi, konusu ve kapsamı","c":"arama kararında: yer, zaman, geçerli süre yazılır (personel adı yok)","n":"","k":"Arama kararında veya emrinde; aramanın sebebi, konusu ve kapsamı ile yapılacağı yer, zaman ve geçerli olacağı süre belirtilir. Aramanın sonucu, arama kararı veya emri veren merci veya makama bir tutanakla bildirilir.","x":[]},{"m":"15/A","g":"önleme araması yapılamaz","c":"konutta ve yerleşim yerinde ve eklentilerinde (erbaş-er araması)","n":"","k":"Konutta ve yerleşim yerinde ve eklentilerinde önleme araması yapılamaz.","x":[]},{"m":"Ek 1","g":"denetlenir ve teftiş edilir","c":"eylem-işlemlerini İçişleri Bakanlığı, mülki idare amirleri, kendi amirleri denetler","n":"","k":"eylem ve işlemleri İçişleri Bakanlığı, mülki idare amirleri ve kendi amirleri tarafından denetlenir ve teftiş edilir.","x":[]},{"m":"Ek 2","g":"kaymakamın değerlendirmesi alınarak il valisi","c":"ilçe jandarma komutanının değerlendirme raporu (il ve merkez ilçe: vali)","n":"","k":"İl jandarma komutanı ile merkez ilçe jandarma komutanı hakkında il valisince, ilçe jandarma komutanı hakkında kaymakamın değerlendirmesi alınarak il valisi tarafından her yıl sonunda söz konusu kişilerin (…) görevleri ile ilgili olarak değerlendirme raporu düzenlenir. Değerlendirme raporları; personelin terfi, ödüllendirme, atama ve yer değiştirmesinde dikkate alınır.","x":[]},{"m":"Ek 2","g":"içeriği ve düzenlenme esasları","c":"değerlendirme raporları: İçişleri Bakanlığı yönetmeliği; terfi-ödül-atama-yer değiştirmede dikkate alınır","n":"MSB değil","k":"Değerlendirme raporları; personelin terfi, ödüllendirme, atama ve yer değiştirmesinde dikkate alınır. Değerlendirme raporlarının içeriği ve düzenlenme esasları, (…) İçişleri Bakanlığı tarafından çıkarılan yönetmelikle düzenlenir.","x":[]},{"m":"Ek 3","g":"otuz gün yıllık izin","c":"her yıl, yol hariç; ayrıca onbeş güne kadar mazeret izni","n":"","k":"a) Personelin her yıl otuz gün yıllık izin hakkı vardır. Bu müddete yol dâhil değildir. Ayrıca, kısa süreli mazeretlerde kullanılmak üzere on beş güne kadar yıllık mazeret izni verilebilir.","x":[]},{"m":"Ek 3","g":"toplam altmış günü geçemez","c":"zorunlu nedenle kullanılamayan yıllık izin müteakip sene; birikim sınırı","n":"","k":"ç) Yıllık izinlerin senesi içinde kullanılması esastır. Ancak hizmet, alıkonulma, esaret ve sair zorunlu nedenlerle yıllık izinlerini kısmen veya tamamen kullanamayanların izinleri, müteakip sene içinde verilebilir. Bu müddet hiçbir suretle toplam altmış günü geçemez.","x":[]},{"m":"Ek 3","g":"izinden geriye çağrılabilir","c":"yıllık izin planlamasını onaylayan makam (görev ve hizmet ihtiyacı)","n":"","k":"d) Görev ve hizmet ihtiyacının gerektirdiği durumlarda, asgari yıllık izin planlamasını onaylayan makam tarafından personel izinden geriye çağrılabilir.","x":[]},{"m":"Ek 3","g":"yedi güne kadar mazeret","c":"kendisinin veya çocuğunun evlenmesi; doğum-ölüm hallerinde on güne kadar","n":"","k":"a) Eşinin doğum yapması, eşinin ölümü, çocuğunun ölümü, kendisinin veya eşinin ana, baba veya kardeşinin ölümü hallerinin her birinde isteği üzerine on güne kadar; kendisinin veya çocuğunun evlenmesi halinde isteği üzerine yedi güne kadar mazeret izni verilebilir.","x":[]},{"m":"Ek 3","g":"otuz güne kadar mazeret izni","c":"yangın, deprem, su baskını gibi olağanüstü mazeret; bir yıl içinde","n":"","k":"b) Yangın, deprem, su baskını gibi olağanüstü bir mazeret dolayısıyla bir yıl içinde otuz güne kadar mazeret izni verilebilir.","x":[]},{"m":"Ek 3","g":"radyoaktif ışınlarla çalışan personele","c":"her yıl yıllık izinden ayrı bir aylık izin","n":"","k":"c) Hizmetleri sırasında radyoaktif ışınlarla çalışan personele her yıl, yıllık izinlerinden ayrı olarak, bir aylık izin verilir.","x":[]},{"m":"Ek 3","g":"üç aya kadar izin verilebilir","c":"yakının ağır kaza/uzun hastalığı; bir katına uzatılır; altı ay aylıksız","n":"sağlık kurulu raporu şart; aynı vakada bir defa","k":"d) Bakmakla yükümlü olduğu veya refakat etmediği takdirde hayatı tehlikeye girecek anne, baba, eş ve çocukları ile kardeşlerinden birinin ağır bir kaza geçirmesi veya tedavisi uzun süren önemli bir hastalığa tutulmuş olması hâllerinde, bu hâllerin sağlık kurulu raporuyla belgelendirilmesi şartıyla, istekleri üzerine, aylık ve özlük hakları korunarak üç aya kadar izin verilebilir. Gerektiğinde bu süre bir katına kadar uzatılır. Bu sürenin bitimini müteakip istekleri üzerine ayrıca altı aya kadar aylıksız izin verilebilir. Bu bent hükmü aynı kişi ve aynı vakaya dayalı olarak bir defaya mahsus uygulanır.","x":[]},{"m":"Ek 3","g":"toptan veya bölümler hâlinde","c":"yüzde 70 engelli çocuk hastalanınca ana/babadan birine on gün","n":"","k":"e) En az yüzde 70 oranında engelli ya da süreğen hastalığı olan çocuğunun (çocuğun evli olması durumunda eşinin de en az yüzde 70 oranında engelli olması kaydıyla) hastalanması hâlinde hastalık raporuna dayalı olarak ana veya babadan sadece biri tarafından kullanılması kaydıyla bir yıl içinde toptan veya bölümler hâlinde on güne kadar mazeret izni verilir.","x":[]},{"m":"Ek 3","g":"iki yılı geçmemek üzere","c":"geçici hastalıkta sıhhi izin sınırı; kanser-verem uzun hastalıkta üç yıl","n":"","k":"a) Hizmet yapamayacak şekilde hastalanan personelin hastalığı geçici ise veya geçici olup sekel bırakan hastalıklardan ise, hastanelerde geçen teşhis ve tedavi süreleri hariç, ay ve gün hesabı ile her bir hastalığı için toplam olarak ve fiilen iki yılı geçmemek üzere, nekahet tedavisi, istirahat ve hava değişimi işlemine tabi tutulur. Bu gibiler hakkında raporlar sağlık kurulunca verilir. Sözleşmeli subay ve sözleşmeli astsubaylar için 4678 sayılı Kanun, uzman erbaşlar için 3269 sayılı Kanundaki sağlık durumları nedeniyle sözleşme fesih hükümleri saklıdır. b) Kanser, her türlü kötü huylu tümör, verem, kronik böbrek yetmezliği ile akıl ve ruh hastalıkları gibi uzun süreli bir tedaviye ihtiyaç gösteren hastalığa yakalananlar, sağlık kurulları raporlarında gösterilecek lüzum üzerine, toplam olarak ve fiilen üç yılı geçmemek şartı ile tedavi, istirahat veya hava değişimine tabi tutulabilirler.","x":[]},{"m":"Ek 3","g":"toplam yirmi dört hafta","c":"doğum izni: önce sekiz, sonra on altı hafta; çoğulda +iki","n":"","k":"ç) Kadın personele doğum yapmasından önce sekiz hafta ve doğum yaptığı tarihten itibaren on altı hafta olmak üzere toplam yirmi dört hafta süre ile aylıklı izin verilir. Çoğul gebelik halinde, doğum öncesi sekiz haftalık izin süresine iki hafta süre eklenir.","x":[]},{"m":"Ek 3","g":"günde üç saat","c":"süt izni ilk altı ay; sonraki altı ay bir buçuk","n":"","k":"Doğum yapan personele çocuklarını emzirmeleri için aylıklı izin süresinin bitim tarihinden itibaren ilk altı ayda günde üç saat, ikinci altı ayda günde bir buçuk saat süt izni verilir.","x":[]},{"m":"Ek 3","g":"Meslekî bilgi ve görgüsünü artırmak","c":"yurt dışı izni bir yıla; öğrenim süresince; mazerette üç ay","n":"","k":"a) İçişleri Bakanlığınca; 1) Öğrenim için öğrenim süresi kadar, 2) Meslekî bilgi ve görgüsünü artırmak maksadıyla bir yıla kadar, 3) Seminer, müşahede gezisi ve ziyaretler için lüzumlu görülen süre kadar, 4) Mazeret dolayısıyla yıllık izinle birlikte üç aya kadar, 5) Seyahat maksadıyla yurt dışına gidecek personele, bu maddenin birinci fıkrasında belirtilen yıllık izin süresi kadar, yurt dışı izni verilebilir.","x":[]},{"m":"Ek 3","g":"dört yıla kadar aylıklı izin","c":"yabancı emsal kurumlarda hizmet için İçişleri Bakanlığınca","n":"","k":"a) Yabancı memleketlerin emsal kurum ve kuruluşlarında hizmet yapmak üzere gönderileceklere İçişleri Bakanlığınca dört yıla kadar aylıklı izin verilebilir.","x":[]},{"m":"Ek 3","g":"beş yıla kadar aylıksız izin","c":"yabancı memleket/uluslararası kuruluşta görev; İçişleri Bakanlığı onayı","n":"","k":"b) Yabancı bir memlekette veya uluslararası kuruluşlarda görev alacaklara İçişleri Bakanlığının onayı ile beş yıla kadar aylıksız izin verilebilir.","x":[]},{"m":"Ek 3","g":"beş yıla kadar aylıklı izin","c":"BM barış gücünde görevlendirilenlere Cumhurbaşkanı kararıyla","n":"","k":"barış gücünde görevlendirilenlere Cumhurbaşkanı kararı ile beş yıla kadar aylıklı izin verilebilir.","x":[]},{"m":"Ek 3","g":"diğer kanunlarda düzenlenen izin hükümleri","c":"jandarma personeline uygulanmaz; izin usulü İçişleri Bakanlığı yönetmeliği","n":"","k":"için bu Kanun dışında diğer kanunlarda düzenlenen izin hükümleri uygulanmaz.","x":[]},{"m":"Ek 4","g":"yeme, içme ihtiyaçlarına ve nakillerine","c":"gözaltına alınanların masrafları JGK bütçesine konulacak ödenekle","n":"","k":"Gözaltına alınanların yeme, içme ihtiyaçlarına ve nakillerine ait masraflar Jandarma Genel Komutanlığı bütçesine konulacak ödenekle karşılanır.","x":[]},{"m":"Ek 5","g":"veya istihbarat başkanının yazılı emriyle","c":"önleyici dinleme emri; yirmidört saatte hâkime; karar kırk sekiz saatte","n":"yalnız kendi sorumluluk alanında; CMK 250 suçları (casusluk hariç)","k":"hâkim kararı veya gecikmesinde sakınca bulunan hallerde Jandarma Genel Komutanı veya istihbarat başkanının yazılı emriyle, telekomünikasyon yoluyla yapılan iletişimi tespit edebilir, dinleyebilir, sinyal bilgilerini değerlendirebilir, kayda alabilir. Gecikmesinde sakınca bulunan hallerde verilen yazılı emir, yirmidört saat içinde yetkili ve görevli hâkimin onayına sunulur. Hâkim, kararını en geç kırk sekiz saat içinde verir.","x":[]},{"m":"Ek 5","g":"Ankara ağır ceza mahkemesi üyesidir","c":"önleyici dinlemede yetkili ve görevli hâkim","n":"","k":"Yetkili ve görevli hâkim, Ankara ağır ceza mahkemesi üyesidir.","x":[]},{"m":"Ek 5","g":"en fazla üç defa uzatılabilir","c":"dinleme kararı üç ay; üçer ay; terör örgütünde müteaddit defalar","n":"","k":"Kararlar, en fazla üç ay için verilebilir; bu süre aynı usûlle üçer ayı geçmeyecek şekilde en fazla üç defa uzatılabilir. Ancak, terör örgütünün faaliyeti çerçevesinde devam eden tehlikelere ilişkin olarak gerekli görülmesi halinde, hâkim üç aydan fazla olmamak üzere sürenin müteaddit defalar uzatılmasına karar verebilir.","x":[]},{"m":"Ek 5","g":"on gün içinde yok edilir","c":"dinleme kayıtları (tedbir bitince veya onaylanmayınca); tutanakla tespit","n":"","k":"Uygulanan tedbirin sona ermesi halinde, dinlemenin içeriğine ilişkin kayıtlar en geç on gün içinde yok edilir; durum bir tutanakla tespit olunur ve bu tutanak denetimde ibraz edilmek üzere muhafaza edilir.","x":[]},{"m":"Ek 5","g":"Cumhuriyet savcılarınca doğrudan soruşturma","c":"dinleme kayıtlarının gizliliğini ihlal edenler; görev sırasında işlense bile","n":"","k":"Bu madde hükümlerine göre yürütülen faaliyetler çerçevesinde elde edilen kayıtlar, birinci fıkrada belirtilen amaçlar dışında kullanılamaz. Elde edilen bilgi ve kayıtların saklanmasında ve korunmasında gizlilik ilkesi geçerlidir. Bu fıkra hükümlerine aykırı hareket edenler hakkında, görev sırasında veya görevden dolayı işlenmiş olsa bile Cumhuriyet savcılarınca doğrudan soruşturma yapılır.","x":[]},{"m":"Ek 5","g":"yılda en az bir defa","c":"dinleme denetimi: sıralı kurum amirleri, mülki idare amirleri, JGK-bakanlık teftiş","n":"Sayıştay sayılmıyor; rapor TBMM Güvenlik ve İstihbarat Komisyonuna","k":"Bu maddede yer alan faaliyetlerin denetimi; sıralı kurum amirleri, mülki idare amirleri, Jandarma Genel Komutanlığı ve ilgili bakanlığın teftiş elemanları tarafından yılda en az bir defa yapılır. Bu faaliyetler Cumhurbaşkanlığınca görevlendirilen denetim elemanları tarafından da denetlenebilir. Bu kapsamda yapılan denetimlerin sonuçları bir rapor hâlinde Türkiye Büyük Millet Meclisi Güvenlik ve İstihbarat Komisyonuna sunulur.","x":[]},{"m":"Ek 5","g":"İstihbarat Başkanlığı görevlilerince yerine getirilir","c":"dinleme hâkim kararları ve yazılı emirler; başlangıç-bitiş tutanakla","n":"","k":"Hâkim kararları ve yazılı emirler, Jandarma Genel Komutanlığı İstihbarat Başkanlığı görevlilerince yerine getirilir. İşlemin başladığı ve bitirildiği tarih ve saat ile işlemi yapanın kimliği bir tutanakla saptanır.","x":[]},{"m":"Ek 5","g":"Cumhurbaşkanınca çıkarılan yönetmelikle","c":"önleyici dinleme maddesinin uygulanmasına ilişkin esas ve usuller","n":"","k":"Bu maddenin uygulanmasına ilişkin esas ve usûller, Cumhurbaşkanınca çıkarılan yönetmelikle düzenlenir.","x":[]},{"m":"Ek 6","g":"Komutanına veya valilere devredebilir","c":"İçişleri Bakanı yetkilerinin bir kısmını; sınırları yazılı olarak açıkça","n":"","k":"İçişleri Bakanı, bu Kanundaki yetkilerinden bir kısmını gerektiğinde sınırlarını yazılı olarak açıkça belirlemek şartıyla ilgisine göre Jandarma Genel Komutanına veya valilere devredebilir.","x":[]},{"m":"Ek 7","g":"aykırı hükümler bulunması halinde","c":"diğer kanunlardaki aykırı hükümlere karşı bu Kanun hükümleri uygulanır","n":"","k":"Diğer kanunlarda bu Kanuna aykırı hükümler bulunması halinde bu Kanun hükümleri uygulanır.","x":[]},{"m":"Ek 7","g":"tereddütleri gidermeye","c":"İçişleri Bakanlığı yetkili; yeni ihtiyaçlarda düzenleme yapmaya Cumhurbaşkanı","n":"","k":"Bu Kanunun uygulanmasıyla ilgili tereddütleri gidermeye ve bu yönde düzenleyici ve yönlendirici işlemler yapmaya İçişleri Bakanlığı yetkilidir.\nBu Kanunda bu maddeyi ihdas eden Kanun ile yapılan düzenlemeler sebebiyle teşkilat, personel, eğitim ve diğer hususlarla ilgili olarak yeni ihtiyaçların ortaya çıkması halinde, buna ilişkin düzenleme yapmaya Cumhurbaşkanı yetkilidir.","x":[]},{"m":"Ek 8","g":"moral eğitim merkezleri ve kantinler","c":"JGK kurabileceği tesisler: vardiya yatakhanesi, eğitim-kongre merkezi, sosyal tesis, gazino","n":"konut sitesi sayılmıyor","k":"Jandarma Genel Komutanlığı, vardiya yatakhaneleri, eğitim ve kongre merkezleri, sosyal tesisler, gazinolar, moral eğitim merkezleri ve kantinler kurabilir.","x":[]},{"m":"Ek 8","g":"aylık gayrisafi hasılatının %1'i","c":"özel/yerel/kış eğitim merkezleri, birlik dışı kantinler; her ay genel bütçeye","n":"","k":"Özel, yerel ve kış eğitim merkezleri ile birlik dışındaki kantinlerin aylık gayrisafi hasılatının %1'i her ay genel bütçeye gelir kaydedilmek üzere ilgili muhasebe birimine yatırılır.","x":[]},{"m":"Ek 9","g":"iki katından beş katına kadar","c":"yüksek hizmet görenlere aylıklarının; büyük yararlık: altı katından yirmidört katına","n":"","k":"a) Ülkenin güvenlik ve esenliği, Devletin çıkarları ve kişilerin can, ırz ve mallarını korumada yüksek hizmetleri görülenler, fiilen almakta oldukları aylık tutarlarının iki katından beş katına kadar,\nb) Olağanüstü durumlarda yaşamını ortaya koyarak büyük yararlıklar gösterenler, fiilen almakta oldukları aylık tutarlarının altı katından yirmidört katına kadar,\npara verilerek ödüllendirilir.","x":[]},{"m":"Ek 9","g":"İçişleri Bakanı tarafından aşağıda isimleri","c":"madalyalar: Üstün Cesaret ve Feragat, Şeref, Üstün Hizmet","n":"cesaret, feragat, kahramanlık, üstün başarı","k":"Jandarma Genel Komutanlığı personelinden kendisine tevdi edilen görevleri cesaret, feragat, kahramanlık veya üstün başarı ile yerine getirenlere İçişleri Bakanı tarafından aşağıda isimleri yazılı madalyalar verilebilir:\na) Jandarma Üstün Cesaret ve Feragat Madalyası,\nb) Jandarma Şeref Madalyası,\nc) Jandarma Üstün Hizmet Madalyası.","x":[]},{"m":"Ek 9","g":"İçişleri Bakanlığınca tasvip ve tescil","c":"başka devletlerin madalya ve nişanları ondan sonra takılabilir","n":"","k":"Başka devletlerce tevcih edilen madalya ve nişanlar ile bunlara ait rozet ve minyatürler, İçişleri Bakanlığınca tasvip ve tescil edildikten sonra takılabilir.","x":[]},{"m":"Ek 11","g":"kusurun derecesine göre durumunun uygun","c":"görevden dolayı sanık olan personelin avukat ücreti JGK bütçesinden","n":"karargâh personeli dâhil; \"her hâlde\" değil, uygun görülürse","k":"karargâh personeli dahil sanık durumuna düşen personelin vekalet verdiği avukatın ücreti, olayın mahiyetine ve kusurun derecesine göre durumunun uygun görülmesi halinde Jandarma Genel Komutanlığı bütçesine konulan ödenekten karşılanır.","x":[]},{"m":"Ek 11","g":"Avukat tutma ve ücret","c":"İçişleri Bakanlığı yönetmeliği; adli yardıma esas görevlerin sınırı da","n":"","k":"Avukat tutma ve ücret ödeme usul ve esasları ile adli yardıma esas olan görevlerin mahiyeti ve sınırları İçişleri Bakanlığı tarafından yönetmelikle düzenlenir.","x":[]},{"m":"Ek 12","g":"kıdemli üstçavuşluk rütbe yaş haddi","c":"sözleşmeliden muvazzaf astsubaylığa geçiş üst sınırı; subayda yüzbaşılık yaş haddi","n":"","k":"Jandarma Genel Komutanlığına mensup sözleşmeli subay ve astsubaylar için muvazzaf subay ve astsubaylığa geçişte belirlenen üst sınır, subaylar için yüzbaşılık rütbe yaş haddi, astsubaylar için astsubay kıdemli üstçavuşluk rütbe yaş haddi şeklinde uygulanır.","x":[]},{"m":"Ek 13","g":"yirmiyedi yaşını bitirmemiş","c":"JGK uzman erbaş adayı; müracaat yılının ocak ayının ilk günü","n":"","k":"Jandarma Genel Komutanlığında istihdam edilecek uzman erbaş adaylarının müracaat yapılan yılın ocak ayının ilk günü itibarıyla yirmiyedi yaşını bitirmemiş olması gerekir.","x":[]},{"m":"Ek 13","g":"beş yıllık sözleşme yapılır","c":"askerliğe başlamadan uzman erbaş olana; askerlik işlemleri ertelenir","n":"","k":"Muvazzaf askerlik yükümlülüğüne başlamadan Jandarma Genel Komutanlığında uzman erbaşlığa kabul edilenler ile beş yıllık sözleşme yapılır ve her türlü askerlik işlemleri ertelenir.","x":[]},{"m":"Ek 13","g":"üç yıllık hizmet süresini tamamlayanlar","c":"askerlik hizmetini yerine getirmiş sayılır; süre fiilen göreve başlayınca başlar","n":"üç yıl dolmadan ayrılan askerlik yapar","k":"Birinci fıkra kapsamındakilerden, Jandarma Genel Komutanlığında üç yıllık hizmet süresini tamamlayanlar askerlik hizmetini yerine getirmiş sayılır. Bu yükümlüler ile ilgili bilgiler, İçişleri Bakanlığınca Millî Savunma Bakanlığına bildirilir.\nÜç yıllık süre, fiilen göreve başlanılan tarihte başlar. Üç yıllık süreyi tamamlamadan hangi nedenle olursa olsun Jandarma Genel Komutanlığından ilişiği kesilen personel askerlik hizmetini yerine getirir.","x":[]},{"m":"Ek 14","g":"fiilen on beş yıldır","c":"muvazzaf subay/astsubay mecburi hizmeti; statü değiştirende ilk statü tarihinden","n":"","k":"a) Muvazzaf subay veya astsubayların mecburi hizmetleri, subay veya astsubay nasbedildikleri tarihten itibaren fiilen on beş yıldır. Statü değiştirerek subaylığa geçirilenlerin mecburi hizmet süreleri Jandarma Genel Komutanlığındaki ilk statülerine nasbedildikleri veya ilk sözleşmelerinin onaylandığı tarihten itibaren on beş yıldır.","x":[]},{"m":"Ek 14","g":"sürelerin yarısı kadar uzatılır","c":"tıp/diş uzmanlık, doktora: yükümlülük yarısı kadar uzar (lisans: süre kadar)","n":"","k":"b) Subay veya astsubay nasbedildikten sonra Jandarma Genel Komutanlığı hesabına yurt içindeki fakülte ve yüksekokullarda lisans veya lisansüstü öğrenim yapanların yükümlülükleri, buralarda geçen süreler kadar uzatılır.\nc) Jandarma Genel Komutanlığı hesabına yurt içinde tıp veya diş hekimliğinde uzmanlık ya da yan dal uzmanlık eğitimi ile Jandarma Genel Komutanlığı hesabına yurt içinde tıpta, diş hekimliğinde veya eczacılıkta doktora eğitimini bitirenlerin yükümlülükleri, buralarda geçen sürelerin yarısı kadar uzatılır.","x":[]},{"m":"Ek 14","g":"altı yıl uzatılır","c":"pilotaj bitirenin yükümlülüğü; yurt dışına altı ay+ gidenin iki katı","n":"statü değişikliği uzatan sebep değil","k":"d) Pilotaj eğitimini (pilot adaylarına verilen uçuş eğitimini) bitirenlerin yükümlülükleri altı yıl uzatılır.\ne) Yabancı memleketlere altı ay veya daha fazla süre ile öğrenim, staj, kurs, ihtisas veya görgü ve bilgilerini artırmak maksadıyla gidenlerin yükümlülükleri, masrafların ödenme şekline bakılmaksızın, gidiş ve dönüş tarihleri arasında geçen sürenin iki katı kadar uzatılır.","x":[]},{"m":"Ek 14","g":"masraflarının iki katını","c":"mecburi hizmette istifa edenin tazminatı; disiplinle çıkarılan dört katı","n":"","k":"Durumları birinci fıkra hükümlerine uyanlardan mecburi hizmetle yükümlü olduğu süre içinde istifa edenler veya sağlık sebebi hariç her ne suretle olursa olsun ilişiği kesilenler, Jandarma Genel Komutanlığı tarafından belirlenen; öğrenci, subay ve/veya astsubay nasbedildikten sonra kendilerine yapılan öğrenim, eğitim ve yetiştirme masraflarının iki katını, 15 inci madde kapsamında ilişiği kesilenler ile 31/1/2018 tarihli ve 7068 sayılı Genel Kolluk Disiplin Hükümleri Hakkında Kanun Hükmünde Kararnamenin Kabul Edilmesine Dair Kanun kapsamında meslekten veya Devlet memurluğundan çıkarılanlar ise belirlenen masrafların dört katını yükümlülük sürelerinin eksik kalan kısmı ile orantılı olarak kanuni faizi ile birlikte tazminat olarak öderler.","x":[]},{"m":"Ek 15","g":"ücret veya katılım payı alınmaz","c":"birlik envanterindeki ilaçla tedavide personelden alınmaz (terör, sınır ötesi, üs)","n":"garnizon rutin poliklinik kapsamda değil","k":"Teröristle mücadele ve sınır ötesi operasyonlar, uluslararası barışı destekleme kapsamındaki faaliyetler, üs bölgeleri gibi görevli bulunulan yer ya da görev koşulları itibarıyla reçete edilen ilaçların eczanelerden temin edilerek hasta/yaralı personele ulaştırılmasının güç olduğu, ikinci ve üçüncü basamak sağlık teşkillerine sevklerin emniyetli şekilde ve zamanında yapılamadığı hallerde, birlik/kurum envanterindeki mevcut ilaç ve tıbbi sarf malzemesi personel tedavisinde kullanılabilir. Bu kapsamda kullanılan ilaç ve tıbbi sarf malzemesi için personelden herhangi bir ücret veya katılım payı alınmaz.","x":[]},{"m":"Ek 16","g":"kıdemli çavuş: 43","c":"yaş haddi (uzman jandarmalıktan astsubaylığa geçen çavuş/kıdemli çavuş)","n":"","k":"Uzman jandarmalıktan astsubaylığa geçenlerin rütbe yaş hadleri aşağıda belirtilmiştir:\nRütbe — Yaş Haddi\nAstsubay çavuş, astsubay kıdemli çavuş: 43\nAstsubay üstçavuş, astsubay kıdemli üstçavuş: 52\nAstsubay başçavuş: 54\nAstsubay kıdemli başçavuş: 55","x":[]},{"m":"Ek 16","g":"kıdemli üstçavuş: 52","c":"yaş haddi (uzman jandarmalıktan geçen üstçavuş/kıdemli üstçavuş)","n":"","k":"Uzman jandarmalıktan astsubaylığa geçenlerin rütbe yaş hadleri aşağıda belirtilmiştir:\nRütbe — Yaş Haddi\nAstsubay çavuş, astsubay kıdemli çavuş: 43\nAstsubay üstçavuş, astsubay kıdemli üstçavuş: 52\nAstsubay başçavuş: 54\nAstsubay kıdemli başçavuş: 55","x":[]},{"m":"Ek 16","g":"Astsubay başçavuş: 54","c":"yaş haddi (uzman jandarmalıktan geçen başçavuş)","n":"","k":"Uzman jandarmalıktan astsubaylığa geçenlerin rütbe yaş hadleri aşağıda belirtilmiştir:\nRütbe — Yaş Haddi\nAstsubay çavuş, astsubay kıdemli çavuş: 43\nAstsubay üstçavuş, astsubay kıdemli üstçavuş: 52\nAstsubay başçavuş: 54\nAstsubay kıdemli başçavuş: 55","x":[]},{"m":"Ek 16","g":"kıdemli başçavuş: 55","c":"yaş haddi (uzman jandarmalıktan geçen kıdemli başçavuş)","n":"","k":"Uzman jandarmalıktan astsubaylığa geçenlerin rütbe yaş hadleri aşağıda belirtilmiştir:\nRütbe — Yaş Haddi\nAstsubay çavuş, astsubay kıdemli çavuş: 43\nAstsubay üstçavuş, astsubay kıdemli üstçavuş: 52\nAstsubay başçavuş: 54\nAstsubay kıdemli başçavuş: 55","x":[]},{"m":"Ek 17","g":"derece ve kademe ilerlemeleri yapılmaz","c":"uzman erbaş: görevden uzaklaştırma kalksa da yargılaması sürüyorsa; usul yönetmelikle","n":"","k":"Bunlar ile hakkındaki görevden uzaklaştırma veya tutuklanma tedbiri ortadan kaldırılmasına rağmen yargılamaları veya adli/idari soruşturmaları devam edenlerin terfi, derece ve kademe ilerlemeleri yapılmaz, bu işlemlerin ne şekilde yapılacağı yönetmelikle belirlenir.","x":[]},{"m":"Ek 18","g":"%90'ının (dâhil) üzerinde","c":"kıdemli başçavuş yaş haddini 60'a uzatma şartı (sicil); İçişleri Bakanı","n":"\"5 yıl rütbede bulunma\" şartı yok","k":"Emsalleri arasında temayüz etmiş, hizmetine ihtiyaç duyulduğu tespit edilen ve sicil notu ortalaması, sicil tam notunun %90'ının (dâhil) üzerinde olan istekli astsubay kıdemli başçavuşların yaş haddi, Jandarma Genel Komutanlığının teklifi üzerine veya resen İçişleri Bakanı tarafından 60 yaşına kadar uzatılabilir.","x":[]},{"m":"Ek 19","g":"Jandarma Asayiş Vakfı","c":"emniyet-asayiş hizmetlerini güçlendirmek için kurulan vakıf; 5072 sayılı Kanun kapsamında","n":"","k":"Jandarma Genel Komutanlığının emniyet ve asayişe yönelik hizmetleri açısından güçlendirilmesi ve her yönüyle ileri düzeye yükseltilebilmesi amacıyla kurulan ve vakıf senedi 6/9/1997 tarihli ve 23102 sayılı Resmî Gazete'de ilan edilen Jandarma Asayiş Vakfı, 22/1/2004 tarihli ve 5072 sayılı Dernek ve Vakıfların Kamu Kurum ve Kuruluşları ile İlişkilerine Dair Kanunun 1 inci maddesinin ikinci fıkrası kapsamındaki vakıflara ilişkin hükümlere tabidir.","x":[]},{"m":"Geçici 5","g":"üç yıl süreyle karşılanır","c":"er-erbaş ihtiyacını MSB karşılar; Cumhurbaşkanı uzatabilir; giderler JGK bütçesinden","n":"","k":"Jandarma Genel Komutanlığının er ve erbaş ile askerlik yükümlüsü ihtiyacı, 21/6/1927 tarihli ve 1111 sayılı Askerlik Kanunu hükümleri çerçevesinde Milli Savunma Bakanlığı tarafından üç yıl süreyle karşılanır. Ancak Cumhurbaşkanı kararıyla; bu süre uzatılabilir. Bu suretle Jandarma Genel Komutanlığı emrine verilen er ve erbaşlar ile askerlik yükümlüleri hakkında, diğer er ve erbaşlar ile askerlik yükümlülerinin tabi olduğu hükümler uygulanır. Bunların giderleri Jandarma Genel Komutanlığı bütçesinden karşılanır.","x":[]},{"m":"Geçici 1","g":"Jandarma Teşkilat ve Vazife Tüzüğü","c":"yönetmelikler çıkana kadar Kanuna aykırı olmayan hükümleri uygulanır","n":"","k":"Bu Kanunun 24 üncü maddesiyle çıkarılması öngörülen yönetmelikler yürürlüğe girinceye kadar, 1 Aralık 1937 gün ve 2/7756 sayılı Kararname ile yürürlüğe konulmuş olan \\\"Jandarma Teşkilat ve Vazife Tüzüğü\\\" ile ek ve değişikliklerinin bu Kanuna aykırı olmayan hükümlerinin uygulanmasına devam edilir.","x":[]},{"m":"Geçici 3","g":"yeterli polis bulunmaması nedeniyle","c":"jandarmanın polis sahasındaki görevi devam eder; polis arttıkça EGM'ye devir","n":"","k":"Bu Kanunun yürürlüğe girdiği tarihte, yeterli polis bulunmaması nedeniyle jandarmanın polis sahalarındaki görev ve sorumluluğu devam eder. Polis miktarına bağlı olarak jandarma bu sahaları Emniyet Genel Müdürlüğüne devreder.","x":[]},{"m":"Geçici 7","g":"yabancı ülkeler ile eğitim","c":"devam eden faaliyetleri İçişleri Bakanlığı yürütür (anlaşma ve protokol esasları)","n":"","k":"Jandarma Genel Komutanlığının halihazırda devam eden yabancı ülkeler ile eğitim ve işbirliği faaliyetleri askeri eğitim işbirliği anlaşmaları ve protokollerinde belirtilen esaslara göre İçişleri Bakanlığı tarafından yürütülür.","x":[]}]},{"id":3,"ad":"6698 sayılı Kişisel Verilerin Korunması Kanunu","grup":"müşterek","satirlar":[{"m":"3","g":"özgür iradeyle açıklanan","c":"açık rıza (tanım)","n":"belirli konu + bilgilendirme + özgür irade","k":"a) Açık rıza: Belirli bir konuya ilişkin, bilgilendirilmeye dayanan ve özgür iradeyle açıklanan rızayı,","x":[]},{"m":"3","g":"amaçlarını ve vasıtalarını belirleyen","c":"veri sorumlusu","n":"kayıt sisteminin kurulmasından sorumlu","k":"ı) Veri sorumlusu: Kişisel verilerin işleme amaçlarını ve vasıtalarını belirleyen, veri kayıt sisteminin kurulmasından ve yönetilmesinden sorumlu olan gerçek veya tüzel kişiyi,","x":[["3","veri işleyen: sorumlunun yetkisiyle onun adına işleyen"]]},{"m":"3","g":"onun adına kişisel verileri işleyen","c":"veri işleyen","n":"","k":"ğ) Veri işleyen: Veri sorumlusunun verdiği yetkiye dayanarak onun adına kişisel verileri işleyen gerçek veya tüzel kişiyi,","x":[]},{"m":"3","g":"başka verilerle eşleştirilerek dahi","c":"anonim hâle getirme","n":"kimlikle ilişkilendirilemez","k":"b) Anonim hâle getirme: Kişisel verilerin, başka verilerle eşleştirilerek dahi hiçbir surette kimliği belirli veya belirlenebilir bir gerçek kişiyle ilişkilendirilemeyecek hâle getirilmesini,","x":[]},{"m":"4","g":"ilkelere uyulması zorunludur","c":"dürüstlük, doğru-güncel, belirli-açık-meşru amaç, sınırlı-ölçülü, gerekli süre","n":"beş genel ilke","k":"(2) Kişisel verilerin işlenmesinde aşağıdaki ilkelere uyulması zorunludur: a) Hukuka ve dürüstlük kurallarına uygun olma. b) Doğru ve gerektiğinde güncel olma. c) Belirli, açık ve meşru amaçlar için işlenme. ç) İşlendikleri amaçla bağlantılı, sınırlı ve ölçülü olma. d) İlgili mevzuatta öngörülen veya işlendikleri amaç için gerekli olan süre kadar muhafaza edilme.","x":[]},{"m":"5","g":"açık rızası aranmaksızın","c":"kanun, fiili imkânsızlık, sözleşme, hukuki yükümlülük, alenileştirme, hak, meşru menfaat","n":"yedi hal","k":"(2) Aşağıdaki şartlardan birinin varlığı hâlinde, ilgili kişinin açık rızası aranmaksızın kişisel verilerinin işlenmesi mümkündür: a) Kanunlarda açıkça öngörülmesi. b) Fiili imkânsızlık nedeniyle rızasını açıklayamayacak durumda bulunan veya rızasına hukuki geçerlilik tanınmayan kişinin kendisinin ya da bir başkasının hayatı veya beden bütünlüğünün korunması için zorunlu olması. c) Bir sözleşmenin kurulması veya ifasıyla doğrudan doğruya ilgili olması kaydıyla, sözleşmenin taraflarına ait kişisel verilerin işlenmesinin gerekli olması. ç) Veri sorumlusunun hukuki yükümlülüğünü yerine getirebilmesi için zorunlu olması. d) İlgili kişinin kendisi tarafından alenileştirilmiş olması. e) Bir hakkın tesisi, kullanılması veya korunması için veri işlemenin zorunlu olması. f) İlgili kişinin temel hak ve özgürlüklerine zarar vermemek kaydıyla, veri sorumlusunun meşru menfaatleri için veri işlenmesinin zorunlu olması.","x":[]},{"m":"5","g":"kendisi tarafından alenileştirilmiş olması","c":"alenileştirilmiş veri: açık rıza aranmaz","n":"","k":"d) İlgili kişinin kendisi tarafından alenileştirilmiş olması.","x":[]},{"m":"5","g":"meşru menfaatleri","c":"açık rıza aranmaz; temel haklara zarar vermemek kaydıyla","n":"veri sorumlusunun meşru menfaati","k":"f) İlgili kişinin temel hak ve özgürlüklerine zarar vermemek kaydıyla, veri sorumlusunun meşru menfaatleri için veri işlenmesinin zorunlu olması.","x":[]},{"m":"6","g":"kılık ve kıyafeti","c":"özel nitelikli kişisel veri","n":"ırk, etnik köken, siyasi düşünce, inanç, din, dernek-vakıf-sendika üyeliği, sağlık, cinsel hayat, ceza mahkûmiyeti","k":"(1) Kişilerin ırkı, etnik kökeni, siyasi düşüncesi, felsefi inancı, dini, mezhebi veya diğer inançları, kılık ve kıyafeti, dernek, vakıf ya da sendika üyeliği, sağlığı, cinsel hayatı, ceza mahkûmiyeti m yalnız \"idari yürütme vasıtası\"","k":"Vali, ilde Cumhurbaşkanının temsilcisi ve idari yürütme vasıtasıdır.","x":[["27","kaymakam yalnız idari yürütme vasıtası"],["42","bucak müdürü: en büyük Hükümet memuru ve temsilcisi"]]},{"m":"11","g":"on beş gün","c":"vali: giriş-çıkış, dolaşma, araç kısıtı","n":"","k":"on beş günü geçmemek üzere ildeki belirli yerlere girişi ve çıkışı kamu düzeni ya da kamu güvenliğini bozabileceği şüphesi bulunan kişiler için sınırlayabilir; belli yerlerde veya saatlerde kişilerin dolaşmalarını, toplanmalarını, araçların seyirlerini düzenleyebilir veya kısıtlayabilir ve ruhsatlı da olsa her çeşit silah ve merminin taşınması ve naklini yasaklayabilir.","x":[]},{"m":"11","g":"ruhsatlı da olsa","c":"silah ve mermi taşıma yasağı, vali koyar","n":"","k":"ruhsatlı da olsa her çeşit silah ve merminin taşınması ve naklini yasaklayabilir.","x":[]},{"m":"11","g":"vali tarafından yerleri değiştirilebilir","c":"il içinde kolluğun yerini vali kendisi değiştirir","n":"kaymakam → valinin tasvibiyle","k":"Ç) Jandarma, polis, gümrük muhafaza ve diğer özel kolluk kuvvetlerinin bütün ast ve üstlerinin il içine munhasır olmak üzere geçici veya sürekli olarak vali tarafından yerleri değiştirilebilir ve bundan hemen İçişleri, Gümrük ve Tekel Bakanlıklarına bilgi verir.","x":[["32","kaymakam valinin tasvibiyle değiştirir"]]},{"m":"11","g":"çapı","c":"askerî birliğin komutanı belirler","n":"görevde kalış süresi → vali","k":"Olayların niteliğine göre istenen askerî kuvvetin çapı, vali ile koordine edilerek askerî birliğin komutanı tarafından, görevde kalış süresi, askerî birliğin komutanı ile koordine edilerek vali tarafından belirlenir.","x":[]},{"m":"11","g":"sözlü olarak","c":"acil yardım istemi; sonra yazıya dökülür","n":"","k":"Acil durumlarda bu istek sonradan yazılı şekle dönüştürülmek kaydıyla sözlü olarak yapılabilir.","x":[]},{"m":"11","g":"en kıdemli komutanı","c":"asker + jandarma/polis birlikte görevde komuta","n":"","k":"Ancak, bu askeri birliğin bel yeti valiye bildirirler","c":"kaymakam askerlik şikâyetine aldığı cevabı yetersiz bulursa","n":"","k":"K) Kaymakamlar, halkın askerlik muameleleri hakkındaki müracaat ve şikayetlerini kabul ederler. Askerlik şubelerine ve dairelerine yazarlar. Cevabı kafi görmedikleri takdirde keyfiyeti valiye bildirirler;","x":[]},{"m":"1","g":"illere; iller ilçelere","c":"merkezi idare kuruluşu: il, ilçe, bucak","n":"coğrafya, iktisadi şartlar, kamu hizmeti gerekleri","k":"(Değişik: 12/5/1964-469/1 md.) Türkiye, merkezi idare kuruluşu bakımından coğrafya durumuna, iktisadi şartlara ve kamu hizmetlerinin gereklerine göre illere; iller ilçelere ve ilçeler de bucaklara bölünmüştür.","x":[]}]},{"id":6,"ad":"5326 sayılı Kabahatler Kanunu","grup":"müşterek","satirlar":[{"m":"2","g":"öngördüğü haksızlık","c":"kabahat (tanım)","n":"karşılığında idarî yaptırım öngörülen haksızlık","k":"(1) Kabahat deyiminden; kanunun, karşılığında idarî yaptırım uygulanmasını öngördüğü haksızlık anlaşılır.","x":[]},{"m":"3","g":"aksine hüküm bulunmaması halinde","c":"kanun yolu hükümleri; genel hükümler para cezası gerektiren tüm fiillere","n":"","k":"(1) Bu Kanunun; a) İdarî yaptırım kararlarına karşı kanun yoluna ilişkin hükümleri, diğer kanunlarda aksine hüküm bulunmaması halinde, b) Diğer genel hükümleri, idarî para cezası veya mülkiyetin kamuya geçirilmesi yaptırımını gerektiren bütün fiiller hakkında, uygulanır.","x":[]},{"m":"4","g":"düzenleyici işlemleriyle de doldurulabilir","c":"kabahat tanımının içeriği (suçta yasak)","n":"TCK m.2: suç ve ceza düzenleyici işlemle konulamaz","k":"(1) Hangi fiillerin kabahat oluşturduğu, kanunda açıkça tanımlanabileceği gibi; kanunun kapsam ve koşulları bakımından belirlediği çerçeve hükmün içeriği, idarenin genel ve düzenleyici işlemleriyle de doldurulabilir.","x":[]},{"m":"4","g":"ancak kanunla belirlenebilir","c":"yaptırımın türü, süresi, miktarı","n":"","k":"(2) Kabahat karşılığı olan yaptırımların türü, süresi ve miktarı, ancak kanunla belirlenebilir.","x":[]},{"m":"5","g":"derhal uygulama kuralı","c":"yaptırım kararlarının yerine getirilmesinde (zaman bakımından)","n":"TCK'nın zaman kuralları kabahatte de uygulanır","k":"Ancak, kabahatler karşılığında öngörülen idarî yaptırımlara ilişkin kararların yerine getirilmesi bakımından derhal uygulama kuralı geçerlidir.","x":[]},{"m":"5","g":"Neticenin oluştuğu zaman","c":"dikkate alınmaz; davranış anı esas","n":"","k":"(2) Kabahat, failin icraî veya ihmali davranışı gerçekleştirdiği zaman işlenmiş sayılır. Neticenin oluştuğu zaman, bu bakımdan dikkate alınmaz.","x":[]},{"m":"7","g":"hukukî yükümlülüğün varlığı gereklidir","c":"ihmali davranışla kabahat için","n":"","k":"(1) Kabahat, icraî veya ihmali davranışla işlenebilir. İhmali davranışla işlenmiş kabahatin varlığı için kişi açısından belli bir icraî davranışta bulunma hususunda hukukî yükümlülüğün varlığı gereklidir.","x":[]},{"m":"8","g":"tüzel kişi hakkında da","c":"organ veya temsilcinin kabahatinden idarî yaptırım uygulanabilir","n":"","k":"(1) Organ veya temsilcilik görevi yapan ya da organ veya temsilci olmamakla birlikte, tüzel kişinin faaliyeti çerçevesinde görev üstlenen kişinin bu görevi kapsamında işlemiş bulunduğu kabahatten dolayı tüzel kişi hakkında da idarî yaptırım uygulanabilir.","x":[]},{"m":"8","g":"iş sahibi kişi hakkında da","c":"çalışanın kabahatinden işverene de yaptırım","n":"","k":"Gerçek kişiye ait bir işte çalışan kişinin bu faaliyeti çerçevesinde işlemiş bulunduğu kabahatten dolayı, iş sahibi kişi hakkında da idarî yaptırım uygulanabilir.","x":[]},{"m":"9","g":"hem kasten hem de taksirle","c":"kabahat işlenebilir; TCK'da taksir açıkça yazılmalı","n":"","k":"(1) Kabahatler, kanunda açıkça hüküm bulunmayan hallerde, hem kasten hem de taksirle işlenebilir.","x":[]},{"m":"11","g":"onbeş yaşını doldurmamış","c":"çocuğa idarî para cezası yok","n":"","k":"(1) Fiili işlediği sırada onbeş yaşını doldurmamış çocuk hakkında idarî para cezası uygulanamaz.","x":[]},{"m":"11","g":"Akıl hastalığı","c":"idarî para cezası uygulanmaz","n":"algılama ya da yönlendirme yeteneği önemli derecede azalmış","k":"(2) Akıl hastalığı nedeniyle, işlediği fiilin hukukî anlam ve sonuçlarını algılayamayan veya bu fiille ilgili olarak davranışlarını yönlendirme yeteneği önemli derecede azalmış olan kişi hakkında idarî para cezası uygulanmaz.","x":[]},{"m":"13","g":"Kabahate teşebbüs","c":"cezalandırılmaz; kanunda açık hüküm varsa TCK teşebbüs hükümleri","n":"","k":"(1) Kabahate teşebbüs cezalandırılmaz. Ancak, teşebbüsün de cezalandırılabileceğine dair ilgili kanunda hüküm bulunan haller saklıdır. Bu durumda, Türk Ceza Kanununun suça teşebbüse ve gönüllü vazgeçmeye ilişkin hükümleri, kabahatler bakımından da uygulanır.","x":[]},{"m":"14","g":"her biri hakkında, fail olarak","c":"iştirakte herkes fail; idarî para cezası","n":"","k":"(1) Kabahatin işlenişine birden fazla kişinin iştirak etmesi halinde bu kişilerin her biri hakkında, fail olarak idarî para cezası verilir.","x":[]},{"m":"14","g":"niteliği taşımayan kişi hakkında da","c":"fail olarak idarî para cezası; TCK özgü suçun tersi","n":"TCK m.40: özgü suçta sıfatsız kişi fail olamaz","k":"(2) Özel faillik niteliğinin arandığı durumlarda, kabahate iştirak eden ve bu niteliği taşımayan kişi hakkında da fail olarak idarî para cezası verilir.","x":[]},{"m":"15","g":"en ağır idarî para cezası","c":"bir fiille birden fazla kabahat","n":"başka idarî yaptırımlar varsa her biri uygulanır","k":"(1) Bir fiil ile birden fazla kabahatin işlenmesi halinde bu kabahatlere ilişkin tanımlarda sadece idarî para cezası öngörülmüşse, en ağır idarî para cezası verilir.","x":[]},{"m":"15","g":"Kesintisiz fiille","c":"karar verilinceye kadar tek fiil sayılır","n":"aynı kabahat birden fazla işlenirse her biri için ayrı ceza","k":"Kesintisiz fiille işlenebilen kabahatlerde, bu nedenle idarî yaptırım kararı verilinceye kadar fiil tek sayılır.","x":[]},{"m":"15","g":"hem kabahat hem de suç","c":"sadece suçtan yaptırım; uygulanamazsa kabahat","n":"","k":"(3) Bir fiil hem kabahat hem de suç olarak tanımlanmış ise, sadece suçtan dolayı yaptırım uygulanabilir. Ancak, suçtan dolayı yaptırım uygulanamayan hallerde kabahat dolayısıyla yaptırım uygulanır.","x":[]},{"m":"16","g":"idarî tedbirlerden ibarettir","c":"idarî yaptırım türleri: para cezası ve idarî tedbirler","n":"tedbir: mülkiyetin kamuya geçirilmesi vb.","k":"(1) Kabahatler karşılığında uygulanacak olan idarî yaptırımlar, idarî para cezası ve idarî tedbirlerden ibarettir.\n(2) İdarî tedbirler, mülkiyetin kamuya geçirilmesi ve ilgili kanunlarda yer alan diğer tedbirlerdir.","x":[]},{"m":"17","g":"maktu veya nispi","c":"idarî para cezası türleri","n":"","k":"(1) İdarî para cezası, maktu veya nispi olabilir.","x":[]},{"m":"17","g":"kendi bütçelerine gelir","c":"SGK ve mahalli idare cezaları; savcılık-mahkeme cezaları Genel Bütçeye","n":"","k":"Cumhuriyet başsavcılıkları ve mahkemeler tarafından verilen idarî para cezaları Genel Bütçeye gelir kaydedilir. Sosyal güvenlik kurumları ile mahalli idareler tarafından verilen idarî para cezaları kendi bütçelerine gelir kaydedilir.","x":[]},{"m":"17","g":"dört eşit taksit","c":"bir yıl içinde; ilk taksit peşin; ekonomik durum müsait değilse","n":"taksit aksarsa kalanın tamamı tahsil","k":"Kişinin ekonomik durumunun müsait olmaması halinde, idarî para cezasının, ilk taksitinin peşin ödenmesi koşuluyla, bir yıl içinde ve dört eşit taksit halinde ödenmesine karar verilebilir. Taksitlerin zamanında ve tam olarak ödenmemesi halinde, idarî para cezasının kalan kısmının tamamı tahsil edilir.","x":[]},{"m":"17","g":"tebliğinden itibaren bir ay içinde","c":"ödeme süresi belirlenmemiş idari para cezası","n":"","k":"Kanunlarında ödeme süresi düzenlenmemiş olan idari para cezaları, tebliğinden itibaren bir ay içinde ödenir.","x":[]},{"m":"17","g":"%25 oranında indirim","c":"ödeme süresi içinde ödenirse","n":"ödeme, kanun yoluna başvuru hakkını kaldırmaz","k":"İdari para cezasının ödeme süresi içinde ödenmesi halinde, cezadan %25 oranında indir e şiddet kullanarak; baskı, korkutma, yıldırma, sindirme veya tehdit yöntemlerinden biriyle, Anayasada belirtilen Cumhuriyetin niteliklerini, siyasî, hukukî, sosyal, laik, ekonomik düzeni değiştirmek, Devletin ülkesi ve milletiyle bölünmez bütünlüğünü bozmak, Türk Devletinin ve Cumhuriyetin varlığını tehlikeye düşürmek, Devlet otoritesini zaafa uğratmak veya yıkmak veya ele geçirmek, temel hak ve hürriyetleri yok etmek, Devletin iç ve dış güvenliğini, kamu düzenini veya genel sağlığı bozmak amacıyla bir örgüte mensup kişi veya kişiler tarafından girişilecek her türlü suç teşkil eden eylemlerdir.","x":[]},{"m":"2","g":"amaçlanan suçu işlemese dahi","c":"terör suçlusu; örgüt mensubu","n":"","k":"Birinci maddede belirlenen amaçlara ulaşmak için meydana getirilmiş örgütlerin mensubu olup da, bu amaçlar doğrultusunda diğerleri ile beraber veya tek başına suç işleyen veya amaçlanan suçu işlemese dahi örgütlerin mensubu olan kişi terör suçlusudur.","x":[]},{"m":"2","g":"örgüt adına suç işleyenler","c":"terör suçlusu sayılır; mensup olmasa da","n":"","k":"Terör örgütüne mensup olmasa dahi örgüt adına suç işleyenler de terör suçlusu sayılır","x":[]},{"m":"3","g":"terör suçlarıdır","c":"TCK 302, 307, 309, 311-315, 320, 310 (birinci fıkra)","n":"mutlak terör suçları","k":"26/9/2004 tarihli ve 5237 sayılı Türk Ceza Kanununun 302, 307, 309, 311, 312, 313, 314, 315 ve 320 nci maddeleri ile 310 uncu maddesinin birinci fıkrasında yazılı suçlar, terör suçlarıdır.","x":[["4","m.4 suçları ancak örgüt faaliyetinde terör suçu sayılır"]]},{"m":"4","g":"terör suçu sayılır","c":"örgüt faaliyeti çerçevesinde işlenirse; başlı başına değil","n":"","k":"Aşağıdaki suçlar 1 inci maddede belirtilen amaçlar doğrultusunda suç işlemek üzere kurulmuş bir terör örgütünün faaliyeti çerçevesinde işlendiği takdirde, terör suçu sayılır:","x":[["3","m.3 suçları her halde terör suçudur"]]},{"m":"4","g":"kasten orman yakma","c":"orman yakma: örgüt faaliyetinde terör suçu","n":"6831 Orman Kanunu m.110/4-5","k":"c) 31/8/1956 tarihli ve 6831 sayılı Orman Kanununun 110 uncu maddesinin dördüncü ve beşinci fıkralarında tanımlanan kasten orman yakma suçları.","x":[]},{"m":"4","g":"hapis cezasını gerektiren suçlar","c":"Kaçakçılıkla Mücadele Kanunu suçları; örgüt faaliyetinde terör suçu","n":"6136 silah suçları da","k":"ç) 10/7/2003 tarihli ve 4926 sayılı Kaçakçılıkla Mücadele Kanununda tanımlanan ve hapis cezasını gerektiren suçlar.","x":[]},{"m":"4","g":"ilanına neden olan olaylara","c":"OHAL bölgesinde; olağanüstü halin ilanına neden olan olaylara ilişkin","n":"","k":"d) Anayasanın 120 nci maddesi gereğince olağanüstü hal ilan edilen bölgelerde, olağanüstü halin ilanına neden olan olaylara ilişkin suçlar.","x":[]},{"m":"7","g":"faaliyetini düzenleyenler","c":"örgüt yöneticisi olarak cezalandırılır","n":"kuran, yöneten, üye: TCK 314","k":"Örgütün faaliyetini düzenleyenler de örgütün yöneticisi olarak cezalandırılır.","x":[]},{"m":"7","g":"propagandasını yapan","c":"bir yıldan beş yıla kadar hapis; basın-yayınla yarı artırım","n":"cebir, şiddet, tehdit yöntemlerini meşru gösterme, övme, teşvik","k":"Terör örgütünün; cebir, şiddet veya tehdit içeren yöntemlerini meşru gösterecek veya övecek ya da bu yöntemlere başvurmayı teşvik edecek şekilde propagandasını yapan kişi, bir yıldan beş yıla kadar hapis cezası ile cezalandırılır. Bu suçun basın ve yayın yolu ile işlenmesi hâlinde, verilecek ceza yarı oranında artırılır.","x":[]},{"m":"7","g":"bin günden beş bin güne","c":"yayın sorumlularına adli para cezası","n":"suça iştirak etmemiş olsalar da","k":"Ayrıca, basın ve yayın organlarının suçun işlenmesine iştirak etmemiş olan yayın sorumluları hakkında da bin günden beş bin güne kadar adli para cezasına hükmolunur.","x":[]},{"m":"7","g":"Haber verme sınırlarını aşmayan","c":"suç oluşturmaz; eleştiri de","n":"","k":"Haber verme sınırlarını aşmayan veya eleştiri amacıyla yapılan düşünce açıklamaları suç oluşturmaz.","x":[]},{"m":"7","g":"Slogan atılması","c":"propaganda gibi cezalan
