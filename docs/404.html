<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Mevzu · JSPS</title>
<style>
  :root{ --lacivert:#0B1F3A; --lacivert2:#123049; --altin:#C9A227; --altin2:#F3C24A;
    --metin:#EAF2F5; --soluk:#9FB6BE; --kenar:rgba(126,205,218,.28); }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%}
  body{background:radial-gradient(120% 80% at 50% 0%, #0d2740 0%, #06182a 60%, #04101c 100%);
    color:var(--metin); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    line-height:1.55; display:flex; align-items:center; justify-content:center; padding:28px 18px; }
  .kart{width:100%; max-width:440px; text-align:center;
    background:linear-gradient(180deg,rgba(12,38,60,.9),rgba(7,22,36,.94));
    border:1px solid var(--kenar); border-radius:22px; padding:30px 22px 26px;
    box-shadow:0 18px 50px rgba(0,0,0,.45); }
  .amblem{width:60px;height:60px;border-radius:16px;margin:0 auto 14px;display:grid;place-items:center;
    background:rgba(240,183,51,.12); border:1px solid rgba(240,183,51,.45); font-size:30px}
  .marka{font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:var(--altin2);font-weight:800;margin-bottom:6px}
  h1{font-size:1.5rem;margin:2px 0 6px;color:#fff}
  p{color:var(--soluk);margin:6px 0 0;font-size:.98rem}
  .btnAna{display:block;width:100%;margin:22px 0 0;padding:15px;border-radius:14px;border:none;cursor:pointer;
    background:linear-gradient(180deg,var(--altin2),var(--altin));color:#241B00;font-weight:800;font-size:1.02rem;
    text-decoration:none;box-sizing:border-box}
  .btnAna:active{transform:translateY(1px)}
  .magaza{display:flex;gap:10px;margin-top:12px}
  .magaza a{flex:1;padding:12px;border-radius:12px;border:1px solid var(--kenar);color:var(--metin);
    text-decoration:none;font-weight:700;font-size:.9rem;background:rgba(255,255,255,.03)}
  .ipucu{margin-top:20px;padding:14px;border-radius:14px;border:1px dashed rgba(240,183,51,.4);
    background:rgba(240,183,51,.06);text-align:left;font-size:.9rem;color:var(--soluk)}
  .ipucu b{color:var(--altin2)}
  .kod{margin-top:10px;display:flex;gap:8px}
  .kod input{flex:1;min-width:0;padding:10px 12px;border-radius:10px;border:1px solid var(--kenar);
    background:rgba(4,20,32,.7);color:#fff;font-size:.85rem}
  .kod button{flex:none;padding:10px 14px;border-radius:10px;border:1px solid var(--altin);
    background:transparent;color:var(--altin2);font-weight:800;cursor:pointer}
  .kucuk{margin-top:18px;font-size:.82rem;color:#6f8791}
  .kucuk a{color:var(--altin2)}
</style>
</head>
<body>
<div class="kart" id="kart">
  <div class="amblem" id="amblem">🎮</div>
  <div class="marka">Mevzu · JSPS</div>
  <h1 id="baslik">Sayfa bulunamadı</h1>
  <p id="aciklama">Aradığın sayfa burada değil.</p>
  <a class="btnAna" id="btnAc" href="#" style="display:none">Uygulamada Aç</a>
  <div class="magaza" id="magaza" style="display:none">
    <a href="https://apps.apple.com/tr/app/id6787908212">App Store</a>
    <a href="https://play.google.com/store/apps/details?id=app.mevzujsps.android">Google Play</a>
  </div>
  <div class="ipucu" id="ipucu" style="display:none">
    Uygulama açılmadıysa: <b>uygulamayı aç → Oyunlar</b> sekmesine gel, en alttaki
    <b>“Sana meydan okuyan var mı?”</b> kutusuna aşağıdaki bağlantıyı yapıştır.
    <div class="kod">
      <input id="kodMetin" readonly />
      <button id="kodKopya">Kopyala</button>
    </div>
  </div>
  <div class="kucuk"><a href="/">Ana sayfaya dön</a></div>
</div>
<script>
(function(){
  var yol = location.pathname || '';
  var m = yol.match(/\/(oyun|oda)\/([^\/?#]+)/i);
  if(!m) return; // normal 404 — olduğu gibi bırak
  var tip = m[1].toLowerCase(), kod = m[2];
  var derin = 'mevzu://' + tip + '/' + kod;
  var tamLink = location.origin + '/' + tip + '/' + kod;

  document.getElementById('amblem').textContent = tip==='oda' ? '⚔️' : '🎮';
  document.getElementById('baslik').textContent = tip==='oda' ? 'Er Meydanı daveti' : 'Oyun daveti';
  document.getElementById('aciklama').textContent = tip==='oda'
    ? 'Bir arkadaşın seni düelloya çağırıyor. Uygulamada aç, aynı sorularla yarışın.'
    : 'Bir arkadaşın sana meydan okuyor. Uygulamada aç, birebir aynı soruları oyna.';
  var btn = document.getElementById('btnAc');
  btn.href = derin; btn.style.display = 'block';
  document.getElementById('magaza').style.display = 'flex';
  var ip = document.getElementById('ipucu');
  if(tip==='oyun'){ ip.style.display='block'; document.getElementById('kodMetin').value = tamLink; }
  document.getElementById('kodKopya').onclick = function(){
    var el=document.getElementById('kodMetin'); el.select();
    try{ navigator.clipboard.writeText(el.value); }catch(e){ document.execCommand('copy'); }
    this.textContent='✓';
    var b=this; setTimeout(function(){ b.textContent='Kopyala'; },1400);
  };
  // Uygulamayı otomatik açmayı dene (kurulu ise). Açılmazsa sayfada kalır.
  setTimeout(function(){ try{ window.location = derin; }catch(e){} }, 350);
})();
</script>
</body>
</html>
