<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Adayların Görüşleri · Mevzu JSPS</title>
<meta property="og:title" content="JSPS 10 Ekim 2026 · Adaylar sınav için ne dedi?">
<meta property="og:description" content="Sınavdan çıkan adayların görüşleri: nasıl geçti, hangi konular zorladı.">
<meta name="theme-color" content="#0B1F3A">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;500;600;700;800&display=swap">
<style>
html,body{margin:0}
[hidden]{display:none!important}
/* Düzen: başlık + nabız çubuğu (nasıl geçti dağılımı) → filtre → görüş kartları. 60 sn'de bir yenilenir. */
:root{
  --zemin:#F7F3EA; --kagit:#FFFCF5; --kenar:#E7DCC7; --metin:#1B2A4A; --soluk:#6E6047;
  --lacivert:#0B1F3A; --lacivert2:#173B6B; --altin:#C9A227; --altinKoyu:#B88917; --altinYuzey:#F3E7C1;
  --kirmizi:#C00000; --yesil:#2E7D32; --amber:#8A5A12;
  --n5:#2E7D32; --n4:#7CB342; --n3:#C9A227; --n2:#E07B39; --n1:#C00000;
  --baslik:'Playfair Display',Georgia,'Times New Roman',serif;
  --govde:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --zemin:#08162A; --kagit:#0E2139; --kenar:#22385A; --metin:#E9E3D6; --soluk:#A9B4C6;
  --lacivert:#E9E3D6; --lacivert2:#9FB8DD; --altin:#D9B441; --altinKoyu:#E6C766; --altinYuzey:#2A2715;
  --kirmizi:#F07B70; --yesil:#6FC475; --amber:#E6C766; color-scheme:dark}}
:root[data-theme="dark"]{
  --zemin:#08162A; --kagit:#0E2139; --kenar:#22385A; --metin:#E9E3D6; --soluk:#A9B4C6;
  --lacivert:#E9E3D6; --lacivert2:#9FB8DD; --altin:#D9B441; --altinKoyu:#E6C766; --altinYuzey:#2A2715;
  --kirmizi:#F07B70; --yesil:#6FC475; --amber:#E6C766; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--zemin);color:var(--metin);font-family:var(--govde);font-size:15.5px;line-height:1.55;padding:0 16px}
.kap{max-width:720px;margin:0 auto;padding-block:20px 72px}
.ust{display:grid;gap:10px;padding-block:8px 18px;border-bottom:2px solid var(--altin)}
.etiket{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--altinKoyu)}
h1{font-family:var(--baslik);font-size:clamp(30px,7vw,42px);line-height:1.1;margin:0;color:var(--lacivert);text-wrap:balance}
.alt{color:var(--soluk);margin:0;max-width:60ch}
.yaz{display:inline-block;justify-self:start;text-decoration:none;font-weight:800;font-size:16px;padding:12px 18px;border-radius:10px;background:#C00000;color:#fff;box-shadow:0 6px 18px rgba(192,0,0,.25)}
.yaz:focus-visible{outline:3px solid var(--altin);outline-offset:3px}
.nabiz{display:grid;gap:8px;margin:18px 0 6px;padding:14px 16px;background:var(--kagit);border:1px solid var(--kenar);border-radius:12px}
.nabiz-ust{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.nabiz-ust b{font-size:15px;color:var(--lacivert)}
.nabiz-ust span{font-size:13px;color:var(--soluk);font-variant-numeric:tabular-nums}
.cubuk{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--kenar)}
.cubuk i{display:block;height:100%}
.lejant{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;font-variant-numeric:tabular-nums}
.lejant span{display:inline-flex;align-items:center;gap:6px}
.lejant span::before{content:'';width:10px;height:10px;border-radius:50%;background:var(--r)}
.filtre{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 10px}
.filtre select{font:inherit;font-size:14px;padding:9px 10px;border-radius:8px;border:1px solid var(--kenar);background:var(--kagit);color:var(--metin);min-width:0;flex:1 1 150px}
.kartlar{display:grid;gap:10px}
.gorus{background:var(--kagit);border:1px solid var(--kenar);border-left:5px solid var(--r);border-radius:10px;padding:12px 14px;display:grid;gap:6px}
.ust-satir{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline;font-size:14px}
.ust-satir b{font-size:15px;color:var(--lacivert)}
.cip{display:inline-block;padding:1px 9px;border-radius:999px;font-size:12px;font-weight:800;color:#fff;background:var(--r)}
.cip.acik{background:var(--altinYuzey);color:var(--metin);font-weight:700}
.zaman{margin-left:auto;font-size:12.5px;color:var(--soluk);font-variant-numeric:tabular-nums}
.metin{white-space:pre-wrap;overflow-wrap:anywhere;margin:0}
.bos{color:var(--soluk);background:var(--kagit);border:1px dashed var(--kenar);border-radius:10px;padding:18px;text-align:center}
.daha{font:inherit;font-weight:700;font-size:15px;padding:11px 18px;border-radius:8px;border:1px solid var(--kenar);background:var(--kagit);color:var(--metin);cursor:pointer;justify-self:center}
</style>
</head>
<body>
<div class="kap">
  <header class="ust">
    <div class="etiket">JSPS · 10 Ekim 2026</div>
    <h1>Adaylar sınav için ne dedi?</h1>
    <p class="alt">Sınavdan çıkan adayların görüşleri. Liste kendiliğinden yenilenir; en yeni görüş en üstte.</p>
    <a class="yaz" href="../">✍️ Sen de görüşünü yaz</a>
  </header>

  <section class="nabiz" aria-label="Sınav nasıl geçti">
    <div class="nabiz-ust"><b>Sınav nasıl geçti?</b><span id="toplam">Yükleniyor…</span></div>
    <div class="cubuk" id="cubuk"></div>
    <div class="lejant" id="lejant"></div>
  </section>

  <div class="filtre">
    <select id="fRutbe" aria-label="Rütbe"><option value="">Tüm rütbeler</option></select>
    <select id="fBrans" aria-label="Branş"><option value="">Tüm branşlar</option></select>
    <select id="fNasil" aria-label="Nasıl geçti"><option value="">Hepsi</option><option value="5">Çok iyi</option><option value="4">İyi</option><option value="3">Orta</option><option value="2">Kötü</option><option value="1">Çok kötü</option></select>
  </div>
  <div class="kartlar" id="liste"><p class="bos">Görüşler yükleniyor…</p></div>
</div>
<script>
const SB_URL = "https://vwmjrvolkbiofpkzzwef.supabase.co", SB_ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZ3bWpydm9sa2Jpb2Zwa3p6d2VmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE2MzA2OTUsImV4cCI6MjA5NzIwNjY5NX0.hWOZHC66U5gZAZImUlHRbucFl3iIvrnmvL0jXQLc2Ho";
const RUTBE = {sb:'Subay', asb:'Astsubay', uzmj:'Uzman Jandarma', uzmerb:'Uzman Erbaş'};
const BRANS = {jandarma:'Jandarma', mebs:'MEBS', havacilik:'Havacılık', personel:'Personel', maliye:'Maliye', istihkam:'İstihkam', ikmal:'İkmal', bakim:'Bakım', bando:'Bando', saglik:'Sağlık', tabip:'Tabip', dis_tabibi:'Diş Tabibi', eczaci:'Eczacı', kimyager:'Kimyager', veteriner:'Veteriner', muhendis:'Mühendis'};
const NASIL = {5:'Çok iyi', 4:'İyi', 3:'Orta', 2:'Kötü', 1:'Çok kötü'};
const esc = t => String(t ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function zaman(t){
  const dk = Math.round((Date.now() - new Date(t)) / 60000);
  if (dk < 1) return 'az önce'; if (dk < 60) return dk + ' dk önce';
  if (dk < 24 * 60) return Math.floor(dk / 60) + ' sa önce';
  return new Date(t).toLocaleString('tr-TR', {day:'numeric', month:'short', hour:'2-digit', minute:'2-digit'});
}
let veri = [], goster = 30;
const fRutbe = document.getElementById('fRutbe'), fBrans = document.getElementById('fBrans'), fNasil = document.getElementById('fNasil');
function nabiz(){
  const n = [5,4,3,2,1].map(k => [k, veri.filter(g => g.nasil === k).length]);
  const T = veri.length;
  document.getElementById('toplam').textContent = T ? T + ' görüş' : 'Henüz görüş yok';
  document.getElementById('cubuk').innerHTML = T ? n.filter(([,c]) => c).map(([k,c]) => `<i style="width:${c / T * 100}%;background:var(--n${k})" title="${NASIL[k]}: ${c}"></i>`).join('') : '';
  document.getElementById('lejant').innerHTML = n.map(([k,c]) => `<span style="--r:var(--n${k})">${NASIL[k]} · <b>${T ? Math.round(c / T * 100) : 0}%</b></span>`).join('');
  const doldur = (sel, kume, ad) => { const s = sel.value; sel.innerHTML = sel.options[0].outerHTML + [...kume].map(k => `<option value="${esc(k)}">${esc(ad[k] || k)}</option>`).join(''); sel.value = s; };
  doldur(fRutbe, new Set(veri.map(g => g.rutbe)), RUTBE);
  doldur(fBrans, new Set(veri.map(g => g.brans)), BRANS);
}
function ciz(){
  const l = veri.filter(g => (!fRutbe.value || g.rutbe === fRutbe.value) && (!fBrans.value || g.brans === fBrans.value) && (!fNasil.value || String(g.nasil) === fNasil.value));
  const kap = document.getElementById('liste');
  if (!veri.length) { kap.innerHTML = '<p class="bos">İlk görüşü sen yaz komutanım. <a href="../">Görüşünü yaz →</a></p>'; return; }
  if (!l.length) { kap.innerHTML = '<p class="bos">Bu filtreye uyan görüş yok.</p>'; return; }
  kap.innerHTML = l.slice(0, goster).map(g => `<article class="gorus" style="--r:var(--n${g.nasil})">
    <div class="ust-satir"><b>${g.ad ? esc(g.ad) : 'Bir aday'}</b><span>${RUTBE[g.rutbe] || esc(g.rutbe)} · ${esc(BRANS[g.brans] || g.brans)}</span>
    <span class="cip">${NASIL[g.nasil]}</span>${g.tahmini != null ? `<span class="cip acik">~${g.tahmini} doğru</span>` : ''}<span class="zaman">${zaman(g.olusturma)}</span></div>
    <p class="metin">${esc(g.gorus)}</p></article>`).join('') +
    (l.length > goster ? '<button class="daha" type="button" id="daha">Daha fazla göster</button>' : '');
  const d = document.getElementById('daha'); if (d) d.addEventListener('click', () => { goster += 30; ciz(); });
}
async function yukle(){
  try {
    const y = await fetch(SB_URL + '/rest/v1/rpc/sinav_gorusler', {method:'POST', headers:{apikey:SB_ANON, Authorization:'Bearer ' + SB_ANON, 'Content-Type':'application/json'}, body:'{}'});
    if (!y.ok) throw new Error();
    veri = await y.json(); nabiz(); ciz();
  } catch (e) {
    if (!veri.length) document.getElementById('liste').innerHTML = '<p class="bos">Görüşler şu an yüklenemedi. Sayfayı birazdan yenile.</p>';
  }
}
[fRutbe, fBrans, fNasil].forEach(x => x.addEventListener('change', () => { goster = 30; ciz(); }));
yukle(); setInterval(yukle, 60000);
</script>
</body>
</html>
